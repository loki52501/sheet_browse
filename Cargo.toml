[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Recipe files, tools/<domain>/<name>.recipe.yaml (T-28, D-150)
serde_yaml_ng = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

# Watch state hash (T-16, D-140)
sha2 = "0.10"

# MCP wrapper, FileAsker (T-07, D-104, D-105)
notify = "8"

# harness CLI, harnessd, scheduler (T-08, D-107, D-116)
clap = { version = "4", features = ["derive"] }
croner = "3"
rpassword = "7"
tempfile = "3"

# Memory store (T-03, D-32, D-103)
fastembed = { version = "7", default-features = false, features = ["ort-download-binaries-native-tls", "hf-hub-native-tls"] }
pgvector = { version = "0.4", features = ["sqlx"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "migrate", "macros"] }

# Vault (T-05, D-101, D-102)
age = "0.12"
aho-corasick = "1"
dirs = "7"
keyring = "4"
percent-encoding = "2"
toml = "1"
zeroize = "1"

# CDP transport and driver (T-18, D-600, D-601)
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
libc = "0.2"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }

# Workspace crates. Directory names follow docs/00; `core` is packaged as `harness-core` (D-35).
harness-core = { path = "crates/core" }
core-pg = { path = "crates/core-pg" }
toolstore = { path = "crates/toolstore" }
sb-cdp = { path = "crates/sb-cdp" }
sb-driver = { path = "crates/sb-driver" }
sb-sheet = { path = "crates/sb-sheet" }
sb-act = { path = "crates/sb-act" }
sb-media = { path = "crates/sb-media" }
