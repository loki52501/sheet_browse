[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# Workspace crates. Directory names follow docs/00; `core` is packaged as `harness-core` (D-35).
harness-core = { path = "crates/core" }
core-pg = { path = "crates/core-pg" }
toolstore = { path = "crates/toolstore" }
sb-cdp = { path = "crates/sb-cdp" }
sb-driver = { path = "crates/sb-driver" }
sb-sheet = { path = "crates/sb-sheet" }
sb-act = { path = "crates/sb-act" }
sb-media = { path = "crates/sb-media" }
