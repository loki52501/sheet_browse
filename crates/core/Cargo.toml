[package]
name = "harness-core"
description = "Harness core: gate, vault, ledger, run folder, scheduler, MCP wrapper, MemoryStore trait (docs/01, docs/02)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "harness_core"

[features]
# D-108: harness_core::testing (MemStore, ScriptedAsker) for other crates' tests.
testing = []

[dependencies]
age.workspace = true
aho-corasick.workspace = true
async-trait.workspace = true
chrono.workspace = true
croner.workspace = true
dirs.workspace = true
# D-126: rule_domain maps with UTS-46 (already in Cargo.lock through url).
idna = "1"
keyring.workspace = true
notify.workspace = true
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
zeroize.workspace = true

# D-111: the integration tests (gate_accept_t04, vault_accept_t05, ledger_t06) use
# harness_core::testing; a self dev-dependency turns the feature on for every test target,
# so `cargo test -p harness-core` (and the S-8 `cargo test --workspace`) runs them all.
[dev-dependencies]
harness-core = { path = ".", features = ["testing"] }
