[package]
name = "srv-cli"
description = "Phase 1 CLI tool server: gh, dns, cloudflare, flags, allowlisted cli (docs/04 C-1..C-4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
core-pg.workspace = true
anyhow.workspace = true
async-trait.workspace = true
harness-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process"] }
toml.workspace = true
zeroize.workspace = true
# C-2 dns(name, type): system resolver config, tokio runtime (D-541).
hickory-resolver = "0.26.3"
# C-2 cloudflare, C-3 flags: HTTPS with the vault header built at the sink (D-541).
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
url = "2"

[dev-dependencies]
harness-core = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["net", "process"] }
