[package]
name = "srv-web"
description = "Phase 1 web tool server: search, fetch, api, feed, read renderer (docs/04 W-1..W-7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
core-pg.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
harness-core.workspace = true
sb-sheet.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# net: lookup_host for the redirect private-address guard (http::host_is_private).
tokio = { workspace = true, features = ["net"] }
toolstore.workspace = true
# The node type scraper's tree is made of (scraper does not re-export it).
ego-tree = "0.11"
# Charset decoding of fetched pages (already in Cargo.lock through reqwest).
encoding_rs = "0.8"
# W-4: RSS 0.x/1.0/2.0, Atom and JSON Feed. iCal is parsed by hand (feed::ical).
feed-rs = "3"
# W-1..W-4 HTTP. Default features: native-tls, charset, http2 (0.12 is already in Cargo.lock).
reqwest = "0.12"
# W-2: the HTML walk that builds IndexRow and TextBlock.
scraper = "0.29"

[dev-dependencies]
harness-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
