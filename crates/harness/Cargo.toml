[package]
name = "harness"
description = "harness CLI and harnessd (docs/01 H-7, H-5; D-106, D-107, D-116)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "harness"
path = "src/main.rs"

[[bin]]
name = "harnessd"
path = "src/bin/harnessd.rs"

[lib]
name = "harness"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
clap.workspace = true
core-pg.workspace = true
harness-core.workspace = true
notify.workspace = true
rpassword.workspace = true
serde_json.workspace = true
# Only `harness db status` (reads _sqlx_migrations without migrating, D-116).
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }
toolstore.workspace = true
zeroize.workspace = true

[dev-dependencies]
harness-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
