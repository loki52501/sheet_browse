# T-27. Composes and sends a new message.
name: send
domain: mail.google.com
kind: recipe
description: "Compose a new message and send it. to is one full email address (a partial name would let Gmail pick its top suggestion)"
match: ["/mail/*"]
args:
  to: {type: string, required: true}
  subject: {type: string, required: true}
  body: {type: string, required: true}
steps:
  - tool: navigate
    args: {url: "https://mail.google.com/mail/u/0/#inbox?compose=new"}
  - tool: wait
    args: {for: selector, value: "[role=dialog] [aria-label=\"To recipients\"]", timeout: 30000}  # cold loads of Google pages exceed the 10 s default
  - tool: act
    target: {role: combobox, name: "To recipients"}
    args: {kind: fill, value: "{to}"}
  - tool: act
    args: {kind: press, key: Tab}             # commits the address as a chip and closes the suggestion list
  - tool: act
    target: {role: textbox, name: "Subject"}
    args: {kind: fill, value: "{subject}"}
  - tool: act
    target: {role: textbox, name: "Message Body"}
    args: {kind: fill, value: "{body}"}
  - tool: act
    target: {role: button, name: "Send"}
    args: {kind: click}
  - tool: wait
    args: {for: text, value: "Message sent"}
expects: {text: "Message sent"}
