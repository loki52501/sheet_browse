# C-4 allowlist for the srv-cli `cli(cmd)` tool (docs/04, crates/srv-cli/src/cli.rs).
# A command whose program is not listed here is refused and nothing runs. Commands run
# without a shell: no pipes, redirects, chaining or variables.
#
# Schema, one table per program (names are matched ASCII case-insensitively, `.exe` ignored):
#
#   [programs.<name>]
#   bin = "<executable>"          optional, default <name>, found through PATH
#   read = ["sub", ...]           first arguments that only read: class Read
#   write = ["sub", ...]          first arguments that change state: class Account (asks)
#   delete = ["sub", ...]         first arguments that delete: class Delete (asks)
#   default = "refuse"            any other first argument: read | write | delete | refuse
#   deny_flags = ["-x", "--y"]    refused anywhere: as given, as --y=value, -xvalue, and a
#                                 short letter in a single-dash cluster (-ax, -abx)
#   value_flags = ["-S"]          short flags that take a value, which may follow in the
#                                 same token: a cluster is read left to right and ends at
#                                 one of these (-Sconfig is -S "config", not -c). List only
#                                 letters that take a value in every allowed subcommand;
#                                 an unlisted one only makes the check stricter.
#   timeout_secs = 60             optional cap on one run
#
# Shipped with read-only examples only. Add write entries yourself; each one asks first.

[programs.git]
read = ["status", "log", "diff", "show", "rev-parse", "ls-files", "blame"]
default = "refuse"
# -c and --config-env set config that can run commands; --output writes files; the rest
# change which repository or helper programs are used.
# The cwd must be trusted: even read subcommands (status, diff, log, show, blame) can run
# programs the repository's own config or attributes name (core.fsmonitor, diff.external,
# textconv drivers). cli always runs in the server's cwd, and -c/-C are denied, so only
# that repository can set these.
deny_flags = [
  "-c",
  "-C",
  "--config-env",
  "--exec-path",
  "--git-dir",
  "--work-tree",
  "--output",
  "--ext-diff",
  "--textconv",
  "--upload-pack",
  "--receive-pack",
]
# Take a value in every read subcommand above that has them (log/diff/show: pickaxe -S/-G,
# -L range, -O orderfile, attached -U<n> -M<n> -B<n>; blame: -L, -S revs file, -M<n>).
# Not -n, -l or -u: they are boolean in blame or log.
value_flags = ["-S", "-G", "-L", "-O", "-U", "-M", "-B"]

[programs.dig]
default = "read"
# -f reads queries from a file; -k and -y use TSIG keys.
deny_flags = ["-f", "-k", "-y"]
# -b address, -c class, -p port, -q name, -t type, -x address (dig -qkey.example.com).
value_flags = ["-b", "-c", "-p", "-q", "-t", "-x"]

[programs.nslookup]
default = "read"
