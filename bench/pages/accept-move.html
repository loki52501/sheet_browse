<!doctype html>
<!--
  bench/pages/accept-move.html: T-19 acceptance fixture for docs/05 B-4 #6 "stable". The
  "Sliding" button starts a 900 ms linear transform transition after load and then stops.
  act(id) must answer "not stable (moving)" while it slides and {x, y} at its final centre once
  it has stopped. The main world records the transitionend time in window.__endedAt
  (performance.now(), shared by every world of this document). No network.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Slide · acceptance fixture</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 24px; }
  #slide { padding: 10px 16px; font: inherit; transition: transform 900ms linear; }
  #slide.go { transform: translateX(320px); }
</style>
</head>
<body>
<main>
  <h1>Slide</h1>
  <button id="slide" type="button">Sliding</button>
</main>
<script>
  window.__endedAt = null;
  const b = document.getElementById("slide");
  b.addEventListener("transitionend", () => { window.__endedAt = performance.now(); });
  window.__start = () => {
    window.__startedAt = performance.now();
    b.classList.add("go");
  };
</script>
</body>
</html>
