# Open questions, taken defaults, interface change requests, and reflect proposals.
# Id ranges per author (D-42): supreme B-1..B-99, core B-100+, sheet B-200+, store B-300+,
# page B-400+, servers B-500+, driver B-600+.
#
# APPEND-ONLY. This file merges with git's union driver, so:
#   * add new list items directly under their key; never rewrite a key line (no `key: []`);
#   * never edit or delete an existing entry: resolve a blocker or an interface change by
#     appending a decision to decisions.yaml that names its id ("resolves B-201");
#   * merge_gate.py rejects duplicate keys or ids after a merge.
# Resolved in wave 0, before any commit: B-1 by D-50, B-2 by D-56.
#
# blockers item:          {id, task, question, default_taken, needs_user}
# interface_changes item: {id, from, interface, change, why}   (only supreme edits interfaces.yaml)
# proposals item:         reflect writes forge proposals, _generic merges, pinned-tool retirements

blockers:
  - id: B-102
    task: T-03
    question: "The shared compose Postgres (sheetbrowse-postgres-1) restarted backends three times this session: 'server process (PID n) exited with exit code 2' at 08:34:53, 09:13:49 and 09:19:33 UTC, each followed by ~2 min of recovery mode, while several worktrees ran tests. Cause unknown (container shm is the Docker default 64 MB; HNSW builds and parallel workers use shared memory). Should compose set shm_size (e.g. 256mb) or should areas serialise DB-heavy test runs?"
    default_taken: "No compose change from core (docker-compose.yml is supreme's T-01 file). core-pg tests stay on throwaway databases (D-100); a run that hits recovery mode is re-run, and failures are reported with the Postgres log line."
    needs_user: false
  - id: B-100
    task: T-04
    question: "H-1.3 names timeout behaviour only for Send(new), Account (proceed) and Pay, Delete (skip). What does an ask on another class time out to, e.g. the seeded ('*','Submit:job_application','ask') rule or a ('bank.com','Submit','ask') override?"
    default_taken: "Skip. Gate::on_timeout returns Proceed only for Send and Account with strict off; every other class skips. A job application or signature that times out to proceed would be the harness acting as the user on exactly what the user reserved for themselves (H-1.2)."
    needs_user: false

interface_changes:
  - id: B-101
    from: core
    interface: I-1
    change: "harness_core::memory::contact_key: normalise with trim() + to_ascii_lowercase() instead of Unicode to_lowercase(); signature unchanged."
    why: "Unicode lowercasing folds compatibility characters (U+212A KELVIN SIGN -> k), so a Send to a different, look-alike address would match a known contact and be allowed without an ask (H-1.1). Mail domains are case-insensitive ASCII after IDNA; local parts beyond ASCII must stay distinct. Default until supreme answers: unchanged (contract), gate behaviour as is."
  - id: B-103
    from: core
    interface: I-3
    change: "Additive: pub fn harness_core::gate::clean_card(card: AskCard) -> AskCard (the D-110 (5) control-strip + caps the gate already applies, today the private card_text/ask_card helpers)."
    why: "ToolCtx::ask (I-2, mid-call asks) must sanitise handler-built cards like the gate does; with the helpers private, T-07 carries a copy of card_text in mcp.rs (card_line), and two copies can drift. Default until supreme answers: keep the copy in mcp.rs, tested by mcp::tests::card_lines_are_clean."
  - id: B-104
    from: core
    interface: I-2
    change: "Additive pub items in harness_core::mcp: serve_io(server, registry, harness, reader, writer), PROTOCOL_VERSION, scrub_value(vault, &Value); new module harness_core::ask (FileAsker, answer, asks_dir, card_path, answer_path). Behaviour: tools/call for a name not in the registry answers JSON-RPC error -32602 (MCP 2025-06-18 'Unknown tool'), not isError; dispatch() still returns ToolError::Args for it."
    why: "Listed so the contract file can name them; serve_io is the test seam for the stdio transport, answer() is what T-08's `harness ask` calls. Default: as implemented in T-07."

