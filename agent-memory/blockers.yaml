    question: "A scheduled `claude -p` session that is allowed Bash can run `harness ask <run> <n> yes`, `harness gate set` or `harness vault set` and approve its own asks or loosen its own gate (review-T-08 note; comes from the D-105 file-based asker). Rule 4 says everything goes through the gate; should the launcher deny those commands to the session?"
    default_taken: "ClaudeLauncher passes --disallowedTools for Bash(harness ask:*), Bash(harness gate:*) and Bash(harness vault:*) on every session it starts (scheduled and `harness run`), and a T-08 test asserts the argv. Answering asks, changing gate rules and vault entries stay user-only. Supreme may prefer a decision that moves the check into the CLI (e.g. refuse when SB_RUN_ID is set) as well. Implemented as D-124 (5). review-T-08 round 2: the deny rules match command text, so a full path, `cmd /c`, `cargo run` or writing <n>.answer directly bypasses them; the deny list is defence in depth only. A sound fix needs an answer the session cannot forge (e.g. the answer file carries a MAC keyed by a secret held in the OS keychain that sessions are never given, checked by FileAsker). Needs a supreme decision before B-192 closes; core keeps the deny list meanwhile."
