#
# APPEND-ONLY. This file merges with git's union driver, so:
#   * add new list items directly under their key; never rewrite a key line (no `key: []`);
#   * never edit or delete an existing entry: resolve a blocker or an interface change by
#     appending a decision to decisions.yaml that names its id ("resolves B-201");
