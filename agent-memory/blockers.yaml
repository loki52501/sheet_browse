# Open questions, taken defaults, interface change requests, and reflect proposals.
# Id ranges per author (D-42): supreme B-1..B-99, core B-100+, sheet B-200+, store B-300+,
# page B-400+, servers B-500+, driver B-600+.
#
# APPEND-ONLY. This file merges with git's union driver, so:
#   * add new list items directly under their key; never rewrite a key line (no `key: []`);
#   * never edit or delete an existing entry: resolve a blocker or an interface change by
#     appending a decision to decisions.yaml that names its id ("resolves B-201");
#   * merge_gate.py rejects duplicate keys or ids after a merge.
# Resolved in wave 0, before any commit: B-1 by D-50, B-2 by D-56.
#
# blockers item:          {id, task, question, default_taken, needs_user}
# interface_changes item: {id, from, interface, change, why}   (only supreme edits interfaces.yaml)
# proposals item:         reflect writes forge proposals, _generic merges, pinned-tool retirements

blockers:
  - id: B-300
    task: T-11
    question: "D-49 says toolstore::fingerprint reads sb-sheet's data/roles.txt, which does not exist yet (area sheet, T-10). What does toolstore use for role aliases meanwhile?"
    default_taken: "toolstore carries a small built-in alias map (input textbox searchbox, button, select combobox listbox, checkbox, radio, link, form); swap to sb-sheet's table in the merge that brings both."
    needs_user: false
  - id: B-301
    task: T-11
    question: "docs/03 acceptance says an unused ephemeral tool 'is deleted by reflect', but T-7 says deletion is always retire -> archive -> delete. Which?"
    default_taken: "D-303: retire and archive at 14 days (ledger event), delete the archived file at 90 days."
    needs_user: false
  - id: B-320
    task: T-11
    question: "T-2/D-53 name page.table(id) but no return shape or id syntax."
    default_taken: "id is `3` or `f2.3` (table number within a frame, leading # ignored). Returns {header: [cells], rows: [[cells]]}, plus refs: [[ref|null]] (refs without #) only when some cell links an element; null when the table has no rows. Cells are trimmed span text. Built directly from TextBlock TableRow blocks in toolstore::runner::table_json."
    needs_user: false
  - id: B-321
    task: T-11
    question: "T-2 lists `url` and `title` without parentheses; the brief for the runner wrote url() and title(). Properties or methods on page?"
    default_taken: "Properties (strings read once from PageHost at run start; a run is synchronous so they cannot change). PageHost itself has url() and title() methods."
    needs_user: false
  - id: B-322
    task: T-11
    question: "PageHost and ApiFetch are synchronous (JS host calls are synchronous); srv-web's api tool and sb-mcp are async (tokio). How do callers bridge?"
    default_taken: "Callers run run_reader/run_planner inside tokio::task::spawn_blocking and implement ApiFetch with Handle::block_on on the gated api call. The runner is !Send internally (fresh Runtime per call), so nothing crosses threads."
    needs_user: false
  - id: B-323
    task: T-11
    question: "The 2 s wall cap includes time spent inside page.api() host calls. A @phase 1 reader making several network calls can hit it."
    default_taken: "Keep 2 s as RunOpts::default(); srv-web passes a larger RunOpts.timeout for @phase 1 readers if acceptance shows it is needed. The cap is checked by the interrupt handler, so a slow api call is only detected when JS resumes."
    needs_user: false
  - id: B-302
    task: T-11
    question: "T-2 gives no default when a tool file has no @phase line."
    default_taken: "@phase defaults to 2 (needs the browser), the safe side: a file only runs on srv-web's fetched index when it says @phase 1. Missing @match defaults to /*; missing @name, @kind or @gate is a header error."
    needs_user: false
  - id: B-303
    task: T-11
    question: "record() on a tool with no tools.health row: which status does the new row get? T-7 starts forged tools as ephemeral, but G-5 seeds sites with hand-written tools that must not be swept after 14 idle days."
    default_taken: "ephemeral when the file's header has @forged (or the file is missing), saved otherwise (hand-written). toolforge calls ToolStore::register_forged at G-2 step 5, which always creates an ephemeral row."
    needs_user: false
  - id: B-304
    task: T-11
    question: "T-1 says folder = eTLD+1, but docs/07 uses tools/mail.google.com/ and tools/calendar.google.com/, whose eTLD+1 is google.com."
    default_taken: "folder_for picks the most specific existing folder among the host and its parents down to eTLD+1 (mail.google.com/ wins over google.com/), then _site.yaml aliases, then eTLD+1. The namespace is the folder's first label, so mail.google.com tools are mail.<name>."
    needs_user: false
  - id: B-305
    task: T-11
    question: "T-3's skeleton line example shows luma.register(name,email) although register also takes plan?:string. Are optional args shown?"
    default_taken: "Shown with a trailing ?: luma.register(name,email,plan?). Two tokens per optional arg buy the model knowledge of the arg without a wasted turn (CLAUDE.md priorities)."
    needs_user: false
  - id: B-306
    task: T-11
    question: "How are _generic tools namespaced (T-3 shows only site namespaces)?"
    default_taken: "generic.<name> (bare names could collide with harness tools such as read or find). A site tool of the same name shadows the generic one and the generic one is not loaded."
    needs_user: false
  - id: B-307
    task: T-11
    question: "@match glob semantics: does * cross / ?"
    default_taken: "Yes: * matches any run of characters including /, ? matches one character, the rest is literal, matched against the URL path without query or fragment. /* is the whole site. Hand-rolled, no globset dependency."
    needs_user: false
  - id: B-308
    task: T-11
    question: "D-303 deletes archived files after 90 days, but tools.health has no archived-at column. Where does the archive clock come from?"
    default_taken: "The archived file's mtime, set to now by ToolStore::archive. A fresh clone resets mtimes, which only delays deletion. Ledger events for file actions use server core and tool tools.relocate | tools.reforge | tools.retire | tools.archive | tools.delete with args {domain, name, version}."
    needs_user: false
  - id: B-309
    task: T-11
    question: "D-304 compares fingerprint names case- and space-insensitively. Labels like 'Email *' or 'Sign-up' then miss."
    default_taken: "Names are compared after lowercasing and replacing every non-alphanumeric character with a space (so 'Email *' = 'email', 'Sign-up' = 'sign up'). Relocate uses the same normalisation plus a built-in synonym table and token overlap >= 0.5."
    needs_user: false
  - id: B-310
    task: T-11
    question: "What if a tool file's @name differs from its file name?"
    default_taken: "The loader skips it with why '@name x does not match file name y.js' (D-306 report). tools.health, the archive and record() all key on the file name, so the two must agree."
    needs_user: false

