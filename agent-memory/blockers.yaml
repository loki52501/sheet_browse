  - id: B-324
    task: T-05c
    question: "WAVE2.md (D-91) says to run parallel tasks in sibling worktrees F:/sb-swarm/wt/<area>-T<nn>, but scripts/hooks/guard_write.py takes ROOT from ${CLAUDE_PROJECT_DIR} (the session's start folder, wt/core), so every Edit/Write by this session or its subagents in wt/core-T05c etc. is blocked ('write outside this repo/worktree'). Two core coders then wrote through Bash/Python, which goes around the hook; their work was stopped and moved. Should the hook allow the area's own task worktrees (wt/<area>-T*), or should each task run in its own session started in that worktree?"
    default_taken: "core does not bypass the hook: the task worktrees are removed and core runs its wave-2 tasks one after another in wt/core by checking out each swarm/core-T<nn> branch there (one PR per task still holds). Parallel task work resumes when supreme changes the hook or launches one session per task worktree."
    needs_user: false
  - id: B-559
    task: T-15
    question: "WAVE2.md (D-91) says to run parallel tasks in sibling worktrees F:/sb-swarm/wt/<area>-T<nn>, but scripts/hooks/guard_write.py refuses every Write/Edit outside ROOT (= the session's own worktree, wt/<area>), so subagents of an area session cannot write in a sibling worktree. Should the hook accept sibling wt/<area>-T* worktrees, or should launch.ps1 start one session per task worktree?"
    default_taken: "No hook edit (hooks are supreme's). Area servers moved its task worktrees inside its own worktree (git worktree move to wt/servers/.wt/T<nn>, same branches swarm/servers-T<nn>), so the guard applies. Known gap of this layout: guard_write's path-specific checks compare the path relative to ROOT, so `tools/*.js` planner `?s` and the interfaces.yaml check do not match `.wt/T<nn>/...`; servers writes tool files (T-13) from wt/servers itself and never edits interfaces.yaml. SubagentStop and Stop read handoffs from wt/servers/agent-memory/handoffs, so coders also copy their handoff there."
    needs_user: false
  - id: B-540
    task: T-15
    question: "docs/04 C-3 says flags(provider, env) reads and that writes are Account, but names no provider, API shape or auth; C-4 names config/cli-allow.toml but no schema. Which providers and programs ship, and how are they configured?"
    default_taken: "config/flags.toml ships with no providers and a commented example; a provider is {api, auth (header value template that must contain @vault(name)), header (default Authorization), read (GET path, {env} replaced), domain (optional gate domain)}. flags(provider, env) GETs the read path; method/path/body make writes (POST/PUT/PATCH Account, DELETE Delete). config/cli-allow.toml is [programs.<name>] {bin, read, write (Account), delete (Delete), default read|write|delete|refuse, deny_flags, timeout_secs}, shipped with read-only git, dig and nslookup entries; anything not listed is refused with nothing run. Both files are read per call and again inside the call, so an edit after the gate approved a call cannot raise its class. Provider and program names fold to ASCII lowercase."
  - id: B-600
    task: T-18
    question: "guard_write.py sets ROOT to the worktree its hook script runs from (the session's project dir), so a subagent of the wt/driver session cannot Write or Edit in a D-91 per-task worktree wt/driver-T18. Should the hook also accept sibling worktrees of the same area (wt/<area>-T<nn>)?"
    default_taken: "Driver runs its task branches one at a time inside wt/driver (git checkout swarm/driver-T<nn>); the separate wt/driver-T18 worktree was removed. Its tasks are sequential (T-20 needs T-18), so nothing is lost. Any area that wants parallel per-task worktrees needs the hook change or a session launched with cwd in that worktree."
    needs_user: false
  - id: B-601
    task: T-18
    question: "I-9 tabs() returns (tab, url, title), but Chromium 156 (chromium-1248) sends no Target.targetInfoChanged when document.title changes: measured on an http page and a data: page, the TargetInfo title stays the commit-time value (host:port or the URL). Where should a fresh title come from?"
    default_taken: "T-18 tabs() reads the registry only (zero round trips): the title is the last TargetInfo title, which can be stale. Proposed for T-22 (which owns tabs()): when tabs() is called, refresh titles with one pipelined Runtime.evaluate('document.title') per tab in the sb world, or have injected.js report title changes; B-4 #9 'opened tab N: title' (T-21) needs the same."
    needs_user: false
  - id: B-602
    task: T-18
    question: "B-4 #2 lists the events that feed the registry (Target.attached/detached, Page.frameAttached/Navigated/Detached, Runtime.executionContextCreated/Destroyed). Are other events allowed, and how are tabs numbered?"
    default_taken: "Three more events are applied because the listed ones leave the state wrong without them: Target.targetInfoChanged (title), Page.navigatedWithinDocument (URL of SPA routes, no generation bump) and Runtime.executionContextsCleared (drops all contexts of a session). TabIds start at 1 in attach order and are never reused; frame ids are per tab, 0 = main frame, never reused. Frame-tree events from inside an out-of-process iframe are not tracked (the OOPIF itself is one opaque frame, B-4 #2 'never read inside'); a frame is opaque when it is out of process, cross-origin to its parent (about:blank and about:srcdoc inherit, data: and unparsable URLs are opaque) or inside an opaque frame."
    needs_user: false
  - id: B-603
    task: T-18
    question: "D-601 gives the pinned path as <home>/chromium/156.0.8078.4/chrome-<platform>/chrome(.exe), but the macOS Chrome for Testing archive has no 'chrome' binary. And is an empty SB_CHROMIUM or SB_HOME 'set'?"
    default_taken: "macOS resolves to chrome-mac-arm64 (or chrome-mac-x64)/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing; Windows and Linux follow D-601 exactly (chrome-win64/chrome.exe, chrome-linux64/chrome). An empty SB_CHROMIUM or SB_HOME counts as unset. A set source that names a missing file is an error naming SB_CHROMIUM, never a fall-through."
  - id: B-500
    task: T-12
    question: "docs/04 W-2 says fetch(mode=\"raw\") returns the cleaned HTML of <main> or the densest block (60 k chars) 'for tools that need structure', but CLAUDE.md rule 5 says the model never receives raw HTML except from screenshot and video.*. Which wins for the model-facing fetch tool?"
    default_taken: "Rule 5 wins. fetch(mode=raw) is refused with ToolError::Args naming B-500 before any request; mode=read (with region) and mode=sheet are the structured views. The W-2 raw renderer exists as srv_web::html::raw_main_html (cleaned: no script/style/comments, attribute allowlist, no password or card values, capped at 60 k chars) for in-process site-tool hosts, and is never returned to the model. If supreme wants raw for the model, that is a CLAUDE.md change, not a srv-web one."
    needs_user: false
  - id: B-501
    task: T-12
    question: "fetch follows redirects (W-2), but the gate classified the call by the requested URL's domain. A redirect to another registrable domain therefore reads that domain without its own gate.rules lookup (a `stop` rule on the target domain does not fire). Classify again per hop, refuse cross-domain redirects, or accept for Read GETs?"
    default_taken: "Accepted for Phase 1: fetch is a Read GET, reads only, and the browser path has the same property on navigation. The final URL is in the tool event's consequences.url, so the ledger shows where the read landed. api (W-3) does not follow redirects to another host at all. Revisit if a domain stop rule must also cover reads reached by redirect."
  - id: B-520
    task: T-14
    question: "docs/04 says `shell(\"rm -rf runs/x\")` is 'Read-class-safe'. Is that the class Read, or only 'allowed like Read'? ledger::report lists Read events under Read:, so an in-runs deletion shows as a read, not under Did."
    default_taken: "Class Read for shell commands whose every changed target is scratch (the literal reading; D-520 (4)). The explicit fs.write/move/mkdir/delete tools are declared Fill, so their in-runs writes show under Did. Supreme may prefer Fill for both."
    needs_user: false
  - id: B-521
    task: T-14
    question: "Fail-closed shell classification makes every unknown command (python script.py, node x.js, make, go build) class Delete, so each one asks and times out to skip. Is that the intended cost, or should known project commands get an allowlist (like config/cli-allow.toml for C-4)?"
    default_taken: "Delete for unknown commands (D-520 (5)); cargo build/test/fmt/run and npm test/run/install are Fill because this repo needs them. An allowlist file can be added later without changing the parser."
    needs_user: false
  - id: B-522
    task: T-14
    question: "B-192 follow-up: srv-files now treats a run's asks/, ledger.jsonl, report.md and prompt.md (and the run folder and runs root) as outside scratch, so fs.write, fs.move, fs.delete and shell redirections into asks/<n>.answer are Delete and ask. Claude Code's built-in Write and Bash tools are not behind the gate and can still write that file."
    default_taken: "srv-files closes its own route (D-520 (2)); the general fix stays with B-192 (an answer the session cannot forge)."
    needs_user: false
  - id: B-526
    task: T-14
    question: "For area core: harness-core test mcp_t07::file_asker_stderr_has_no_canary (crates/core/tests/mcp_t07.rs:1602) fails 3/3 when TEMP is a longer path (e.g. F:/sb-swarm/tmp-servers/t14acc-F) and passes with the default TEMP. The FileAsker stderr line 'ask: cannot create <temp path>\\asks: ...; skipped, nobody saw' is cut by the core line-length cap before 'nobody saw', so the assertion depends on the temp path length. Found by the T-14 acceptance re-run; no srv-files code involved."
    default_taken: "Not a servers fix. Core shortens the path in that line (or puts the fail-closed words first) so the cap never cuts them, or asserts on a prefix. Until then run the workspace suite with a short TEMP."
    needs_user: false
  - id: B-560
    task: T-13
    question: "Live run 2026-10-26: ashbyhq.list_jobs works on jobs.ashbyhq.com/ashby and /linear, but fails on /openai because api.ashbyhq.com/posting-api/job-board/openai answers more than page.api's 5 MB cap (D-501; the answer carries descriptionHtml and descriptionPlain for every job, which the tool drops). Large boards therefore cannot be listed in Phase 1. Raise page.api's cap for JSON (the tool's output is capped at 64 KiB / 20 000 chars anyway), stream-parse and drop known-large fields, or accept?"
    default_taken: "Accept for now: the 5 MB cap stays (W-2, D-501) and page.api reports a cut body as 'answered more than the 5 MB cap' instead of 'did not answer with JSON', so the model falls back to fetch/find in one turn. Proposed follow-up for the sub-orchestrator: a separate page.api cap (e.g. 32 MB, still bounded by the run's remaining wall time, D-64), since the bytes never reach the model."
    needs_user: false
  - id: B-561
    task: T-13
    question: "docs/03 T-4 says a fingerprint miss disables the tool 'for this run'. D-561 (T-13) re-registers a needs_repair or process-disabled tool within the same run when a later fetched page's fingerprint is not a miss, and repairs it on a clean run. Does that amendment of T-4 stand?"
    default_taken: "Keep D-561: re-enabling only on a page whose fingerprint matches or partially matches is no capability gain (check_repair refuses header changes; the registry class floor holds, D-127), and it is what lets 'fixing the page flips it back via relocate with version = 2' happen without a restart. If supreme prefers the literal T-4 text, the same-run re-enable can be dropped; a needs_repair row from an earlier run still reaches relocate."
  - id: B-562
    task: T-13b
    question: "Phase 1 ladder rung 2 (bench/results/ladder-phase1-servers.md, variants 1 and 3): the session put the Claude Code account's email address into a `User-Agent` header of a Read-class `api` call to crates.io, so personal data left the machine with no ask. Should srv-web's `api` refuse model-set identity headers (User-Agent, From, Cookie...) and keep its own UA, or should the gate class an outgoing header carrying contact data as Send?"
    default_taken: "Servers fix in T-12b: `api` sends its own UA and refuses model-set User-Agent, From, Cookie and Authorization headers that are not @vault(...) templates; any other header value that looks like an email address raises the class to Send (asks, D-39 recipients = the host). A gate-level personal-data check is a core question for wave 4."
    needs_user: false
  - id: B-563
    task: T-13b
    question: "Phase 1 ladder rung 1 (variants 2, 3): `claude -p` sessions launched by `harness run` answered research prompts from memory with zero tool calls, and report.md said `Result: done` with `Read: 0`. The launcher passes only the bare prompt; the session is not told its run id, its files/ folder, or that answers must cite this run's tool results. Should the launcher (core, docs/01 H-5/H-6) prepend a short run preamble (run id, files path, 'cite sources you fetched in this run'), and should report.md mark a research run with no Read calls as not done?"
    default_taken: "Core owns it (launcher and report). Proposed preamble: one paragraph with the run id, `runs/<id>/files/` for deliverables, and 'cite only what tools returned in this run'. Until then the ladder scores such runs as fail."
    needs_user: false
  - id: B-564
    task: T-13b
    question: "Phase 1 ladder rungs 4 and 5 (variant 3): sessions wrote deliverables (CSV, table) to their working folder instead of runs/<id>/files/, because fs.write and csv.clean resolve a bare file name against the base folder and the session never learns its run id. Should fs.write and csv.clean put a bare file name into the run's files/ the way xlsx.write already does?"
    default_taken: "Yes, servers T-14b: a relative path with no folder component goes to runs/<id>/files/; explicit paths keep their meaning. The tool descriptions say so."
    needs_user: false
  - id: B-605
    task: T-20
    question: "D-55 and D-73 say element ids are never reused within a tab frame and sb-driver passes walk({base}) per document, but walk() returns only {count}, so the driver cannot know where a document's ids end. Which base should each new document get?"
    default_taken: "D-604: document k of a tab frame gets base 1 + k * 100000 (u32 ids, so 42949 documents per frame, then fail closed); the first document keeps short ids. Proposed for area page (additive I-11 change, not filed as an interface change yet): walk() and index() also return next, the id the document would issue next, so the driver can track the high-water mark and give the next document max(next) + 1, keeping ids short after navigations."
    needs_user: false
  - id: B-606
    task: T-20
    question: "Background tabs in one window are hidden (visibilityState hidden, no requestAnimationFrame, timers about 1 per second on chromium-1248), so act(id), which awaits two frames, stalls there. Should Driver::open make tabs or windows, and what about the headed me profile?"
    default_taken: "D-605: open() creates every tab in its own window (Target.createTarget newWindow true), headless and headed alike, so tabs can act in parallel (B-4 #10); a tab that is hidden anyway (a popup in its opener's window, a minimized window) gets Page.bringToFront once when an act finds it hidden. If the user prefers tabs in one window for me, T-22's scheduler must front the tab it acts on and serialize acts per window. Round 2 (review-T-20 should-fix): under Profile::Me the driver never sends Page.bringToFront, because it would take the user's focus and un-hide E-2's hidden window; a hidden me tab fails the step at once with 'the tab is not visible (its window is hidden or minimized; profile me never brings it to front)'. Scheduling for me (hidden, minimized or occluded windows, and whether the scheduling flags --disable-backgrounding-occluded-windows, --disable-renderer-backgrounding and --disable-background-timer-throttling fit D-5) is deferred to T-22 and the user."
    needs_user: false
  - id: B-607
    task: T-20
    question: "For area page: describe() in injected.js appends the raw id attribute (and the first class), so a page id such as 'x (OVERLAY #12)' or 'x (#99)' can spell the driver's own element refs inside a cover why ('covered by div#x (OVERLAY #12) (OVERLAY #40)'). Should describe() escape or drop ids and classes that hold whitespace, parentheses or '#', and cap them?"
    default_taken: "sb-driver neutralises it on its side (review-T-20 round 2): tidy_why rebuilds the why around the page text (covered by D (OVERLAY #n), covered by D (#n), covered by D, does not receive pointer events (hit D)), keeps only the ref it parsed at the end, and maps every character of D's tag and id or class outside letters, digits, '-' and '_' to '_' (40 characters each); the driver's act wrapper also reports document ids with whitespace, parentheses or '#' that occur in the why, which are neutralised first. Residual gap: an id with whitespace inside an open or closed shadow root is not in that report, so 'covered by tag#x (#99)' with id 'x (#99)' on a shadow-DOM element without an indexed ancestor still reads as ref #99. Proposed for page: describe() neutralises the id and class the same way (or emits them as a separate field), which closes it for every caller."
    needs_user: false
  - id: B-608
    task: T-21
    question: "CDP cannot pause a download, and B-4 #9 asks that a download is stopped and asked with nothing landing before the answer. What should Driver::download(allow=true) do?"
    default_taken: "D-611: the browser denies every download (nothing lands) and download(allow=true) fetches the URL again with the page's cookies (Network.loadNetworkResource) or decodes a data: URL. Cost: blob: URLs (script-built exports), POST-only downloads and one-time links cannot be fetched again; download() answers an error naming the scheme for blob: and the server's answer otherwise. Alternative if the user prefers exact bytes: allow into a private staging folder outside runs/<id>/files and move on allow, delete on deny (bytes on disk before the answer)."
    needs_user: false
  - id: B-610
    task: T-21
    question: "B-7 writes u#9=files/cv.pdf while the brief says upload paths are relative to the run's files folder. Is the leading files/ part of the path?"
    default_taken: "D-609: a leading files/ names the files folder itself, so u#9=files/cv.pdf and u#9=cv.pdf both read runs/<id>/files/cv.pdf; anything with .., a root, a drive or UNC prefix, or that resolves (after symlinks) outside the folder is refused."
    needs_user: false
  - id: B-611
    task: T-21
    question: "H-2 memory hygiene for typed vault values: the insertText message is built in a zeroized buffer (sb_cdp::start_raw) and the pipe zeroes its framing copy, but the WebSocket backend copies every message into a String for tungstenite, which is not zeroed. Does WebSocket need the same treatment?"
    default_taken: "No change in T-21: Pipe is the default transport (D-600) and the only one the driver launches; WebSocket attaches to an already running Chrome and is not used for vault typing yet. Proposed for whoever enables it: send Message::Binary from the Bytes, or zeroize the String after the send."
    needs_user: false
  - id: B-612
    task: T-21
    question: "ToolCtx::ask documents 'a step whose live class exceeds self.class' as a mid-call ask. Should Driver::act ask instead of stopping when a step's live class is above ctx.class?"
    default_taken: "Stop (H-1.4 and the T-21 brief): ActResult.stopped carries the live class, the why and the element, and no later step runs. sb-mcp can turn that stop into an ask and run the rest of the program again under the approved class. A CHALLENGE is always a stop (D-5)."
    needs_user: false
  - id: B-613
    task: T-21
    question: "For area core (rule 2, B-152): core's scrubber (harness_core::scrub, Vault::scrub) matches whole values only, and ToolCtx exposes no way to scrub against every vault value. A page can echo a value the model typed in an earlier program (so sb-driver does not know it is a vault value), cut by a cap before the driver sees it (the page index cuts names at 150 with '…'; raw page strings are cut at 2000). Should core's scrubber also replace a value prefix of 8 or more characters that ends at a cut ('…', '...', or the end of the string), and should ToolCtx offer scrub(&self, s: &str) -> String over the run's vault?"
    default_taken: "D-616 in sb-driver: both scrub passes apply the prefix rule against the values of the keys the program typed, and against core's whole-value scrubber for every other value. Driver::tabs() and frames() use harness_core::scrub. Proposed for core: the prefix rule in Scrubber::scrub, and ToolCtx::scrub, so every tool server can scrub against every value with it; sb-driver would then call ctx.scrub instead of resolving typed keys."
    needs_user: false
  - id: B-614
    task: T-21
    question: "For T-22 (B-4 #8 and #9): the consequence window settles on the DOM only and compares only the step frame's index. A submit click whose XHR outlasts the 500 ms window, or a frame click that changes its parent, can read as 'no visible change'. What should the window do?"
    default_taken: "T-21: a step in a frame other than 0 never reports NoVisibleChange (D-617). A frame-0 Submit step whose request is still in flight after 500 ms still can (review-T-21 should-fix 7, left for T-22). Proposed for T-22: network in-flight tracking in settle(), and the parent and top frames' indexes in the window and the diff (frame merging), after which D-617 can be lifted."
    needs_user: false
  - id: B-615
    task: T-22
    question: "Driver::settle (and open's and w(d)'s settle) awaits frame 0's DOM only; the network part covers the whole tab (its OOPIFs included). Should settle also await the DOM of same-origin child frames?"
    default_taken: "Frame 0 only (D-620): one in-page call per pass. An SPA that renders inside a same-origin iframe is still covered when its rendering follows a request (the network part waits for it). Proposed for T-23 if read() on framed pages needs it: run the in-page settle in every readable frame concurrently (one round trip in parallel) and take the latest."
    needs_user: false
  - id: B-616
    task: T-22
    question: "Requests made by workers (dedicated, shared, service workers) come on worker sessions, which the driver attaches and resumes but does not track or Network-enable. Should settle count them?"
    default_taken: "Not counted (D-620): a fetch a page awaits is made by the page itself in nearly every SPA, and a service worker that answers a page fetch shows as the page's request. Counting worker requests would need Network.enable on every worker session and an owner map from worker to tab. Revisit if a bench task settles too early behind a worker fetch."
    needs_user: false
  - id: B-617
    task: T-22
    question: "For area page (injected.js): Settled.changed should count DOM mutations made while sb-driver waits for the network between two in-page settles (accept-T-22 note 2), but __sb exposes no mutation counter (S.mutCount is internal), so the driver cannot read the count at the start of a wait. Should __sb expose mutations() -> number (S.mutCount, after flushMut) or let settle(opts) take a since-count?"
    default_taken: "D-625 work in sb-driver: before a network wait between two settle calls, the driver sends (not awaited) a small function into the sb world that starts a MutationObserver and records a mark; the next SETTLE_FN call adds the count since the mark to changed and drops the observer with its last mark (or after the settle's remaining time + 1 s by a page timer). It lives in the isolated world only (globalThis.__sbGap there, never the page's window). Proposed for page: __sb.mutations() so the driver reads S.mutCount in the call it already makes and the extra observer goes."
    needs_user: false
  - id: B-618
    task: T-22
    question: "For supreme (merge tooling): since wave 3 opened (main 1d921ee), merge_gate.py driver adds areas.driver.later.tasks, so it prints 'gate BLOCKED: T-23..T-26 missing review-T-2x.md' on swarm/driver-T22 (2c6fafb). merge.ps1 runs that gate for every driver PR, so #6, #11 and #12 (T-20, T-21, T-22) cannot pass it although each has an approve review. Per-task PRs (D-91) need the gate to check the PR's own task, not the area's whole list."
    default_taken: "Area driver does not edit scripts/swarm/. Proposed: merge_gate.py takes the task from the head branch name (swarm/<area>-T<nn>[x] -> T-<nn>[x], plus the tasks that branch carries, e.g. T-18 T-20 T-21 for driver-T22) or an explicit --tasks list from merge.ps1, and only falls back to the area list for a swarm/<area> branch."
    needs_user: false
  - id: B-199
    task: T-05c
    question: "For area driver: sb-driver test chromium_driver::bench_headless_launch_registry_and_cleanup (crates/sb-driver/tests/chromium_driver.rs:231) fails about 1 run in 2 on this machine under load ('bench profile ... not removed'); it passed on the next run with no code change. Seen in core's `cargo test --workspace -j 2` on swarm/core-T05c (main 14587a3 merged). It makes the D-87 workspace gate flaky for every area."
    default_taken: "Not a core fix. Core lists it in its PR bodies as a known flake and reruns that test binary once. Proposed for driver: wait for the browser process tree to exit (condition with a cap, rule 6) before asserting the profile folder is gone, or retry the removal on Windows sharing violations."
    needs_user: false
interface_changes:
  - id: B-401
    from: page/suborch
    interface: I-10
    change: "sb_act::PlannerError gains ChallengeTarget { step: usize }: check_planner rejects any step whose target row is CHALLENGE, with or without ?s, before the ?s rule (D-404 (4)). MissingStop { class: Challenge } no longer occurs."
    why: "D-5: a planner may never target a challenge; consumers matching on PlannerError (toolstore, toolforge G-2) need the new variant."
  - id: B-400
    from: page/suborch
    interface: I-10
    change: "sb_act adds pub const MAX_WAIT: Duration (30 s): w(n) longer than this is clamped (D-431). No I-10 signature changed."
    why: "Draft-tier addition recorded so consumers (sb-driver, toolforge) see it; sb-driver's settle cap for w() should read it."
  - id: B-410
    from: page/js-coder
    interface: I-11
    change: "New in-page API for sb-media (B-9), next to __sb: injected/media.js installs globalThis.__sbMedia {list, cues, frames, frame} in world sb (shapes in its header and D-420). Video ids are __sb ids."
    why: "B-9's in-page seek + canvas path and video.list facts need a page API that I-11 does not name; sb-media (an I-9 consumer) calls it."
  - id: B-411
    from: page/js-coder
    interface: I-11
    change: "Additive details, no rename: act(id) returns a Promise; walk also accepts walk(true) and {dirty: [ids]}; frames() entries carry extra fields (challenge, and id/name on child entries with frame:null); text() emits an iframe placeholder block (kind other, elem = iframe row); index() omits State fields equal to State::default() (D-421)."
    why: "Recorded so sb-driver codes against what the page really returns."
  - id: B-412
    from: page/js-coder
    interface: I-11
    change: "Return-shape changes (D-405, D-423..D-425): before the first walk({base}) in a document, id(), index(), text(), fingerprint(), state(), name() and frames() return {why: \"no base\"} (array-returning calls return that object instead), walk() without a base returns it too, and resolve() answers stale; sb-driver must walk with a base after every navigation before any read. A challenge page returns index() = [one CHALLENGE row, role document], text() = [one other block linking it], frames() = [self with challenge: true]. __sbMedia (B-410): list() and cues() may return {why}, frames() entries may carry truncated: true and opts gains budgetMs (default 8000)."
    why: "The un-based first call reused ids across document generations (review Blocking 2) and an empty index for a challenge page was an unreported stop; consumers (sb-driver, sb-media) must handle the new shapes."
  - id: B-194
    from: core
    interface: I-4
    change: "Additive pub items in harness_core::vault: Vault::open_for_set(path, key) -> Result<Vault, VaultError> (Vault::open without the D-118 value rules, for `harness vault set` only; set on that handle checks only the entry being set; never installed as the global scrubber) and VaultError::ValueInLiteral { name } (set or open of a value any of whose spellings occurs, ignoring ASCII case, inside `@vault(` or inside `@vault(n)` for an entry name n; names the entry only). VaultError is now #[non_exhaustive] as D-76 and the I-4 notes already say, so this and later variants break no downstream match; harness-core's own vault_accept_t05 row 5 gained a `_` arm."
    why: "D-118 (3b): a value inside a literal is invisible to scrub, so set and open must refuse it by name; both refusals point the user to `harness vault set <name>`, which needs a way to open the file open refuses, or the repair hint loops (review-T-05 round 4). Default until supreme answers: as implemented in T-05 round 5."
  - id: B-101
    from: core
    interface: I-1
    change: "harness_core::memory::contact_key: normalise with trim() + to_ascii_lowercase() instead of Unicode to_lowercase(); signature unchanged."
    why: "Unicode lowercasing folds compatibility characters (U+212A KELVIN SIGN -> k), so a Send to a different, look-alike address would match a known contact and be allowed without an ask (H-1.1). Mail domains are case-insensitive ASCII after IDNA; local parts beyond ASCII must stay distinct. Default until supreme answers: unchanged (contract), gate behaviour as is."
  - id: B-103
    from: core
    interface: I-3
    change: "Additive: pub fn harness_core::gate::clean_card(card: AskCard) -> AskCard (the D-110 (5) control-strip + caps the gate already applies, today the private card_text/ask_card helpers)."
    why: "ToolCtx::ask (I-2, mid-call asks) must sanitise handler-built cards like the gate does; with the helpers private, T-07 carries a copy of card_text in mcp.rs (card_line), and two copies can drift. Default until supreme answers: keep the copy in mcp.rs, tested by mcp::tests::card_lines_are_clean."
  - id: B-104
    from: core
    interface: I-2
    change: "Additive pub items in harness_core::mcp: serve_io(server, registry, harness, reader, writer), PROTOCOL_VERSION, scrub_value(vault, &Value); new module harness_core::ask (FileAsker, answer, asks_dir, card_path, answer_path). Behaviour: tools/call for a name not in the registry answers JSON-RPC error -32602 (MCP 2025-06-18 'Unknown tool'), not isError; dispatch() still returns ToolError::Args for it."
    why: "Listed so the contract file can name them; serve_io is the test seam for the stdio transport, answer() is what T-08's `harness ask` calls. Default: as implemented in T-07."
  - id: B-150
    from: core
    interface: I-4
    change: "Additive pub items in harness_core::vault: fn default_path() -> Result<PathBuf, VaultError> (SB_VAULT_PATH, else <config_dir>/sheetbrowse/vault.toml.age; D-101), fn default_key() -> KeySource (keychain service `sheetbrowse`, account `vault`; D-101), const MIN_VALUE_CHARS: usize = 4 (D-118). VaultError gains ValueTooShort { name, min } (set or open of a non-empty value under MIN_VALUE_CHARS characters) and ScrubUnavailable (the scrub automaton could not be built; set writes nothing). Adding variants breaks an exhaustive match on VaultError; the only one is harness-core's own test vault_accept_t05 row 5, updated."
    why: "The CLI (`harness vault set`) and bootstrap need one definition of the D-101 defaults; D-118 needs typed errors so a refused short value and a failed scrubber are reported instead of silently over-scrubbing or withholding every output. Default until supreme answers: as implemented in T-05 round 3."
  - id: B-200
    from: sheet
    interface: I-6
    change: "Draft additions, no existing signature changed: sb_sheet::sheet_line(&IndexRow) -> String, sb_sheet::find_lines(&[IndexRow], &[FindHit]) -> String, sb_sheet::data::{aria_roles(alias) -> &[String], alias_for(aria_role) -> &str, role_prior(word) -> &[String], synonyms(word) -> &[String]}, sb_sheet::tokens::estimate(&str) -> usize, and an example binary `cargo run -p sb-sheet --example skeleton -- <index.json>`."
    why: "srv-web and sb-mcp must render find and sheet lines identically (D-203), toolstore::fingerprint must read the same alias table (D-49, D-201), and servers need a smoke test that needs no browser."
  - id: IC-300
    from: store
    interface: I-7
    change: "toolstore is split into pub modules header, domain, loader, fingerprint, invariants, lifecycle, archive, runner; every wave-0 name stays re-exported at the root. ToolStore gains scan(domain, path) -> LoadReport{tools, skipped} (D-306), tool_path, archive_path, archive, git_commit(paths, msg) -> hash (msg must carry a task id), health, register_forged, reforge, confirm, set_pinned, log_invariant, sweep(store, now, visits) -> Vec<SweepAction> (D-303). load() and scan() accept a host or folder and a path or full URL. Free fns relocate(tool, index), planner_class / planner_act_class(tool, program, index, &dyn PlannerCheck) (D-301), check_repair(old_src, new_src, RepairKind) (D-307). StoreError gains Git(String). record/reforge/sweep change files but never commit: the caller commits with its task id."
    why: "T-4 relocate, T-7 sweep, T-9/G-4 invariants and T-1 git commits need entry points the wave-0 draft did not name; consumers srv-web, sb-mcp, toolforge and harness (reflect) call them."
  - id: IC-301
    from: store
    interface: I-12
    change: "toolstore::runner (D-305): traits PageHost {find, find_all, text(Option<&str>), table, url, title} and ApiFetch {api(url)}, both synchronous; run_reader(tool, host, args, Option<&dyn ApiFetch>) and run_planner(tool, host, args) plus *_with(&RunOpts); RunOpts{timeout 2 s, memory_limit 32 MiB, max_stack}; RunError; SheetPage over (&[IndexRow], &[TextBlock], url, title). In JS `page.url` and `page.title` are properties (B-321); `page.api` exists only for @phase 1 readers. Callers run it inside spawn_blocking (B-322)."
    why: "D-53 named a page API and runtime that no interface defined; srv-web (T-12/T-13) and sb-mcp need the exact shape."
  - id: IC-302
    from: store
    interface: I-12
    change: "Amends IC-301 (accepted as D-61) per D-308: ApiFetch::api(&self, url: &str, remaining: Duration) gets the run's remaining wall time and must return within it (a late return, Ok or Err, makes the run RunError::Timeout); RunOpts gains max_output (default 64 KiB of reader JSON or planner program text) and RunError gains OutputTooLarge { max, got }; q(undefined|null) throws TypeError."
    why: "review-T-11-runner should-fix 2 and 3: a hung host fetch outlived the T-9 wall cap, and reader output had no size cap (CLAUDE.md rule 5). srv-web and sb-mcp ApiFetch impls must honour `remaining`."
  - id: IC-303
    from: store
    interface: I-7
    change: "Amends IC-300 (accepted as D-60) per D-310/D-311: StoreError gains BadPath; new pub fns try_tool_path, try_archive_path, valid_domain, valid_name, check_tool_id; folder_for returns \"\" for hosts that cannot be a folder and every mutator refuses it; planner_class/planner_act_class reject an @vault(k) the tool source does not contain literally (D-309)."
    why: "review-T-11-core blocking 1-3 (path traversal, git pathspec magic, vault key bypass)."
  - id: IC-304
    from: store
    interface: I-7
    change: "Completes IC-300..IC-303 (review-T-11 should-fix 5). Further pub items: runner::{ALLOWED_GLOBALS, FIND_ALL_K, table_json}; invariants::{stop_count, vault_keys}; archive::has_task_id; domain::{normalize_host, registrable, SiteConfig}; fingerprint::{fingerprint_items, role_matches, norm, parse_fingerprint, render_fingerprint, patch_fingerprint}; loader::{namespace, glob_match, url_path}; skeleton_line; lifecycle consts CLEAN_RUNS_TO_SAVE, MISSES_TO_RETIRE, EPHEMERAL_IDLE_DAYS, EPHEMERAL_IDLE_VISITS, ARCHIVE_DELETE_DAYS. Behaviour: tool_path/archive_path return an empty PathBuf on bad input (try_* return BadPath); record(Relocated) on a retired row is an error; a reforge of an ask row stays ask (D-310)."
    why: "Consumers (srv-web, sb-mcp, toolforge, harness) should see the whole surface before coding against it; these helpers are what toolforge's G-2 static check reuses."
  - id: B-413
    from: page
    interface: I-11
    change: "__sbMedia whole-call refusals: frame() returns {t: null, why} and frames(id, times) returns a single {t: null, why} entry (not one per time) when the call is refused as a whole (no base, unknown id, challenge). Proposed note in I-11: a single t:null entry with why means the whole call was refused; per-time failures keep one entry per time."
    why: "accept-T-19-js round 2 note 2: I-11 promises a bare {why} only for list() and cues(), so sb-media (wave 2) needs the frame()/frames() refusal shape written down before it parses them."

  - id: B-177
    from: core
    interface: I-2
    change: "Behaviour only, no signature change (D-119). harness_core::ask::answer returns io::ErrorKind::AlreadyExists with a plain message when the ask is closed: already answered, or timed out (FileAsker claims <n>.answer with `timeout`; both sides claim it no-clobber via a temp file and hard_link). FileAsker::ask returns TimeoutSkip when it cannot write the card. dispatch and ToolCtx::ask read a missing runs row as strict, cap every Asker at card.timeout + 5 s (TimeoutSkip), and dispatch catches a handler or classifier panic (ToolError::Failed + an ok=false tool event). ToolCtx::ask runs its card through Gate::check (Stop: no card, a core stop, TimeoutSkip). serve_io answers -32700 for a non-UTF-8 line and scrubs only payload strings."
    why: "review-T-07 blocking and should-fix items. `harness ask` (T-08) should print the AlreadyExists message to the user as is; every other change only makes the wrapper stricter."
  - id: B-185
    from: core
    interface: "harness_core::sched (owned by core, not a contract module; consumer: harness)"
    change: "Additive pub API (T-08, D-116). sched::run_loop(store) is replaced by Scheduler { runner, wake: Arc<Notify>, fired: Option<mpsc::UnboundedSender<Fired>> }::run_loop(shutdown). New: trait Launcher { launch(LaunchRequest{run, runs_root, prompt}) -> Result<LaunchExit{code}, LaunchError> } (D-106 placement moved from the harness crate to core, D-116 (1)); trait Clock { now, sleep_until } with SystemClock and ManualClock { new, set, next_deadline, deadline_where }; Runner { store, launcher, clock, runs_root } with fire(&Schedule) and execute(RunSpec{prompt, parent_run, strict, schedule}) -> Finished{run, folder, status, parent_run, schedule, launch_problem}; parse_cron (5 fields, UTC), next_after, changed_dir, notify_changed, CHANGED_DIR, FIRE_TOOL, LAUNCH_TOOL; SchedError {BadCron, NotInPhase1, Memory, Ledger, Io}. The harness crate (lib) adds Env, CliError, cli::{Cli, Cmd, Ctx, execute, SCHEDULE_ADD_TOOL}, daemon::{Daemon, watch_changes}, ClaudeLauncher."
    why: "The scheduler loop in core must call the launcher, so the trait cannot live in the crate above it; a Clock seam makes the step-1 scheduler acceptance testable without a model or a real minute. Anything that adds or removes a schedule outside the CLI (a future srv-cli tool) must call sched::notify_changed so harnessd re-reads. Default: as implemented."
  - id: B-191
    from: core
    interface: I-3
    change: "Behaviour, no signature change (D-120): rule_domain returns the Punycode A-label form and refuses non-mappable Unicode; rule_hint accepts only ASCII a-z 0-9 _ - .; a Send AskCard's values[0] is always ('new recipients (N)', list) written by the gate, and any other value under that key (classifier, args, clean_card input) is dropped; blank Call.recipients are ignored and duplicates count once."
    why: "Consumers that render or parse cards (FileAsker, harness ask, T-09 echo.send tests) and classifiers that emit hints must know the row and the hint alphabet; stored gate.rules keys written before this change with non-ASCII domains will no longer match and should be re-set."

  - id: B-193
    from: core
    interface: I-3
    change: "Names only, no behaviour change: add ANY_DOMAIN, rule_domain, rule_hint, rule_class_key and rule_key (harness_core::gate) to I-3's rust: list, and list core-pg as a consumer. D-113 makes them the one canonicaliser for gate.rules keys and core-pg calls them (crates/core-pg/src/lib.rs rule_set and rule lookup); D-81 records their behaviour but not their names."
    why: "review-T-04 round 3 should-fix 2: their behaviour is already contract in fact, so a wave-2 consumer must be able to find them in I-3. Default: as implemented."

  - id: B-195
    from: core
    interface: "harness_core::sched (I-13 draft, D-80)"
    change: "Additive: trait Launcher gains a provided method fn before_run(&self) -> Result<(), LaunchError> (default Ok); Runner::execute calls it first, before the prompt is scrubbed, and when it fails returns the new variant SchedError::BeforeRun(LaunchError) without creating a folder or runs row. Existing Launcher impls compile unchanged; a match on SchedError without a wildcard arm needs the new arm (none in the workspace). The harness crate adds daemon::ReopenVault (harnessd's launcher wrapper that re-opens the vault in before_run) and launcher::{DISALLOWED_TOOLS, DEFAULT_SESSION_CAP, SESSION_CAP_VAR, DEFAULT_MAX_ANSWER_BYTES, ANSWER_SCRUB_SLACK, parse_session_cap, session_cap_from_env, answer_text}, with ClaudeLauncher fields max_session and max_answer_bytes (D-124)."
    why: "review-T-08 should-fix 7: harnessd must scrub a vault value added after it started, and the prompt is scrubbed inside Runner::execute, so the re-open has to happen there, before anything is written. Default until supreme answers: as implemented in T-08 round 2."
  - id: IC-305
    from: store
    interface: I-7
    change: "Additive, per D-315 (B-33 (3)): toolstore::ToolStore::{scan_live(&self, store: &dyn MemoryStore, domain: &str, path: &str) -> Result<LoadReport, StoreError>, load_live(&self, store: &dyn MemoryStore, domain: &str, path: &str) -> Result<Vec<Tool>, StoreError>} (async). They skip tools whose tools.health row is retired. Behaviour per D-316: a retire whose archive fails is an ok:true tools.retire plus an ok:false tools.archive event, and record() returns Ok for it. Proposed for wave 4: #[deprecated] on the sync load/scan in favour of the live pair."
    why: "Runtime callers (srv-web T-13, sb-mcp, toolforge) must not serve a retired tool whose file is still in place; load cannot see tools.health without MemoryStore. Default until supreme answers: callers use load_live; load/scan stay for tests and offline tooling."
  - id: B-604
    from: driver
    interface: "I-8 (sb-cdp), I-9 (sb-driver)"
    change: "Additive only; every I-8/I-9 path and signature is unchanged. sb_cdp: Cdp, CdpError, CdpSender (start, call, start_then, pending, is_closed), Event, Observer, COMMAND_TIMEOUT, Pipe::{launch, pid, pids, kill}, DROP_KILL_CAP, process_running, WebSocket::connect, devtools_active_port, parse_devtools_active_port. CdpSender::start_then(session, method, params, then) -> bool queues a command whose reply the reader task hands to `then` synchronously, in wire order with the events (no 10 s timeout; dropped uncalled on close). sb_driver: DriverError::Launch, impl From<CdpError> for DriverError, Driver::{launch_with, cdp, with_registry, wait_registry, pid, pids, profile_dir, shutdown}, Registry (with take_seeds, tracks, seed_frame_tree), Seed, ExecContext, SB_WORLD, LaunchEnv, launch_args, resolve_chromium, platform_dir, binary_name, CHROMIUM_VERSION. The registry also applies Target.targetDestroyed (removes the tab) and Target.targetInfoChanged for prerender activation (B-602 lists the events it applies)."
    why: "review-T-18 round 1 asked for the additive items to be listed for the supreme; round 2 adds start_then and the seed API because Page.enable does not replay existing frames (review should-fix 6) and the seed must be applied at its place in the event stream. Default until supreme answers: as implemented in T-18 round 2."
  - id: B-609
    from: driver
    interface: "I-8 (sb-cdp)"
    change: "Additive only: sb_cdp::Cdp::start_raw(session: Option<&str>, method: &str, params: &[u8]) and sb_cdp::CdpSender::start_raw(same), returning the same future as start. params is serialized JSON given as bytes (not parsed); the message is built in one buffer of exact size that is zeroed when the transport drops it, and Pipe's writer zeroes its framing copy after every write. Errors name the method only. No existing signature changes. Also behaviour, no signature change, I-9: Driver::open uses the browser's startup tab once (D-610); Driver::launch denies downloads (D-611); popups run when their first navigation starts (D-612); Driver::act gates every step against ctx.class (D-608)."
    why: "T-21: a vault value goes into the Input.insertText message bytes inside ToolCtx::resolve_into (H-2, D-55); start(Value) would leave unzeroed copies of it in a serde_json Value and its serialization. crates/sb-cdp/tests/contract_paths.rs b609_additive_paths_resolve uses both paths. Default until supreme answers: as implemented."

  - id: B-196
    from: core
    interface: I-4
    change: "Implements D-84 (supersedes the open_for_set signature in B-194): harness_core::vault::Vault::open_for_set(path: &Path, key: &KeySource) -> Result<harness_core::vault::VaultEditor, VaultError>, also re-exported as harness_core::VaultEditor. VaultEditor has exactly set(&mut self, name, value, EntryKind) -> Result<(), VaultError>, remove(&mut self, name) -> Result<(), VaultError>, names(&self) -> Vec<(String, EntryKind)> and save(self) -> Result<(), VaultError>, plus a Debug that prints `VaultEditor(..)`; no resolve_into, scrub, install_global, Deref or From to Vault (compile_fail doctests in vault.rs). set and remove write through: each runs its whole read-modify-write under the exclusive <vault file>.lock like Vault::set; set checks only the rules involving the entry being set (D-118); remove of a name the file does not hold, or on a missing file, is Unknown(name) and writes nothing and generates no key. save writes nothing: it only verifies that the file on disk decrypts with the key (a missing file is ok only when the editor holds no entries, else Io(NotFound))."
    why: "D-84: the handle that skips D-118's value rules must not be able to resolve a value or become the process-wide scrubber, so the restriction is in the type. Write-through keeps concurrent `harness vault set` runs from dropping each other's entries, as Vault::set already guarantees, so save has nothing left to write. interfaces.yaml I-4 already names VaultEditor; this records the method set and the write-through semantics. Default: as implemented in T-05c."

