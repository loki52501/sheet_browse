state: "Round 3 (review-T-12b round 2 Blockings 1 and 2, item 3, should-fix 2 and 3) is in commit a487bc7 on swarm/servers-T12b. (1, Blocking 1) The walk no longer recurses without bound: Walker::walk counts its depth and below WALK_DEPTH_MAX = 256 reads a subtree as plain text (collect_text, its own stack) with a note under the skeleton (Doc::cut, 'page nests elements more than 256 levels deep; what is deeper is shown as plain text without its links and fields'); controls nested in controls get rows in one loop (Walker::row split out of control, nested_controls with its own stack); collect_text, fragment_text (no ancestors() per text node any more) and serialize (raw_main_html) keep explicit stacks. Other walks over the tree (Walker::new, densest, onclick_button, page_title, base_url, selectors) were already iterative. (2, Blocking 2) New src/dom.rs: every html5ever parse in srv-web goes through dom::document or dom::fragment, which feed the parser 1024 bytes at a time and check between pieces the deadline (dom::Budget), the depth of the newest node against NEST_MAX = 512 (Chromium's parser cap) and the node count against 2 per byte + 1024 (formatting-element reconstruction); past a cap the parse stops there, keeps what it parsed and fetch shows 'page nested too deep to read past 512 levels; the rest of the page after that point is missing'. I picked this over the byte-scan estimate (refuse or strip): it measures the parser's real depth, so implied end tags cannot trip it and <div/> or reconstruction cannot slip past it (D-519). Debug timings: 512 nested div 34 ms; 100 000 nested div stops in 56 ms. (3) feed::parse_with and search::parse_answer_in run in spawn_blocking under fetch::WALK_MAX with a Budget and a timeout on the task. (should-fix 2, D-526) api_for's lookup is capped at http::LOOKUP_MAX = 5 s and api's request timeout is what is left of cfg.timeout. (should-fix 3, D-527) a retired tool keeps Relocated (toolstore refuses it), is removed from the registry