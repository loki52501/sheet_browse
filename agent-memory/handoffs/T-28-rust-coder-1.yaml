gotchas:
  - "parse_recipe checks every string of the YAML tree (keys too) for `***`, key shapes and core::scrub changes BEFORE the typed parse, so serde messages (unknown field, unknown variant) can never echo a vault value. Keep that order if you add rules."
  - "core::scrub only knows vault values when a vault is installed globally (Vault::install_global). harness-core's lib test binary must never install one (vault::tests::global_scrub_before_and_after_install asserts the slot is empty), which is why the D-154 canary test is its own file crates/core/tests/report_browser_t28.rs. The toolstore lib tests install a canary-only vault (tests_recipe::install_canary_vault)."
  - "The secret hook refuses writes that contain key-shaped literals: tests build them at run time (format!(\"{}{}\", \"sk-\", ...))."
  - "required: true together with a default is refused (B-210); tools.save must not write both."
  - "@vault(k) is allowed only at act args text, value and fields[i].value; anywhere else (other act args, other tools, targets, description, expects, match) it is refused. A secret-looking key (password, otp, pin, card, token, api_key...) may hold only {arg}/@vault refs, never a literal string or number."
  - "Browser: lines are numbered by 1-based file line (blank lines skipped, numbers kept), the same number tools.save takes. Format details are B-211."
  - "Builds: CARGO_TARGET_DIR=F:/sb-swarm/wt/core/target is shared with the other coder; expect several minutes of `Blocking waiting for file lock`."
