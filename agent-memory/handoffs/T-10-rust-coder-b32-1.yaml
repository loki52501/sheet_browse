  - "P1 (refines D-219): inside code blocks keep `[` `]` and break only the link-form shape (`](` -> `)(`), so code such as `a[0]` and `#[derive]` stays readable while `[x](#3)` still cannot be forged; the longer fence already marks the block as page content."
  - "P2 (extends D-220): a region switch also keeps the cursor's used (implemented that way, fails closed); a caller that wants a fresh budget drops the cursor."
  - "P3 (new, pr-ready section 5): a paragraph whose text starts with `remaining:`, `truncated:` or `chunk N of M` can pose as a trailer or note line; escape those prefixes at the start of a unit body. Also skeleton title, form headings, warning names and sheet lines print row names with only `\"` -> `'` (a `[button 'x'](#3)` look-alike survives); route them through link_text."
  - "P4 (D-222 edge): with an empty chunk the reader always makes progress, so when max_tokens leaves fewer chars than a unit's fixed overhead (code fence lines) or a table header's separator suffix, the piece can exceed the remainder by that overhead. Fix would return an empty truncated body instead."
