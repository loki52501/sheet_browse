state: "T-05 fix round 3 on harness_core::vault (H-2, I-4, D-101, D-102, D-118), code commit bed9d02. Every Should-fix in bench/results/review-T-05.md (round 2) is addressed. (1) The stale #[allow(clippy::incompatible_msrv)] lines and the false 1.85 comment are gone from vault.rs and tests/vault_scrub_t05_fix.rs (D-112 made rust-version 1.94). (2) A failed scrubber build is now reported. Vault::open and Vault::set return VaultError::ScrubUnavailable, and set builds the scrubber before it encrypts or writes, so a failed set changes nothing. Only Vault::in_memory keeps the SCRUB_WITHHELD backstop. The doc comment says that marker is itself a malformed ref, and a unit test pins that. (3) Short values: the floor is MIN_VALUE_CHARS = 4 characters (chars, not bytes). set refuses a shorter non-empty value with VaultError::ValueTooShort { name, min } before it touches the file. open refuses a file that holds one, and so does set when it re-reads the file under its lock. Empty values are still allowed and scrub nothing. in_memory is exempt, because test fixtures such as r2_5's `K9` use short values. Scrub never matches wholly inside the @vault(name) literal of an existing entry, or inside the fixed `@vault(` of any opener. So scrub output parses with vault_refs and scrub(scrub(s)) == scrub(s). The name inside an unknown or malformed literal is still scrubbed, and so is a match that only overlaps a literal, so a value cannot hide behind one. (4) D-102 is amended by D-118 in decisions.yaml. D-102's text now points to D-118. (5) B-150 (interface_changes, I-4) lists the additive pub items: default_path, default_key, MIN_VALUE_CHARS, and the variants ValueTooShort and ScrubUnavailable. (6) Each known limit now has a blocker with a deadline. B-151, before step 2: base64 and base64url. B-152, before step 3: input masks, DOM-split and ellipsis-truncated values, and mixed Unicode case; it also lists what is accepted for Phase 1. HTML-safe JSON (Go and Rails `<>&` and U+2028/9 escapes, and System.Text.Json's `<>&'+\"` escapes plus all non-ASCII as \\u00XX) is fixed here rather than deferred. (7) The 3 red-first tests in tests/vault_accept_t05_r2.rs (r2_4b, r2_4c, r2_4d) are un-ignored and pass. They needed new spellings: {:?} inside JSON, {:?} inside {:?}, and JSON inside {:?}. The clippy unnecessary_literal_unwrap at the old :758/:766 was already gone at HEAD, because the tester's std::hint::black_box wrapper fixed it. Clippy on that file is clean with no change. vault_accept_t05 row 5 now matches the 2 new variants and requires ValueTooShort to be exercised. New tests: 6 unit tests in vault.rs (failed_build_withholds_output, extended; set_refuses_values_under_the_floor; open_refuses_a_file_holding_a_short_value; short_values_never_touch_vault_literals; literal_ranges_and_inside; html_safe_and_nested_json_debug_spellings) and 2 integration tests in tests/vault_scrub_t05_fix.rs (section 9). Results: --lib vault:: 21 passed; vault_accept_t05 9, vault_accept_t05_r2 14, vault_scrub_t05_fix 11, all passing with 0 ignored. The canary had 0 hits with a random SB_VAULT_CANARY, and the tests also pass with the fallback canary. Clippy on --lib and the 3 vault test targets with -D warnings is clean."
not_done: "(a) B-151 (base64) must close before step 2's acceptance, and B-152 (masks, DOM-split and ellipsis values, CSS capitalize) before step 3's. (b) Review notes left as notes: two different entries whose spans only touch merge under the left name, which over-scrubs safely. The global scrubber does not see a `vault set` from another process until the vault is reopened; T-07 bootstrap or harnessd should reopen or watch the file. The panic hook prints a leading newline and omits the RUST_BACKTRACE note. (c) ScrubUnavailable cannot be triggered through the public API (aho-corasick limits are far beyond any vault). Only the Scrubber::checked unit test covers the mapping, and row 5 accepts the variant without requiring it."
gotchas:
  - "For T-06 (ledger fails closed when scrub would change a line), the floor means a real (open/set) vault never holds a 1 to 3 character value. A 4-character value can still match inside ordinary text (a PIN `1990` in a year, `Anna` in `Annabelle`); D-117 handles that by checking only data fields. in_memory vaults can still hold short values (accept_t06_r2_year uses one), so ledger tests built on in_memory are not protected by the floor."
  - "The literal protection covers only names of entries with a non-empty value, plus the `@vault(` text of any opener. `@vault(unknown)` keeps its `@vault(` but its name part can still be scrubbed. This is deliberate: protecting arbitrary names would let a page that wraps a reflected secret in `@vault(...)` hide it from scrub (rule 2)."
  - "A value the TOML file holds under the floor makes open fail with ValueTooShort naming the entry. There is no remove API, so such a file has to be re-created. No real vault predates the floor, since T-05 is not on main."
  - "Commits to agent-memory/*.yaml in this shared worktree: `git commit -- <file>` commits other coders' uncommitted hunks too. My D-118 first landed inside another coder's commit f2dea11. For the D-118 refinement (f00c0b3) I staged only my hunk with git hash-object + update-index --cacheinfo."
  - "`cargo test ... --lib vault:: --test X` applies the `vault::` filter to the integration test binaries too, so they run 0 tests. Run the --lib filter and the --test targets as two commands (see verify)."
  - "I ran `cargo fmt -p harness-core` once by mistake, which formats every file in the crate. The PostToolUse hook already rustfmts every edit, so it should have been a no-op on other coders' files. Use `rustfmt --edition 2021 <files>`."
