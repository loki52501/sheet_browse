gotchas:
  - "New public items (additive, not in I-4): vault::default_path() reads SB_VAULT_PATH, else <config_dir>/sheetbrowse/vault.toml.age; vault::default_key() returns Keychain{service: sheetbrowse, account: vault}. Use these in `harness vault set` and bootstrap."
  - "keyring 4.x is a wrapper around keyring-core. The default `v1` feature picks Windows Credential Manager, macOS Keychain or zbus Secret Service per target, so no target-specific features are needed (keyring 3 silently used a mock store without features; 4 does not)."
