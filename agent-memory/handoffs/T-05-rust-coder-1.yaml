  - "Only vault::tests::global_scrub_before_and_after_install touches the process-wide slot. If another test in harness-core calls install_global, the 'before install' assertion becomes order-dependent; keep install_global out of other unit tests or move them to an integration test binary."
  - "Empty values are never scrubbed (D-102 says non-empty) but resolve to an empty string."
  - "The aho-corasick automaton and toml/serde_json intermediate buffers hold value bytes that are not zeroized; values themselves, decrypted plaintext and serialized TOML are Zeroizing."
