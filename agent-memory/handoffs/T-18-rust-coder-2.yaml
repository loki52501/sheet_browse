state: "All nine review-T-18 should-fix items and the tester's uncapped-wait note are fixed. (1) Windows Pipe launch: the attribute list, CRT block and STARTUPINFOEX are built first, then under a crate-private LAUNCH_LOCK the three handles become inheritable, CreateProcessW runs and our copies close at once, so the inheritable window holds only CreateProcessW; the wrong comment is replaced. The remaining limit (a concurrent std::process::Command spawn on another thread can still inherit the pipe ends) is decision D-602. AttrList now borrows its handle slice (PhantomData lifetime). (2) Unix Proc has a Drop that kills the process group when the child is still unreaped (failed bridge-thread start). (3) Windows kill: try_pids returns an error on any query failure (ERROR_MORE_DATA included) and kill returns false on it; the loop checks the deadline every pass; a pid counts as gone only when its handle was signalled or OpenProcess fails with ERROR_INVALID_PARAMETER (no such process), any other OpenProcess failure returns false; pids() reports the leader when the job cannot be queried. (4) Registry: a second session on a known page (or OOPIF) target is not tracked, so its events and its detach change nothing; only the owner's detach or Target.targetDestroyed (now applied) removes the tab. (5) Page targets with any non-empty subtype (prerender) are not tabs; they are kept aside by session, and on activation (targetInfoChanged without subtype) the prerender takes over the tab it was attached under (new target and session, frames reset, frame 0 generation bumped, old sessions dropped), or becomes a new tab if that tab is gone. (6) A page or OOPIF attached running (waitingForDebugger false: initial tab, tabs `me` restores, pre-existing OOPIFs) is queued as a Seed; the observer sends Page.getFrameTree between Page.enable and Runtime.enable, all pipelined, and applies the reply with the new CdpSender::start_then, which runs the reply hook inside the reader in wire order, so replayed contexts find their frames. An activated prerender gets getFrameTree, Runtime.disable, Runtime.enable. (7) observer_sees_each_event_before_subscribers now peeks a subscriber of the all-events and the session stream from inside the observer; moving the observer call after the broadcasts turned it red (seen, then restored). (8) tests/common/mod.rs (same file in both crates) resolves SB_CHROMIUM (set but missing fails), then the D-601 pinned path under SB_HOME or the workspace root, then Playwright chromium-1248 under PLAYWRIGHT_BROWSERS_PATH or the per-user default; with no browser the test FAILS naming the paths, and only SB_CHROMIUM_TESTS=0 skips (prints SKIP: <test>). Checked both ways with a bogus PLAYWRIGHT_BROWSERS_PATH. (9) chromium_websocket kills and reaps Chrome through a KillOnDrop guard on any panic. (10) Every event wait in the client unit tests is capped at 5 s. Also: Driver docs say drop blocks up to DROP_KILL_CAP and `me` callers should shutdown(); additive API listed as interface change B-604 and pinned in both contract_paths tests. fmt, clippy -D warnings (Windows, and sb-cdp for x86_64-unknown-linux-gnu) clean. cargo test -j 2 -p sb-cdp -p sb-driver: sb-cdp 26 (lib 17, accept_t18 5, chromium_pipe 1, chromium_websocket 1, contract_paths 2), sb-driver 39 (lib 35, accept_t18 1, chromium_driver 1, contract_paths 2), real Chromium ran, no SKIP. Mutations seen red this round: observer order (item 7), prerender subtype check removed, second-session guard removed."
not_done: "1. T-20..T-22 driver methods remain todo!(). 2. B-601 (stale titles) unchanged. 3. Prerender activation and pre-existing-frame seeding are proven with mock-transport tests only: no real-Chromium test, since the initial tab is about:blank and a prerender needs a Speculation Rules page; T-22 acceptance should cover a restored `me` tab with iframes. 4. Unix pipe launch still compile- and clippy-checked only. 5. Review notes left as is: session_events for an already-detached session registers a channel that only closes at client close; From<CdpError> maps Closed to Transport(Closed) without the method; Unix kill waits for the leader then probes the group once (can report false spuriously); stale profiles/bench-* after a harness crash are not swept; tabs() titles and URLs are page-controlled and must be escaped and capped by their renderer (T-22, sb-mcp). 6. Real-browser tests keep their 30 s caps (loaded machine), not 5 s. 7. cargo test --workspace (pr-ready section 3) was started but killed by the host for low memory before it printed any result; it is not proven for this round. Only sb-cdp and sb-driver changed (plus dev-dependencies async-trait and bytes, already in the workspace), so no other crate is affected, but the run is still owed."
gotchas:
  - "Bash heredocs with long Python bodies sometimes fail to parse in this tool; write edit scripts to target/scratch/ (git-ignored, inside the worktree, so the write hook allows it) and run them."
  - "CdpSender::start_then hooks run inside the reader task: keep them short and never await or block on the client from one. They are dropped uncalled on close and have no 10 s timeout; they count in pending()."
  - "Seeding relies on CDP answering a session's commands in order, so Page.getFrameTree must stay before Runtime.enable in on_attached: Runtime.enable replays existing contexts as events right before its reply, and contexts for frames the registry does not know yet are dropped."
  - "Prerender targets arrive under the page session that speculated them (page-level auto-attach); activation is a Target.targetInfoChanged whose targetInfo has no subtype. This follows Puppeteer's handling; not yet seen on chromium-1248 in a test."
