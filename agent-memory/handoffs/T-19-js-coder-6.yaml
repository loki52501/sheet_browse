state: "D-439 applied in injected/injected.js (commit edd30e4). (1) Remove-first across batches: in inheritSensitive a batch's S.gone entries are built first ({t, keys, parent: null}); for a parent that lost exactly one value field, a sensitive one, and gained none in the batch, the entry gets parent = WeakRef(parent) (a same-batch one-for-one still goes through D-437). On the add side, the first later batch within 2000 ms that adds value fields to an armed parent consumes the entry (parent set to null) and, when it adds exactly one, that field inherits (S.sens). An armed entry is kept even when the removed field has no keys. (2) The add side's S.sens.has(f) || sensitive(f) check and every key read run inside the fail-closed try; a throw marks the field sensitive and the batch goes on. The removal side's sensitive(f) is also wrapped: a removed field whose sensitivity cannot be read counts as a sensitive one (its keys then usually throw too, giving a match-all S.gone entry, D-438 (3)). Throwing getters are reachable only from the same JS world (jsdom), not from a page in Chromium. (3) Chromium: bench/pages/remove-first.html (remove; setTimeout 0; append a neutral input into the same parent) and a browser test asserting zero value getter calls. bench/pages/add-first.html gains #w6 (user + password in one wrapper) for the lost-two control. node --test injected/test/jsdom.test.js 39/39 (2 new), jsdom.test.js + browser.test.js 65/65 (3 new), node --test injected/test/ 89/91 (the 2 failures are B-415, below, and also fail on HEAD 2ec0d4f), cargo test -p sb-act --test wire_from_injected 3/3."
not_done: "1) B-415: accept-t19 A10 and A14 fail in full-suite runs (and intermittently alone) on HEAD 2ec0d4f and on edd30e4 alike: D-438 (1)'s born same-parent rule counts parse-time inserts, so #nick (added to the form through its label at load) is 'the single field added' when a wrapper in the same form is swapped within 2 s of load. Not fixed (outside D-439); proposed defaults in blockers.yaml B-415. 2) Consumption is my reading of 'a later batch adds exactly one': the first later batch that adds value fields to the armed parent decides; a later batch adding two fields consumes the entry without marking, and a third single add later does not inherit. 3) Over-mark cost (accepted by D-437/D-439): a one-field step that removes its only (sensitive) field and, within 2 s, appends any one field into the same parent marks it. 4) Caps still untested (S.gone 32, S.born 64, NEAR_MAX 64). 5) A field counted under two record targets (parser or incremental builders: container added, then the input into it, same batch) counts for both parents; that is the root of B-415."
