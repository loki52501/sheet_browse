gotchas:
  - "The process-wide scrubber (vault::install_global) is shared by every test in a test binary. Tests that install a vault with values must live in their own binary and hold a lock (t08_vault.rs LOCK), or a parallel test that installs an empty vault races them."
  - "The binary cannot use a non-empty vault in tests: Env::from_env always takes the keychain key (D-1). So the binary error path is tested at library level, with main.rs's exact scrub(format!(\"{e:#}\"))."
