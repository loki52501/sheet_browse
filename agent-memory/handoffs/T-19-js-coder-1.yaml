gotchas:
  - "Chrome's el.labels walks every label in the document per call, so a walk that asked it per control was O(n^2) (1.5 s at 6000 rows). injected.js builds a control -> labels map once per walk from the labels the walk visits (labelsOf/buildLabelMap)."
  - "Node 22 runs `node --test <directory>` as a module, so injected/test/index.js requires the three suites; `npm test` inside injected/test lists the files explicitly."
  - "Chrome seeks media only when the server answers Range requests; the test server in helpers.js does. Playwright recordVideo clips vary in length and segment timing under load, so the media test samples densely and checks colours, not fixed times."
  - "jsdom objects come from another realm: assert.deepStrictEqual fails on equal shapes; the jsdom tests compare through JSON (same())."
  - "index() omits State fields equal to sb_sheet::State::default() and false flags; tests read rows through helpers.fill(), which applies the same defaults serde does."
  - "The dotpals Stop/PreToolUse hook refuses a commit when any file in the worktree (including the rust-coder's crates/sb-act) changed after the last test run; rerun the fast jsdom suite right before committing. guard_write blocks writes outside the worktree, including the session scratchpad."
  - "Bash heredocs containing apostrophes failed in this harness with 'unexpected EOF'; write files with the Write tool instead."
  - "playwright-core is pinned to 1.59.1 because its browsers.json names chromium-1217, which is installed; a different version looks for a revision that is not on this machine (SB_CHROMIUM overrides the executable)."
