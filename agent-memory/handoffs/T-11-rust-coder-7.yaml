ccept_t11 d312_reforge_with_a_different_name_refused now assert that why says 'rejected: ... D-312' and that nothing else in the row changes. No pub API added: archive_with, sweep_with, touch and SetMtime are pub(crate) or private. cargo test -p toolstore: 116 lib + 35 accept_t11 + 1 contract_paths pass."
