state: "T-05 fix round on harness_core::vault (H-2, D-102), closing the scrub bypasses an adversarial review found in 49cce85. I-4 signatures unchanged. (1) Scrub spellings now include the WHATWG fragment, query, special-query, path (with and without ^) and userinfo percent-encode sets, encodeURI, RFC 3986 unreserved and Python quote(). The WHATWG component set equals encodeURIComponent. Space is written as %20 and as +. Upper and lower hex both match. (2) The automaton is ASCII-case-insensitive. Values with non-ASCII characters also get char-wise lower/upper and std to_lowercase (final sigma) base forms, and every encoding is applied to each base form. (3) Double percent-encoding: each single-level percent spelling is encoded once more with the encoders that turn % into %25 (all non-alnum, encodeURIComponent, form, unreserved, unreserved+/). (4) Rust Debug spellings: {:?} without quotes, escape_debug, escape_default. Also JSON with \\/. (5) Overlaps: an overlapping search (MatchKind::Standard) feeds a stack merge that is linear in the number of matches. Overlapping and adjacent spans merge, and the leftmost match names the merged span (longest first, then lowest pattern id). (6) set() holds an exclusive std File::lock on <vault file>.lock for the whole read-modify-write. Under the lock it re-loads the identity, re-reads and decrypts the current file, generates the identity only if neither the key nor the file exists, applies the change, and writes atomically (the temp name is now unique per process and call). The handle also picks up entries other writers added. (7) The panic hook writes with `let _ = writeln!(stderr().lock(), ..)`, so a broken stderr no longer double-panics and aborts. (8) Decryption goes through the streaming age Decryptor into a Zeroizing buffer of ciphertext length that never grows. Every spelling temporary is a pre-sized Zeroizing<String>. TOML is serialized by hand into one pre-sized Zeroizing buffer, with names quoted because . is a dotted key. Extra: a failed automaton build now fails closed (scrub returns a fixed withheld marker, not the input). Tests: 7 new regression tests in crates/core/tests/vault_scrub_t05_fix.rs, each confirmed failing on 49cce85 (the panic test child aborted with 0xC0000409), plus a TOML round-trip test. New vault unit tests: json_escape_matches_serde_json, debug_inner_is_debug_without_quotes, merge_spans_any_order, failed_build_withholds_output, set_picks_up_entries_written_since_open. `cargo test -p harness-core` passes, no feature flag needed (66 unit, 47 integration). `cargo clippy -p harness-core --all-targets -- -D warnings` is clean."
not_done: "Known limits, not addressed: (a) input-mask reformatting. A site that re-renders a phone, card or date value with its own separators (e.g. 555-0100 shown as (555) 0100) is not matched. (b) base64 (for example an echoed HTTP Basic header) and other encodings: HTML entities, quoted-printable, punycode. (c) Values split across DOM nodes or truncated with an ellipsis. (d) Case-insensitive matching over-scrubs short personal values (a 2-letter entry is redacted wherever those letters appear). This is harmless for rule 2 but can hurt readability, so consider a minimum length or a word-boundary rule for personal entries in a D-102 follow-up. (e) Vault::open takes no shared lock. A concurrent open during a set reads either the old or the new file (rename is atomic), never a torn one, so no lock is needed for correctness. (f) Plaintext residue that stays unzeroed: age's StreamWriter plaintext chunk during encrypt, toml parser internals during decrypt, std to_lowercase growth, and the aho-corasick pattern store for the scrubber's lifetime."
gotchas:
  - "MSRV: std::fs::File::lock is stable from 1.89 and std::io::pipe (used in the panic test) from 1.87, but workspace rust-version is 1.85. Both call sites carry #[allow(clippy::incompatible_msrv)] with a comment. Proposal for supreme (not written to blockers.yaml because this brief limited edits to vault.rs and my tests): bump workspace rust-version to 1.89. The toolchain is 1.99."
  - "The panic hook's dirty branch now writes to the raw stderr, which bypasses libtest capture. A unit test that panics with a vault value prints its scrubbed message even when the test passes (vault::tests::global_scrub_before_and_after_install prints 'boom @vault(test)'). This is expected and is not a leak."
  - "Scrubber build cost grows with the spellings. In release, one 40-char non-ASCII value gives about 134 patterns (12 KB) and takes about 0.6 ms to generate. 50 such entries take about 80 ms per Vault::open/set (about 1/3 of that for ASCII-only values) and about 1-2 s in debug builds. Scrubbing 100 KB takes about 0.25 ms in release. If vaults grow large, cache the per-entry spellings across set() calls instead of rebuilding all entries."
  - "Old code's percent_encoding helpers (URI_COMPONENT, FORM, lower_hex_escapes) now live only in vault::tests as an independent oracle. The crate keeps percent-encoding as a dependency for those tests. The production encoder is vault::pct_encode with PctSet."
  - "The lock file <vault>.lock stays next to the vault on purpose. Deleting it would let two lockers hold different inodes. Tests that list a temp dir must allow it (row6 only checks for .tmp)."
  - "cargo fmt -p harness-core formats every file in the crate, including files other coders are mid-edit on. Use `rustfmt --edition 2021 <your files>` in a shared worktree."
