gotchas:
  - "Windows timers wake up to about 16 ms late, so a wait that runs to its deadline ends 3.00 to 3.016 s after it starts. That leaves about 25 ms of the 40 ms slack."
  - "After a click, the XHR's Network.requestWillBeSent can arrive after the mouseReleased reply, so the window's first network wait may see idle and make the full 500 ms call first. The tightened accept_t22 bound is therefore measured from that XHR's requestWillBeSent on the event stream, not from act()'s start, which also includes the gate read and actionability (about 30 ms before the input)."
  - "With D-628 there are two layers of challenge refusal (index's row check and closed_frame in based_ctx). A mutation has to remove the registry mark to show the real-browser test failing; removing only the index check stays green because based_ctx still refuses."
  - "Bash heredocs that hold Python with mixed quotes sometimes fail in this harness with 'unexpected EOF'. Write the script to target/scratch with the Write tool and run it from there."
  - "The mock settle tests now see a GAP_FN Runtime.callFunctionOn (not awaited) between two SETTLE calls; Script::gap_mark() consumes it and returns its token."
