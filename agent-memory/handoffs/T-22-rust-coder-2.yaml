state: "Commit 32cbd6c on swarm/driver-T22 fixes review-T-22 round 1 and accept-T-22 rows 3c and 6c. (1) Blocking 1, D-625: the settle loop ends through one honesty check: a tracked request of the tab still in flight at the end (started before the settle, aged out of the 3 s limit, or counted) makes settle() and w(d) settled false for any cap or d; the act window applies it to requests after the step's mark and also counts an aged-out one as net_busy. (2) Blocking 2: the act window's calls each get min(normal, deadline - now - 50 ms) and end by input + 3 s with their grace; a wait that ends busy stops 100 ms early (INDEX_ROOM) for one index-only call (settle cap 0); the re-run after a document change and the new-tab title reads share the deadline. (3) Blocking 3: scrub_rows takes every IndexRow and State field apart with exhaustive patterns and scrubs and caps role, name, nearby, heading, form, landmark, input_type, autocomplete, the text value and options. (4) D-626: open() takes the instant it sees the main-frame commit; the paint wait, the in-page settle, the walk and its reply and the network pass all end by commit + 3 s (the in-page cap is what is left minus 50 ms); navigation keeps OPEN_CAP. Tester rows 03f to 03j now assert commit-to-return <= 3.04 s and total <= time to the commit + 3.04 s. Measured, 5 runs each: commit-to-return max 2.995 s (mut), 3.015 s (fetch), 3.008 s (anim), 3.008 s (sse), 3.014 s (mix); totals 3.26 to 3.40 s. (5) tabs() titles go through page_text(TEXT_CAP) and URLs through clean_url after the scrub; frames() URLs through clean_url too. (6) D-625 test. (7) D-628: Registry::closed_frame (opaque, or CHALLENGE by ancestry) is checked in based_ctx before anything is sent and in act before a step's first read. (8) index() reads level by level; a child is read only when its parent's fresh row is neither OPAQUE nor CHALLENGE and closed_frame allows it, and the parent's row writes the CHALLENGE mark into the registry first. (9) The owner cache keeps only answers the page gave. (10) and (11): Settled.changed counts DOM changes during network waits (GAP_FN in the sb world, B-617); the act window on a hidden page (target=_blank) is settled false and a missed window call is Some(false), so the row 1 blank-target step is Some(false) in 3 of 3 runs (D-627). Gates: cargo fmt --all -- --check clean; cargo clippy -j 2 -p sb-driver -p sb-cdp --all-targets -- -D warnings clean; cargo test -j 2 -p sb-driver -p sb-cdp -- --test-threads=1 green: sb-cdp 19+5+1+1+3, sb-driver lib 103, accept_t18 1, accept_t20 12, accept_t21 10, accept_t21_tester 16, accept_t22 10, accept_t22_tester 19, chromium_driver 1, contract_paths 2. Workspace (cargo test -j 2 --workspace --no-fail-fast -- --test-threads=1): ran to the end, 92 binaries, 1050 passed, 0 failed, 5 ignored (the pre-existing ones). Canary (dashed, sbcanary-r2c-<hex>) 0 hits in every log. Mutations seen red then restored: honesty check off (3 lib tests), INDEX_ROOM off (window test), role not scrubbed, refusal off in based_ctx, closed_frame never opaque (act test), tabs title not escaped (2 tests), owner failures cached, challenge mark never set (real-browser test), gap count off (real-browser test), open deadline from the walk instead of the commit (row03g)."
