state: "Commit 98641c1 on swarm/driver-T22 fixes accept-T-22 row 13b-2 (D-629). The cause was Driver::program_rows: it read the index of a frame that the last window left no index for with a fresh CALL_CAP (3 s), so act() could return up to input + 6 s. Changes in crates/sb-driver/src/act.rs: (1) read_index takes its deadline. (2) Captured and Pages carry window_end, the last window's deadline: input + 3 s for an input step, start + d + W_GRACE for w(d). (3) program_rows reads by reads_end(window_end), which is window_end - REPLY_MARGIN (50 ms); with no time left it makes no read and leaves the frame out of both sides of the diff. (4) tab_title (new-tab titles) uses the same reads_end rule; before, it ended by the deadline with no margin. (5) live_index, the pre-input gate read, keeps an explicit Instant::now() + CALL_CAP. Callers I checked and left unchanged: dead_target, the scroll and upload lookups in start_step and actionable_op are reads before the input, with their own caps. post_step (the first window call and its re-run after a document change) already ends by input + 3 s with its in-page cap set to the time left minus REPLY_MARGIN, and cdp_until sends nothing once a deadline has passed. The navigation and new-tab waits are condition waits capped at input + 3 s. NoVisibleChange is still decided only from the window's own index of the current document, so a missing after-state is never reported as no change. New lib tests over the mock transport (lib.rs): the_diff_read_after_a_window_with_no_index_ends_by_the_window_deadline has a window call that misses its cap and a re-run that fails, then a diff read sent at about 0.8 s that never answers; act returns by input + 3.04 s with no NoVisibleChange and no diff. no_read_is_made_after_a_window_that_used_its_whole_deadline has a request that never ends and an index-only call that never answers; act returns by input + 3.04 s and nothing is sent after the window. Both use a flush marker (Test.flush) to show that nothing more was queued, with no wait for a quiet period. Mutation check: with the fresh CALL_CAP put back in program_rows, both tests go red (3.816 s and 6.016 s); with the fix restored, both are green. row13b2 passed 5 runs in a row, worst time from the click per run: 2.999, 3.004, 3.006, 3.003 and 2.999 s (bound 3.04 s); worst act() total 3.028 s. Gates: cargo fmt --all -- --check is clean. cargo clippy -j 2 -p sb-driver -p sb-cdp --all-targets -- -D warnings is clean. cargo test -j 2 -p sb-driver -p sb-cdp -- --test-threads=1 is green: sb-cdp 19+5+1+1+3, sb-driver lib 105, accept_t18 1, accept_t20 12, accept_t21 10, accept_t21_tester 16, accept_t22 10, accept_t22_tester 26, chromium_driver 1, contract_paths 2. Workspace (cargo test -j 2 --workspace --no-fail-fast -- --test-threads=1) ran to the end and was not killed: 92 binaries, 1059 passed, 0 failed, 5 ignored (the pre-existing ones). The dashed canary got 0 hits in every log."
not_done: "1. Reviewer and tester round 3. Mutation B3 (window calls not cut at the deadline) should now be possible to tell apart on row 13b. 2. Still open from earlier rounds: B-615, B-616, B-617, D-617 frame merging in the window, and B-4 #10 scheduling."
gotchas:
  - "A mock window call that never answers misses its cap after 500 ms + 300 ms grace, not at input + 3 s. To use up the whole window in a mock, keep a request in flight (Script::request) so the window waits for the network, then leave its index-only call unanswered."
  - "cdp_until already sends nothing once its deadline has passed, so 'no read with no time left' cannot be seen on the wire for calls going through call_sb. The margin (REPLY_MARGIN) is the part that changes timing. A guard that skipped the window re-run when no time was left could not be told apart by any test, so I dropped it."
  - "Python open(..., 'w') on Windows writes CRLF. Use newline='' or the Edit tool, or git warns about CRLF in lib.rs."
  - "s.quiet() (try_recv) can race the CDP writer task after act() returns. Use nothing_queued(&d, &mut s), which queues a Test.flush marker and expects it to be the next message."
