state: "review-T-11 should-fix 1-3 are fixed, each with a regression test that fails on the previous commit (7b44132). (1) runner: RunOpts.memory_limit 0 now means the 32 MiB default. CappedAlloc's limit is a shared Rc<Cell<usize>> (struct Caps) that starts at usize::MAX, is armed after the runtime, context, prelude, page object and the compiled tool module exist (just before module.eval(), so the tool's top level, call and result serialization are capped), and is lifted before teardown. Tests: runner_small_memory_caps_never_crash spawns this test binary filtered to runner_memory_cap_child once per limit (0, 1024, 16384, 40000, 165000, 168000, 300000, 1 MiB), so a crash shows up as a failed child exit status. The child runs 7 readers and the register planner per limit and accepts only Ok or OutOfMemory (limit 0 must be Ok for every non-hog tool). On the old code limit 0 exits 0xC0000005. (2) read_table.js steps the 199-unit cell cut back by one when it lands after a high surrogate; read_table_cell_cut_keeps_surrogate_pairs_whole covers 198 a + U+1F600 (pair dropped) and 197 a + U+1F600 (pair kept). (3) reforge's undo removes the archived copy only when writing the old content back succeeded; otherwise it keeps it and returns StoreError::Io naming the original error, the restore error and the archive path. reforge_keeps_the_archive_when_the_rollback_fails injects the fault through the fake store: its tool_health_set replaces tools/luma.com/register.js with a directory and then fails. cargo test -p toolstore: 95 lib (91 before + 4 new) + 29 integration tests pass; cargo test --workspace is green (135 passed, 0 failed); clippy -p toolstore --all-targets -D warnings and fmt are clean."
