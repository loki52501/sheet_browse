state: "D-406 (1)-(7) applied in commit e16f9fc (crates/sb-act/src/classify.rs, lib.rs). (1) A key value containing \\r or \\n (\"\\r\", \"\\n\", \"\\r\\n\", \"Shift+\\r\") is Enter; any other key containing a control character (\\t, DEL, BS, ETX, ESC, NEL) is a click on its row, plus Delete for DEL on a non-text row (as the Delete key, D-404 (3)); Space is only U+0020 / U+00A0, other whitespace (em space, U+3000, U+2028) is an unknown key. (2) Enter on any row in a form, any role, is max(click(row), implicit submission, every submit of the form); formless activators stay their click, formless text fields stay Submit-from-headings; submitish fields take the form max; a file input (input_type file, any role) is not a text field, so Space/letters/Backspace on it are click(row) and Delete is Delete. (3) A one-time-code field loses only the 'security code' phrase as card evidence; CVC/CVV/CSC/card number/cardholder/expiry/MM-YY on it still give Pay. (4) check_planner classifies every step once, returns ChallengeTarget for the first challenge step before any MissingStop. (5) classify::Ctx groups the index by (frame, form id) once and caches FormEvidence per form for a whole classify()/check_planner() call; per submit only its own name is tokenised. 200 submits x 1700 rows: Enter takes about 26 ms in debug (test asserts < 250 ms and an exact evidence-build counter of 1). twofa_setup is now one verb pass plus a bounded window per span (review nit). (6) An affirmative non-submit button whose own heading has Delete wording is Delete with no form or dialog. (7) Pay: 'submit order', 'upgrade' on a submit or a non-submit button/menuitem (not a link), subscribe-with-price kept; Account 2FA spans add passkey(s) and authenticator app(s) (still need a set-up verb); Delete adds clear history/data/all within two words ('Empty trash' was already Delete via 'trash'). Header docs in lib.rs and classify.rs cite D-406 and name D-404 (1) as the only sanctioned lowering, with D-406 (3) as the bound on the one-time-code exemption. Gates (unpiped): cargo fmt -p sb-act --check clean, cargo clippy -p sb-act --all-targets -D warnings clean, cargo test -p sb-act 108/108 (lib 57, accept_t19_classify 16, accept_t19_forms 11, accept_t19_quote_fuzz 6, accept_t19_round2 18)."
