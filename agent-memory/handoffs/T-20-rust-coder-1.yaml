gotchas:
  - "Page.navigate (and a createTarget URL) is handled in the browser process and does not wait for renderer-side commands queued before it on the same session: a target resumed before its addScriptToEvaluateOnNewDocument reply can commit its first document with neither Page.frameNavigated nor the sb world. Keep runIfWaitingForDebugger in the install's reply hook."
  - "runImmediately on addScriptToEvaluateOnNewDocument created the sb world in a new tab's initial about:blank document, which stayed alive in the old renderer after the registry already showed the new URL, so open walked the wrong document. Not used."
  - "On chromium-1248 headless a background tab in the same window is visibilityState hidden: requestAnimationFrame never fires and timers run about once a second, so in-page act (two frames) stalls. open() uses newWindow; tabs a page opens (window.open, target=_blank) land in the opener's window and hide it."
  - "A fresh window's compositor can stall one frame for about 100 ms on this loaded machine (nextFrame's fallback), so the < 50 ms test waits two frames first and asserts the median of three first answers."
  - "Lib tests in sb-driver run the mock tests and the chromium test in parallel; tests/common/mod.rs is included into src/chromium_t20.rs with #[path] so the in-crate test can time actionable()."
