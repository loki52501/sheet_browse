not_done: "1. Row 1b (fail): the first act after browser launch, on its first tab, answered in 104 to 154 ms in 6 of 15 samples, because __sb.act waits out nextFrame's 100 ms fallback (rAF did not fire in the first window). Every other sample of about 90 was 5 to 18 ms. Fix: the first act after launch must not wait on an animation frame the compositor has not produced. For example, open() could await one rendered frame in its settle-and-walk round trip. Re-check with: cargo test -j 2 -p sb-driver --test accept_t20 row1b -- --ignored --nocapture, run about 6 times. 2. Observation for T-21/T-22, outside acceptance 2: under heavy load, w(50ms) can miss its d + 300 ms call deadline. Driver::act then returns Err(Timeout(\"w()\")) for the whole program instead of a failed step that keeps the earlier steps' results."
gotchas:
  - "__sb is frozen (Object.defineProperty plus Object.freeze), so act cannot be wrapped. To count attempts, wrap what act calls, inside the sb world: Number.isInteger (resolve calls it once on entry, with the id) and document.elementFromPoint (one hit test per attempt). The page world cannot see either wrapper."
  - "Never call __sb.id in a new document before the driver has walked it. Run any driver call first (act 'w(50ms)'); otherwise the answer is 'no base'."
  - "Browser tests in one test binary run in parallel by default. Seven Chromiums at once broke the timing rows (wait 1 was 133 ms, w(50ms) timed out). accept_t20.rs holds a static tokio Mutex for each test's lifetime."
  - "core-pg accept_t03_r3 requires SB_VAULT_CANARY to contain 'sbcanary'. Use sbcanary-<unique> when you export it for a workspace run."
  - "Registry::frame_url is pub(crate). Integration tests read the main-frame URL from Registry::tabs()."
