state: "T-06 fix round (review-T-06 + adversarial hunt) in commit 5bf1f37. Ledger::write now scrubs every JSON number by its decimal text (a match becomes a string, e.g. \"@vault(otp)\"), replaces U+0000 with U+FFFD, repeats the scrub to a fixpoint, then serializes the event before the insert and refuses with LedgerError::Unscrubbable { fields } (field names only) if a whole-text scrub would still change it. Nothing is inserted or written in that case. WrongRun scrubs the foreign run id it shows. append_line uses one write_all and puts a '\\n' first if the file does not end in one. read_jsonl/read_back return lines sorted by id. read_jsonl_checked returns JsonlRead { events, torn } and skips torn lines. report.md scrubs every input (the whole prompt, why, summaries, targets, consequences, tool names) before it clips or collapses whitespace, and the final scrub is kept. Read: counts every ok non-core Read event as pages/mails/files plus ', n other' (only when n > 0), one per distinct full target or one per target-less call, so the count matches the refs. A failure followed by an ok call with the same server+tool+target is resolved and does not make the run partial (run_status changed too). An unresolved failure prints step+target, class, why, consequence (or 'none captured') and fallback (the next non-core event's tool+target, or 'none'). Stops and skipped asks are listed first and never truncated; failures after them are capped with +n more. A tool event with mode=stop is never a Did and is listed once when a core stop event has the same tool. The Files: line accepts only files/<rel>, runs/<id>/files/<rel>, or an absolute path under <run_dir>/files (write_report) or containing /runs/<id>/files/ (report() with no dir); '..' and ':' are rejected. slugify: scrub raw, clean, scrub, clean, cut; 'run' if the result still holds a value. RunFolder::open accepts only run::is_run_id ids and an exact-name directory entry (no symlink/junction). pub const ledger::CORE_SERVER added. fmt clean; clippy -D warnings clean on lib (test profile) and tests ledger_t06, ledger_t06_fix, accept_t06; cargo test -p harness-core --no-fail-fast: all binaries green except vault_accept_t05_r2 (2 failures in another coder's vault.rs round, not touched here). Dev-dependency for D-111 is in place; no --features testing needed."
not_done: "Nothing in T-06. T-07: write the tool event of a challenge-stopped call with mode=stop plus one core stop event with the same tool. Expect Ledger::write to return Unscrubbable for events that cannot be cleaned, and surface that error (do not drop it). T-09: compare jsonl to the table keyed by id (read_jsonl is already sorted) and check read_jsonl_checked(..).torn is empty."
gotchas:
  - "Torn-line rule (deviates slightly from the brief, please confirm): an unparsable unterminated last line is skipped. A line in the middle is also skipped (and listed in `torn`) when it is *truncated*, meaning serde reports EOF or the UTF-8 is cut inside a char. That is what a torn write looks like after the next append added the '\\n' prefix. Any other bad line in the middle (garbage, no id, wrong type) is still LedgerError::Corrupt. Without this, one crash plus one more append would make the run's ledger unreadable forever."
  - "Fail closed is whole-line. A short or common vault value (for example a 4-digit PIN that matches the ts year, or a value equal to a mode name) makes every write fail with Unscrubbable { fields: \"ts\" } and similar. That is intended under rule 2, but such values make the ledger unusable. The id is not part of the pre-insert check because it is unknown until after the insert."
  - "Read: counts changed. A repeated target is now counted once (the old code counted 3 pages for a,b,a). Target-less reads by the same tool show as `tool (xN)`. The ', n other' suffix only appears when n > 0, so accept_t06's q4_lines parser (splitn(3, \", \")) still holds for runs without other reads but would choke on runs with them."
  - "RunFolder::open now returns InvalidInput (not NotFound) for ids like \"nope\". Only ids of the form `yyyy-mm-ddThh-mm-ss-<a-z0-9 parts>` are accepted."
  - "cargo clippy -p harness-core --all-targets currently fails in crates/core/tests/vault_accept_t05_r2.rs:758 (clippy::unnecessary_literal_unwrap, another coder's file). Use --lib --profile test plus explicit --test targets to check this area."
  - "Writes outside the worktree (including the session scratchpad) are blocked by guard_write.py; bash heredocs containing certain quote sequences fail in this shell, so use Edit for large insertions."
  - "Known limits documented in the ledger.rs header (no fix): an integral f64 >= 1e16 round-trips from jsonb as an integer; a write future dropped between the insert and the append leaves a row with no line."
