gotchas:
  - "Event shapes written: tool event {server=<server>, tool, class=approved, mode=allow|answered_proceed|timeout_proceed (stop + why=reason when ToolOutput.stopped), args scrubbed, result_summary=summary or first line of text (cap 300) or `error: <first line>`, consequences (+ {files:[..]} merged in when output.files is non-empty), duration_ms of the handler call, ok, why=error message}. Ask outcome {server=core, tool, class, mode=answered_*|timeout_*, args scrubbed, result_summary=why=card.what, duration_ms=ask wait, consequences={site, on_timeout}}. Stop {server=core, tool, class, mode=stop, result_summary=why=reason, consequences={element}}. A classify error writes a tool event with mode None, ok=false, why=`classify: ...`."
  - "Skip returns Ok(ToolOutput{text: `skipped: you said no (<what>)` or `skipped: no answer before the ask timed out (<what>)`}); no tool event, the core outcome event is the record. A gate Stop returns Ok with stopped=Some and text `stopped: <class> at <element>: <why>`; serve appends the same stop line to a handler's partial text."
  - "Fail closed before running: gate/run_get/ledger errors before the handler runs return ToolError::Failed and nothing runs. After the handler ran, a ledger write failure only goes to stderr (a retry by the model would repeat the side effect). ToolCtx::ask turns a proceed into a skip if its outcome cannot be logged."
  - "ToolCtx::ask: timeout forced to ASK_TIMEOUT, on_timeout may only tighten (Proceed only if Gate::on_timeout(class, run strict) also proceeds; run_get error = strict). A Challenge card is never shown: core stop event + TimeoutSkip returned."
  - "tools/call with a name not in the registry answers JSON-RPC -32602 (MCP spec), not isError; ToolErrors from dispatch are isError=true with the scrubbed message; a panicking handler answers isError with a fixed text (inner spawn)."
  - "Every outgoing JSON-RPC message is scrubbed value by value (strings, keys, numbers) before serialisation, not as a serialised line: a short vault value like `1` or `true` would otherwise corrupt the JSON."
  - "serve_io returns at reader EOF after in-flight calls answer. Over tokio::io::duplex + split, dropping the client write half is not EOF while the read half lives: call shutdown()."
  - "FileAsker::new(runs_root, run, vault) scrubs with the given vault (tests do not install a global). Files: runs/<run>/asks/<n>.json (n claimed by create_new, pretty JSON with n, run, class, what, site, values, timeout_s, on_timeout, answer_with) and <n>.answer (`yes`/`no`, also y/n). answer() validates the run id via RunFolder::open and requires <n>.json; writes .<n>.answer.<pid>.tmp then renames."
  - "bootstrap(): vault first (Vault::open(default_path(), default_key()) then install_global) so the run folder's prompt.md is scrubbed; SB_RUN_ID must name an existing folder under SB_RUNS_ROOT (default ./runs) else MemoryError::Invalid; without it a run `<ts>-<exe stem>` with status running is created (runs.folder = the folder path with / separators)."
  - "mcp.rs carries a copy of gate's private card_text (card_line); B-103 proposes exposing gate::clean_card so there is one copy."
