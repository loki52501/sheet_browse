gotchas:
  - "Class order is Read < Fill < Navigate < Submit, so an unknown key on a textbox is click(textbox) = Navigate, which is above Fill. Ctrl/Alt/Meta + a letter is not 'typing' and counts as unknown (Control+s on a textbox is Navigate, on a submit it is the submit's class)."
  - "split_key: a trailing '+' is the plus key ('+', 'Control++'); a whitespace-only key (k#1=\" \") is Space. Key names are case-insensitive."
  - "Enter on a checkbox/radio in a form is an implicit submission (browsers submit on it), so it is at least Submit; Space on a checkbox is click = Fill."
  - "Implicit submission ignores the field's own label as button text (a field named 'Pay note' does not make Pay), but click(row) is merged in, so a field named 'Remove ...' does raise to Delete."
  - "'Security code' with autocomplete one-time-code is not a card field (SMS codes). 'Expiration date' needs 'card' or MM/YY to count; DD/MM/YYYY does not."
  - "Heading-only exemptions on the cancel rule: 'cancel anytime', 'cancel any time', 'cancel at any time' are marketing; on a button 'cancel <x>' is still Delete except 'cancel and/or ...'."
  - "Paid subscription needs a price signal (currency symbol, 'per month', '<digits> month'); bare 'Subscribe' and 'Subscribe to our weekly newsletter' stay Submit (tester asserts newsletter Subscribe = Submit)."
  - "The tester's crates/sb-act/tests/ files needed no assertion changes: none pinned the old lower behaviour, and accept_t19_classify.rs was already fmt-clean in this worktree when I ran cargo fmt -p sb-act --check."
  - "2FA/2-step headings now make 2FA login challenge pages Account (one ask per such login). That is D-403 (3) as written; flag if it asks too often."
