# Roster, areas, waves. Supreme updates `waves` and `areas.*.merged`; sub-orchestrators update `areas.*.status`.
topology:
  supreme: "1 session at repo root on main; owns tasks.yaml merges, interfaces.yaml, wave gates, bench runs"
  sub_orchestrators: "1 session per area in wt/<area> on branch swarm/<area>; spawns subagents from .claude/agents/"
  subagents: [rust-coder, js-coder, reviewer, tester, memory-keeper, spec-reader, bench-runner]
  limit: "Claude Code subagents cannot spawn subagents; the middle tier is sessions, coordinated through agent-memory/ and git"

areas:
  core:
    wave: 1
    crates: [core, core-pg, harness]
    tasks: [T-03, T-04, T-05, T-06, T-07, T-08, T-09]
    later: {wave: 3, tasks: [T-16]}
    docs: [docs/01-HARNESS-CORE.md, docs/02-MEMORY.md]
    status: in_progress
    merged: true   # 960c7b1, 2026-10-25 20:40: D-87 merge (review approved, cargo test --workspace 704 passed 0 failed 5 ignored); red acceptance rows -> follow-up tasks
  sheet:
    wave: 1
    crates: [sb-sheet]
    tasks: [T-10]
    docs: [docs/05-BROWSER.md#B-6, docs/04-TOOL-SERVERS-PHASE1.md#W-5]
    status: pr_open
    merged: true   # 607eda5, 2026-10-23 18:52: gate ok T-10, cargo test --workspace 237 passed 0 failed
  store:
    wave: 1
    crates: [toolstore]
    tasks: [T-11]
    docs: [docs/03-TOOL-STORE.md]
    status: pr_open   # D-78 follow-up batch ready to merge 2026-10-25 (handoffs/T-11-store-suborch-3.yaml)
    merged: true   # f493fd3, 2026-10-23 17:33: gate ok T-11, cargo test --workspace 135 passed 0 failed; follow-up (D-78 batch) 83bfdb5, 2026-10-25 19:17: gate ok T-11, 271 passed 0 failed
  page:
    wave: 1
    crates: [injected, sb-act]
    tasks: [T-19]
    docs: [docs/05-BROWSER.md#B-5, docs/05-BROWSER.md#B-7]
    status: in_progress
    merged: false
    note: "Phase 2 code started early because nothing blocks it; not part of the Phase 1 baseline"
  servers:
    wave: 2
    crates: [srv-web, srv-files, srv-cli]
    tasks: [T-12, T-13, T-14, T-15]
    docs: [docs/04-TOOL-SERVERS-PHASE1.md]
    needs_merged: [core, sheet, store]
    status: not_started
    merged: false
  driver:
    wave: 2
    crates: [sb-cdp, sb-driver]
    tasks: [T-18, T-20, T-21, T-22]
    later: {wave: 3, tasks: [T-23, T-24, T-25, T-26], crates: [sb-mcp, sb-media]}
    docs: [docs/05-BROWSER.md]
    needs_merged: [page]
    status: not_started
    merged: false

waves:
  "0": done
  "1": open
  "2": open
  "3": "not started"
  "4": "not started: Phase 1 baseline T-17, then T-27 T-28 T-29"

pr_rule: "D-86/D-91: one GitHub PR per task, branch swarm/<area>-T<nn>, gh pr create --base main --head <branch>; areas push their branches, the supreme pushes main after every merge (supersedes D-46)"
merge_rule: "D-87: review report has no Blocking items AND cargo test --workspace passes on the merge commit AND no leak hook fired; a red acceptance item becomes a follow-up task (T-xxb), never a block; supreme reviews are non-blocking; at most two review rounds (D-89)"
