# One line per decision. Add, never delete. Reference ids in commits.
# Id ranges (D-42), so parallel branches never collide: supreme D-31..D-99, core D-100+,
# sheet D-200+, store D-300+, page D-400+, servers D-500+, driver D-600+. Append at the end
# of the list; this file merges with git union driver (.gitattributes).
decisions:
  - id: D-1
    text: "Claude Code is the only model path. No API keys, no .env, no other SDKs."
    why: "User rule; keeps the harness portable and auditable."
  - id: D-2
    text: "Rust for everything that touches the browser or the core; plain JS only inside the page."
    why: "Latency and one binary."
  - id: D-5
    text: "A challenge (captcha, Turnstile, hCaptcha, phone verify) means stop. No solving, no stealth, no fingerprint tricks."
    why: "User rule; not revisited."
  - id: D-6
    text: "The model never receives raw HTML or pixels except from explicit screenshot and video tools."
    why: "Token cost and reliability."
  - id: D-7
    text: "Priority order: efficiency > latency > throughput > token cost."
    why: "User criteria."
  - id: D-19
    text: "Gate is lenient: Read/Fill/Navigate/Submit/Send(known) allow; Send(new)/Pay/Account/Delete ask; Challenge stop. Overrides per domain+class in gate.rules."
    why: "User asked for lenient; irreversible classes still ask."
  - id: D-20
    text: "Mail and calendar are used through the browser (Gmail, Google Calendar web UIs) as site tools. No Gmail/Calendar API, no connectors."
    why: "User decision."
  - id: D-21
    text: "Memory is Postgres 16 + pgvector + pg_trgm behind a MemoryStore trait. Never two databases. SQLite+sqlite-vec and SurrealDB are future backends of the same trait."
    why: "One query joins facts, relations, recall, search, history; swap path kept open."
  - id: D-22
    text: "Forged tools are saved under tools/<eTLD+1>/ and announced in the skeleton on the next visit; readers return data, planners return act programs, a tool never gets hands."
    why: "Reuse instead of re-forging; safety."
  - id: D-23
    text: "Harness first, browser as a tool server. Phase 1 proves gate/vault/ledger/memory/scheduler on 22 use cases before any browser code."
    why: "Separate harness failures from browser failures."
  - id: D-24
    text: "New folder sheetbrowseV2_, start from scratch. Old sheetbrowse is reference only."
    why: "User decision."
  - id: D-25
    text: "Five Playwright ideas are borrowed (isolated-world script, actionability, auto-wait, event-driven targets, real input); nothing else is ported."
    why: "Those fix the bench failures; the rest serves human test authors."
  - id: D-26
    text: "No fixed sleeps in driver code; wait on a condition with a cap."
    why: "Bench: fixed waits were both too short and too long."
  - id: D-27
    text: "Planners are never dry-run against live sites; readers may be."
    why: "Bench failure F-7 (forge dry-run timeouts, risk of real submits)."
  - id: D-28
    text: "Text sent as Lokesh has no em dashes or double-dash separators."
    why: "User rule."
  - id: D-29
    text: "Repairs and forges can raise a gate floor, never lower it; cannot remove ?s; cannot add vault keys or widen @match."
    why: "Learn as data, never as permission."
  - id: D-30
    text: "Headless is never used with the 'me' profile; mail/calendar run headed (hidden window if scheduled)."
    why: "Login challenges and ToS; headless was blocked in 18/60 bench runs."
  - id: D-31
    text: "Search backend for srv-web W-1 is a local SearXNG container (compose profile `search`, 127.0.0.1:8888, JSON output on, limiter off), added by area servers in T-12. Brave free tier is not used."
    why: "No account, no token, no monthly quota for ~90 ladder runs; one compose file already exists. Cost: upstream engines can rate-limit SearXNG, so search() must report degraded results honestly; switching to Brave would be a new decision."
  - id: D-32
    text: "Embeddings: fastembed-rs with BAAI/bge-small-en-v1.5, 384 dims, computed locally in core-pg; memory.facts.embedding is vector(384)."
    why: "No keys (D-1); CPU ONNX is ms per fact at personal scale; 384 dims is a quarter of the HNSW memory of 1536. Cost: ~130 MB model download from huggingface.co on first use and an ort build on MSVC. Changing the model means a migration plus re-embedding."
  - id: D-33
    text: "Postgres runs from docker-compose.yml (pgvector/pgvector:pg16) on 127.0.0.1:5433 with trust auth on loopback; schema only via `harness db migrate` (sqlx). DATABASE_URL postgres://sb@127.0.0.1:5433/sb."
    why: "This machine's native PostgreSQL 17 on :5432 has no pgvector, and building it on Windows needs MSVC + nmake; the spec says 16; an image tag is reproducible. Trust on loopback means no password exists to commit."
  - id: D-34
    text: "Chromium is one pinned Chrome for Testing build for both profiles (bench, me), downloaded on first run into a git-ignored dir; exact version pinned in T-18. `profile login me` opens it headed with no debugging switch so the hand login is a plain browser session; agent runs reuse the profile over the pipe. The pin is bumped deliberately, at least every 4 weeks, each bump a decision."
    why: "One engine makes CDP behaviour and bench numbers reproducible; system Chrome auto-updates under the bench, and branded Chrome 136+ refuses remote debugging on its default profile. The bump cadence bounds how stale a browser holding live Google sessions can get. Unverified, check in T-18/T-27: H.264 support in CfT (B-9 mp4) and Google accepting the login."
  - id: D-35
    text: "The docs' crate `core` is packaged as `harness-core` (lib `harness_core`) in crates/core; read `core::x` in the docs as `harness_core::x`. Other crate names are as in docs/00."
    why: "A package named `core` shadows Rust's built-in core crate and makes `core::` paths ambiguous."
  - id: D-36
    text: "Class total order (derive Ord, used by max() for programs and floors): Read < Fill < Navigate < Submit < Send < Account < Delete < Pay < Challenge."
    why: "Classes whose ask times out to skip (Delete, Pay) must outrank those that time out to proceed (Send, Account), so taking the max never turns a skip into a proceed."
  - id: D-37
    text: "Element refs are `#12` (main frame) and `#f2.15` (frame 2), serialized as that string. IndexRow's serde JSON is the wire format from injected.js: snake_case fields, `bbox` named `box` on the wire and optional (fetched HTML has no layout), FieldValue as {kind: empty|filled|text, text}, flags as an object of booleans."
    why: "One shape for the live index, the fetched index and fixtures; `box` is a Rust keyword; srv-web cannot produce geometry."
  - id: D-38
    text: "Crate DAG (supersedes the docs/00 drawing, now updated): core <- core-pg; sb-sheet is a leaf; sb-act -> core, sb-sheet; toolstore -> core, sb-sheet, sb-act; sb-cdp is a leaf; sb-driver -> core, sb-cdp, sb-sheet, sb-act; sb-media -> sb-driver; srv-web -> core, sb-sheet, toolstore; srv-files, srv-cli -> core; sb-mcp -> core, sb-driver, sb-sheet, sb-act, sb-media, toolstore; toolforge -> core, toolstore, sb-act, sb-sheet; harness -> core, core-pg, toolstore."
    why: "The original drawing put the pure crates sb-sheet and sb-act above sb-driver, but I-10 makes sb-driver consume sb-act and every reviewer would have flagged that as a layering break."
  - id: D-39
    text: "Classifier hints select gate rules through the class key `Class:hint` (e.g. `Submit:job_application`) in gate.rules and MemoryStore::gate_rule. Lookup, first hit wins: (domain, Class:hint), then ('*', Class:hint), then (domain, Class), then ('*', Class), then the H-1.1 default. Migration 0001 seeds ('*', 'Submit:job_application', 'ask')."
    why: "H-1.2 wants the job-application rule scoped by a hint, but the table key is (domain, class) and I-1's gate_rule takes (domain, class: &str); encoding the hint in the class key needs no schema or trait change. Hint rules go first because they are the user's standing semantic rules and must not be undone by a broad domain allow."
  - id: D-40
    text: "Traits used as trait objects (MemoryStore, ToolHandler, Asker, Transport) use #[async_trait]."
    why: "M-2 requires Arc<dyn MemoryStore>; native async fn in traits is not dyn-compatible."
  - id: D-41
    text: "ledger.events.mode is a gate decision (allow, ask, stop) or how an ask ended (answered_proceed, answered_skip, timeout_proceed, timeout_skip): LedgerMode in harness_core::memory."
    why: "docs/01 acceptance expects to read `timeout_proceed` from the ledger, and the table has no separate outcome column."
  - id: D-42
    text: "Decision and blocker ids are allocated in ranges per author (supreme 31-99, core 100+, sheet 200+, store 300+, page 400+, servers 500+, driver 600+). agent-memory/decisions.yaml and blockers.yaml use git's union merge driver."
    why: "Four branches append to the same two files in parallel; ranges prevent id collisions and union merge turns guaranteed append conflicts into clean merges."
  - id: D-43
    text: "T-18 and T-19 no longer depend on T-17. Driver and page gate on swarm.yaml (page in wave 1, driver after page merges), not on the Phase 1 baseline."
    why: "docs/10 S-2 schedules page in wave 1 and driver in wave 2; blocked_by T-17 contradicted that. The supreme still keeps sb-driver out of the Phase 1 baseline run."
  - id: D-44
    text: "ToolStatus is ephemeral | saved | repaired | needs_repair | retired | ask; `pinned` is the tools.health.pinned flag, not a status."
    why: "M-3 stores pinned as a boolean, and T-5 introduces an `ask` status (floor raised, awaiting the user) that T-7's table omits."
  - id: D-45
    text: "migrations/0001_init.sql is M-3 plus: extensions created in the migration, vector(384) (D-32), a statement trigger that also blocks TRUNCATE on ledger.events, and the D-39 job-application seed rule. ledger.events keeps M-3's column name `args` (scrubbed), not H-3's `args_scrubbed`."
    why: "Append-only has to cover TRUNCATE; M-3 is the schema of record, so the name follows it and a column comment records the invariant."
  - id: D-46
    text: "The repo is local-only (no remote). An area's PR is its branch with `areas.<area>.status: pr_open` in its own swarm.yaml plus a final handoff; the supreme reads `swarm/<area>` directly and merges with scripts/swarm/merge.ps1. If a remote is added later, push + PR resume."
    why: "Worktrees share one object store, so pushing is unnecessary; creating a GitHub repo is an outward-facing step the user has not asked for."
  - id: D-47
    text: "Interface tiers: I-1..I-5 are CONTRACT (change only through interface_changes and a supreme decision); I-6..I-12 are DRAFT signatures the owning area may reshape before its first merge, recording each change under interface_changes so consumers see it. The supreme rewrites interfaces.yaml at merge."
    why: "Wave 0 fixes only what all areas code against today; the drafts were written ahead of their owners and should not freeze guesses."
  - id: D-48
    text: "Wave-0 contract corrections after a five-lens adversarial review (59 of 64 findings confirmed). I-1 gains run_start/run_end/run_get, schedule_add/list/rm/fired, gate_rule_set, review_add and ledger_events; append returns LedgerId; gate_rule returns GateRule{mode, strict}; duration_ms is i32; LedgerEvent.ts is microsecond-truncated (ts_now); contact keys are normalised (contact_key); neighbors walks both edge directions. I-2 is serve(server, tools, Harness) plus dispatch() for in-process tests, a live ToolRegistry for site tools, ToolSpec.description, async classify(ctx, args), Classified.what/values, ToolCtx::store/ask/registry and ToolOutput.stopped. I-3: Challenge stops before any rule lookup, a Send with no recipients is Send(new), strict = run OR rule, HINT_SIGNATURE. D-38 is amended: srv-web, srv-files, srv-cli and sb-mcp also depend on core-pg, whose bootstrap() builds the Harness. Migration 0001: NOT NULL wherever the Rust field is not an Option, gate.rules.strict, runs.strict, schedules.run_id, one statement-level append-only trigger, the signature rule. Compose: pinned pgvector/pgvector:0.8.1-pg16, postgres alone on network `db`, TCP healthcheck. D-33's 'trust on loopback' was wrong: trust covers every container on `db`, which is why nothing else may join it."
    why: "Without these, docs/01's scheduler acceptance, H-7, H-1.3's strict rules and the T-09 test seam could not be built against the contract, serve() had no way to get a store, and every later contract change would have broken four parallel areas at once. Cheaper to fix before anyone codes against it."
  - id: D-49
    text: "IndexRow.role is the lowercase ARIA role (textbox, button, checkbox, combobox, link, iframe). Sheet lines, @fingerprint items and `name:role` queries use short aliases (input, button, select, checkbox, link...) mapped to ARIA roles by sb-sheet's data/roles.txt, which both sb-sheet and toolstore::fingerprint read. Sheet lines print the alias."
    why: "The docs write `input \"Email\"` everywhere while B-5 says the role is the ARIA role; one alias table is the only way find, sheets and fingerprints agree."
  - id: D-50
    text: "Planner ?s rule (resolves B-1): every step classified Submit or higher must be immediately followed by `?s`; T-2's `...; c#btn; ?s` is the canonical shape. Permission comes from the gate's up-front check of the whole program's class; ?s guarantees nothing runs past a submit before the model sees the state. Enforced by sb_act::check_planner, the T-9 invariant, the G-2 static check and the guard_write/post_write hooks."
    why: "Read as 'before', ?s would make the submit in every Submit planner dead code, and the lenient gate (D-19) would need an extra model turn per registration (D-7: efficiency first). Read as 'right after', T-2's example, E-3's draft planner and D-29 ('a repair cannot remove ?s') all stay coherent."
  - id: D-51
    text: "sb-sheet in Rust is the only find/skeleton/sheet/read implementation, for the live and the fetched index. injected.js ships IndexRow[] and TextBlock[] (incrementally, via the dirty set) and does not score. This overrides B-6.2's 'Scoring runs in the page; only winners cross the wire'."
    why: "Two scorers (JS in the page, Rust for srv-web) would drift, and acceptance 6 would test one of them. The cost is moving the index over a local pipe (sub-ms to a few ms); the model's tokens are unchanged because only winners reach it either way."
  - id: D-52
    text: "Act DSL values: a bare value runs to the next `;` or the end of the program; a quoted value `t#7=\"a; b\"` may contain anything, with \\\" \\\\ and \\n escapes. sb_act::quote() and the tool page API's q(s) produce quoted values; planners must use q() for any argument."
    why: "Without quoting a value cannot contain `;`, and a planner interpolating a user-supplied argument could inject extra steps (`x; c#99`)."
  - id: D-53
    text: "Tool files run in an embedded JS engine (default rquickjs) in a toolstore `runner` module shared by srv-web and sb-mcp, without document, window, fetch, eval, import or require. Page API: find(q) and findAll(q) return refs without `#` (`12`, `f2.15`, so planners write `c#${id}`); text(region), table(id), url, title, q(s); and api(url) for @phase 1 readers, executed through srv-web's api tool and the gate as Read. sb-mcp evaluates @expects against the act's Consequences and reports RunOutcome::ExpectsMiss to toolstore."
    why: "I-12 named a page API and a runtime that nothing defined; T-3's acceptance needs a @phase 1 reader that calls api; toolstore cannot see sb-driver's Consequence type under D-38."
  - id: D-54
    text: "find(): the `?` weak mark compares the lexical part of the score (3*BM25 name + 1.5*nearby + 0.5*heading) with 3, not the total. docs/05 acceptance 6 runs with k = 1: the four top hits plus the always-appended CHALLENGE, OVERLAY and winning-submit rows, in document order."
    why: "With the total, role prior +2 and visible +1 reach 3 with no text match, so `?` could never fire. With the default k = 3 the newsletter Email legitimately appears, so the acceptance would be untestable as written."
  - id: D-55
    text: "A CHALLENGE container owns its subtree: a captcha container and its iframe are one row, flagged CHALLENGE (and OPAQUE when the frame is cross-origin), carried on the iframe row when there is one. Draft additions from the same review: State gains covered, input_type and autocomplete; IndexRow gains landmark and child_frame; TextBlock gains table and header (each TableRow span is one cell); element ids are never reused within a tab frame (walk({base}) per document generation, resolve -> {why: stale}); Driver::act takes &ToolCtx so @vault is resolved only into Input.insertText, and Driver gains index, text, tabs, close, dialog and download; Consequence and StepResult are serde; sb_act::classify returns ActClass{class, hints} so job_application/signature rules can fire for browser submits; FingerprintResult::Partial carries FpItems and RunOutcome::Relocated exists. The vault sink stays synchronous: the CDP payload bytes it returns exist only to be written to the pipe."
    why: "Each was a confirmed gap: B-6.2's covered term, B-7's Pay/Account evidence, sheet(region=landmark), W-5 tables, stale ids after navigation (B-4 #2), the vault reaching the driver's sink (H-2), D-39 hints for act, and T-4's relocate path."
  - id: D-56
    text: "B-2 resolved: Docker Desktop runs (reinstalled to E:\\apps\\Docker). migrations/0001_init.sql was applied to PostgreSQL 16.12 with pgvector 0.8.1 and pg_trgm 1.6, both standalone and inside one transaction (as sqlx does), in throwaway databases. Verified: zero-row UPDATE, UPDATE, DELETE and TRUNCATE on ledger.events all fail; vector(384) is enforced; the tsv, trigram and cosine paths return hits; hnsw.iterative_scan is available; NOT NULL holds; six gate rules are seeded. The `sb` database is left empty for `harness db migrate`."
    why: "The migration had been written blind; four parallel areas now rely on it."
  - id: D-57
    text: "Swarm mechanics after review. Worktrees live at <drive>:\\sb-swarm\\wt\\<area> (supersedes S-7's wt/<area>). Hooks run `python \"${CLAUDE_PROJECT_DIR}/scripts/hooks/<x>.py\"`; project settings exclude F:/aside_mcp for claude/CLAUDE.md through claudeMdExcludes. The merge gate takes an area's tasks from swarm.yaml, requires `Verdict: approve` and `Verdict: green` lines plus all-pass result cells, rejects duplicate YAML keys or ids after the union merge, and fails when the worktree's .claude/state/leaks.log is non-empty (canary hits are logged there). Reviewers get the Write tool for their report."
    why: "Claude Code loads CLAUDE.md from every ancestor directory, so worktrees inside the repo would also have loaded the enclosing browser-use instructions and main's working copy. Hooks run under Git Bash from the session's cwd, so relative script paths break after a cd. The original gate passed reports it could not read, and S-8's 'no leak fired' had no record to check."
  - id: D-100
    text: "core-pg tests never touch the shared `sb` database. Each test creates a throwaway database `sb_t_<random>` on the server in SB_TEST_DATABASE_URL (default postgres://sb@127.0.0.1:5433/postgres), runs `migrations/` on it with sqlx::migrate!, and drops it at the end. Postgres unreachable = test failure with a message naming `docker compose up -d --wait postgres`, never a silent skip."
    why: "All worktrees share one compose container and `cargo test --workspace` runs core-pg tests from every area; per-test databases keep parallel areas and parallel tests from seeing each other's rows, and the append-only ledger cannot be cleaned any other way."
  - id: D-101
    text: "Vault backend: the `age` crate (x25519 recipient) encrypting a TOML map `name = {value, kind}` to vault.toml.age at SB_VAULT_PATH (default <config_dir>/sheetbrowse/vault.toml.age, outside the repo). Default KeySource is the OS keychain via the `keyring` crate (service `sheetbrowse`, account `vault`); the identity is generated on the first `vault set` when absent. IdentityFile is the fallback. Values live in `zeroize::Zeroizing<String>`. A missing vault file opens as an empty vault."
    why: "H-2 names age + keychain; keyring covers Windows Credential Manager, macOS Keychain and Secret Service with one API; generating the key on first set means no setup step and no key file in the repo (D-1)."
  - id: D-102
    text: "scrub() matches every non-empty vault value longest-first (aho-corasick, leftmost-longest), and also each value's JSON-escaped form and percent-encoded form, replacing any of them with `@vault(name)`. install_global() also installs a panic hook that scrubs the panic message before the previous hook prints it. Superseded in its details by D-118 (overlapping search, case-insensitive matching, literal protection, value floor, fail-closed build)."
    why: "Outputs are often JSON (tool results, ledger args, jsonl) or URLs; a value containing a quote, backslash or space would otherwise survive scrubbing in its encoded spelling. H-2 lists panics among the outputs."
  - id: D-103
    text: "Fastembed model cache is SB_MODEL_DIR (default <cache_dir>/sheetbrowse/fastembed), never the crate's default `.fastembed_cache` in the cwd. Embedding runs on spawn_blocking. recall()'s FTS side ORs the query's lexemes (to_tsquery with `|` built from plainto_tsquery's lexemes) and ranks with ts_rank; vector side is cosine top 20; fusion is RRF with k=60."
    why: "The default cache would litter every worktree and runs/; ONNX inference blocks; M-4 is a recall path, and AND semantics would drop a fact that matches two of three query words, which is exactly the docs/02 `Rust CDP crate` acceptance."
  - id: D-104
    text: "MCP stdio is hand-rolled in harness_core::mcp: newline-delimited JSON-RPC 2.0 with initialize, notifications/initialized, ping, tools/list, tools/call and notifications/tools/list_changed (protocol 2025-06-18). No MCP SDK dependency."
    why: "The surface the harness needs is six messages; an SDK pins a fast-moving API under every tool server and adds compile time to all of them."
  - id: D-105
    text: "Asks from a tool server process (Phase 1): bootstrap() installs a FileAsker. The card is written scrubbed to runs/<run>/asks/<n>.json and printed to stderr; the answer is `harness ask <run> <n> yes|no`, which writes <n>.answer; the asker waits on that file (notify watcher, no polling sleep) capped at card.timeout, then applies card.on_timeout. Tests use a scripted Asker."
    why: "A server launched by Claude Code owns stdio for MCP, so it cannot prompt; a file channel in the run folder is visible to the user, survives the 60 s window, and needs no extra service. MCP elicitation can replace it later behind the same Asker trait."
  - id: D-106
    text: "A run is launched through a `Launcher` trait in the harness crate. The default launcher runs `claude -p <prompt>` with SB_RUN_ID and SB_RUNS_ROOT in its environment (the tool servers read them in bootstrap()); tests use a launcher that does not call a model (rule 1). After the launcher exits, report.md is generated from the ledger and runs.ended/status are set."
    why: "H-5 says a firing starts a fresh Claude Code session; the scheduler acceptance (row, folder, report.md, parent_run) is about the harness, not the model, and must be testable without one."
  - id: D-107
    text: "Cron expressions are 5-field standard cron parsed with the `croner` crate, evaluated in UTC. harnessd wakes at the next due time across enabled schedules (tokio::time::sleep_until on a computed instant, re-read on change), never on a fixed poll interval. `harness schedule add` with no SB_RUN_ID creates its own run row (`<ts>-schedule-add`, status done) and stores it as schedules.run_id, so every firing has parent_run set."
    why: "docs/01 writes `*/1 * * * *` (5 fields; the `cron` crate wants 6+). Sleeping until a computed deadline is a wait on a condition, not a fixed sleep (rule 6). The acceptance needs parent_run set even when the schedule comes from the CLI."
  - id: D-108
    text: "harness_core::testing (cfg(test) or cargo feature `testing`) provides MemStore, an in-memory MemoryStore seeded with migration 0001's gate rules, and ScriptedAsker, an Asker that returns queued outcomes or applies card.on_timeout immediately and records every card. Gate, dispatch and echo tests use them; other areas may enable the feature as a dev-dependency."
    why: "D-48 says tool-server tests run dispatch with a fake store and a scripted asker; one shared fake avoids four diverging copies and keeps core's unit tests free of Postgres."
  - id: D-109
    text: "Resolves B-100: an ask times out to proceed only for Send(new) and Account with strict off; every other asked class (Pay, Delete, Submit including Submit:job_application and Submit:signature, and any Read/Fill/Navigate a user rule turns into an ask) times out to skip."
    why: "H-1.3 names only four classes; the standing rule 'job submissions and signatures are mine' means silence must never submit for the user, and a user who wrote an ask rule for a lenient class wanted to be asked, not overridden after 60 s."
  - id: D-110
    text: "Gate rule semantics after the T-04 adversarial review. (1) Keys are canonical: gate_rule_set (every MemoryStore backend) stores the class as Class::as_str() plus `:` plus the trimmed lowercase hint, and the domain trimmed, lowercased, trailing dot removed, or '*'; it rejects anything that does not canonicalise. Gate::lookup canonicalises call.domain and hints the same way. (2) Hint rules apply at the call's class or any lower class: for each hint, try (domain, C:hint) then ('*', C:hint) for C from call.class down to Read, first hit per hint. (3) When several hints match, the most restrictive mode wins (stop > ask > allow) and strict is OR-ed across them; any hint match beats the class-level lookup. (4) An ask times out to proceed only when not strict, not from a hint rule, and the class is Account or Send with at least one new recipient; every other ask times out to skip (refines D-109). (5) Every ask-card string (what, values) is control-stripped and length-capped, whether built by the gate or given by a classifier."
    why: "Confirmed bypasses: non-canonical rules were accepted then silently dead; an unrelated hint allow undid the standing job_application ask; a job application classed Account (password field) missed the Submit:job_application rule and proceeded on timeout; a user's ask rule for Send to a known contact proceeded after 60 s; page text with ANSI/CR could make a card misreport the action."
  - id: D-111
    text: "harness-core's integration tests get the `testing` feature through a self dev-dependency (`[dev-dependencies] harness-core = { path = \".\", features = [\"testing\"] }`), not `required-features`, so `cargo test --workspace` (the S-8 merge gate) compiles and runs them."
    why: "required-features silently skips the test binary when the feature is off, which would let the merge gate pass without running the acceptance tests."
  - id: D-112
    text: "Workspace rust-version is 1.94 (was 1.85). core-pg uses sqlx 0.9 (pgvector 0.4 requires it; one sqlx in the tree) with fixed-literal SQL, and fastembed 7; core-pg writes every timestamp from the Rust process (ts_now), never the database's now()."
    why: "sqlx 0.9 needs rustc 1.94 and fastembed 7 needs 1.88, so 1.85 was a false promise; two sqlx majors would double compile time and split types. The compose container's clock ran ~37 s ahead of the host and made due-time tests flaky."
  - id: D-113
    text: "Refines D-110 (2): a hint rule found at a class lower than the call's class can raise the class-level result (allow < ask < stop, strict OR-ed) but never lower it; a hint rule at the call's own class beats the class level as D-110 (3) says. A Send with no recipients asks (Send(new), I-3) and times out to skip. Canonicalisers are harness_core::gate::{rule_domain, rule_class_key, rule_hint, rule_key}; every gate_rule_set backend stores rule_key's output. A call.domain that does not canonicalise (e.g. host:port) gets only '*' rules."
    why: "Otherwise ('*','Read:newsletter','allow') would allow a Pay or Account call carrying the newsletter hint. A Send whose recipients the classifier could not name must never go out on silence. One canonicaliser shared by MemStore and PgStore keeps the fake and the real store from drifting."
  - id: D-114
    text: "migrations/0002_edges_dst.sql adds `create index on memory.edges (dst)` (M-3 plus one index). PgStore::connect runs the migrator with ignore_missing = true, so a binary built without a newer migration that another worktree already applied to the shared database still starts."
    why: "neighbors() walks edges in both directions and the only edges index leads on src: a depth-4 walk on a 3000-node, 15000-edge graph took ~2 s, ~80 ms with the index. All worktrees share one compose Postgres (D-100), so a strict migrator would refuse to start every branch that has not merged the newest migration yet."
  - id: D-115
    text: "search(): an exact hit is a case- and punctuation-insensitive equality on subject (score 1.0) or a substring of subject/key/value (score 0.9); the trigram tier uses word_similarity (`q <% subject`) with its score; results are ordered by score, tier only breaking ties. SM-2 rounds a fractional interval up (ceil), in PgStore and MemStore alike."
    why: "Name and domain lookups are what search() is for (M-1 job 4): 'Foo-Bar Inc' must beat a fact that merely mentions it, and a typo inside a longer subject ('Vasnth' in 'Vasanth Raghavan') must still hit. SM-2 as published rounds up."
  - id: D-118
    text: "Amends D-102 (T-05 round 3, amended in round 5). (1) scrub() runs one ASCII-case-insensitive aho-corasick automaton with Standard semantics and an overlapping search over every spelling of every non-empty value (vault::spellings: raw; lower- and upper-cased bases for non-ASCII values; JSON as serde writes it, with `\\/`, ASCII-only, HTML-safe as Go/Rails and System.Text.Json write it, and JSON inside JSON; Rust {:?}, escape_debug, escape_default, and {:?} or JSON nested inside {:?} or JSON; every percent-encode set incl. the WHATWG URL sets, and double encoding). The union of overlapping or touching match spans is replaced by the @vault(name) of its leftmost, then longest, match. (2) A match lying wholly inside a well-formed @vault(name) literal of an existing entry, or inside the fixed `@vault(` text of any opener, is ignored, so the @vault(name) literals of existing entries in the input stay parseable and scrub(scrub(s)) == scrub(s); the name inside an unknown or malformed literal is still scrubbed (with pw = hunter22, `@vault(xxhunter22yy)` scrubs to `@vault(xx@vault(pw)yy)`, which is idempotent and leaks nothing but gives BadReference), and a match that only overlaps a literal is kept and widened to cover the whole literal; scrub repeats until a pass changes nothing (at most 8 passes, after which the whole output is withheld as `@vault(?) [output withheld: scrub did not settle]`), so a literal scrub wrote cannot complete another value. (3) Vault::set refuses a non-empty value shorter than vault::MIN_VALUE_CHARS = 4 characters with VaultError::ValueTooShort { name, min } before touching the file; Vault::open refuses a file holding one the same way. Empty values are allowed and scrub nothing. Vault::in_memory (tests only) is exempt when built. (3b) set and open also refuse a non-empty value any of whose spellings occurs, ignoring ASCII case, inside `@vault(`, inside `@vault(n)` for any entry name n, or inside either withheld-marker text of (4) (SCRUB_WITHHELD, SCRUB_UNSETTLED; amended in T-05 round 6, since scrub would rewrite the marker itself) (VaultError::ValueInLiteral { name }, naming the entry whose value hides). Both errors name only the entry and point to `harness vault set <name>`. Vault::open_for_set skips these rules so that command can repair a file; set on that handle (and on in_memory) checks only the entry being set, and set on a handle from open checks every entry of the re-read file. (4) If the automaton cannot be built, open and set return VaultError::ScrubUnavailable and set writes nothing; an in_memory vault built with such values keeps a backstop, where every scrub returns `@vault(?) [output withheld: vault scrubber unavailable]`. On any vault, a scrub that hits the 8-pass cap of (2) returns `@vault(?) [output withheld: scrub did not settle]`. Both markers are malformed references, so vault_refs/resolve_into on them give BadReference: fail closed. (5) The panic hook prints a message that held a value itself, scrubbed, in the default hook's format; clean messages go to the previous hook."
    why: "A 1 to 3 character value (a middle initial, a state code) matched case-insensitively inside ordinary words and inside @vault(...) literals, which destroyed reader output, produced refs G-4 rejects, and would make the T-06 ledger (which fails closed when scrub changes a line) refuse ordinary lines; such a value protects almost nothing. A scrubber that failed silently withheld every output with no reported cause."
  - id: D-200
    text: "sb-sheet token counts are estimated as ceil(chars / 4) over the rendered UTF-8 text (sb_sheet::tokens::estimate). Used for the skeleton budget (B-6.1, 80-150), W-5 chunk_tokens (default 4000) and max_tokens."
    why: "The crate is pure and must be deterministic across live and fetched pages; a real tokenizer would add a dependency and model coupling for a budget that only needs to be roughly right."
  - id: D-201
    text: "sb-sheet's data files live in crates/sb-sheet/data/ (roles.txt, synonyms.txt), embedded with include_str! and parsed once (std OnceLock). roles.txt holds both the short alias -> ARIA roles table (D-49) and the query-word -> role prior table (B-6.2); both are public through sb_sheet::data so toolstore::fingerprint reads the same table."
    why: "Pure crate, no runtime file I/O; one table for find, sheet lines and fingerprints (D-49)."
  - id: D-202
    text: "find() candidates are rows with state.visible true and not flags.opaque-only content; a row with visible false is never a Match hit (still listed by sheet() with a `hidden` mark). Ties in score break by document order. The group-bonus form is the form owning the most part top-1 hits computed without the bonus; ties go to the form that appears first. The winning submit is the first row of that form with flags.submit or state.submitish. A row that is both a Match and an always-appended row appears once, with its Match reason."
    why: "B-6.2 leaves tie-breaks and hidden rows open; document order is the only stable tie-break across walks, and srv-web's approximated visibility (W-2) must not surface display:none distractors such as register.html's promo."
  - id: D-203
    text: "Sheet line format (B-6.3, also used for find output): `#id alias \"name\" [state...] [FLAGS...]`, e.g. `#7 input \"Email\" empty`, `#14 button \"Register\" SUBMIT`, `#3 iframe \"reCAPTCHA\" CHALLENGE OPAQUE`. Password values print only empty|filled; text values are quoted and capped at 40 chars. find output prefixes a weak hit with `?` (D-54). sb_sheet::sheet_line(row) and sb_sheet::find_lines(index, hits) are public so srv-web and sb-mcp render identically (I-6 draft addition)."
    why: "docs/00 and docs/03 write lines as `#12 input \"Email\" empty` and `button \"Register\" SUBMIT`; servers need one renderer, not two."
  - id: D-204
    text: "W-5 read cursor is opaque text `v1:<region>:<next block order>:<content hash hex>`; read(cursor) resumes at that block, so no text repeats. If the hash of the region's blocks changed, read restarts at chunk 1 and says so in the first line. Chunks break between blocks; a single block larger than chunk_tokens splits at sentence then word boundaries."
    why: "W-5 wants cursors that continue without repeating text; tying the cursor to block order (not byte offsets) survives re-rendering, and the hash makes a stale cursor visible instead of silently skipping content."
  - id: D-210
    text: "W-5 cursor detail (extends D-204, T-10): `v1:<region>:<order>[.<byte offset>][+<tokens used>]:<16 hex FNV-1a 64>`. The offset appears only when a block was split mid-body; `+used` only when max_tokens is set, so max_tokens caps the whole continued read (body tokens). The region is parsed from the right, so it may contain ':'. The hash is over the rendered units of the region. A cursor that does not parse reads from the start and says `cursor not understood` on the first line. When max_tokens is reached: cursor None, `truncated: max_tokens N reached`, the remaining outline is still listed. `chunk i of N` numbers come from the canonical plan from the region start with the current chunk_tokens."
    why: "D-204 alone cannot resume inside a split block or carry a whole-read budget across calls; both are needed for 'no repeated text' and 'max_tokens caps a whole read'."
  - id: D-211
    text: "W-5 selection and layout (T-10): main-less pages keep a block when score >= 0.5, score = 1 + landmark (nav/footer/aside -1.5, header -0.75, main/region +0.5) - 2*link density (non-headings) + 0.5 if >= 20 words / -0.5 if < 4 words (non-headings) - 1 if the same text repeats in two landmarks or 3+ times. Region resolution: a landmark name reads that landmark's blocks; otherwise a heading (`## FAQ` level first, then any level, exact text, then prefix, main content first, then the whole page) reads to the next heading of the same or higher level; no match reads the page with `region \"x\" not found` on the first line. A heading never ends a chunk when content follows. The remaining outline has one entry per heading (to the next heading of any level, body words only), `(top)` for text before the first heading, and counts only words not yet returned."
    why: "W-5 names the signals but not weights; these keep link-only and repeated header/footer blocks out while keeping a paragraph with a few inline links."
  - id: D-212
    text: "W-5 safety (T-10): blocks in a CHALLENGE row's child_frame, and in frames nested inside it, are dropped before selection (a landmark region cannot reach them); a block whose spans link a CHALLENGE row renders only the `[iframe \"reCAPTCHA\"](#id)` link forms. A span linking a password row renders `[input \"<row name>\"](#id)` and never the span text, and any FieldValue::Text on a password row is scrubbed to `***` from markdown and outline as defence in depth."
    why: "H-2 and D-5/D-55: the reader must stay safe even if a producer puts a challenge's text or a password value into a span."
  - id: D-205
    text: "find() scoring details (T-10, extends B-6.2, D-54, D-202): BM25 IDF is ln(1 + (N - n + 0.5)/(n + 0.5)) with N, n and avgdl computed per field (name, nearby, heading) over every row of the index, hidden rows included. Typed query words weigh 1.0; words added by synonym expansion weigh 0.5 (a word both typed and expanded keeps 1.0); expansion looks up every 1..3-word n-gram of the typed words and is not chained. The +2 role prior fires on n-grams of the typed words only, never on synonyms. `+1 visible / -2 covered or disabled` is either/or. A row needs lexical > 0 to be a Match, except for a bare forced role (`:button`). `name:role` splits at the last ':' and forces only when the suffix is a known alias or ARIA role, else the whole part is text. Rows in frames hosted by a CHALLENGE or OPAQUE row are never candidates. Appended CHALLENGE and OVERLAY rows and the winning submit must be visible; appended rows carry score 0.0 and weak false. A row hit by several parts keeps its highest-scoring part; weak uses its best lexical score."
    why: "On register.html, synonyms at full weight or a prior fired by the synonym `confirm` lets `Accept all` outrank the agree checkbox; half weight and typed-word priors keep acceptance 6 with a clear margin while still finding Postcode for `zip`."
  - id: D-206
    text: "Sheet line and sheet() details (T-10, extends D-203): an empty name is omitted (`#4 generic`); names are whitespace-collapsed, capped at 80 chars with `...`, and `\"` becomes `'`. SUBMIT prints for flags.submit or state.submitish. A row is a password field when input_type is `password` or autocomplete contains `password`; it prints only empty|filled. Options print as `[a, b, c, d, e, +N more]`. sheet(region) matches, in order: landmark, form id, `form` (every form row), exact heading, heading substring; a leading `#` (`## Heading`) forces heading mode; all case-insensitive. Rows of frames hosted by selected rows come along; rows in frames hosted by CHALLENGE or OPAQUE rows are never listed. An unknown region returns `no region \"x\". regions: <landmarks, form ids, ## headings>`; an empty selection returns `no elements`."
    why: "D-203 fixes the shape but not these edges; one renderer is shared by srv-web and sb-mcp, so they must be pinned."
  - id: D-207
    text: "Skeleton format (T-10, B-6.1): lines in order, empty ones omitted: title; URL; `landmarks: a, b`; `form f1 \"heading\": N fields, submit \"name\"` (at most 5 forms); h1/h2 joined by ` · ` (at most 6; rows' section headings as `h X` when there are no text blocks); `N elements: L links, B buttons, F fields`; `! CHALLENGE #id alias \"name\"`, `! OVERLAY ...`, `! dialog: \"text\"` (meta.dialog) and `! dialog #id ...` (dialog rows), at most 3 per kind; meta.site_tools verbatim; content hint. Counts, forms and warnings use visible rows outside CHALLENGE/OPAQUE-hosted frames. Fields are textbox searchbox combobox listbox checkbox radio switch slider spinbutton. Content hint: `main: form` when main holds form fields and under 300 non-heading words, else `main: article N words, M tables` (`, form` appended when it holds one); `page:` over non-chrome blocks when there is no main landmark. register.html renders 10 lines, about 98 tokens."
    why: "B-6.1 lists the items, not their rendering; a fixed, plain-ASCII-marker format keeps it deterministic and inside the 80-150 token budget."
  - id: D-208
    text: "Data file formats (T-10, D-201): roles.txt has `alias <alias>: <aria> <aria>...` lines (alias_for = first alias listing the role, else the role itself; every listed role is a known role for `name:role`) and `prior <aria> <aria>...: word, multi word, ...` lines (a word on several lines accumulates roles). synonyms.txt has one symmetric group per line, entries separated by `|`, about 200 lines, no transitive closure across lines. Keys of both match in normal form (lowercase, split on non-alphanumerics, joined by one space), so `e-mail` == `e mail` and `sign-up` == `sign up`."
    why: "Simple line formats a human can extend without touching code; normal-form keys make the scorer's tokenizer and the tables agree."
  - id: D-213
    text: "find() synonym phrases (T-10, amends D-205): a multi-word synonym (`postal code`, `sign up for updates`) is one phrase term that matches only where its words appear consecutively in a field; its BM25 tf and df count phrase occurrences, and it weighs 0.5 per word. A synonym phrase equal to an n-gram the caller typed is not added again. Single-word synonyms keep weight 0.5."
    why: "Splitting phrases into loose words let generic parts (sign, in, code, number) give a strong unmarked Match on unrelated controls, e.g. `subscribe` -> `Sign in` SUBMIT (review round 1, item 7)."
  - id: D-214
    text: "find() query evidence and role nouns (T-10, amends D-205's lexical gate): a row is a Match candidate when lexical > 0 or the part's role prior covers its role (a bare forced role lists every row of that role); a row scoring only the visible/covered term is not a hit. So an unnamed searchbox is found by `search` as `?#1 input` (score 3, lexical 0, weak by D-54). roles.txt gains `noun <aria>...: word, ...` lines (button, link, field, dropdown, check box, radio button...): when a part's typed words hold a role noun, the noun's roles replace that part's task-word priors, longest noun first (`radio button` is radio only)."
    why: "B-6.2's formula has no text gate and D-54's why assumes prior-only rows can surface with `?`; the state term alone carries no query information and would list arbitrary rows. `help button` must prefer the button over the link that `help` primes."
  - id: D-215
    text: "CHALLENGE rows are always reported (T-10, amends D-205 and D-207): find appends and the skeleton warns about every CHALLENGE row outside a CHALLENGE/OPAQUE-hosted frame, whether or not state.visible is true. Counts, forms, OVERLAY rows and the winning submit still use visible rows only."
    why: "Rule 3 / D-5: a challenge means stop, and producer visibility (srv-web W-2) is approximate, so a hidden-flagged challenge must not go unreported."
  - id: D-216
    text: "W-5 reader (T-10, amends D-211/D-212): only a `main` landmark in the top frame (frame 0) switches the page to main-only content; a `<main>` inside an iframe is that document's landmark and is boilerplate-scored with everything else. Blocks in frames hosted by CHALLENGE or OPAQUE rows are dropped (sheet::sealed_frames, shared with sheet/find/skeleton). Password rows use sheet::is_password (D-206: input_type or autocomplete). Password values are scrubbed from each rendered unit (and in their whitespace-collapsed spelling) before chunking and hashing. When a chunk holds only headings and the next unit does not fit, that unit is cut into the room left, at least a quarter of the chunk, so a heading never makes a chunk alone. A forged cursor `+used` saturates instead of overflowing."
    why: "Review/audit round 1 items 1-2, 5, 10-16: one password and sealed-frame definition across renderers, no split leaking a secret across two reads, no wasted read call on a lone heading, no panic on caller input."
  - id: D-217
    text: "find() synonym groups (T-10, amends D-205 and D-213): the synonyms of one typed n-gram are alternatives, not a sum: per field a row scores only the best term of each n-gram's synonym group, and groups add (each typed word is its own group; a term reached from two n-grams stays in the first). A synonym that is the typed n-gram respelled (same letters once spaces are removed: `e mail` for `email`, `signup` for `sign up`) weighs 1.0, as a typed word; other synonyms keep 0.5 per word. IDF is computed once per term per part and field, so a phrase's df scan is not repeated per row."
    why: "Review/audit round 2 items 4 and 10: overlapping expansions (`e-mail` phrase + `mail`) stacked to 1.5 so a synonym-only `E-mail` outranked the exact `Email` and flipped the group-bonus form; and the per-row phrase df rescan made find quadratic on large pages (seconds at 5000 rows)."
  - id: D-218
    text: "Sealed frames and escapes across renderers (T-10, amends D-212 and D-216): a reader span that links a row inside a CHALLENGE/OPAQUE-hosted frame renders the outermost host row's link form (a CHALLENGE host reduces the block as D-212 says), or nothing when the host is not in the index; plain text and outline labels follow the same rule. Password values are scrubbed in every escaped spelling the renderer produces (pipe -> backslash pipe, `[ ]` -> `( )`, double quote -> `'`, all combinations) and span text is scrubbed before escaping. sheet(region) never matches, and the unknown-region list never names, the landmarks, form ids or headings of rows or blocks in sealed frames. Skeleton's content hint uses only a frame-0 `main`, like the reader. Code blocks split at the last line break that fits and resume with the next line's indentation intact; only a cut inside an over-long line drops the spaces at the cut. A huge chunk_tokens saturates."
    why: "Review/audit round 2 items 1, 5-9: challenge-frame text and refs reached the model through spans and the no-region message, escaped password values slipped past the literal scrub, split code lost indentation, and chunk_tokens*4 could overflow."
  - id: D-300
    text: "toolstore resolves eTLD+1 with the `psl` crate (public suffix list compiled in, ICANN and private sections), then `_site.yaml` aliases. No list file is downloaded or vendored."
    why: "folder_for runs on every fetch/open; a compiled-in list needs no I/O, no network on first run and no refresh job. Bumping the crate version bumps the list."
  - id: D-301
    text: "toolstore reaches sb-act through an object-safe trait `PlannerCheck { check(program, index) -> Result<ActClass, String> }` with a default `SbAct` impl that calls sb_act::parse, classify and check_planner. Tests and callers may pass a fake; no cargo feature."
    why: "sb-act is a todo!() stub until area page merges; a trait object lets T-9's planner invariants be tested now and swaps to the real classifier with no code change in toolstore."
  - id: D-302
    text: "tools.health counters are per version: `runs` is the current clean streak (success += 1, any failure resets it to 0) and `fails` counts failures (misses included) in the current version; a version bump resets both. '3 clean runs' = runs >= 3; 'retired after 5 misses' = fails >= 5 while needs_repair. Lifetime totals come from the ledger."
    why: "T-7 needs a clean-run streak and a miss count, ToolHealth (I-1 contract) has only runs and fails, and per-version counters are what `harness tools list` should show for the current file."
  - id: D-303
    text: "T-7 'ephemeral deleted if unused 14 days or 10 site visits' is executed as retire + move to tools/_archive/ (status retired, why recorded, ledger event); the archived file is deleted 90 days later. ToolStore::sweep(store, now, visits) does both; site visit counts are passed in by the caller (reflect counts them from the ledger)."
    why: "T-7 says deletion is always retire -> archive -> delete and CLAUDE.md forbids deleting a tool file directly; toolstore has no visit counter of its own."
  - id: D-304
    text: "Fingerprint semantics (T-4): items match a row by role (alias or ARIA role, D-49) and case/space-insensitive name; `form#f2` matches when any row has form == f2. All found -> match; at least half found and the rest relocatable candidates exist -> partial(missing); otherwise miss. A needs_repair tool that matches or relocates again becomes `repaired` with version += 1."
    why: "T-4 names the three outcomes without thresholds; docs/03 acceptance needs a fixed page to bring a needs_repair row back via relocate at version 2."
  - id: D-305
    text: "Tool files run in rquickjs 0.14 inside toolstore::runner (D-53): a fresh context per run with document, window, globalThis.fetch, eval, Function, import and require absent; the page API is host functions; `api(url)` calls a caller-supplied `ApiFetch` trait object (srv-web wires it to its gated api tool). Runs are capped by an interrupt handler (wall cap, no sleeps)."
    why: "T-9 requires `page` to have no document/window/fetch, which only a runner can prove; srv-web (T-12/T-13) and sb-mcp need the same runner. rquickjs 0.14 builds on this machine's MSVC toolchain (quickjs-ng)."
  - id: D-306
    text: "Loader reporting: ToolStore::scan(domain, path) returns LoadReport { tools, skipped: Vec<(PathBuf, why)> }; load() is scan().tools. Files with a bad header are skipped and listed, never fatal. toolstore has no logging dependency; callers log `skipped`."
    why: "T-9 says the loader ignores and logs invalid files; the workspace has no logging crate and a returned list is testable."
  - id: D-307
    text: "Repairs come in two kinds. Relocate may change only @fingerprint (any other header change is rejected). Re-forge may change the body and raise @gate (status ask until the user confirms) but may not lower @gate, reduce the planner's `?s` count or fail sb-act's ?s rule, add an @vault key the old file did not use, rename the tool, or put a scheme, host, `//` or `..` in @match. Violations return StoreError::Invariant and are written to tools.health.why."
    why: "T-9 and G-4 list the invariants; T-5 lets a re-forge raise the floor while T-9 forbids a repair changing @gate, so the two kinds are separated."
  - id: D-308
    text: "Runner sandbox detail (refines D-305): `Function` stays as a global that throws on call (so `instanceof Function` works) and every function constructor reachable through prototypes is replaced by it; rquickjs's Eval intrinsic stays loaded because module loading needs it, but no JS-reachable eval exists. ApiFetch::api receives the run's remaining wall time and must return within it; reader output is capped by RunOpts.max_output."
    why: "Deleting Function outright breaks ordinary instanceof checks in tool code; module eval is how rquickjs loads ES modules. A host call with no deadline would let a hung fetch outlive the T-9 cap (review-T-11-runner should-fix 2, 3)."
  - id: D-309
    text: "Vault keys in tools (G-4, D-29) are enforced at run time, not only by text search: every @vault(k) in a planner's output program must appear as a literal `@vault(k)` in the tool's source file, else planner_act_class returns StoreError::Invariant. The static check_repair text search stays as the early check."
    why: "review-T-11-core blocking 3: a re-forge can build `@vault(` by string concatenation; only the emitted program is authoritative, and comparing it with the source's literal keys closes the bypass without parsing JS."
  - id: D-310
    text: "Only confirm() leaves `ask` (T-5). While a row is ask: record(Ok) counts runs but keeps ask, Relocated patches the fingerprint and keeps ask, misses/failures count fails and keep ask, a further reforge keeps ask. Domains and tool names that become paths must be a single normal component matching [a-z0-9._-] (domain also not starting with `.` or `_` except the reserved `_generic`); git calls use --literal-pathspecs."
    why: "review-T-11-core blocking 2 and 4: input strings reached filesystem paths and git pathspecs unchecked, and three paths turned an unconfirmed raised floor back into a runnable tool."
  - id: D-311
    text: "Refines D-303/D-310 after the fix round. Sweep idle clock: max(last_ok, last_fail); a tool that never ran counts from the later of its @forged date and the file mtime. Tool names are [A-Za-z0-9_-]{1,100} (upper case allowed, since parse_header accepts it); domains are `_generic` or [a-z0-9._-] with no leading `.`/`_`, no trailing `.`, no Windows device names. folder_for returns \"\" for hosts that cannot be a folder (non-ASCII, separators, traversal); every path builder refuses \"\". IDN hosts must arrive as punycode (URL hosts already are)."
    why: "Counting from @forged alone retired a tool registered seconds earlier from an older file; rejecting upper case would make valid headers unrecordable; returning \"\" keeps I-7's folder_for -> String and fails closed without a punycode dependency."
  - id: D-58
    text: "B-430 decided (supersedes the Pay clause of D-402): Submit is raised to Pay when the submit button's name, or the form's heading or name, says checkout, place order, confirm order, pay or pay now, buy now, complete purchase, or add card, in addition to D-402's card/IBAN field evidence. The text rule only raises the class, never lowers it; class order stays max() (D-36)."
    why: "docs/01 H-1's table lists checkout, add card and confirm order as Pay. Under D-402 a saved-card checkout has no card field, classifies as Submit, and runs under the lenient gate without an ask, which is the one path the gate exists to stop. A false Pay costs one ask; a missed Pay costs money."
  - id: D-59
    text: "B-200 accepted: I-6 (draft) gains sb_sheet::sheet_line, sb_sheet::find_lines, sb_sheet::data::{aria_roles, alias_for, role_prior, synonyms}, sb_sheet::tokens::estimate and the `skeleton` example binary; toolstore joins I-6's consumers. No existing signature changes. toolstore drops its built-in alias map (B-300) for sb_sheet::data once both areas are merged."
    why: "Additive and within D-38 (toolstore -> sb-sheet is already an edge). D-49 needs one alias table for find, sheets and fingerprints, and D-51's single-scorer rule extends to a single line renderer; two copies would drift and acceptance would test one of them."
  - id: D-60
    text: "IC-300 accepted: I-7 (draft) is split into pub modules header, domain, loader, fingerprint, invariants, lifecycle, archive, runner with every wave-0 name re-exported at the root, and gains ToolStore::{scan, tool_path, archive_path, archive, git_commit, health, register_forged, reforge, confirm, set_pinned, log_invariant, sweep}, free fns relocate, planner_class, planner_act_class (through PlannerCheck, D-301) and check_repair (D-307), and StoreError::Git. record, reforge and sweep never commit; the caller commits with its task id. harness joins I-7's consumers (reflect calls sweep)."
    why: "Additive, and every name is an entry point docs/03 already requires (T-1 commits, T-4 relocate, T-7 sweep, T-9 and G-4 invariants) that the wave-0 draft had not named. Keeping commits with the caller keeps one task id per commit, which CLAUDE.md's task-id rule needs. PlannerCheck keeps toolstore -> sb-act inside D-38 without a cargo feature."
  - id: D-61
    text: "IC-301 accepted: I-12 (draft) gains toolstore::runner::{PageHost, ApiFetch, run_reader, run_planner, *_with, RunOpts, RunError, SheetPage} per D-305 and D-308, with B-320 (table shape), B-321 (url/title are properties) and B-322 (sync traits, callers use spawn_blocking and Handle::block_on) taken as the contract; B-323's 2 s default stays and srv-web may pass a larger RunOpts.timeout for @phase 1 readers."
    why: "D-53 defined the page API in prose only; srv-web (T-12/T-13) and sb-mcp need one exact shape before wave 2 starts. Synchronous host traits match how JS host calls work, and a fresh !Send runtime per run means nothing crosses threads."
  - id: D-62
    text: "B-101 accepted (I-1 contract, behaviour only): harness_core::memory::contact_key normalises with trim() + to_ascii_lowercase() instead of Unicode to_lowercase(); signature unchanged. Non-ASCII characters are compared as written."
    why: "Unicode lowercasing folds compatibility characters (U+212A KELVIN SIGN -> k), so a look-alike address would match a known contact and a Send would be allowed without an ask (H-1.1). ASCII folding can only make an address look new, which costs one ask; nothing is stored yet, so no migration is needed."
  - id: D-63
    text: "B-400 accepted: I-10 (draft) gains pub const sb_act::MAX_WAIT: Duration = 30 s; w(n) is clamped to it (D-431). sb-driver's settle cap for w() reads MAX_WAIT instead of its own constant."
    why: "Additive; one constant keeps the parser's clamp and the driver's settle cap from drifting."
  - id: D-64
    text: "IC-302 accepted (amends D-61, I-12): ApiFetch::api(&self, url: &str, remaining: Duration) must return within the run's remaining wall time, and a late return (Ok or Err) makes the run RunError::Timeout; RunOpts gains max_output (default 64 KiB) with RunError::OutputTooLarge{max, got}; q(undefined|null) throws TypeError. srv-web's and sb-mcp's ApiFetch impls must honour `remaining`."
    why: "A hung host fetch outlived T-9's wall cap because the interrupt handler only runs when JS resumes (B-323), and reader output had no size bound (CLAUDE.md rule 5). Changing the trait now costs nothing; wave 2 has not written an impl yet."
  - id: D-65
    text: "IC-303 accepted (amends D-60, I-7): StoreError::BadPath; public try_tool_path, try_archive_path, valid_domain, valid_name, check_tool_id; folder_for returns \"\" for hosts that cannot be a folder and every mutator refuses it; planner_class and planner_act_class reject an @vault(k) the tool source does not contain literally (D-309)."
    why: "review-T-11-core blocking 1-3: path traversal through domain or tool names, git pathspec magic, and a re-forge reaching a vault key by string concatenation (G-4). Consumers need the validators to reject bad input before calling a mutator."
  - id: D-66
    text: "B-401 accepted (I-10): PlannerError gains ChallengeTarget{step}; check_planner rejects any step whose target row is CHALLENGE, with or without ?s, before the ?s rule. MissingStop{class: Challenge} no longer occurs. toolstore's and toolforge's matches on PlannerError must handle the new variant."
    why: "D-5: a planner never targets a challenge. A named variant lets toolstore and toolforge (G-2) report it instead of folding it into a missing-?s error."
  - id: D-67
    text: "B-410 accepted (I-11): injected/media.js installs globalThis.__sbMedia {list, cues, frames, frame} in world sb, beside __sb; shapes live in its header and D-420; video ids are __sb ids. sb-media becomes an I-11 consumer. It ships with the page area but is Phase 2 code (swarm.yaml page note) and is not part of the Phase 1 baseline."
    why: "B-9's in-page seek and canvas path needs a page API that I-11 did not name; keeping it a separate global leaves __sb's surface unchanged for sb-driver."
  - id: D-68
    text: "B-411 accepted (I-11): act(id) returns a Promise; walk(true) and walk({dirty: [ids]}) are accepted; frames() entries may carry challenge, and child entries with frame:null carry id/name; text() emits an iframe placeholder block (kind other, elem = iframe row); index() omits State fields equal to State::default() (D-421). Every reader of I-5 JSON deserializes State with serde(default); sb-sheet's State already does."
    why: "Additive, and sb-driver (wave 2) must code against what the page really returns. Omitting default state fields shrinks the index on the pipe; verified that sb_sheet::index::State is #[serde(default)] on swarm/sheet, so I-5 still round-trips."
  - id: D-69
    text: "B-102 (Postgres backends exiting with code 2 three times, 08:34-09:19 UTC): no docker-compose.yml change during wave 1. Areas keep throwaway databases (D-100) and re-run a test that hits recovery mode, reporting the Postgres log line. The supreme revisits shm_size (256mb) and log settings at the wave-1 gate, when no area is running tests."
    why: "The container log shows no shared-memory or out-of-memory error and the crashed backends logged nothing, so shm is a guess, not a diagnosis. Any compose change recreates the one shared container on the next `docker compose up`, which would kill every other area's tests mid-run. No crash since 09:19 UTC."
  - id: D-70
    text: "B-103 accepted (I-3 contract, additive): pub fn harness_core::gate::clean_card(card: AskCard) -> AskCard exposes the D-110 (5) control-character strip and caps the gate already applies. ToolCtx::ask (I-2) and every other card builder call it; the copy in mcp.rs (card_line) is removed in favour of it."
    why: "Two sanitisers for the same card drift, and a card that skips one path can carry ANSI or CR text that misreports the action (the D-110 finding). Making the gate's own helper public is additive and leaves one place to test."
  - id: D-71
    text: "B-104 accepted (I-2 contract, additive): harness_core::mcp gains serve_io(server, registry, harness, reader, writer), PROTOCOL_VERSION and scrub_value(vault, &Value); new module harness_core::ask {FileAsker, answer, asks_dir, card_path, answer_path}. tools/call for a name not in the registry answers JSON-RPC error -32602 (MCP 2025-06-18 'Unknown tool') rather than an isError result; dispatch() still returns ToolError::Args."
    why: "The MCP spec puts unknown tools under protocol errors (-32602), while isError is for a tool that ran and failed; following it keeps clients like Claude Code from treating a typo as a tool failure. serve_io is the stdio transport's test seam and ask::answer is what T-08's `harness ask` needs, so both belong in the contract file."
  - id: D-72
    text: "IC-304 accepted (I-7 draft), with one condition: the further pub items (runner ALLOWED_GLOBALS/FIND_ALL_K/table_json, invariants stop_count/vault_keys, archive has_task_id, domain normalize_host/registrable/SiteConfig, fingerprint helpers, loader namespace/glob_match/url_path, skeleton_line, the lifecycle constants) and behaviours (record(Relocated) on a retired row errors; a reforge of an ask row stays ask) are contract for consumers. Consumers call try_tool_path/try_archive_path only; tool_path/archive_path, which return an empty PathBuf on bad input, stay for wave-0 compatibility and are marked #[deprecated] by store in a follow-up (not a merge blocker)."
    why: "toolforge's G-2 static check reuses these helpers, so wave 2 should see them before coding. An empty PathBuf as an error sentinel joins to the tools root and is easy to write through; IC-303 already makes every mutator refuse it, so the risk is in new callers, which the try_* rule covers."
  - id: D-73
    text: "B-412 accepted (I-11 draft): un-based reads return {why: \"no base\"} (array calls return that object), walk() without a base returns it, resolve() answers stale; sb-driver walks with a base after every navigation before any read. A challenge page reports index() = [one CHALLENGE row, role document], text() = [one other block], frames() = [self with challenge: true]. __sbMedia list()/cues() may return {why}, frames() entries may carry truncated: true, opts.budgetMs defaults to 8000."
    why: "The un-based first call reused ids across document generations (review-T-19-js Blocking 2, against D-55), and an empty index on a challenge page was a stop nobody reported. sb-driver and sb-media are not written yet, so the shape change costs nothing now."
  - id: D-74
    text: "I-7 paths corrected to match swarm/store deeab04 (supreme second-opinion review): try_tool_path and try_archive_path are ToolStore methods, not root functions (archive.rs); parse_fingerprint, render_fingerprint and patch_fingerprint live in toolstore::header and are re-exported at the crate root, not in toolstore::fingerprint. D-65 and D-72 read with these paths. No code change on the branch."
    why: "The IC-303 and IC-304 proposals named the wrong paths and D-65/D-72 copied them, so a wave-2 consumer coding against I-7 as written would not compile. The code's layout is fine; the contract text was wrong."
  - id: D-117
    text: "Ledger::write fail-closed rule (refines D-102 for the ledger, T-06): after scrub_event, every data field (server, tool, args, result_summary, consequences, why), serialized exactly as it appears in the jsonl line, must come back unchanged from scrub(), else LedgerError::Unscrubbable { fields } and nothing is inserted or written. Fields the harness generates itself (id, run_id, which must equal the ledger's own run, ts, class, mode, duration_ms measured by the wrapper, ok) and the line's key names and JSON punctuation are not checked: a vault value equal to a year, a duration, a mode or a key name is a coincidence there, not a leak. run_id is the one exempt field that is not purely harness-made: its slug comes from the prompt and was scrubbed against the vault only when the run was created (run::slugify). A value added to the vault mid-run, or held by a tool server with another vault, is not re-checked against it; this is accepted because the run folder's name holds the slug anyway. The rule does not rely on any minimum vault value length (D-118)."
    why: "Outside data can only enter a ledger line through the data fields, which still fail closed; checking the whole line made a 4-digit PIN equal to the year refuse every write, which loses the H-3 ledger and protects nothing."
  - id: D-119
    text: "T-07 round 2 (H-6, H-1.3, H-1.4, I-2). (1) ToolCtx::ask runs every mid-call card through Gate::check as a Call {class = card.class, domain = card.site, the enclosing call's server, tool, scrubbed args and hints, no recipients, strict = runs.strict}: Stop -> no card, a core stop event, TimeoutSkip; Ask -> the card proceeds on timeout only if the gate's card, Gate::on_timeout(class, strict) and the handler's card all proceed (so a strict or hint rule makes it skip); Allow -> the handler's card is still shown, tightened by Gate::on_timeout; a gate error -> shown with on_timeout Skip. (2) A run with no runs row (run_get Ok(None)) reads as strict in dispatch and ToolCtx::ask; a failed lookup refuses the call in dispatch (ToolError::Failed, the handler never runs) and reads as strict in ToolCtx::ask. (3) Every Asker call is capped at card.timeout + 5 s; a cap hit, or a TimeoutProceed on a card that says Skip, counts as TimeoutSkip. (4) FileAsker returns TimeoutSkip when it cannot create asks/ or write the card, and closes an ask by claiming <n>.answer no-clobber (temp file + hard_link): its own timeout writes `timeout`, so ask::answer refuses (ErrorKind::AlreadyExists) an ask already answered or timed out. (5) dispatch catches a handler or classifier panic: isError reply and an ok=false tool event. (6) Outgoing JSON-RPC scrubs only payload strings (result.content[*].text, result.tools[*] name/description/inputSchema, error.message), never id, jsonrpc, method or protocolVersion. (7) Diagnostic and stop lines are scrubbed, then cleaned by gate::clean_card, then scrubbed again. (8) A non-UTF-8 input line answers -32700 and serve_io keeps reading."
    why: "Rule 4: a mid-call escalation is a side effect whose class must meet gate.rules (strict, hint, stop), not only runs.strict, and a proceed on timeout must mean the user saw the card and stayed silent. An answer nobody reads must not look accepted. Cleaning before scrubbing let truncation or whitespace collapse reshape a vault value past the scrubber (rule 2). Scrubbing the envelope let a short vault value rewrite the id or protocolVersion."
  - id: D-121
    text: "report.md event-shape contract (T-06; H-3, H-4, Q-4, Q-5; binds the T-07 wrapper and T-09 site tools). ledger::report reads only these shapes, documented in the ledger.rs and mcp.rs module headers. (1) Tool event: server = the tool server, tool (a site tool is named after its site), class, mode = allow | answered_proceed | timeout_proceed (None counts as allowed) or stop when the handler returned a stopped output (why = the reason), ok, args (the target is the first of url href to path file id message_id thread query q domain), result_summary, consequences (paths inside the run's files/ go on the Files: line). (2) Read: counts ok class=Read calls outside core, one per distinct target, bucketed mails / files / pages / other by server, tool and target host. (3) Ask outcome: server = core, mode = one of the four outcomes, class and tool of the asked call, why = the card's what line. (4) Stop: server = core, mode = stop, why = the reason, tool and args of the call. One listing per stopped call: a tool stop event is grouped with the next event of the same (tool, args) when that is a core stop (the trailing one), and with the core stops of the same (tool, args) right before it whose ts lies inside the call (ts - duration_ms, plus 100 ms slack). Every other core stop is a call of its own, so a resumed run (H-1.4) stopped again on the same tool and args lists a second stop. A group shows its first core stop's why, and Result: stopped (...) shows the last group's why. (5) A failed call (ok = false, not a stop or skip) is resolved by a later ok call with the same server, tool and target; otherwise it is listed with class, why, consequence and fallback (the next non-core event, or none). (6) Core events with other modes (allow, ask) are not read, and core events never count as failures."
    why: "The report is derived from the ledger alone, so a writer that changes an event's server, mode, tool or args silently changes what the user is told; a decision binds T-07 and T-09 to the shapes, and grouping stops by call instead of by run keeps a second stop after a resume visible."

  - id: D-116
    text: "T-08 placement and loop rules (refines D-106, D-107). (1) The Launcher trait (and a Clock trait with SystemClock and a test ManualClock) live in harness_core::sched, not the harness crate, because the core::sched loop calls them; the harness crate implements ClaudeLauncher and re-exports the trait. (2) harness is one crate with a lib and two bins (harness, harnessd); deps clap, rpassword, core-pg, toolstore (tools subcommands, I-7 try_* paths per D-74), notify, and sqlx only so `db status` can read _sqlx_migrations without migrating. (3) Schedule changes wake harnessd through a marker file: `harness schedule add|rm` calls sched::notify_changed(runs_root), which writes <runs_root>/.sched/changed; harnessd watches that folder (notify, non-recursive) and re-reads schedule_list. No poll interval. (4) Due rule: the next croner occurrence strictly after max(last_run, the first time this loop saw the schedule, the loop's last attempt); occurrences missed while harnessd was down coalesce into one firing; a schedule whose previous firing is still running skips; schedule_fired is written before the run starts, so a failing firing never hot-loops. (5) watch and reflect rows are stored but the Phase 1 loop skips them with one log line (T-16); sched fire() returns SchedError::NotInPhase1 for them. (6) A firing writes a core ledger event sched.fire; a launcher error or non-zero exit writes a core launch event (ok false), sets runs.status failed unless the ledger says stopped, and the report's Result line says failed. (7) ClaudeLauncher: scheduled runs are `claude -p` with the scrubbed prompt on stdin (not argv, so a prompt starting with '-' is not a flag and Windows quoting cannot break it), SB_RUN_ID and an absolute SB_RUNS_ROOT in the environment, stdout scrubbed into files/answer.md; `harness run` is interactive `claude <prompt>` with inherited stdio."
    why: "The loop in core cannot name a trait defined in a crate above it. A marker file is the only cross-process change signal reachable without adding LISTEN/NOTIFY to the MemoryStore contract, and it keeps rule 6 (wait on an event, not an interval). Coalescing and write-before-launch keep a down daemon or a broken prompt from producing a burst of runs."
  - id: D-120
    text: "T-04 round 3 gate semantics (refines D-110, D-113; resolves review-T-04 round-2 should-fix 1 and 2). (1) rule_domain returns the A-label form URL hosts carry: trim; U+3002, U+FF0E, U+FF61 become '.'; full-width ASCII becomes ASCII; lowercase; one trailing dot removed; each label with non-ASCII letters is Punycode-encoded (RFC 3492, xn--). A label may hold only ASCII a-z 0-9 - _ or non-ASCII letters and digits that are neither default-ignorable nor in a compatibility block; there is no NFC/NFKC, so decomposed or compatibility input is refused, never mapped. Labels <= 63, names <= 253 characters. rule_hint accepts only ASCII a-z 0-9 _ - . after ASCII lowercasing (so KELVIN SIGN and full-width hints are refused). (2) Cards: the invisible set is Unicode Default_Ignorable_Code_Point plus U+2800; what_line cleans every component (tool, each recipient, each arg key and value) before joining; a stop reason cleans the tool name. (3) Send: recipients blank after trim are not recipients; new recipients are deduped by contact_key (first spelling kept). The card's first value is the gate's ('new recipients (N)', list): up to 32 recipients within 2000 characters, each over 120 characters shown as head + '…(+K chars)…' + '@domain', then '…(+K more)'; 'none' when N = 0. A classifier, arg or clean_card value under that key is dropped. A Send(new) ask proceeds on timeout only when every new recipient is listed in full and as written. (4) from_hint is set by a hint whose own mode decided or tied the result; a lower-class hint that loses to the class level leaves the class-level timeout (an Account or Send(new) ask hinted 'newsletter' under ('*','Read:newsletter','allow') proceeds)."
    why: "A rule typed as BÜCHER.DE was stored as bücher.de and never matched xn--bcher-kva.de, the silent dead rule D-110 (1) closed; without an IDNA dependency in core, refusing what cannot be mapped safely beats storing a key no host has. An OSC opened in one recipient and closed in the next ate the new address from a card that proceeds on timeout, and the 200-character what cap pushed a ninth recipient off the card; a card that cannot show who receives the mail must not send on silence. D-113 made the unrelated allow rule make Account stricter, which the spec does not ask for."
  - id: D-75
    text: "blockers.yaml no longer uses the git union merge driver (.gitattributes); decisions.yaml keeps it. scripts/swarm/merge_gate.py now also fails when a blockers.yaml entry sits under a section whose fields it lacks (blockers need question and default_taken; interface_changes need interface and change) or when ids repeat across sections. swarm/core and swarm/page must repair their blockers.yaml by moving lines, not editing entries: the block of store entries from `  - id: B-31` through the end of B-310 goes to the end of the `blockers:` list, and the second `interface_changes:` key line is deleted."
    why: "After main gained store's blockers (f493fd3), core and page merged main with union, which stacked main's additions to `blockers:` after their own additions to `interface_changes:` and repeated the key, so PyYAML's last-key-wins hid B-101/B-103/B-104/B-402..B-405 and filed 18 store blockers as interface changes. decisions.yaml is one list, where union is safe; for a three-list file a normal 3-way merge places hunks correctly and turns real overlap into a visible conflict. The gate already rejected the duplicate key, but a misfile without one would have passed."
  - id: D-76
    text: "B-150 accepted (I-4 contract, additive): harness_core::vault gains default_path() (SB_VAULT_PATH, else <config_dir>/sheetbrowse/vault.toml.age), default_key() (keychain service `sheetbrowse`, account `vault`), const MIN_VALUE_CHARS = 4, and VaultError::{ValueTooShort{name, min}, ScrubUnavailable}. VaultError is marked #[non_exhaustive] in the same change so further variants never break a consumer's match."
    why: "The CLI and bootstrap need one definition of the D-101 defaults, and D-118's floor needs a typed refusal so a short value is reported instead of over-scrubbing every output. The only exhaustive match today is core's own test; non_exhaustive keeps wave-2 consumers (srv-web, srv-files, srv-cli) safe from the next addition."
  - id: D-77
    text: "B-151 owner and timing: area core closes the base64/base64url scrub gap (standard and url alphabets, padded and unpadded, the three byte alignments, trimmed edge characters, patterns under 8 characters skipped) as wave-2 work on swarm/core after its wave-1 merge, with a test that `Basic <base64 of user:canary>` and a JWT payload carrying the canary are scrubbed. It must be merged to main before servers' T-12 (srv-web api with vault headers) merges; the supreme holds the servers merge until then. B-152 (input masks, split or truncated values, capitalised non-ASCII) is accepted as defaulted: core closes it in step 3 with page's readers, before the browser readers' acceptance."
    why: "core's default said 'first core task of step 2', but core has no wave-2 task (T-16 is wave 3) while T-12 is the first code that sends vault values in headers that can come back base64-encoded, so the gap would ship with the first real vault use and count against Phase 1's zero-leak gate. Running it beside servers keeps it off the critical path."
  - id: D-78
    text: "store's follow-up batch (one change on swarm/store after it merges main): the five B-31 items, #[deprecated] on tool_path/archive_path (D-72), and toolstore::fingerprint switching from its built-in alias map to sb_sheet::data::{aria_roles, alias_for} (D-59, now unblocked by the sheet merge 607eda5). It must be on main before servers T-13 (the seeded ashbyhq.com tool and fingerprint on a fetched index) merges and before toolforge T-28. The store session is relaunched for it when the user approves."
    why: "D-59 tied the alias swap to 'once both areas are merged', which happened at 607eda5, but no task or session owned it. Two alias tables would let find and fingerprints disagree on what a role name means, which is the drift D-49 exists to prevent, and T-13 is the first consumer to fingerprint a real page."
  - id: D-79
    text: "B-177 accepted (I-2 contract, behaviour only): ask::answer returns io::ErrorKind::AlreadyExists with a plain message once an ask is closed; FileAsker::ask returns TimeoutSkip when it cannot write the card; dispatch and ToolCtx::ask read a missing runs row as strict, cap every Asker at card.timeout + 5 s, and turn a handler or classifier panic into ToolError::Failed plus an ok=false tool event; ToolCtx::ask cards go through Gate::check; serve_io answers -32700 for a non-UTF-8 line and scrubs only payload strings. `harness ask` prints the AlreadyExists message as is."
    why: "Each change only makes the wrapper stricter or fail closed (review-T-07 blocking and should-fix items): a lost runs row must not relax strict mode, a hung Asker must not stall a tool call past its card timeout, and a panic must leave a ledger trace instead of killing the server."
  - id: D-80
    text: "B-185 accepted: harness_core::sched becomes interface I-13 (draft, consumers harness and srv-cli): Scheduler{runner, wake, fired}::run_loop(shutdown), traits Launcher and Clock (SystemClock, ManualClock), Runner::{fire, execute}, parse_cron (5 fields, UTC), next_after, changed_dir, notify_changed, CHANGED_DIR, FIRE_TOOL, LAUNCH_TOOL, SchedError. The harness crate's Env, CliError, cli and daemon items stay harness-internal. Any tool that adds or removes a schedule outside the CLI calls sched::notify_changed."
    why: "The loop in core calls the launcher, so the trait must live in core (D-38 has harness above core), and a Clock seam makes the H-5 acceptance testable without a model or a real minute. Recording it as an interface tells servers (srv-cli, wave 2) about notify_changed before they write a schedule tool."
  - id: D-81
    text: "B-191 accepted (I-3 contract, behaviour only): rule_domain stores Punycode A-labels and refuses non-mappable Unicode; rule_hint accepts only ASCII a-z 0-9 _ - .; a Send AskCard's values[0] is always the gate-written ('new recipients (N)', list) row and any other value under that key is dropped; blank Call.recipients are ignored and duplicates count once. No re-set is needed: the six seeded gate.rules (migrations/0001_init.sql) use '*' and ASCII hints, and no user rule exists yet."
    why: "Unicode domains and hints admit look-alike keys (the D-62 problem for gate rules), and a classifier-supplied 'new recipients' row could tell the user a Send goes to known contacts when it does not. Checked the seeds before accepting, so the stated incompatibility strands nothing."
  - id: D-82
    text: "B-413 accepted (I-11 draft): __sbMedia frame() returns {t: null, why} and frames(id, times) returns a single {t: null, why} entry when the call is refused as a whole (no base, unknown id, challenge); per-time failures keep one entry per requested time."
    why: "I-11 named a bare {why} only for list() and cues(), so sb-media (wave 2) had no written shape for whole-call refusals of frame()/frames(); writing it down before sb-media exists costs nothing, and a single t:null entry is distinguishable from per-time failures."
  - id: D-219
    text: "B-32 (1)/(2): every plain span the reader or the skeleton prints from page text goes through link_text (`[` to `(`, `]` to `)`), so page text cannot forge a `[role \"name\"](#id)` form; outside code blocks a run of three or more backticks is cut to two; a code block's fence is one backtick longer than the longest backtick run in its body (minimum three), so its content cannot close it. Skeleton h1/h2 lines render their spans through the reader's span rules (a password-linked span prints its link form only, a block linking a CHALLENGE row prints the iframe link form)."
    why: "srv-web (T-12) feeds real pages through read(); a forged link form gives the model an id that does not exist or names a different element, and a closed fence lets page text pose as harness output. One escaping rule for both renderers keeps them from drifting."
  - id: D-220
    text: "B-32 (3)/(7): when ReadOpts.region is set and differs from the cursor's region, the explicit region wins and the read restarts at chunk 1 with a note; the max_tokens budget carried in a cursor (used) survives a page change (only the position resets)."
    why: "The caller asked for a different region, so continuing the old one wastes a turn; and max_tokens caps what one read sequence spends, which a page change must not refill (fails closed)."
  - id: D-221
    text: "B-32 (5): FindOpts implements Default with k = 3, and find() treats k = 0 as the default 3 instead of dropping every Match row."
    why: "The documented default must be applied in code; 0 meaning 'drop everything' silently returns only the appended rows, which reads like an empty page."
  - id: D-222
    text: "B-32 (6): a headings-only chunk that must split the next unit's body respects the max_tokens budget passed in (the cap/4 floor applies only when no max_tokens limit is lower)."
    why: "max_tokens is a hard cap on what the read returns; the floor existed to avoid a chunk of headings only, not to exceed the caller's cap."
  - id: D-223
    text: "Refines D-219 for code blocks (coder proposal P1): inside a code block `[` and `]` are kept and only the link shape is broken (`](` becomes `)(`); the longer-fence rule stays. Plain spans outside code keep the full link_text swap."
    why: "Code with attributes and indexing (`#[tokio::main]`, `a[i]`) must stay readable for the model; a link form needs `](`, so breaking only that pair still makes forging impossible."
  - id: D-224
    text: "Refines D-220 (coder proposal P2): switching region restarts the position but keeps the cursor's used, like a page change."
    why: "max_tokens caps one read sequence; any reset of position must not refill the budget (fails closed)."
  - id: D-225
    text: "Coder proposal P3: a rendered body line (outside code) that starts with a harness trailer or note word (`remaining:`, `truncated:`, `chunk N of M`, `note:`) gets a leading backslash; the skeleton title, form headings, warning names and sheet lines apply link_text to page-derived names in addition to the quote swap."
    why: "Same defect class as B-32 (1): page text must not pose as harness syntax; the quote swap alone leaves a `[button 'x'](#3)` look-alike."
  - id: D-226
    text: "Review round 4 should-fix (T-10, B-201): (1) inside a code block a backtick run longer than 9 is cut to 9, so the fence is at most 10 backticks (overhead bounded, not page-controlled); (1)+(2) a chunk never exceeds the max_tokens remainder because of fixed overhead: when the remainder cannot hold a unit's prefix, close and separator lines plus at least one word of body, the read stops there with truncated (and a cursor) instead of forcing progress; with no max_tokens the chunk_tokens cap applies the same way except that an empty chunk still takes one piece; (3) outline headings are built with the same span joining and scrub as the body heading, so remaining: never shows a value the body hides; (4) poses_as_skeleton also matches every fixed multi-word line start the skeleton writes (`tools for this site:` and any other found by grepping skeleton.rs format! calls)."
    why: "A 2000-backtick run made one read return ~1018 tokens against max_tokens 50 and a 40 KB block 44552 chunks; the cap must hold against page content, and the outline is model-visible text that must obey the same password scrub as the body (H-2)."
  - id: D-312
    text: "B-31 (1), per D-78: tool names are lower case only. domain::valid_name accepts [a-z0-9_-]+ (still no device names, at most 100 bytes), the header parser refuses an @name with an upper-case letter, and ToolStore::reforge refuses a new spec whose @name differs from the name it was called with (StoreError::Invariant-style refusal, no file written)."
    why: "NTFS and the default macOS volume are case-insensitive, so Register.js and register.js are one file but would be two tools.health rows. Lower-casing at the boundary is simpler than case-folding every health key, docs/03 sets no case rule, and both seeds are already lower case."
  - id: D-313
    text: "B-31 (2), per D-78: check_repair refuses a re-forge that changes @kind (either way) or lowers @phase (2 to 1, which gains page.api and runs on fetched HTML). Raising @phase 1 to 2 is allowed."
    why: "G-4 says a repair may never widen what a tool can do; a reader becoming a planner or a browser tool becoming a fetch tool with api access both widen it, and neither is a repair."
  - id: D-314
    text: "B-31 (4), per D-78: ToolStore::archive fails closed. It sets the tool's mtime to now before the rename (a rename keeps it); if that fails, nothing has moved and the error is returned, so an archived file always carries its archive time and sweep's 90-day clock (D-303) is never measured from the tool's old mtime. The mtime is set through a handle that a read-only file grants (FILE_WRITE_ATTRIBUTES on Windows, a read-only open elsewhere). Sweep does not stop on a per-tool file failure (retire, archive, 90-day delete): it writes an ok:false ledger event for that tool or file and goes on with the other tools and domains; memory errors still return."
    why: "Recording the time in a row would need a tools.health column (contract change, like G-5's content hash); failing the archive keeps the current contract and the caller retries at the next sweep. Setting the mtime before the rename means a failure needs no rollback (a failed rollback would have left a file in _archive with its old mtime), and continuing the sweep keeps one stuck file from blocking every later retire and delete."
  - id: D-83
    text: "B-193 accepted (I-3 contract, names only): harness_core::gate::{ANY_DOMAIN, rule_domain, rule_hint, rule_class_key, rule_key} join I-3's rust list as the one canonicaliser for gate.rules keys (D-113, behaviour per D-81), and I-3 gains consumers: [core-pg]. Any other code that writes or looks up gate.rules keys calls these instead of normalising on its own."
    why: "core-pg's rule_set and lookup already call them (crates/core-pg/src/lib.rs, verified on swarm/core), so they are contract in fact; naming them lets wave-2 consumers find them, and a second normaliser would reopen the look-alike-key problem D-62 and D-81 closed."
  - id: D-84
    text: "B-194 accepted with a condition (I-4 contract). VaultError::ValueInLiteral{name} is accepted as proposed. Vault::open_for_set is accepted only if it returns a distinct type, harness_core::vault::VaultEditor, exposing set, remove, names and save, and NOT resolve_into, scrub or install_global; it must not return a Vault. core makes this change before its wave-1 PR, with a compile-fail or API test showing VaultEditor cannot resolve."
    why: "On swarm/core (0790269) open_for_set returns a full Vault built with strict=false, so the handle that skips D-118's value rules can still resolve values scrub cannot see (short ones, ones inside a literal) and can be installed as the process-wide scrubber; only a doc comment forbids it. The vault is the harness's main safety boundary, so the restriction belongs in the type system (CLAUDE.md: APIs hard to get wrong), and the editor type costs a few lines."
  - id: D-85
    text: "B-195 accepted (I-13 draft): Launcher::before_run (provided, default Ok) runs first in Runner::execute, before the prompt is scrubbed; a failure returns SchedError::BeforeRun(LaunchError) with no folder or runs row. harnessd's daemon::ReopenVault re-opens the vault there. The harness-crate launcher constants and ClaudeLauncher fields (D-124) stay harness-internal. Condition: SchedError is marked #[non_exhaustive] in the same change, as VaultError was (D-76)."
    why: "A vault value added while harnessd runs would otherwise be unknown to the scrubber for every scheduled run until a restart, which is a leak path; re-opening before anything is written closes it, and failing before the runs row keeps a half-started run out of the ledger. SchedError has gained a variant each round, so non_exhaustive keeps srv-cli (wave 2) safe from the next."
  - id: D-227
    text: "Review round 5 (T-10, W-5): (blocking) the D-226 'at least one word' rule applies only when that word fits in the current budget; a first word longer than the budget (min of chunk_tokens and the max_tokens remainder, in chars) is cut by characters as D-204 says, so a fresh read under max_tokens never returns an empty body while text is left. (should-fix 1, amends D-210) the remaining: outline lists at most 20 entries, each label capped at 80 chars, then one `+N more sections, W words` entry; it stays outside the body budget. (should-fix 2) a table header separator wider than the chunk is deferred to B-202."
    why: "A 6000-char token at max_tokens 1000 made that text unreadable (empty body, spent cursor); an uncapped outline let 2000 headings put 100k tokens around a 50-token body, against W-5 'max_tokens caps a whole read'. 20 x 80 bounds the outline near 500 tokens while keeping its navigation value."
  - id: D-228
    text: "Clarifies D-227: the word threshold is this read's budget, min(chunk cap, max_tokens remainder), not the full max_tokens. So the only stop that leaves body text unread is the D-226 overhead stop (remainder cannot hold a unit's overhead plus one char); otherwise a word that does not fit is cut by characters, and a tiny remainder ends the sequence with a partial word in a read marked truncated."
    why: "Either threshold keeps max_tokens; the remainder form never spends a whole read returning nothing, and a fragment at the end of a truncated sequence costs less than an extra empty turn (CLAUDE.md priorities). Implemented in d2cf21b."
  - id: D-86
    text: "The repo has a remote: origin = https://github.com/loki52501/sheet_browse.git, with main and every swarm branch pushed. PRs are real GitHub pull requests (gh pr create --base main --head swarm/<branch>); areas push their own branches; the supreme pushes main after every merge. Supersedes D-46 (local-only). Never force-push; never push main from an area session."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core. A real remote gives every merge a PR record and lets areas publish branches without the supreme reading worktrees."
  - id: D-87
    text: "Merge rule (overrides docs/10 S-3 and S-8 where they differ): a PR merges when its reviewer report has no Blocking items and cargo test --workspace passes on the merge commit, and no leak hook fired (CLAUDE.md hard rule, kept). A red acceptance item does not block a merge; it becomes a follow-up task on main (T-xxb) owned by the same area. Supreme second-opinion reviews are non-blocking notes filed into blockers.yaml; they never hold a merge or a launch."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core."
  - id: D-88
    text: "Holds are abolished: no wave-2 launch or merge waits on a should-fix in another area. D-77's base64 scrub, B-32 item 1 and B-33 item 3 become ordinary follow-up tasks (T-05d, T-10b, T-11b) running in parallel with wave 2."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core."
  - id: D-89
    text: "Review loops are capped at two rounds per PR: round 1 review + test, round 2 fixes. After round 2 the PR merges under D-87 and everything left is filed as follow-ups."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core; wave-1 PRs went 3 to 5 rounds."
  - id: D-90
    text: "Interface freeze: no amendment to interfaces.yaml until T-17 is done. An area that needs a change works around it locally and files the proposal; the supreme answers 'deferred to wave 4' and moves on. D-84 (VaultEditor) and D-85 (before_run, non_exhaustive SchedError) are the last accepted items; if core has not finished them they become follow-up tasks (T-05c, T-08b), not merge conditions."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core."
  - id: D-91
    text: "One PR per task from now on, on branch swarm/<area>-T<nn> (for example swarm/servers-T12, swarm/core-T05d). core's remaining work after its merge, every follow-up, and every wave-2 and wave-3 task each gets its own branch and merges alone."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core; one branch per area made each merge wait for the area's slowest task."
  - id: D-92
    text: "The supreme relaunches any stopped area session itself, without asking, with scripts/swarm/launch.ps1 (Start-Process wt.exe form, TMP on F:/sb-swarm/tmp-<area>). It still asks the user only about: a merge conflict it cannot resolve, a vault or captcha rule, or deleting something."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core."
  - id: D-93
    text: "Supreme checkpoint commits at most once per hour, one line. Decisions only when they change what someone else must do."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core."
  - id: D-122
    text: "T-09 placement (H-6, H-2, H-3, H-5, docs/01 and docs/02 step-1 acceptance). The fake echo server is an example of the harness crate (crates/harness/examples/echo.rs): a stdio MCP server on core::mcp::serve_io with a PgStore-backed ledger and the real Vault, never an installed bin. The step-1 acceptance lives in crates/harness/tests/step1_accept.rs, spawns the echo example over stdio (as Claude Code will), runs against the compose Postgres in a throwaway sb_t_* database (D-100), and greps stdout, stderr, ledger.events, every table, ledger.jsonl and runs/ for SB_VAULT_CANARY. The scheduler item drives `harness schedule add` through the real CLI and a harnessd loop with the T-08 Clock seam and a fake Launcher in place of claude (rule 1)."
    why: "echo needs core and core-pg, and harness is the only crate above both; an example keeps a test tool out of the installed bins, and going through stdio exercises the wrapper on the path production uses instead of calling dispatch in-process like accept_t07."
  - id: D-123
    text: "T-07 round 3 (H-6, H-1.3, H-1.4, I-2; refines D-119). (1) FileAsker publishes asks/<n>.json whole: the card is written to a temp file in asks/ and hard-linked to <n>.json (atomic, no-clobber); AlreadyExists moves on to n+1, so several processes on one run still never share an n; a failed write leaves no card and no temp file. Where hard links are unavailable, create_new takes the name and one rename replaces the empty placeholder with the full temp file (a reader sees empty or whole, never partial). (2) ask::answer refuses with ErrorKind::InvalidData, and writes nothing, when asks/<n>.json is not a complete JSON object. (3) The asker claims <n>.answer (as timeout) on every path where it stops waiting: its timer; a dropped ask future (an OpenAsk guard closes the ask inline in Drop, so it is closed before the wrapper cap reports TimeoutSkip); a card that landed after the future was dropped (the guard rides the oneshot from the card-writing thread and closes the ask when the send fails or the channel is dropped); and, when the temp-file claim fails for an I/O reason, a bare create_new of an empty answer. If even that fails the ask is TimeoutSkip, never TimeoutProceed. (4) A mid-call card with site None is checked by Gate::check against the enclosing call's classified domain (CallInfo.domain, scrubbed); a card with its own site keeps it. (5) Stop reasons (gate stops and a handler's stopped output) go through clean_line (scrub, clean_card, scrub) for why and element before the ledger, the returned stopped and the model's stop line (D-119 (7))."
    why: "review-T-07 round 2: a card claimed with create_new and written afterwards was read empty or partial in 15 of 40 stress runs and left an empty card that ask::answer accepted when the write failed; an ask abandoned by the cap left <n>.answer open, so a late harness ask reported success for an answer nobody read; a handler that built a card without a site skipped the call's own domain stop and strict rules (rule 4); a handler stop line carried ESC and CRLF into the ledger and the model text."
  - id: D-125
    text: "Refines D-115 (T-03, T-04 MemStore; M-3): the trigram tier's cut-off is word_similarity >= 0.5, not pg_trgm's default 0.6. PgStore sets pg_trgm.word_similarity_threshold = 0.5 on every pooled connection (after_connect), so `subject %> $1` keeps using the trigram index; MemStore's port uses the same 0.5. Ranking is unchanged (score order, tier breaks ties)."
    why: "D-115's own example ('Vasnth' inside 'Vasanth Raghavan') scores exactly 0.5 on the server, so the default threshold made the decision's stated purpose fail (accept-T-03 round 3). One step lower admits that typo class; search() results are ranked and capped, so the extra low-score hits cost little."
  - id: D-126
    text: "Refines D-120 (1) and B-190 (T-04; H-1.2): gate::rule_domain maps a domain with the idna crate (UTS-46 nontransitional processing, idna 1.x, already in Cargo.lock) instead of the hand-written subset, then stores the A-label form; a domain idna refuses is refused (RuleError), never stored. So every stored key is what a browser's URL host carries (ſ -> s, ĳ -> ij, modifier letters, final sigma -> σ, U+1E9E -> ss, compatibility ideographs and jamo)."
    why: "Three review and accept rounds each found another character class the subset missed, and every miss is a silent dead user rule (D-110 (1)). The standard mapping in a crate the workspace already builds ends the class of bugs; B-190 allowed taking it."
  - id: D-124
    text: "T-08 round 2 (H-2, H-5, H-7; refines D-116 (7), takes the B-192 default). (1) `harness` installs the vault (Vault::open + install_global) at the top of execute for every command except `vault set`; when the vault cannot be opened the command fails before it prints or writes anything, and the error names entries only. `vault set` opens with Vault::open_for_set (repairs a file open refuses, D-118) and never installs that handle. (2) harnessd re-opens and installs the vault before every firing through Launcher::before_run (harness::daemon::ReopenVault); when that fails the firing ends with SchedError::BeforeRun and no folder, row or prompt is written. (3) A `claude -p` session is capped at SB_SESSION_CAP_SECS (default 3600 s, whole seconds above 0): past it the session is killed (taskkill /F /T on Windows, since claude.cmd runs under cmd.exe), the run gets the failed launch event and status failed; harnessd's shutdown drain is bounded by the same cap. Interactive `harness run` sessions are not capped. (4) answer.md keeps at most 1 MiB of stdout (the rest is read and dropped); 64 KiB more is read, the whole is scrubbed, and that slack is dropped from the end, so a vault value cut by the cap is never written in part; a cut answer ends with an `[answer cut: kept N of M bytes]` note. (5) Every ClaudeLauncher session gets `--disallowedTools 'Bash(harness ask:*)' 'Bash(harness gate:*)' 'Bash(harness vault:*)'` as separate arguments after `-p` (scheduled) or after the prompt (interactive), because the option's list is variadic and would swallow a trailing prompt."
    why: "Without an installed vault scrub() is the identity, so the CLI printed schedule prompts and tool whys raw (review-T-08 blocking); open_for_set is the only exit from the D-118 refusal loop. A per-firing reopen is deterministic where a file watcher races the next firing. A hung session held its schedule in running forever and blocked shutdown; cutting stdout before scrubbing could leave a value prefix behind. The denied commands keep asks, gate rules and vault entries user-only (rule 4, B-192)."
  - id: D-127
    text: "T-07 round 4 (H-6, H-1.4, I-2; refines D-119, D-121 (4); review-T-07 Notes carried since round 1). (1) ToolRegistry never lowers a name's class (rule 4): every name keeps a floor, the highest class it was ever registered with in this registry (shared by clones, kept after remove); add and new register max(floor, spec.class), and the new handler, description and schema replace the old ones. Keep-max, not refuse: add returns () in I-2, so a refusal would be silent or need a signature change, and a repaired or re-forged site tool must still be able to replace its handler. (2) One core stop per stopped call: while the handler runs, a stop that ToolCtx::ask hits (a Challenge card or a gate Stop) is held, not written, and only the call's first one is kept (a later one goes to stderr). When the handler returns stopped the wrapper writes the tool event (mode stop, the handler's why) and then one trailing core stop carrying the held stop (its element filled from the handler's when it has none), or the handler's stop when nothing was held. When the call did not return stopped (went on, failed, panicked) the held stop is written right before the tool event. An ask from classify writes its stop at once. Accepted gap: a process that dies inside the handler after a mid-call stop loses that line; nothing ran on its behalf (the ask returned TimeoutSkip). (3) serve_io reads at most MAX_LINE_BYTES = 8 MiB per incoming line (the newline not counted). A longer line is not buffered: past the cap its bytes are consumed and dropped up to the next newline or EOF, the reply is error -32600 with id null, and the server keeps reading. -32600, not -32700: the line was never parsed, so the server cannot say it is not JSON, only that it will not take it as a request; the id is unknown, so it is null as JSON-RPC 2.0 requires."
    why: "A forge or repair that re-registered Pay as Read lowered the gate class, which rule 4 forbids, and remove-then-add was the same hole. Writing the mid-call stop at once and skipping the trailing one would make ledger::report take the next call's core stop of the same (tool, args) as this call's trailing stop, so a resumed run stopped again by the gate would lose its listing; holding the stop keeps the documented shape (tool stop event, then its trailing core stop) that D-121 (4) groups exactly. read_until grew its buffer without bound on a line with no newline; 8 MiB is far above any tool call's arguments."
  - id: D-140
    text: "T-16 watch and run preamble defaults (H-5 watch, M-1(5), M-3 baselines, B-563; plan defaults 1-5 and 10; code crates/core/src/watch.rs, sched.rs). (1) A watch firing hashes runs/<id>/files/watch.txt, which the session writes: whitespace runs collapse to one space and the ends are trimmed, the text is scrubbed against the vault, then sha256 (hex) is compared with memory.baselines[watch_target] (schedule-<id> when the row has no target). (2) The first observation sets the baseline silently: no notification. (3) No watch.txt, or one that is empty after normalising, is an ok:false core watch.check event, no notification, baseline untouched; a session that failed (launch error, non-zero exit) or a run the ledger says stopped is not checked either (ok:false watch.check 'not checked: ...'). (4) A change notifies once: runs/<id>/files/notification.md, one line appended to <runs_root>/notifications.md, one stderr line (harnessd's terminal), a core watch.notify event; then the new baseline is stored. No mail in Phase 1. report.md ends with a 'Watch: <target>: ...' line (first observation / no change / changed, notified (<path>) / no state / not checked). Every string written to the notification files, the ledger and the baseline is scrubbed (rule 2). (5) H-5's 'compare output shape' is deferred: the ledger stores only result_summary. (10) B-563: harness_core::sched::run_preamble (run id, absolute files/ path, 'cite only what tools returned in this run'; for watch runs where to write watch.txt) goes before the task only in a `claude -p` session's stdin (ClaudeLauncher), separated by one blank line; prompt.md, runs.prompt and LaunchRequest.prompt stay the task; interactive `harness run` gets no preamble (argv through the claude.cmd shim cannot carry newlines); B-563's second half is not adopted."
    why: "A session-written file is the one state the harness can hash without reading raw HTML (rule 5); silent first runs and untrusted failed or stopped runs keep 'notify once' from firing on noise, and keeping the preamble out of LaunchRequest.prompt leaves prompt.md as the task and every test launcher unchanged."
  - id: D-315
    text: "B-33 (3), T-3/T-7: ToolStore gains async scan_live(store, domain, path) -> Result<LoadReport, StoreError> and load_live(store, domain, path) -> Result<Vec<Tool>, StoreError>. They read tools.health for the site folder and _generic first and skip every tool whose row is retired even when its file is still in place (a retire whose archive step failed); a skipped file goes to LoadReport.skipped with why `retired (v<N>)`, and a retired site tool no longer shadows a _generic tool of the same name. A memory error returns Err, never an unfiltered list. The sync load/scan keep their I-7 signatures (D-90 freeze), do not consult tools.health, and say so in their docs; every runtime caller (srv-web, sb-mcp, toolforge) uses load_live. Proposed to I-7 as IC-305."
    why: "A retired tool is retired because it misbehaved or went stale; serving it because a rename failed would let a file-system hiccup undo a T-7 decision. The row is the source of truth (retire persists it before the move), and load cannot reach MemoryStore without a signature change, so the filter is a new async entry point; a file-system tombstone would fail in the same situations the archive move fails."
  - id: D-316
    text: "B-33 (1), T-7/D-303: when retire's archive step fails, retire still writes an ok:true tools.retire event for the row it already saved (consequences archived: null, archive_failed: <path>), then an ok:false tools.archive event naming the error; it no longer returns that file error. So record() returns Ok with the row retired, and sweep reports SweepAction::Retired { archived: None } for it. The next sweep archives the file with an ok:true tools.archive event. Memory errors still return."
    why: "The ledger is the audit trail of what the harness decided: the retire happened (the row says retired), only the file move failed and will be retried, so the failure belongs to tools.archive. An ok:false tools.retire contradicted the row and left the ledger with no retire event at all."
  - id: D-229
    text: "T-10 acceptance round 6 (W-5b, H-2, extends D-218 and D-226 (3) to the body): a block's rendered text is also checked against every password value with each `[text](#id)` link form reduced to its text, the way a markdown renderer shows it. On a hit, every span that contributes characters to a hit is rendered as `***` (a link span keeps no link form), and the result is checked again until no hit is left. The literal and escaped scrubs of D-218 stay as they are. Done per unit before chunking, so cut points and budgets see the scrubbed text."
    why: "A value split between plain text ending in `(` and a link's text, or a link's text and a following `.`, gets no space between them (needs_space), so the body read as text showed the whole value although no output string held it in one piece; the outline already reduced links before scrubbing. Blanking the contributing spans is simpler and safer than locating the value inside link syntax, and costs only text that already carried part of a password."
  - id: D-230
    text: "Clarifies D-229, resolves B-203: on a hit across a link form, a contributing link span renders as `***` whole (link form included); a contributing plain span hides only the characters it contributes, one `***` per run. Every character of the value is hidden either way and the line is re-checked until no hit is left. Implemented in c550253."
    why: "Blanking a whole plain span removed heading text that held no part of the value (the D-227 label test lost `## Golf`), costing navigation for no gain: a plain span has no link syntax, so the reason to blank a link span whole does not apply."
  - id: D-231
    text: "T-10 review round 7 blocking (W-5, H-2, extends D-229): the joined-value check also reads each line with the escape backslashes the renderer inserted (the backslash before a table-cell pipe, D-218's escapes) dropped, the way a markdown renderer shows them, so a value holding a `|` that crosses a table cell boundary (`x | y|z` in cells `x` and `y|z`) is hidden like any other joined value (D-230 rules for which characters hide). The check is skipped entirely when the reader holds no password value, and secrets that cannot occur in the line are filtered out before the tagged readings are built."
    why: "The inserted backslash was tagged Shows::Always, so no reading dropped it, and D-218's escaped spellings escape every `|` in a value or none, never the mixed spelling a cross-cell value gets; the value showed at every budget. The skip and prefilter take back most of the 2x slowdown c550253 added to reads with no password."
  - id: D-540
    text: "T-15 C-1 gh classification fails closed (H-1, rule 4). Read: run list|view [--log|--log-failed], pr view|list|diff|checks|status, issue view|list|status, repo view, workflow list|view, search <kind>, status, and api with GET or HEAD and no field flag; --web or -w on any of them raises it to Navigate. For api every token is scanned: any -X/--method other than GET/HEAD is Account (DELETE is Delete), and any -f/-F/--field/--raw-field/--input makes it Account even with -X GET. `<group> delete` is Delete. gh auth is refused with ToolError::Args. Everything else (pr merge, release with any subcommand, workflow run, run rerun/cancel, secret, alias, extensions, unknown commands) is Account. Programs run as argument vectors, never a shell; shell syntax outside quotes is refused. run view <id> --log (or --log-failed) saves the whole log, scrubbed with harness_core::vault::scrub, as runs/<run>/files/gh-run-<id>[-job-<j>].log and returns only the first failing step: the step of the first ##[error] line, its error-looking lines (at most 20) and, when there are at most 2, up to 10 lines before the error."
    why: "docs/04 names a few reads and writes, but gh has hundreds of commands plus extensions, so a read allowlist with everything else asking is the only reading that cannot let a write through as Read. gh auth token prints a credential the vault does not know, so scrub cannot catch it. Every api token is scanned because a flag value (-H -XGET) could otherwise hide the real method. The full log is a deliverable on disk; the model gets the failing step, which is what the acceptance asks for."
  - id: D-541
    text: "T-15 C-2 and C-3 DNS and HTTP (H-1, H-2). dns(name, type) uses hickory-resolver 0.26 with the system resolver config (TokioResolver::builder_tokio), the name made absolute (one query), types A, AAAA, MX, TXT, CNAME, NS only, IDN names as A-labels. cloudflare(path, method?, body?) and flags(provider, env, method?, path?, body?) share one HTTP sink: the header value template (Bearer @vault(cf_token) for Cloudflare, the provider's auth for flags) is resolved inside ToolCtx::resolve_into straight into a sensitive reqwest HeaderValue through a zeroized buffer; redirects are never followed; a path must start with / and stay under the configured base (no scheme, .., @, #, backslash, whitespace); a body containing @vault( is refused. GET and HEAD are Read, POST, PUT and PATCH Account, DELETE Delete, any other method refused. A non-2xx reply is a ToolError. Gate domain: cloudflare.com for Cloudflare, the provider's domain or its api host for flags. reqwest 0.12 with native-tls only (already in Cargo.lock)."
    why: "One sink keeps the vault value in exactly one place; no redirects means the header is never forwarded to another host; refusing @vault in bodies keeps the rule that values are resolved only at the header write. hickory avoids depending on dig, which Windows does not have. DNS and flag writes are production config, which H-1 names as Account."
  - id: D-542
    text: "T-15 round 2 (C-1..C-4, extends D-540 and D-541). gh: the whole `gh config` group is refused with ToolError::Args, like `gh auth`. Single-dash flag clusters are read letter by letter the way pflag reads them: for api, i/h are boolean, X/f/F/H/p/q/t take a value (the rest of the token or the next token), X sets the method, f/F make it Account, and any other letter or unknown long flag is Account; for every command a `w` anywhere in a single-dash cluster (-cw) is --web and raises the call to Navigate. A gh api endpoint that contains :// or starts with // is refused unless it is https to api.github.com or to a GHE host in SB_GH_HOSTS (no userinfo); --hostname must be github.com or a GHE host; that host becomes the gate domain (default github.com). Values of known value-taking flags (-f body=https://...) are not endpoints. cli deny_flags: a denied short letter anywhere in a single-dash cluster is a hit (dig -4f). HTTP sinks: an API base that gets a @vault header (SB_CLOUDFLARE_API, flags api) must be https, plain http only to a loopback host (127.0.0.0/8, ::1, localhost); a path must stay under the base at a segment boundary; a reply body that is not application/json, application/*+json or text/plain is replaced by its status and content type."
    why: "gh config get oauth_token and gh config list print the same credential gh auth token does, which the vault cannot scrub (D-540's reason). pflag accepts clustered short flags, so -iXPOST ran a POST as Read; reading the cluster like gh does, and failing closed on what is not known, closes that. A full-URL api endpoint was an ungated raw page fetch labelled github.com (rules 4 and 5). Short-flag clustering also bypassed cli deny_flags. A vault credential over plain http can be read on the wire or by an http proxy. An HTML error page from a WAF or proxy is raw HTML (rule 5)."
  - id: D-600
    text: "sb-cdp is our own CDP client (B-3), not chromiumoxide: one writer task, one reader task, a reply map by id, flattened sessions, a per-session event broadcast and a 10 s command timeout (B-4 #11) live in sb_cdp::Cdp over Arc<dyn Transport>. On Windows Pipe launches Chromium with CreateProcessW and the CRT lpReserved2 block (fd 3 = Chromium reads, fd 4 = Chromium writes), the same mechanism libuv and Playwright use; anonymous pipes have no overlapped I/O, so one blocking OS thread per direction bridges to tokio channels. On Unix the pipes are dup2'd to fds 3 and 4. Messages are NUL-terminated JSON both ways."
    why: "--remote-debugging-pipe reads inherited CRT fds 3/4 and std::process cannot pass them on Windows; chromiumoxide is WebSocket-first and would hide the transport the spec puts behind a trait. A thread per direction is the only correct async bridge for anonymous pipes."
  - id: D-601
    text: "D-34 pin: Chrome for Testing 156.0.8078.4 (Chromium revision 1706539, listed in known-good-versions.json), the build Playwright ships as chromium-1248. Chromium is resolved as LaunchOpts.chromium, else env SB_CHROMIUM, else <SB_HOME or cwd>/chromium/156.0.8078.4/chrome-<platform>/chrome(.exe); missing -> DriverError naming SB_CHROMIUM. First-run download is follow-up T-18b. Profiles live in <SB_HOME or cwd>/profiles/: `me` is persistent at profiles/me and refuses headless; `bench` is a fresh temp dir profiles/bench-* removed when the driver drops. Launch flags are exactly --remote-debugging-pipe, --user-data-dir, --no-first-run, --no-default-browser-check, --headless=new only for bench when asked, and about:blank; no stealth, UA or fingerprint flags (D-5)."
    why: "One exact build keeps CDP behaviour reproducible (D-34) and the local Playwright copy lets tests run without a download; the downloader needs an HTTP and unzip path that does not block the transport work, so it ships as its own PR under D-91. profiles/ is already git-ignored."
  - id: D-602
    text: "Pipe launch handle inheritance on Windows (T-18, B-3, B-4 #11; refines D-600). sb_cdp::Pipe::launch makes the two pipe ends and NUL inheritable only around its own CreateProcessW, closes its copies right after it, limits its child with PROC_THREAD_ATTRIBUTE_HANDLE_LIST, and serializes Pipe launches with a crate-private lock. Accepted limit: a CreateProcess on another thread of the same process during that window with bInheritHandles=TRUE and no handle list (every std::process::Command spawn; std's own CREATE_PROCESS_LOCK is private) can still inherit the pipe ends. That child then holds the pipe open, so the client sees end-of-file (and closes) only when both the browser and that child have exited; browser processes are still killed by the Job. Consumers that spawn long-lived children while a browser launches (sb-mcp, toolstore, harness) should spawn them before or after Driver::launch, not concurrently; short-lived ones (git) only delay the close until they exit. If that ever bites, the fix is one process-wide spawn lock in a crate below both, which every in-repo spawner takes."
    why: "review-T-18 should-fix 1: the old comment claimed the handle list protects against concurrent spawns, which it does not. Win32 has no per-spawn inheritance for CreateProcess calls we do not control, and stable std offers no hook to pass a handle list to Command, so the window can be shrunk and our own launches serialized, not closed."
  - id: D-500
    text: "srv-web api (W-3) classes by HTTP method: GET and HEAD are Read, POST, PUT and PATCH are Submit, DELETE is Delete; any other method is refused. The classifier fills the registrable domain (toolstore::registrable) so gate.rules apply per site. @vault(k) is accepted only inside header values (resolved by ctx.resolve_into into a sensitive HeaderValue built in the sink), refused in the URL and body; redirects are followed only within the same host; errors are srv-web's own text naming the host only."
    why: "Docs/04 gives api no class; a write method is a side effect and rule 4 needs it classified. Headers are the only place a credential belongs, and URLs and bodies are logged and echoed by servers; reqwest's error text carries the full URL."
  - id: D-501
    text: "Site tools in srv-web (W-7) get page.api as a GET-only, JSON-only fetch limited to hosts under the fetched page's registrable domain, with same-host redirects only, no caller headers, the 5 MB cap, and the run's remaining wall time (D-64). It does not re-dispatch through the api tool: the site tool call itself is the gated call (class max(@gate, Read), domain = the page's registrable domain)."
    why: "D-53 says page.api goes through the gate as Read; a nested dispatch would log a second call per api use and cannot run inside the synchronous runner. Pinning the domain keeps the gated call's domain truthful, and no headers means no vault value can reach a tool-chosen URL."
  - id: D-502
    text: "fetch(url=\"#12\") follows the href of link #12 on the last fetched page (srv-web keeps an id -> absolute http(s) URL map per page; IndexRow has no href field). A non-link id is an argument error. The resolved URL is what classify and the ledger see."
    why: "The read output shows links as [text](#id); without this the model must copy URLs it never sees, which costs a turn per link (efficiency first)."
  - id: D-503
    text: "srv-web fetch details (W-2, W-5, W-6): no cursor and no region always refetches and returns the skeleton (with the T-3 site-tools line), the first read chunk (4000 tokens) and a `cursor:` line; cursor or region re-read the cached page (last 16 pages per process) without a request and without the skeleton; max_tokens is per call, so a capped read passes it again with each cursor. find(q, url?, k=3, 1..10) scores the cached index with sb_sheet::find. Untrusted page text is escaped in the walk until sheet's B-32 item 1 lands: [ ] become ( ) in prose spans, three backticks become ''' everywhere (code blocks keep their brackets), and a line starting with remaining:, truncated:, cursor:, tools for this site:, stopped:, skipped: or `chunk N` gets the word quoted. Permalink anchors (a fragment link whose text has no letter or digit, rustdoc's §, Sphinx's ¶) keep their row but add no text."
    why: "A cursor read that refetched would cost a request and could see a changed page; the escapes stop a page from forging links, fences, outlines or site-tool lines; permalink anchors put [§](#n) into every heading and outline entry of rustdoc and Sphinx pages."
  - id: D-504
    text: "SearXNG for W-1 (D-31) runs as compose service `searxng`, profile `search`, image pinned by digest (searxng/searxng@sha256:23482d8e..., the latest of 2026-10-25, verified with the live tests), 127.0.0.1:8888 -> 8080, network `search` only, config/searxng/settings.yml (use_default_settings, JSON and HTML formats, limiter off, no image proxy), secret from the git-ignored config/searxng/secret.env (SEARXNG_SECRET), generated locally by the command in docker-compose.yml."
    why: "D-31 left the image and settings to T-12. A digest pin is reproducible where `latest` is not; the limiter needs Valkey and throttles a single local client; the secret never enters git (D-1)."
  - id: D-505
    text: "T-4 in srv-web (W-7): a site tool whose @fingerprint is `partial` on the fetched page runs and its output ends with `note: fingerprint partial, missing ...`; it is not relocated. `match` runs, `miss` refuses (D-506)."
    why: "Relocation (T-4) patches the tool file and must verify the patched selectors on a live page that can act, which is the browser path's job (Phase 2); srv-web only reads a static index, so it cannot verify a relocation, and refusing a mostly-matching reader would cost a turn for a read that is likely right. The note tells the model the result may be partial."
  - id: D-506
    text: "srv-web site tool registration honours tool health (T-4, T-7): on each fetch, a tool whose tools.health row is retired or needs_repair is not registered (and is removed from the registry if an earlier fetch added it); when the health rows cannot be read no site tool is registered (fail closed). A fingerprint miss records FingerprintMiss (needs_repair), removes the tool from the registry and disables it for the rest of the server process, which is one run, even if its health row is reset; a disabled tool still called is refused."
    why: "T-4 says a miss disables the tool for this run; registering from the file scan alone announced and ran tools the store had already marked broken or retired (review-T-12 round 1)."
  - id: D-507
    text: "srv-web round 2 guards (W-2, W-3, rules 2, 4, 5). (1) Classify-to-call pinning: fetch(url=\"#id\") and site tools resolve their target (URL, cached page) in classify and pin it keyed by the call's ToolCtx address plus the args; call takes exactly that pin and refuses ('the page changed since the call was checked; call again') when it is missing. dispatch hands one ToolCtx to classify and call, so the address names one in-flight call. (2) fetch, feed and search follow redirects by hand (page client Policy::none, 10 hops, bounded by the 15 s timeout); a hop into 127/8, 10/8, 172.16/12, 192.168/16, 169.254/16, 0/8, ::1, fc00::/7, fe80::/10 or localhost is refused unless the start URL was itself such a host. Names are resolved per hop; a name in Config.resolve (test DNS overrides) counts as public, a failed lookup counts as public. (3) api: @vault headers only over https or to loopback (127/8, ::1, localhost, or a Config.resolve override whose address is loopback); with a vault header redirects keep scheme, host and port, without one the same host and never https->http. (4) HTML is sniffed from the first bytes (after BOM, whitespace, comments, <?xml?>) whatever the content type: fetch walks it, api refuses it, feed calls it not-a-feed."
    why: "review-T-12 round 1: the last page could change between classify and call (serve_io runs calls concurrently), so call could act on a domain the gate never saw; a public page could redirect the reader into the user's own network; reqwest strips Authorization only on a host change and never a custom header; servers label HTML text/plain. Overrides stand for the public sites they name in tests (production has none), while for the cleartext check what matters is where the bytes go."
  - id: D-508
    text: "srv-web rule 5 fails closed by construction (W-2, W-3, W-4; supersedes D-507 (4) and the per-hop lookup of D-507 (2); sub-orchestrator decision, review-T-12 round 2). Nothing recognises HTML any more (http::looks_like_html is gone); every decision runs on the decoded body (http::decode: BOM first, then charset, then meta charset for non-text/plain, then UTF-8). (1) fetch: a JSON type (application/json, text/json, +json) points to api, a feed type (xml/rss/calendar, not XHTML or SVG) to feed, image/audio/video/font/pdf/archives and decoded text that looks binary are refused; every other body (HTML, text/plain, none, unknown) goes through the HTML walk (text/html and XHTML as a document, anything else via html::parse_text, which puts a <p> at each blank line so plain text keeps its paragraphs). The model only sees sb-sheet output built from the walk's text blocks; the plain-text passthrough (html::plain_text) is removed. The walk never emits raw-text or RCDATA content that can hold markup: xmp, plaintext, noembed, noframes join SKIP_TAGS (script, style, noscript, iframe already), and title and textarea text with a tag-like sequence is re-walked as a fragment. (2) api shows a body only as JSON (a JSON type or no type, decoded text parses, an XSSI )]}' line stripped; JSON strings may hold HTML, which is data) or as text/plain whose decoded text has no tag-like sequence (http::has_tag: '<' then an ASCII letter, '!', '/' or '?'). Anything else is one Ok line `HTTP <status> <type>, <n> bytes, not shown (not JSON or plain text; use fetch to read pages)`; only such a body is walked for a challenge (D-5). (3) feed: a body that does not parse as a feed is never echoed; the iCal sniff runs on decoded text (UTF-16 calendars parse); every iCal text field (SUMMARY, DESCRIPTION, LOCATION, X-WR-CALNAME) goes through html::fragment_text. (4) Private-address guard: the page client has a filtering DNS resolver (http::PublicOnly, reqwest::dns::Resolve) that resolves once and hands the connector only public addresses, refusing a name whose every answer is loopback, private (10/8, 172.16/12, 192.168/16), link-local, 0/8, CGNAT 100.64/10, 198.18/15, ::1, fc00::/7, fe80::/10 or an IPv4-mapped/-compatible form of those; literal private hosts and localhost/*.localhost hops are refused before any request. A request may reach a private address only when the user wrote one (http::written_private: a private IP literal or exactly localhost): fetch and feed of such a URL, and fetch(\"#id\") when the page holding the link was fetched from such a URL; those use the unfiltered page_local client, as does search (the SearXNG URL is operator config, D-31). Config.resolve overrides are answered before the resolver and count as public. A name that resolves to a private address (intranet, nas.local) is refused even when typed: write its IP. (5) api's @vault over plain http: loopback IP literals, exactly localhost, or a Config.resolve override whose address is loopback; *.localhost names no longer count. (6) http::get_page bounds redirects and body read with one cfg.timeout deadline (15 s, W-2). (7) D-506 fail closed: when tool health cannot be read, the page's site tools an earlier fetch registered are removed before returning."
    why: "Round 2 showed a sniffer keeps leaking (UTF-16, unclosed comments, text before the doctype, odd doctype spacing, fragments with unlisted tags): every new spelling is a bypass. Parsing everything and keeping only text nodes needs no list of spellings, and api only lets through what is known to be data (JSON) or provably tag-free text. Resolving once inside the connector closes the check-then-connect rebinding race and the name-pointing-at-127.0.0.1 and #id-to-loopback cases without an extra lookup; *.localhost can go to DNS on Windows; a fresh reqwest timeout per hop let redirects plus body exceed 15 s."
  - id: D-520
    text: "T-14 srv-files classes (F-1, F-2, H-1, rule 4). (1) Paths: relative paths resolve against the folder that holds runs/ (the runs root's parent); every path is resolved the way the OS will (Win32 normalisation from the plain spelling, every existing component canonicalised, so `..`, symlinks, junctions, 8.3 names, trailing dots and other case all land on the real target); `\\\\?\\` and `\\\\.\\` paths and alternate data streams are refused. (2) Scratch is strictly inside runs/ minus run bookkeeping: the runs root, a run folder itself, and a run's asks/, ledger.jsonl, report.md, prompt.md count as outside (writing asks/<n>.answer would answer the run's own pending ask from a parallel call; the rest is the evidence). (3) fs.*: reads Read; write, move, mkdir, delete declared Fill; raised to Delete when they delete, replace or touch bookkeeping outside scratch, and a move from outside runs/ into it is Delete (from there it could be deleted without asking). (4) shell: declared Read; class derived from a bash-subset parse of the whole line (`;` `&&` `||` `|` `&`, subshells, `$(..)`, backticks, process substitution, redirections, here-docs, bash -c, eval, xargs, find -exec, env/nice/timeout wrappers), max over every part. Changes whose every target is scratch stay Read (docs/04: `rm -rf runs/x` is Read-class-safe); creating or appending outside runs/ is Fill; curl/wget sending data is Submit (HTTP DELETE is Delete); git push, gh writes, cargo/npm publish and git config writes are Account; deleting, replacing or moving away outside scratch, discarding git work and rewriting remote history are Delete; local git, cargo build/test/fmt/run and npm test/run/install are Fill (the project's own code). (5) Fail closed to Delete: an unknown command (python, node, make, scripts), a target decided at run time ($x, ~, {a,b}, xargs input), a relative target after a cd the parser cannot follow (a cd replaces the folder only when everything after it is joined by && with no subshell or pipe; otherwise both folders must be safe), a variable that makes later commands run programs (PAGER, LESSOPEN, GIT_SSH_COMMAND, LD_*, PATH...), and anything it cannot parse. (6) Every call reclassifies before acting and refuses if the class rose above the approved one."
    why: "Delete is the highest class a user can approve that also times out to skip (H-1.3), so an unrecognised side effect never runs unattended, and resolving paths as the OS does is the only way `runs/../x`, junctions and Windows aliases cannot pass as scratch."
  - id: D-521
    text: "T-14 shell and helper processes (F-2, F-3, rule 6). Each child is started suspended inside its own Windows Job Object (resumed after it joins) or its own Unix process group, and the whole job or group is killed at the timeout and again when the call returns, so background jobs (`cmd &`) end with the call. Output pipes are drained with a 2 s cap after exit. Shell output is capped at 20 000 chars for the model (first 4 000 and last 16 000); when cut, the whole output, scrubbed with harness_core::scrub, is saved as runs/<run>/files/shell-<utc>.log and its path is in the text; the raw stream only ever goes to a temp file outside runs/."
    why: "Git Bash starts pipeline stages and background commands as processes whose Windows parent is not bash, so taskkill /T left `sleep 60 | cat` running and its open pipe held a reader thread for 60 s; a job holds every process created inside it."
  - id: D-522
    text: "T-14 document wrappers (F-3). The installed skills ship no create/read entry-point scripts for these ops, so srv-files runs their documented recipes in one embedded helper (docs_ops.py via `python -c`, request as JSON on stdin, PYTHONSAFEPATH=1, empty temp cwd): pypdf for pdf.read, reportlab platypus for pdf.write and md.to_pdf, openpyxl for xlsx.read/xlsx.write (then the xlsx skill's own scripts/recalc.py when formulas were written), python-pptx for pptx.write; docx.read and docx.write call pandoc as the docx skill documents. SB_PYTHON, SB_PANDOC and SB_SKILLS_DIR override discovery (PATH, skipping the WindowsApps python stub; the Claude Code synced skills folder). A missing program or package is a ToolError naming it and the pip or install step. Written files default to runs/<run>/files/; an `out` outside runs/ that exists is Delete."
    why: "Shelling out to the skills' own libraries keeps one implementation of each format (docs/04 says do not reimplement), and a named missing dependency costs the model one turn instead of a guess."
  - id: D-523
    text: "T-14 round 2 (review-T-14 B1-B9, S1-S10; sub-orchestrator direction). (1) The shell classifier fails closed by construction: a line is below Delete only if every simple command in it, substitutions included, is an allowlisted program or builtin used with only its listed flags (unknown flags and long-option abbreviations are Delete), and every path it replaces or deletes is a literal path that resolves inside runs/; creating or appending to a literal path outside runs/ stays Fill as in D-520 (4). A run-time word ($x, $(..), a glob that could match -name, a brace) where it could become an option or a target is Delete. (2) Delete wherever it appears: arithmetic ($((..)), ((..)), $[..]), a [..] holding $( or a backtick (even quoted), ${..} beyond a plain name with a default/alternative/length/pattern operator, function definitions, unquoted here-documents with $( ` $[ ${, the builtins let declare typeset local readonly export printf -v read mapfile readarray unset test -v [[ -v ]] eval exec source . trap alias function history enable builtin command env nohup time coproc, xargs, find -exec/-execdir/-ok/-okdir/-delete/-fprint*, bash/sh/zsh/pwsh/cmd, ln, mklink, cp -l/-s/--link/--symbolic-link, rsync, a program run by path, [[ -eq ]] on non-literals, every git global option except -C/--no-pager (so all git -c), git --upload-pack/--receive-pack/--exec/--template/--config/-u, switch -f/--discard-changes/-C, checkout -f/--/-B, reset --hard, clean, stash drop/clear, commit without -m (editor). Prefix assignments are allowed only for formatting variables (LANG, LC_*, TZ, COLUMNS, NO_COLOR, RUST_LOG...); standalone ones only for lowercase names. (3) D-520 (4) narrowed (S2, B-521): cargo, npm/pnpm/yarn/bun, node, python, pip, make, go, docker and other build tools run the project's code (build.rs, package scripts, hooks) and are Delete; only `--version` (and `go/cargo/docker version`) is Read. (4) Links (B7): a file with more than one hard link (GetFileInformationByHandle nNumberOfLinks / st_nlink, unreadable count = linked) is outside runs/ for fs.write, fs.delete, fs.move and every shell target; when a line also extracts, clones or copies a tree (cp -r/-a/-P, tar -x, unzip, git checkout/clone/..., gh clone/download), every other runs/ target in it is Delete because a link may be planted before it runs. (5) No cmd.exe (B9): without bash on Windows a line runs only if it is one allowlisted command of plain words (no quotes, $, globs, %, ^, separators, redirections), as argv through CreateProcess; anything else is refused with 'shell needs Git Bash ... set SB_BASH'. Bash runs with BASH_ENV, ENV, CDPATH, GLOBIGNORE, BASHOPTS, SHELLOPTS, PROMPT_COMMAND, PS4, IFS and BASH_FUNC_* removed. (6) S3 / B-520: fs.delete inside runs/ is Read, the class shell rm has there (the literal reading of docs/04 'Read-class-safe'); ledger::report lists both under Read. (7) S4: fs.move and shell mv of a source outside runs/ are Delete wherever it goes. (8) Writes (fs.write, docs out, every shell target, mv/cp destination) to anything inside a .git folder, .gitattributes, .gitmodules, .gitconfig, .curlrc/_curlrc or .wgetrc are Delete, in or out of runs/: allowlisted git, curl and wget run what these say (hooks, core.fsmonitor, textconv). gh runs only its built-in groups (pr issue repo run workflow release gist api browse search status label cache project ruleset org auth config help version): any other first word is an alias or extension and is Delete; gh auth token and gh config set are Delete. (9) The per-call reclassify-before-acting check (D-520 (6)) is unchanged."
    why: "Round 1 showed nine deny-list holes, each a confirmed delete outside runs/ classed Read or Fill; with an allowlist an unlisted construct asks (and times out to skip) instead of running, so the next hole costs a turn, not a file."
  - id: D-524
    text: "T-14 review round 2 (rule 4; refines D-523 (8)). paths::runs_code_on_use marks a write Delete wherever it is when it can make a program run code later: any dotfile (.bashrc, .profile, .zshrc, .npmrc, .netrc, .envrc, .gitconfig, ...) and _netrc/_curlrc; anything inside .git .cargo .config .ssh .husky .vscode .devcontainer .github .local; below the home folder anything inside a dot folder, AppData, the PowerShell profile folders or a Start Menu folder; and a file in a folder listed in PATH. It over-matches (a dotfile inside runs/ is Delete too) instead of listing each program's startup files."
    why: "Round 2 found ~/.config/git/config and ~/.config/git/attributes classed Fill, which auto-allows, after which a Read-class git call runs their programs; startup and rc files are the same class of hole. A broad match asks once where a narrow list leaks."
  - id: D-525
    text: "T-14 review closing round (rule 4; supersedes the details of D-524, keeps D-523). (1) One write check: util::write_verdict(roots, path) is the class of every named write, fs.write, fs.move destination (and a source inside a config location), fs.mkdir, docs out, csv.clean out, every shell target (redirections, tee, sed -i, touch, mkdir, truncate, sort -o, cp/mv destination, gzip/bzip2/xz output, tar -cf/zip archive, curl -o, wget -O and the URL-named wget file, git format-patch files); the shell and diff overflow copies in files/ are re-resolved and must pass it as scratch. (2) Trees whose file names are not known in advance go through util::tree_verdict(roots, dir): cp -r/-R/-a/-d/-P of anything but a regular file (SRC/. and -T copy into DST itself), mv or fs.move of a folder, link or missing source, tar -x, unzip, git clone, git worktree add, gh repo/gist clone, gh run/release download, curl -O, wget --content-disposition. Inside runs/ they are Read; outside runs/, bookkeeping, or a folder where config, startup files or programs live they are Delete. (3) git in a folder inside runs/ (cwd or -C, the runs root and bookkeeping included, or a .git file whose gitdir points into runs/, or a folder the classifier cannot follow) is Delete except clone, init, version and help; gh, which runs git in its folder, likewise except repo/gist clone, search, help and version. git add that can stage runs/ (a pathspec in or above runs/, -A with no pathspec, -f, --pathspec-from-file) is Delete unless the repository root .gitignore ignores runs/ with a plain line. A git command that updates a working tree whose root is the home folder or above it, or a config location, is Delete. In-place updates of an existing repository outside runs/ (checkout/switch of a branch, pull, merge, rebase, stash pop) keep their D-523 classes: they write the repository's own tracked paths, and git refuses .git paths in a tree. (4) The PATH folders are computed once: this server's PATH (a relative or empty entry taken against its own folder), its executable's folder, ~/bin, the Git folders next to the runner's bash, and the PATH that bash reports when started like the runner (--noprofile --norc, cleaned env), converted with cygpath -w -p. Entries are canonicalised (8.3 names, junctions) and compared with the drive. The runner strips relative and empty PATH entries before bash starts; if bash still reports one, every write is Delete. The runner also strips XDG_CONFIG_HOME, GIT_CONFIG*, GIT_DIR, GIT_WORK_TREE, GIT_COMMON_DIR, GIT_INDEX_FILE, GIT_OBJECT_DIRECTORY, GIT_ALTERNATE_OBJECT_DIRECTORIES, GIT_CEILING_DIRECTORIES, GIT_DISCOVERY_ACROSS_FILESYSTEM, GIT_EXEC_PATH, GIT_TEMPLATE_DIR, GIT_SSH*, GIT_EDITOR, GIT_SEQUENCE_EDITOR, GIT_PAGER, GIT_EXTERNAL_DIFF, GIT_ASKPASS, GIT_PROXY_COMMAND, SSH_ASKPASS, PAGER, EDITOR, VISUAL, BROWSER, GH_PAGER, GH_EDITOR, GH_BROWSER, CURL_HOME, WGETRC, NETRC; HOME is kept. (5) runs_code_on_use(roots, path) is narrowed: dotfile names anywhere; CODE_DIRS (.git .cargo .config .ssh .husky .vscode .devcontainer .github .local, Start Menu) anywhere outside the base folder and, inside it, only below the base; below a home folder (the profile folder and HOME) and outside a base that lies below it: a top-level dot folder (~/.x/...), AppData/Roaming, AppData/Local/Microsoft/WindowsApps, a Startup or Start Menu folder, Documents/WindowsPowerShell and Documents/PowerShell; a file in a PATH folder. AppData/Local (so the default %TEMP%) no longer counts."
    why: "The closing review found fs.move skipping the check, cp -r SRC/. and -T placing files the check never saw, an archive in runs/ planting .git/config that a Read-class git then ran, the PATH check reading the harness PATH instead of Git Bash's, and an AppData match that turned every write under the default %TEMP% into Delete; one helper per kind of write and the PATH bash really has close each without making scratch work ask."
  - id: D-560
    text: "Tool files that toolstore's record(Relocated) patches from srv-web (T-4, D-561) are never committed by srv-web. The patched file stays as a working-tree change under tools/<domain>/; the ledger has the core tools.relocate event and the tool's output says 'not committed (D-560)'. Reflect (T-16) commits it at the end of the run with ToolStore::git_commit and the run's task id; until T-16 lands, the agent or user that ran the task commits tools/<domain> with its task id."
    why: "I-7 says the caller commits with git_commit and a task id; srv-web has no task id, and a git commit inside a gated Read fetch would be a hidden side effect the gate never classified."
  - id: D-561
    text: "srv-web repairs a broken site tool on a fixed page (T-4, docs/03 acceptance 2; amends D-505 and D-506). On fetch, a tool whose row is needs_repair or that a miss disabled in this process is registered again when its fingerprint is not a miss on the fetched index (match, or partial and relocatable); retired tools stay unregistered and a miss is still refused, recorded as FingerprintMiss and disabled. Its next run there is a repair: on partial, toolstore::relocate gives the new fingerprint and a clean run records Relocated (@fingerprint patched, version + 1, status repaired, ledger tools.relocate), then the patched file is registered in place of the old one; on match a clean run records Ok (needs_repair -> repaired, version + 1, D-304). Either clean repair run enables the tool again in this process. A healthy tool's partial still runs with a note and is not patched (D-505). The seeded ashbyhq.com/list_jobs.js calls the posting API with the page's scheme (https in production, http when an offline test serves the board over http) and has no @fingerprint, so it always matches."
    why: "The acceptance needs needs_repair -> repaired at version 2 via relocate, which D-506 made unreachable (a needs_repair tool was never registered, so it could never run on a fixed page). A clean reader run on the fixed page is the verification D-505 said a static index lacks. The scheme rule lets the offline test run the exact seeded file without a TLS downgrade seam in srv-web."
  - id: D-590
    text: "srv-cli http (T-15b, cloudflare and flags, C-2, C-3): a request to a loopback base (127.0.0.0/8, ::1, localhost) uses its own reqwest client built with no_proxy() and localhost pinned to 127.0.0.1, so neither HTTP(S)_PROXY/ALL_PROXY nor the Windows proxy settings can carry it; every other base is https and keeps the system proxy, which then sees only a CONNECT tunnel."
    why: "secure_base lets a vault header travel over plain http only to loopback because the request never leaves the machine; through a proxy it would, in cleartext. Corporate users still need the proxy for the real https APIs, and TLS keeps the header from it."
  - id: D-591
    text: "srv-cli gh aliases (T-15b, C-1, rule 4). A gh call that is not on the read allowlist, api, auth, config or status may name a user alias, so the handler runs `gh alias list` (YAML map; plain, single- and double-quoted values read, anything else kept as unreadable) in classify and again in call, and plans the call: an alias (two-word names like `issue mine` first) is replaced by its expansion the way gh 2.x expands it ($N replaced in the string, else arguments appended, then split by argv::split), recursively up to 4 deep, and the expansion is classified and is what runs, never the alias. An alias of a refused command (auth, config, a non-GitHub host) is refused; of a delete Delete; of a read Read. Refused outright: shell aliases (`!` or --shell), unreadable values, too few arguments, a two-word alias with flags between its words, and any call needing the list when `gh alias list` fails or prints something unreadable. `gh alias set NAME EXPANSION` is max(Account, class of the command the expansion runs, $N read as plain words) and refused when that command would be refused, for a shell alias, for `-` (stdin) and for a flag other than --clobber. Cards and errors name an expansion by its first two words only."
    why: "`gh alias set tok 'auth token'` then `gh tok` printed a credential the scrubber does not know behind two Account asks; running the classified expansion ourselves also closes the window where the alias changes between the ask and the run."
  - id: D-592
    text: "Flag values are not flags or subcommands (T-15b, C-1, C-4; rule 4: no class goes down). cli: Program.value_flags (config/cli-allow.toml) lists short flags that take a value; a single-dash cluster is read left to right and ends at one of them, so `git log -Sconfig` is -S \"config\", not -c; any unlisted letter is read as a flag (stricter), each token is still checked on its own, and the shipped git and dig entries list only letters that take a value in every allowed subcommand. gh: the subcommand is the first word after the group and -R/--repo VALUE (`gh run -R o/r delete 5` is Delete, was Account); after any other flag the class is the highest any later word gives, never below Account. On read-allowlist commands short clusters use that command's gh 2.93 value letters for -w (`-Rw/x` and `run list -w ci.yml` are reads; `-cw` is still --web), and an R inside a cluster (`-cRHOST/o/r`) is a repo whose host must be github.com or SB_GH_HOSTS."
    why: "Reading every letter as a flag refused real reads and mis-marked browser opens, while taking the first token as the subcommand under-classed `run -R o/r delete`; gh 2.93 was checked to send `pr view -cR127.0.0.1:9/o/r 5` to that host, which the old -R prefix check missed."
  - id: D-593
    text: "srv-cli: HTML is not shown under a readable label (T-15b, C-1, C-2, C-3, rule 5). text::looks_like_html is true for a document marker (<!doctype html, <?xml, or an html/head/body/script/style/iframe/frameset/svg/noscript tag) or for 3 or more tag-shaped tokens; http::reply_text (cloudflare, flags) replaces a body that is not valid JSON (one or more values) and looks like HTML with its status, content type, size and <title> (neutral, 120 chars) plus a pointer to the web tools' fetch, as Ok on 2xx and an error otherwise, whatever the content type says. gh uses the document test only (a PR body may quote <details>): `gh api` output and any gh error text that is a whole HTML page are replaced the same way. JSON that carries HTML in its strings is still shown."
    why: "A content-type check let a proxy, login or challenge page labelled text/plain reach the model as raw HTML; the title alone is short text that still lets the model see it hit a login or challenge page (rule 3) and stop."
  - id: D-141
    text: "T-16 package C (H-1.1, H-6, M-2, M-3, H-5; rungs 6-8). (1) dispatch touches memory.contacts after a call whose approved class is Send, that returned Ok with no `stopped` and no held mid-call stop, and that ran under mode allow or answered_proceed: each scrubbed, non-blank recipient once per contact_key, channel = the classified domain else the server name, note empty (a stored note is kept); a touch_contact failure goes to stderr only. Skipped, failed, stopped and timeout_proceed Sends, and non-Send calls with recipients, touch nothing. (2) `harness mcp` serves MCP server `mem` (crates/harness/src/mem_server.rs, core_pg::bootstrap + harness_core::serve): review.add Fill, review.grade Fill (reports the new due date by scanning due_reviews to a far horizon, at most 1000 rows), review.due Read (args days 0..3650 default 0, k 1..50 default 10; shows Q, A and SM-2 state), schedule.list Read, contact.get Read, schedule.add Submit, schedule.rm Delete (classify reads the row so the ask card names the schedule), watch.observe Fill. (3) schedule.add: parent run = the call's run (SB_RUN_ID through bootstrap; without it bootstrap's own run), cron normalised to single spaces and checked by parse_cron, kind watch needs watch_target and watch_target is refused for other kinds; after the row is written sched::notify_changed runs, and a marker failure is a warning in the reply, not an error. No extra core ledger event: the wrapper's mem tool event is the record. (4) Text stored in memory (review item and answer, schedule prompt, watch target) is scrubbed with the server's vault before it is written. watch.observe writes its state unscrubbed to runs/<run>/files/watch.txt (temp file + rename, last call wins, 256 KiB cap) because the harness hashes it; its reply is scrubbed by the wrapper. Replies cut user text to one line of at most 200 characters per field."
    why: "Contacts are the gate's memory of whom the user approved, so only an allow or an explicit yes may add one (a timeout_proceed Send asks again next time, fail closed), and a stopped or failed send contacted nobody. The session's run as parent is what H-4 parent_run means for a schedule a session creates. Scrubbing before storage keeps vault values out of memory tables, while the watch file must hold the real state or a change confined to a personal value would never be noticed. Reporting the next due date in review.grade saves the model a review.due round trip (efficiency first)."
  - id: D-142
    text: "T-16 package B reflect and proposals (H-5 reflect, G-3, T-7, T-8, D-303, D-560; code crates/harness/src/reflect.rs, proposals.rs, daemon.rs, bin/harnessd.rs). (1) harnessd's launcher is ReopenVault over harness::reflect::ReflectLauncher: a firing whose LaunchRequest.schedule kind is reflect runs one reflect pass inside the run harnessd created for it; every other firing and `harness run` go to the inner `claude -p` launcher unchanged. No reflect schedule is created automatically; the user adds one with `harness schedule add` (kind reflect). (2) History comes from every other run's runs/<id>/ledger.jsonl (unreadable ones skipped and listed in the summary), standing in for I-1 ledger_since (B-189): a visit is an ok event whose args.url is an http(s) URL, mapped to a folder by ToolStore::folder_for and counted once per run; _generic counts runs that visited any site; a good call is an ok `web` event named <namespace>.<tool>, paired with that run's latest ok web fetch on the tool's folder (any folder for generic.*). (3) Sweep: ToolStore::sweep with visits(row) = runs that visited the folder after the tool's last use (last_ok/last_fail, else the later of @forged and the file mtime), through a MemoryStore wrapper whose append goes through the reflect run's Ledger, so every tools.* event carries the run id, is scrubbed and is mirrored to its ledger.jsonl. Pinned tools are never swept. (4) Commit: the tool folders git ls-files -m -d -o --exclude-standard reports (site folders, _generic, _archive/<domain>) are committed with ToolStore::git_commit, message `tools: reflect sweep of run <id> (T-16; T-7, D-560)`; a git failure is noted in the summary event's why and the pass goes on. (5) Proposals (harness::proposals): T-8 merge for live tools with the same kind, arg type shape (types in order, `?` for optional, names ignored) and fingerprint role sequence under at least 3 site folders (no fingerprint, never grouped; id is FNV-1a of the shape so a later pass adds nothing new); T-7 retire for a pinned tool (row or site config) the sweep would have retired. One JSON-flow line per item is appended under the trailing `proposals:` key of SB_PROPOSALS_FILE (default <tools_root>/../agent-memory/blockers.yaml), deduped by id, plus a copy in runs/<id>/files/proposals.yaml; when the file is missing or `proposals:` is not its last top-level key only the run copy is written and the summary carries a warning. (6) A core `reflect.sweep` ledger event and files/reflect.md summarise the pass. (7) Health refresh, readers only: live @phase 1 readers with a last good call whose url and args are prompt-safe (at most 2000 chars, no control characters, no space in the url) are listed in a generated prompt (files/reflect-prompt.md), and a second `claude -p` session allowed only mcp__harness-web replays them (fetch, then the tool), so srv-web checks fingerprints and writes tools.health itself. Planners are never named; with nothing to replay no session starts. Everything written (ledger, files, proposals, prompt) is scrubbed."
    why: "Reflect has to run without a model for the sweep (deterministic, testable, rung-independent) but the health refresh must go through srv-web's own fingerprint and tools.health path, so only the replay is a session and it can only reach harness-web readers (G-3, never a planner). The jsonl mirrors and a header scan avoid an interface change during the D-90 freeze; an append-only proposals section keeps blockers.yaml valid and user-decided."
  - id: D-143
    text: "T-16 round 2 (review-T-16 r1 should-fix 1-8; corrects D-141 (2) and (4) and D-142 (4) and (7); code crates/harness/src/launcher.rs, reflect.rs, mem_server.rs, proposals.rs, bin/harnessd.rs, crates/core/src/sched.rs, watch.rs). (1) ClaudeLauncher::print sessions (harnessd firings) pass --allowedTools mcp__harness-web mcp__harness-files mcp__harness-cli mcp__harness-mem (names from mcp.example.json) before the unchanged B-192 --disallowedTools list; interactive `harness run` gets no allow list. (2) The watch run preamble tells the session to call harness-mem watch.observe with the state and not to write files/watch.txt itself. (3) Corrects D-141 (4): watch.observe scrubs the state before writing watch.txt. The old reason was wrong: the harness scrubs before hashing (watch.rs), so storing it unscrubbed changed no hash, baseline or notification and only left a vault-shaped value in a deliverables file. A watch target is collapsed to one line (watch::target_key, mem_server, CLI), and the harness reads at most 256 KiB of watch.txt (watch::WATCH_MAX_BYTES, the same cap watch.observe enforces). (4) Corrects D-142 (7): the replay session is ClaudeLauncher::readers_only: --strict-mcp-config with --mcp-config <run>/replay-mcp.json naming harness-web only (srv-web from SB_SRV_WEB, else next to harnessd), working directory the run folder with absolute SB_TOOLS_ROOT and SB_VAULT_PATH, --setting-sources local, --permission-mode default, --allowedTools mcp__harness-web, and the built-in tools (Bash, PowerShell, Edit, Write, MultiEdit, NotebookEdit, WebFetch, WebSearch, Read, Glob, Grep, Task, Agent and the rest of the ladder shim's list) appended to --disallowedTools, which stays last. (5) Corrects D-141 (2): schedule.add is Account, so it asks (timeout proceeds per H-1.3); B-187. (6) Corrects D-142 (4): reflect commits only the paths the sweep moved or deleted (old and archive path of each retired or archived tool, each deleted archive file; a path neither present nor tracked is dropped), never whole folders; srv-web relocations are not committed by reflect. (7) The proposals file is read and appended through one handle under an exclusive file lock. (8) Deferred to T-16b (swarm/core-T16d): H-5/G-3 compare output shape, T-6 growth and G-3 forge proposals, G-3 expectation learning and after-each-task reflect, H-5 nightly reflect row not auto-created."
    why: "A `claude -p` session refuses every tool without an allow rule, so harnessd firings could call no harness tool and live rungs 7 and 8 could not pass; the gate inside each server is the permission layer, so allowing the servers adds no unchecked effect. The replay prompt carries page-derived text from earlier ledgers, so that session must be limited by what it is given (one server, no settings, no built-ins), not by an allow rule that removes nothing. A schedule makes unattended runs persist, which one injected page must not do without a card; one ask when the user did ask costs little. Committing whole folders swept up users' edits and unreviewed forged tools."
  - id: D-144
    text: "T-16 supreme hold of PR #17 (review-T-16 r1 should-fix 3, 4, 5; tightens D-143 (4) and (5)). (1) schedule.add is Account with the classifier hint `schedule` (gate::HINT_SCHEDULE), and migration 0003 seeds ('*','Account:schedule','ask'); a hint rule that decides an ask times out to skip (D-110 (4)), so an unanswered schedule.add adds nothing. A user yes still adds it; a user who deletes or changes the row gets the plain Account ask back. (2) The replay session also gets --tools \"\" (no built-in tools loaded at all; checked live on Claude Code 2.1.311: only mcp__harness-web__* are listed), on top of the strict harness-web MCP config, the run-folder cwd, --setting-sources local and the built-ins denied by name. (3) watch.observe scrubs before write_atomic (D-143 (3), test accept_t16_mem vault canary) is unchanged. Supersedes the timeout clause of B-187's default_taken (blockers.yaml is append-only, D-75)."
    why: "Account alone proceeds at the 60 s timeout, and a harnessd firing has nobody at the card, so one injected page could still plant an hourly job; the supreme asked that it not proceed without a yes. A deny list only removes the names it lists; --tools \"\" removes every built-in, including ones a later Claude Code adds."
  - id: D-565
    text: "srv-web has a second body cap for JSON that is reduced before the model sees it: Config::json_max_bytes, default 32 MB (DEFAULT_JSON_MAX_BYTES). page.api (the site-tool runner's fetch) reads up to it instead of the 5 MB page cap, still inside the run's remaining wall time (D-64) and the 15 s request timeout; api reads up to it only when the call has pick (only the projection reaches the model) and keeps the 5 MB W-2 cap otherwise (accept_t12's api-over-5-MB check stands). A body cut at either cap is named with the cap ('answered more than the 32 MB cap', 'body cut at the 5 MB cap ... cannot be parsed'), never 'not JSON'; a JSON answer cut without pick adds 'call again with pick, which reads JSON up to 32 MB'."
    why: "B-560 / ladder rung 4: Ashby posting-API answers for large boards (OpenAI) are over 5 MB, but only list_jobs' 60-row output or api's 20 000-character view (or pick projection) reaches the model, so the W-2 cap protected nothing and made the board unreachable."
  - id: D-566
    text: "W-3 extension: api(url, method, body?, headers?, pick?). pick is a list (or one string) of up to 40 dotted paths with [] for arrays (jobs[].title, [].name, data.items[].id); the parsed JSON is projected onto them before escape, pretty-print and the API_MAX_CHARS = 20 000 cap. A key step met by an array maps over its items ([] is optional), items without the picked keys stay as null so arrays line up, a whole-subtree path wins over deeper ones, and any other bracket form is refused in words. A pick that matches nothing returns the answer's shape instead of the JSON. A cut answer (with or without pick) ends 'truncated: N more characters not shown; top-level keys: k (array of N objects), ...; items of k have keys: ...; call again with pick ..., e.g. pick: [\"k[].title\", ...]' (keys escaped); with pick it says to pick fewer fields. On non-JSON text, pick is ignored with a note."
    why: "One call instead of an unusable cut: a 2 MB job board was cut at 20 000 characters with no way to select fields, so sessions either gave up or listed partial results (ladder rung 4)."
  - id: D-567
    text: "api owns identity headers (B-562, W-2). The client always sends its browser USER_AGENT. A caller's User-Agent or From header is refused even as @vault(...); Authorization, Proxy-Authorization and Cookie are refused unless the value holds @vault(...). Refusals are one ToolError::Args line naming only the header and why (so the model does not retry and no value, vault or literal, is echoed). Any other header whose literal text (vault references removed, %40 decoded) holds an email-shaped string raises the call's class to max(method class, Send) with recipients = [host] (D-39), so it asks; the ask card shows the header as written."
    why: "Ladder rung 2: the session put the account email into a model-set User-Agent on a Read-class call, so personal data left with no ask. Refusing the identity headers keeps W-2's no-spoofing UA; the Send raise catches contact data in custom headers without a gate change (a gate-level check stays core's, B-562)."
  - id: D-568
    text: "A site tool's MCP description is the existing 'Site tool (reader) from tools/<domain>/<name>.js; reads ... and returns JSON.' plus the first paragraph of plain comment lines in its header block (after the @key lines, up to an empty // line), escaped with escape::name and capped at 400 characters. Notes for people go after an empty // line. fetch's description says a fetched page announces that site's tools (e.g. a job board's list_jobs) and to prefer them over raw api; search's says to cite only what search and fetch returned in this run."
    why: "The args schema only names offset and q; without their meaning the model spends a call discovering paging. Ladder failing item 3(c): 2 of 3 sessions skipped the announced site tool and went to raw api."
  - id: D-569
    text: "tools/ashbyhq.com/list_jobs.js takes @args org?:string offset?:number q?:string and returns {org, total, matched, offset, shown, next_offset?, jobs}. Still at most 60 jobs per call (MAX_JOBS); q is a trimmed case-insensitive substring over title, department and team; offset skips matching jobs and must be a whole number >= 0 (else a worded error); next_offset is present only when more matching jobs remain; total counts listed jobs, matched the filtered ones. The header stays valid for toolstore (no @fingerprint, @phase 1, @gate Read), and the skeleton line becomes ashbyhq.list_jobs(org?,offset?,q?); toolstore's own seed-tool expectations (src/tests.rs, tests/accept_t11.rs) were updated to that line and output shape in the same commit. Tool health is keyed by (domain, name), not by file content, so the edit does not trip needs_repair or bump a version."
    why: "Ladder rung 4: Ashby listed 66 jobs and the tool stopped at 60 with no way to page; 'ML roles' needed the whole list in context. Two calls for 66 jobs and one for a filtered list."
  - id: D-570
    text: "T-13c (B-564, docs/04 F-1, F-3, F-4). Every srv-files tool that names an output file resolves it with Roots::resolve_out: a bare file name (paths::is_bare: one plain component, no folder part, root, drive, '.', '..', '~' or trailing separator) lands in this run's files/ (runs/<id>/files/<name>); './name', 'folder/name' and absolute paths keep their meaning, relative to the folder that holds runs/. Applies to fs.write (append too), csv.clean out (already) and the docs writers' out (already). A bare name goes to files/ even when the base folder has a file of that name (that file is not touched). fs.mkdir is not an output file: a bare folder name stays in the base folder, so 'fs.mkdir out' then 'fs.write out/x.csv' agree. A write into files/ is scratch, so it keeps class Fill and the gate allows it; the reply and consequences name runs/<id>/files/<name>, so the session learns its run folder and the report's Files: line lists it."
    why: "Phase 1 ladder rungs 4/3 and 5/3 wrote deliverables to the repo because a bare name resolved against the base folder and the session never learns its run id; xlsx.write already did this and passed rung 2."
  - id: D-571
    text: "T-13c (B-564). Tools that read an existing file resolve it with Roots::resolve_existing: the path against the base folder as before; a bare name that does not exist there but exists in this run's files/ is that file. Used by fs.read, fs.delete, fs.move's source, csv.clean path, diff a and b, pdf.read, xlsx.read, docx.read and md.to_pdf's source. When both exist the base wins (unchanged behaviour for every call that worked before T-13c); fs.read then appends one line 'note: this is <name>; this run's runs/<id>/files/<name> has the same name (read that path for it)' (Roots::shadowed) so the session knows which it read. When neither exists the error names the base path."
    why: "A session must be able to read back, clean, diff or delete what it wrote with the same bare name; keeping the base first means no existing caller changes meaning, and the note costs one line only in the rare both-exist case, instead of a wasted turn on the wrong file."
  - id: D-572
    text: "T-13c (B-564). fs.* classify and call act on one resolved plan (fs::Plan: verdict, card values, target path or MovePlan); call recomputes it, rechecks the class against the approved one, and acts on exactly that target instead of resolving the raw argument again. csv.clean already used one out_path for both; docs plan_out likewise. Tested by accept_t13c::classify_and_call_agree_on_the_path (classify's shown path equals the written path for fs.write and csv.clean)."
    why: "With a fallback that depends on what exists, resolving twice inside call could act on a different file than the one whose class was rechecked."
  - id: D-573
    text: "T-13c (B-564, keeps D-523). fs.move's destination: a bare 'to' for a source that is scratch (inside runs/, not bookkeeping, not hard-linked) lands in this run's files/ like a bare fs.write, unless the base folder holds a folder of that name (then the move goes into it, as before). For a source outside runs/ a bare 'to' stays a rename next to it in the base folder; moving a file from outside runs/ stays Delete either way. A bare 'from' follows D-571. There is no fs.copy; shell cp/mv targets are unchanged (the shell's cwd rules decide)."
    why: "Renaming a run file with a bare name must not drop it into the repo, while 'rename notes.txt to old-notes.txt' in the base folder keeps its everyday meaning; neither path lowers a D-523 class."
  - id: D-574
    text: "T-13c (B-564). Descriptions: fs.write says a bare file name lands in this run's files/ (runs/<run>/files/, named in the reply) and is listed in the run report, and that ./name, folder/name and absolute paths keep their meaning; fs.read, fs.move, fs.delete, diff and the docs readers' path say a bare name not found next to runs/ is read from this run's files/; csv.clean leads with 'Dedupe and normalise ... use it instead of deduping rows yourself' and names rules.key as the columns that identify a row (default the whole row), with a description on the key and out properties."
    why: "Ladder failing rung item 2 and 3(d): sessions did not know where a bare name lands and deduped in-model instead of calling csv.clean."
  - id: D-575
    text: "T-13c review round 1 (B-562). api decides whether a header value holds a vault reference with core's exact spelling (@vault( in lower case, harness_core::vault::vault_refs). A header template that holds @vault( in any other case, an unclosed reference, or a bad name is refused in one line naming only the header, before classify; the url and body still refuse every spelling."
    why: "Core resolves only lower-case @vault(name) at the sink; a @VAULT(...) counted as a reference here was stripped before the email scan and satisfied the credential-header rule, so the address or a raw token went out as typed with class Read."
  - id: D-576
    text: "T-13c review round 1 (B-562, B-560). (1) An email-shaped string in api's url path or query (also %40-encoded) raises the class to Send with recipients [host], like one in a header; the ask card shows the url. (2) pick raises api's read cap to json_max_bytes only when the answer's content type is JSON, text/plain or missing; any other answer keeps the 5 MB page cap."
    why: "The rung-2 leak can move from a header to ?contact=<address>; and a pick on an HTML page must not read 32 MB it can never project."
  - id: D-509
    text: "T-12b, resolves B-590 for srv-web (W-2, W-3, W-4, rule 2). Clients that may reach this machine or the user's network never use a proxy: page_local (fetch/feed of a URL written as a private address or localhost, search) and new api_local/api_vault_local (api and page.api to a URL written as private or localhost, or loopback through a config override) are built with no_proxy(). The direct page client keeps PublicOnly and is no_proxy() too. A public page hop goes through a new page_proxy client (system proxy, system resolver) only when the system proxy applies to its URL (hyper_util Matcher::from_system, the matcher reqwest's system-proxy feature reads, built at the same moment) and PublicOnly resolves the name to at least one public address first (a config DNS override counts as public, D-507); a private answer, no answer or a lookup error sends the hop to the direct client, where PublicOnly refuses it (Private) or the connect fails. With allow_private a hop not written as private follows the proxy settings as before (a remote SearXNG behind a proxy still works). https api through a proxy stays a CONNECT tunnel."
    why: "A proxy resolves the target itself, so PublicOnly never saw the address and a localhost URL (or a plain-http @vault header to loopback) went to the proxy. Of the two B-590 options this keeps fetch working behind corporate proxies and refuses only what PublicOnly would refuse. Residual: the proxy resolves the name again, so a TTL-0 rebinding name can answer public to our check and private to the proxy; and on a network where only the proxy can resolve names, public fetches fail closed (no local answer means no proxy)."
  - id: D-510
    text: "T-12b (review-T-12 should-fix, rule 5, D-508). api runs the text/plain tag check on the raw body (as before) and again on what would be shown: a text/plain body that parses as JSON is not shown when its pretty-printed decoded text holds a tag (JSON escapes like \u003c spell markup only once decoded). Under any type, a JSON document whose top-level value is a string holding a tag is a document, not data, and is not shown. JSON objects and arrays under a JSON type keep showing HTML in their fields (data, D-508)."
    why: "A tag-free text/plain body could carry a page as a JSON string; the old check ran only before the decode."
  - id: D-511
    text: "T-12b (review-T-12 should-fix). The Content-Type shown by fetch, api and feed lines and errors is http::shown_mime: the MIME type as written when it is type/subtype made of RFC 6838 restricted-name characters (first character alphanumeric, then alphanumerics and !#$&-^_.+) and at most 80 characters; 'no content type' when absent (api keeps '(no content type)'); otherwise 'unusual content type'."
    why: "The header is server text and escape::name kept '<', so a type like <script>...</script> was echoed; a fixed phrase cannot carry markup, link forms or fences."
  - id: D-512
    text: "T-12b (review-T-12 should-fix, rule 5). Bodies walked as text (html::parse_text: text/plain, a missing or other non-HTML type) first go through html::plain_source: a '<' whose tag name is not a known HTML/SVG/MathML element, has no '-' (custom elements stay markup) and whose <...> run on the same line (<= 200 bytes) holds no '=' or quote is written as &amp;lt; (and its closing '>' as &amp;gt;), so the walk shows Vec&lt;String&gt; and #include &lt;stdio.h&gt;. With no '>' on the line only '<' and the name are escaped. Known elements, attribute-bearing tags (and the end tags of unknown names opened that way), comments, doctypes and processing instructions are left to the parser and dropped as before. Entities elsewhere decode as before (a body with no type may be HTML)."
    why: "The walk read Vec<String> as an element <string> and lost it; escaping keeps the text and keeps tag-shaped text out of the output. Known names like <B> in Option<B> are still dropped (fail closed)."
  - id: D-513
    text: "T-12b (review-T-12 should-fix, W-4). feed parses RSS, Atom and JSON Feed with feed-rs base_uri = the feed's final URL (after redirects), so xml:base applies first and then the feed URL; each item link is joined against that URL again (JSON Feed) before http::clean_url. iCal event URL is resolved the same way. feed::parse(bytes) without a URL keeps dropping relative links."
    why: "Relative links without xml:base (common in RSS and JSON Feed) were dropped, leaving items with no URL to fetch."
  - id: D-543
    text: "T-14b item 1 (review-T-14 confirm should-fix 1, rule 4; refines D-525 (4)). paths::path_dirs adds <h>/bin for every home folder in paths::home_dirs() (the profile folder and HOME, a Git Bash /c/... HOME converted), whatever the bash PATH probe did, instead of failing closed. path_dirs_from() takes the parts so a failed probe is testable. canonical_or_absolute now canonicalises the existing prefix of a missing folder, so ~/bin below a junction or 8.3 name compares equal to a resolved path in it."
    why: "Git Bash's bin/bash.exe puts $HOME/bin on its PATH; with the probe failed or timed out (10 s, cached for the process) only the guessed Git folders remained, so a HOME different from USERPROFILE left $HOME/bin/jq Fill. Adding the folders closes it without making every write ask for the life of the process, which failing closed would."
  - id: D-544
    text: "T-14b item 2 (review-T-14 confirm should-fix 2, rule 4). Git's own system config folders are code locations below every level: <msys root>/etc and <msys root>/mingw64/etc for the MSYS root of the runner's bash and of the git on this server's PATH (cmd/, bin/, mingw64/bin/), and %ProgramData%/Git. They live in PathDirs::trees (shell::git_config_dirs, computed once with path_dirs); runs_code_on_use makes any write below them Delete (fs.write, fs.move, fs.mkdir, csv/docs out, every shell target)."
    why: "A per-user Git install (%LOCALAPPDATA%/Programs/Git) or an elevated harness can write etc/gitconfig, which the next Read-class git status reads (core.fsmonitor, filters); appending to it was Fill. Whole folders, because etc/ also holds gitattributes and bash's profile files."
  - id: D-545
    text: "T-14b item 7 (review-T-14 should-fix carried; narrows D-524 and D-525 (5) inside runs/ only). Inside runs/ a dotfile name alone is no longer a code location: runs/<id>/files/.something, runs/x/.env, .bashrc or .npmrc there are scratch (Read for shell, Fill for fs.write like any scratch write). D-523 (8)'s names stay Delete in runs/ (a .git file, .gitattributes, .gitmodules, .gitconfig, .curlrc, _curlrc, .wgetrc) and every CODE_DIRS folder (.git/hooks, .config, .cargo, .vscode, .github, ...) stays Delete there. Outside runs/ every dotfile is still Delete."
    why: "No program this server starts reads startup files from a run folder: HOME, XDG_CONFIG_HOME, CURL_HOME and WGETRC are kept or stripped so they never point there, and git in runs/ is Delete anyway (D-525 (3)); the over-match cost an ask per scratch dotfile, while the names git reads in a repository stay strict."
  - id: D-546
    text: "T-14b items 3 and 4 (D-525 (3) residual). (1) In-place updates of an existing repository outside runs/ (pull, checkout or switch of a branch, stash pop/apply, merge, rebase, cherry-pick) keep local git's D-523 class Fill, tested so none can drop to Read; in a repository whose tree is the home folder or a config location they are Delete (unchanged). (2) git stash (push, save or bare, with or without -u/--include-untracked) and git commit -a/--all or with pathspecs use the git add rule: Delete when the repository's tree holds runs/, a pathspec (or none, the whole tree) reaches it, and the root .gitignore does not ignore runs/; stash -a/--all is Delete even with runs/ ignored (it takes ignored files). git add -u/--update now counts as the whole tree too. In a planted repository inside runs/ every one of them is Delete (D-525 (3))."
    why: "stash -u removes the run's own untracked files (ledger, asks, files/) and a planted repository from disk, and commit -a and stash take tracked files below runs/, where a gitlink to a planted repository makes a later git status run its config; in a repository that ignores runs/ neither happens, so everyday stash and commit -am stay Fill."
  - id: D-547
    text: "T-14b item 5 (rule 4). A shell line whose every git and gh command is Read on its own (Verdict.runs_git and not git_above_read) runs git sealed (shell::GitSeal): GIT_CONFIG_NOSYSTEM=1, GIT_CONFIG_GLOBAL=<empty temp file>, GIT_ATTR_NOSYSTEM=1, GIT_TERMINAL_PROMPT=0, then command-scope config (GIT_CONFIG_COUNT, which beats every file and reaches submodules): data keys copied from the system and global config (KEPT_KEYS: autocrlf, symlinks, safe.directory, user, colours, formats; read with git config --system/--global --list -z, 5 s cap) and core.hooksPath=<empty folder>, core.fsmonitor=false, core.attributesFile=<empty file>, core.sshCommand=ssh, credential.helper= (reset), core.askPass=, protocol.ext.allow=never, diff.ignoreSubmodules=all, status.submoduleSummary=false, submodule.recurse=false, log.showSignature=false. What the seal cannot switch off from the command line makes a Read git Delete instead: a repository config (config, config.worktree, the commondir's, every modules/*/config) that sets filter.<x>.clean/smudge/process, diff.<x>.command/textconv, diff.external, include.path or includeIf.*.path, remote.<x>.uploadpack/receivepack/vcs/proxy, core.gitProxy, core.alternateRefsCommand, gpg.*program or uploadpack.packObjectsHook (classify::config_keys reads comments, same-line keys and continuation lines as git does). A line with any git or gh above Read (commit, fetch, push, git in runs/) runs git as the user configured it, as D-520 (4) local git did."
    why: "An empty filter or diff override breaks git diff (cannot spawn ''), driver names are per repository, and includes cannot be undone from the command line, so those are raised; everything else is switched off without an ask. Sealing Fill-class git would drop the user's identity, credential helper and hooks from their own commits and pushes."
  - id: D-548
    text: "T-14b item 8 (T-13d item 8). In srv-files' shell a fetch to stdout (no -o/-O, no redirection outside runs/, no data or non-GET method) is already Read, with or without -s/-S/-L/-I/-H and piped into jq; the 60 s asks T-13d saw came from srv-cli's classifier, not this one. python and python3 -c stay Delete with every other RUNS_CODE use (D-523 (3)), including -I -S."
    why: "The interpreter runs startup code before the expression (site, .pth files in a site-packages folder a Fill write can reach, sitecustomize) and any expression can open, write or spawn; a safe subset would have to parse Python and would not cover the imports sessions actually write, so it would add risk without saving asks."
  - id: D-549
    text: "T-14b item 6 (TOCTOU between reclassify and the syscall). New srv_files::safeio: fs.write, csv.clean out and the shell and diff overflow copies open first and check that the handle's final path (GetFinalPathNameByHandleW; /proc/self/fd on Linux) equals the classified path before truncating or writing; a missing file is created with create_new and, if it landed elsewhere, removed through its own handle; fs.write also refuses when the open file gained a hard link the approved class did not account for. fs.delete of a file and the cross-volume copy then remove of fs.move delete by handle (FileDispositionInfo) after the same check. Remaining window, accepted: fs.delete of a folder, the rename of fs.move and fs.mkdir check the entry or its parent on a handle immediately before the path-based syscall (one syscall wide); the docs writers (the python helper writes out) and every shell command (bash's own syscalls) are not covered, so a link swapped in by a parallel call between the gate and those syscalls is still followed. Off Windows and Linux the check is skipped."
    why: "The swap needs a parallel call that replaces a folder in runs/ by a junction or symlink (ln and mklink are Delete; tar or unzip may plant one), so closing the common writers on a handle and narrowing the rest to one syscall is the reachable fix; std offers no path-relative rename or recursive delete from a verified handle."
  - id: D-550
    text: "T-14b round 2 (review-T-14b Blocking, accept rows 7b and 7c; rule 4; amends D-545 and D-523's RUNS_CODE --version exception). (1) D-545 is reverted: inside runs/ every dotfile is code-class again (paths::code_path: any dotfile, _netrc, _curlrc, anywhere), so a dotfile write in runs/ is Delete for fs.write, fs.move, fs.mkdir, csv/docs out and every shell writer, as before T-14b; plain names in runs/ stay scratch. (2) Every use of a RUNS_CODE program (cargo, rustc, rustup, npm, npx, pnpm, yarn, bun, node, deno, python, pip, uv, poetry, go, java, mvn, gradle, make, cmake, docker, dotnet, pytest, ...) is Delete, `--version` and `version` included, wherever the cwd is. The tester's accept_t14b item7 dotfile test was tightened to match (dotfiles ask and are not written; git names stay Delete; plain names stay scratch)."
    why: "A version probe is not inert: rustup's proxies run a rust-toolchain.toml `path` toolchain (shown end to end), yarn runs yarnPath from .yarnrc(.yml), go switches to a go.mod toolchain, dotnet follows global.json, mvn reads .mvn/jvm.config, pytest loads addopts plugins, and asdf/mise/volta/pyenv shims pick a binary from project files; Fill writes outside runs/ do not ask (gate Mode::Allow), so no folder is safe from a planted config and narrowing to cwd-in-runs/ would leave the same hole one folder up. Reverting D-545 keeps dotfiles from becoming a cheap plant for Read programs behind shims (.tool-versions) that no list here covers; both only cost an ask."
  - id: D-551
    text: "T-14b round 2 (review-T-14b should-fix 1, accept row 4b; refines D-546 (2)). git commit with --pathspec-from-file (=file, a separate word, or - with stdin) takes the D-546 rule like -a and explicit pathspecs: Delete whenever the repository's tree holds runs/, since the pathspecs are not known to the classifier (tree_reaches_runs treats the flag as reaching runs/, as git add and git stash push already did)."
    why: "The rule only ran with -a or operands, so commit --pathspec-from-file stayed Fill and could stage a repository planted in runs/ as a submodule."
  - id: D-552
    text: "T-14b round 2 (review-T-14b should-fix 6, accept row 6b; narrows D-549's mkdir window). safeio::create_dirs replaces create_dir_all in fs.mkdir, fs.write, fs.move, csv.clean out and the docs out folder: the nearest existing ancestor is opened (links followed) and its handle checked to be the planned folder, then each missing name is made relative to that open handle (NtCreateFile with RootDirectory, FILE_OPEN_IF, FILE_DIRECTORY_FILE) and the new folder's handle is checked before the next level is made below it; a folder this call made that is not the planned one is removed through its own handle. safeio::check_parent no longer skips a missing parent: it checks the nearest existing ancestor and refuses when there is none. Off Windows (no libc dependency) each level is made by path right after its parent was checked and is then checked itself, a window of one syscall per level."
    why: "check_parent returned Ok for a missing parent and fs.write/fs.move created the parents before any handle check, so a junction swapped into runs/ mid-call made folders in its target (row 6b); creating relative to a verified handle never resolves a path above it, so a swapped folder cannot redirect a level."
  - id: D-553
    text: "T-14b round 2 (review-T-14b should-fix 5; refines D-549). safeio::links_ok fails closed: an open file whose hard-link count cannot be read counts as linked, so fs.write refuses unless the approved class already accounted for links (Delete). safeio::open_existing opens existing files with FILE_READ_ATTRIBUTES (plus std's write or append rights) so the count is readable on the handle. csv.clean out gets the same recheck after its verified open."
    why: "is_none_or let a write through when the count was unreadable, while paths::hard_linked fails closed in the same case, and csv.clean out could overwrite an existing file that gained a hard link after the check."
  - id: D-554
    text: "T-14b round 2 (review-T-14b should-fix 2; refines D-547). The unsealable-config scan reads each repository config file as bytes (classify::config_text): a missing file is skipped; a file that cannot be read, is not UTF-8, or starts with a UTF-8 byte order mark makes a Read git Delete with that reason, in the git folder, the common folder and every modules/*/config."
    why: "read_to_string skipped non-UTF-8 files that git reads fine, and git skips a leading BOM that this parser would not, leaving the first header's driver keys in no section; failing closed costs an ask only on such rare files."
  - id: D-555
    text: "T-14b review round 2 (F-2, rule 4, extends D-547). The Read-git seal sets safe.bareRepository=explicit in command scope, after the copied keys, so git never discovers a bare repository from the cwd; a bare repository planted outside runs/ with Fill writes (config naming a diff driver, info/attributes) cannot run its driver under a Read git (diff --no-index, log -p, show, blame, grep)."
    why: "classify::find_repo only finds a .git entry, so the unsealable-config scan never saw a bare repository, and git's default safe.bareRepository=all ran its diff.x.command; the reviewer reproduced it with git 2.50.1 and the seal's env."
  - id: D-556
    text: "T-14b review round 3 (F-2, rule 4, extends D-555). Every git a shell line runs that is not sealed (a git above Read in the line) still gets safe.bareRepository=explicit through GIT_CONFIG_COUNT (shell::no_bare_discovery), so no line discovers a bare repository from the cwd; a real bare repository is reached with --git-dir, which asks. Tested through dispatch (tests/accept_t14b_bare.rs) with a live bash control."
    why: "A bare repository's config and hooks sit at plain names Fill writes outside runs/ can plant, and the classifier's repo scan only follows .git; on unsealed lines git's default safe.bareRepository=all ran its diff driver, hooks and clean filter with no ask (the reviewer reproduced four lines)."
  - id: D-594
    text: "srv-cli gh, a flag before the group (T-15b round 2, C-1, rule 4; review-T-15b Blocking). gh's parser (cobra) skips flags before the command to find it and hands them to that command in order, so the handler does the same before anything else (gh::group_first, also on every alias expansion): `--name=value` and `-R`, `--repo` or `--hostname` with the next word as its value are moved behind the group (`--repo=o/r run delete 5` is classified, shown and run as `run --repo=o/r delete 5`, Delete; `--hostname github.com tok` is the alias tok, so it is refused like auth token; `--repo=other.host/o/r pr view 5` is host-checked and refused). Any other flag first (an unknown --flag VALUE, a short flag other than -R, a cluster such as -Ro/r, --help with more words, --) and a call that is only flags are refused in one line that says to put the flags after the subcommand; a lone --help or --version is kept as it is."
    why: "The reviewer offered refuse-every-leading-flag or skip-them-as-gh-does; the committed acceptance test accept_t15b_open item3 needs `--repo=o/r run delete 5`, `--yes=true repo delete o/r` and `-R o/r run delete 5` to ask as Delete, so the forms gh reads one way are moved (and the moved argv is what runs, so the gate saw exactly it) and every ambiguous form is refused as proposed."
  - id: D-595
    text: "srv-cli gh, classify and call run one plan (T-15b round 2, C-1, rule 4; review-T-15b should-fix 1; amends D-591's why). classify keeps its GhPlan (the argv that runs after alias expansion and group_first, the gate domain, the class, the alias name) for its call, keyed by the call's ToolCtx (address, plus run id and the named argv as a cross-check; at most 64 kept, oldest dropped); call takes it out, plans again with a fresh `gh alias list`, and runs only when the two plans are equal. A changed alias (another command at any class, another host), a missing plan or a failed listing refuses with 'what this call runs changed after it was classified ...; nothing ran', and nothing is spawned but `gh alias list`."
    why: "Comparing only the class let an alias swapped between the ask and the run execute a command nobody classified or saw on the card (accept_t15b_open: classified pr view 5, ran issue list 5). ToolCtx has no public per-call id, so the context address is the key until B-591 gives one; a mismatch can only refuse."
  - id: D-596
    text: "srv-cli gh, alias text in cards and errors (T-15b round 2, C-1; review-T-15b should-fix 2; amends D-591's last sentence). An expansion is named by gh::command_words: its first two words, stopping at the first that is not a plain command word (ASCII letters, digits, - and _, at most 32 bytes, not starting with -), else '(a command)'; so `far: api https://any.host/x` is 'gh far is an alias for gh api ...'. Every refusal made inside an expansion (plan depth > 0) leaves the expansion's words out: the api and repo host refusals say '(a host in an alias's expansion)' instead of quoting the token, alias set inside an alias says NAME and does not quote a flag, the two-word-alias and leading-flag refusals name no word. A refusal of the user's own call still quotes it."
    why: "An alias value can hold anything the user typed (a token in a URL query, a private host), and in_alias appended the inner message, which quoted up to 200 chars of it; the reason is kept so the model does not spend a turn finding out why."
  - id: D-597
    text: "srv-cli gh alias import is refused (T-15b round 2, C-1, rule 4; review-T-15b should-fix 4): `gh alias import FILE` (or -) stores aliases with no check of what each runs, so it is refused before the gate with a one-line pointer to `gh alias set NAME EXPANSION`, which checks the expansion (D-591). `alias set` or `alias import` after a flag this module does not skip (`alias --bogus set ...`, `alias -c set ...`) is refused too, so the alias set check cannot be bypassed; `alias -R o/r import` is still import and refused."
    why: "With import Account-only, `tok: auth token` could be stored behind one ask; every later run of it is refused today, but the stored alias would still work in the user's own terminal and in any future path that misses the expansion."
  - id: D-598
    text: "T-15b review round 2 (C-1, rule 4, amends D-594). gh refuses any empty word in a call or an alias expansion (`'' auth token`, `repo '' delete`, `alias set e \"'' auth token\"`), checked in group_first before the flag move; an empty flag value is written in one word (`--jq=`)."
    why: "gh's parser (cobra) drops empty words, so the command that runs is not the one srv-cli classified: `'' auth token` asked as Account instead of being refused, and `repo '' delete` was Account instead of Delete."
  - id: D-599
    text: "T-15b review round 2 (C-1, D-540). gh subcommands `remove` and `rm` are classed Delete like `delete` (`secret remove`, `variable remove`)."
    why: "They are gh's own aliases of delete; Account understated a deletion. Raising a class never lowers one."
  - id: D-585
    text: "T-15b review round 3 (C-1, rule 4, extends D-598 and D-599). gh also refuses a lone `-` word anywhere in a call or an alias expansion (gh drops it like an empty word; gh runs with stdin closed, so `-` as stdin has no use). A deletion named by a hyphenated word (`release delete-asset`, `project item-delete`, `project field-delete`) or by the word after the subcommand (`repo deploy-key delete`, `repo autolink delete`) is classed at least Delete."
    why: "`label - delete --yes` deleted while classed Account, and an unanswered Account ask proceeds where a Delete ask is skipped; the hyphenated and three-word deletes were Account since T-15 (D-540). Each change only raises a class or refuses."
  - id: D-586
    text: "T-15b review round 4 (C-1, D-585). The word that names a sub-resource deletion after the subcommand is found with the same subcommand() walk (so a -R/--repo value is skipped: `repo deploy-key -R o/r delete 5` is Delete) and must be exactly delete, remove or rm; hyphenated delete words count only as the subcommand itself, so `repo view my-delete-tool` stays Read. D-585 was first committed as D-660, which is in the driver range (D-42); renumbered before merge."
    why: "The first walk took the -R value for the third word and left a deletion at Account; matching any hyphen part of a later word over-classed reads."
  - id: D-577
    text: "T-13b (T-4, D-561, review-T-13 should-fix 1). A site tool is repaired at most once per fix of its page. (1) srv-web holds a per-tool repair lock (Web::repair_lock, a tokio Mutex keyed by the namespaced tool name) from the decision to relocate until the run's outcome is recorded, and re-checks 'disabled or needs_repair' after taking it; a call that waited for another call's repair sees a healthy tool and runs as one (partial: note, no patch, D-505). (2) toolstore's record(Relocated) whose fingerprint equals the @fingerprint the file already carries writes nothing and is recorded as Ok (no tools.relocate event, version bumped only by Ok's needs_repair -> repaired rule, D-304); a retired row still refuses. (2) covers two server processes (two runs) that each saw the miss."
    why: "Two calls (or two runs) repairing the same broken tool both recorded Relocated, so the second bumped the version to 3 and logged an 'X -> X' relocate; the lock keeps notes and ledger right in one process, and the file check is the only shared state two processes have."
  - id: D-578
    text: "T-13b (B-33 family, rule 4, review-T-13 note b). Names and ids that toolstore writes into a tool header must not hold a control character (Unicode Cc: CR, LF, NEL, tab...) or U+2028/U+2029, the JS line terminators Rust's header_lines does not split on. (1) relocate skips index rows whose name holds one, and a form id that holds one or whitespace or a quote, so such a page is a miss, not a partial; (2) record(Relocated) refuses such an item and a fingerprint that does not read back from the patched file exactly as given (StoreError::Invariant, logged to tools.health.why, file untouched); (3) check_repair (relocate and reforge) refuses a new file whose header block holds a lone CR, U+2028, U+2029 or another control character except tab. The refusal names the role only, never the page text."
    why: "JS ends a // comment at CR, U+2028 and U+2029, so a page name holding one would turn the rest of a header line into reader code that check_repair compares as a comment; srv-web escapes index names today, but the store must not depend on its caller (Phase 2's live index)."
  - id: D-579
    text: "T-13b (T-13d item 7). A site tool's classify what and its output summary (the ledger's what) name the call's arguments after the tool name, in @args order, as name=value with compact JSON values, escaped with escape::name and capped at 160 characters: 'run site tool ashbyhq.list_jobs(org=\"openai\") on http://jobs.ashbyhq.com/acme'. A call with no arguments keeps the old text."
    why: "list_jobs(org) reads the board named by org, which can differ from the page fetched last; the ledger and ask card must say which board was read."
  - id: D-580
    text: "T-13b (D-5, CLAUDE.md rule 3, docs/03 site tools). A challenge reached through page.api inside a site tool stops the site tool call: an answer with cf-mitigated: challenge, a redirect to a challenge URL, or a non-JSON HTML body that fetch's walk calls a challenge makes the call return the same stopped output as fetch (StopReason class Challenge, nothing of the body), the reader's result is dropped, and no tool health outcome is recorded (a challenge is not a tool failure). A site tool runs only on a cached page, and a challenge page is never cached, so it never runs on a challenge page."
    why: "page.api returned 'HTTP 403' for a Cloudflare challenge on the API host, so the model saw an ordinary failure it could retry and the tool's health counted a failure; D-5 says a challenge stops and goes back to the user."
  - id: D-581
    text: "T-13b (B-561). B-561's default stands: D-561 keeps the same-run re-enable. T-4's 'tool disabled for this run' is read as 'disabled in this run on every page its fingerprint misses'; a fetched page it matches or relocates on offers it again, and a clean run there repairs it. Pinned by srv-web tests/t13b.rs (same_run_re_enable_*) and documented in site.rs."
    why: "B-561 proposed keeping D-561 and asked supreme only whether to drop it; until supreme answers the default is what the code does, so a test must pin it and the doc comment must say it amends T-4."
  - id: D-582
    text: "T-13b round 2 (D-5, CLAUDE.md rule 3, D-580, review-T-13b should-fix 1-3 and note a). (1) The api clients' redirect policy (api and page.api, with or without a vault header) never follows a redirect whose target html::challenge_url recognises (a challenge host such as challenges.cloudflare.com or hcaptcha.com, reCAPTCHA, /cdn-cgi/challenge-platform/ on any host); the refusal carries the reason (http::ChallengeRedirect, since reqwest's Error::url() is the URL that redirected) and the call stops with class Challenge like D-580, naming the URL asked for, instead of an ordinary 'redirected somewhere this tool does not follow' failure. (2) Once page.api has met a challenge in a site tool call, every later page.api call in that call refuses without a request. (3) A challenge met by fetch, feed, api or a site tool's page.api drops every cached page of the challenged site (registrable domain of the URL asked for and of the one that answered) for the run, so no site tool, find or cursor runs on an older page of it; fetching it again after the user's check brings it back."
    why: "A cross-host redirect to a challenge host ended as a tool failure the model could retry, a reader that caught the challenge error could keep calling the host, and a site tool could still run on a board page cached before the site asked for a human check."
  - id: D-583
    text: "T-13b round 2 (D-577, review-T-13b should-fix 5). When a site tool's repair run relocated but the tool file already carries that @fingerprint (another run patched it, so toolstore records the run as Ok and writes nothing), srv-web's note says 'fingerprint already relocated by another run ... is already at version N, status S; this call patched nothing' instead of 'patched to version N'. srv-web reads the file before record with the same comparison toolstore makes (record's signature is unchanged)."
    why: "The second run's note claimed a write it did not make; the model and the user must be told which run changed the file."
  - id: D-584
    text: "T-13b round 2 (amends D-577 part 2, review-T-13b should-fix 4). toolstore's 'a relocate to the fingerprint the file already carries is an Ok' covers two server processes (runs) whose repairs run one after the other. Two processes repairing the same tool at the same moment are not covered: carries_fingerprint and the file write are a check-then-act with no lock across processes, and the row update is a read-modify-write, so both can still record Relocated and reach version 3. A file lock or a compare-and-set on the row is left for a later task."
    why: "D-577's text claimed it covered two server processes; the review showed only sequential cross-process repairs are, and this round leaves the code as is."
  - id: D-630
    text: "T-18d (B-199, B-2): a bench profile is no longer removed by TempDir's single silent attempt. ProfileDir keeps the path (TempDir::keep at creation) and its Drop, which runs after Driver's kill because the profile is Driver's last field, calls launch::remove_dir_retrying: std::fs::remove_dir_all, retried after waits of 0, 50, 100, 250, 500 ms and then 500 ms steps while the total waited stays within BENCH_REMOVE_CAP = 20 s (the same as sb_cdp::DROP_KILL_CAP). Retried: ErrorKind PermissionDenied or DirectoryNotEmpty, and on Windows raw codes 5 (access denied), 32 (sharing violation), 33 (lock violation), 145 (dir not empty). NotFound is success; any other error stops at once. Removal runs even when kill returned false. A final failure is left on disk for the stale-profile sweep (T-18c), never a panic. The wait is std::thread::sleep on the dropping thread (rule 6 exception, commented: Windows gives no event when a file lock is released)."
    why: "Measured on this host: every failure was OS error 32 on the one TempDir attempt (3 of 8 runs). With retries, the hold cleared within 4.9 s when kill confirmed the browser gone, but lasted 16 s, and once more than 32 s, when kill hit its 20 s cap. The 5 s first proposed left 0.1 s of margin in the 4.9 s case and would have failed the 16 s case. The cap costs time only while a file is still held."
  - id: D-631
    text: "B-199 is resolved by D-630 (T-18d): the bench profile is removed with a capped retry after the browser is gone; accept-T-18d 10/10 on the loaded host. B-619: area driver works each task branch inside its one worktree F:/sb-swarm/wt/driver, sequentially, and writes no files outside it."
    why: "guard_write.py only allows Write/Edit under the session's own worktree, so per-task sibling worktrees force Bash writes that skip the write hooks; with under 1 GB free RAM, builds run one at a time anyway, so parallel worktrees buy nothing."
  - id: D-514
    text: "T-12b round 2 (rule 5, accept-T-12b rows 3b and 6b; sub-orchestrator ruling). Page text shown to the model writes every < as &lt; and every > as &gt;, whether the page wrote it literally, as an entity (&lt;script&gt; decodes to <script>), or as a numeric reference: escape::text, escape::name and escape::code (escape::angles), so the text/html walk (block spans, code blocks, index row names, values, options, nearby text, titles), text/plain fetch, search titles and snippets and feed titles and summaries carry no tag-shaped string. & is not escaped, the D-512 convention (&lt; in the output stands for < or for the text &lt;). api's non-JSON text/plain answer keeps < and > as written (escape::text_checked): it is shown only when http::has_tag finds no tag (D-510), so a < b stays a < b; JSON answers stay data (D-508)."
    why: "The walk and fragment_text decode entities after the tag strip, so &lt;script&gt; reached the model as <script> in fetch, search and feed; escaping at the one place all page text passes keeps the no-tag invariant for every source and costs only &lt; tokens where a bracket really is text."
  - id: D-515
    text: "T-12b round 2 (amends D-509, B-590; review-T-12b should-fix 2 and 4; accept-T-12b row 4b). (1) Clients::api_for is async and, when the system proxy applies to the URL and the host is a name, resolves it with PublicOnly first (capped at the request timeout): a name whose every answer is loopback, private or link-local uses api_local/api_vault_local (no proxy), with or without a vault header, http or https. A public answer, no answer or a lookup error follows the proxy settings (api may need the proxy to resolve names; what the proxy reaches on its own network is its owner's choice). page.api does the same. (2) A host in the config's DNS overrides (cfg.resolve, empty in production) goes direct for fetch, feed, search and api: the override pins the address and a proxy would resolve the name itself. (3) An IP literal needs no lookup: a private one is written private (direct, as before), a public one (IPv4 or IPv6, brackets stripped) goes through the proxy when it applies. proxy_t12b and accept_t12b_proxy now use the public literal 192.0.2.10 (TEST-NET-1) as the proxied control and assert the override host public.test goes direct."
    why: "api picked the proxied client for any name not written private, so a name resolving to this machine or the LAN went to the proxy (and a vault header over https rode the tunnel to it); an override sent to a proxy lost its pinned address; host_of kept IPv6 brackets, so a public IPv6 literal failed the lookup and skipped the configured proxy."
  - id: D-516
    text: "T-12b round 2 (amends D-513, review-T-12b should-fix 1, accept-T-12b row 7b). A feed item link that is empty, whitespace only or fragment only (#, #top), and any link that resolves to the feed's own final URL (fragment ignored; feed-rs joins such an href against base_uri before srv-web sees it), is no link: the item's url is empty. An iCal event without URL has an empty url."
    why: "base.join('') is the base, so every item without a link (most calendar events) repeated the feed URL, a secret iCal address once per event, and pointed the model at the feed instead of an item."
  - id: D-517
    text: "T-12b round 2 (W-2 15 s, review-T-12b Blocking, accept-T-12b row 3c). (1) html::plain_source is one byte loop; for each < it looks at most PLAIN_BRACKET_MAX (200) bytes past it for the closing > (never to the end of the line), checks known element names by binary search on a lowercased stack copy, and allocates only to remember an attribute-bearing unknown name. It writes the < and > of bracket text as the noncharacters U+FDD0 and U+FDD1 (escape::LT_MARK, GT_MARK), which escape::angles shows as &lt; and &gt;, instead of &amp;lt; entities: the HTML parser spends tens of microseconds per character reference in a debug build. (2) fetch::walk caps the walk at WALK_MAX = 15 s: the walker checks a deadline every 256 nodes and stops its blocking thread soon after it, and the call does not wait longer in any case; a walk that does not finish fails the call with 'the page took longer than 15 s to read, so nothing of it is shown'. The parser's own pass cannot be interrupted (it is linear). (3) The walk splits a text block longer than BLOCK_MAX_CHARS (8000) characters into blocks of at most that many, at the last whitespace within 200 characters of the limit or at the limit (never inside &lt;/&gt;), linked spans kept whole (capped with ' ...' if longer); a table cell longer than that is capped instead, so a row stays a row. The sb-sheet reader re-reads a whole block for every chunk it plans (B-592), so one block of megabytes cost time growing with its square."
    why: "A text/plain body of '<x' repeated made plain_source quadratic (60 s for 320 KB), and after that was bounded the parser's entity cost and the reader's per-chunk rescans of one huge block still kept a 1 MB body past 15 s; the cap guarantees the call returns whatever the input."
  - id: D-518
    text: "T-12b round 2 (D-577, D-583, D-584; t13b two_servers_repairing_the_same_tool_leave_version_2). When a site tool's repair run relocated and srv-web's own read before record (file_carries, D-583) already sees the new @fingerprint in the file, srv-web records the run as RunOutcome::Ok instead of Relocated, the clean run toolstore itself makes of it (D-577). The test is unchanged: its two server repairs already run one after the other. The flake's ToolHealth (version 3, why 'relocated: X -> X') shows toolstore's carries_fingerprint returned false while the file carried the fingerprint, so its read or parse of the file failed transiently (most likely a Windows file read failing under workspace load; the patch step read the same file a moment later and found X), not the same-moment race D-584 describes; toolstore treating an unreadable file as 'not carried' is B-593."
    why: "With srv-web's read deciding, a sequential second repair no longer depends on toolstore reading the file a second time, so it cannot patch again and bump the version when that read fails."
  - id: D-519
    text: "T-12b round 3 (W-2, amends D-517's 'the parser's own pass is linear'; review-T-12b round 2 Blockings 1 and 2). (1) Every HTML parse in srv-web (fetch text/html and text/plain, api and feed bodies walked for a challenge, feed titles and summaries, iCal fields, search titles and snippets, <title>/<textarea> RCDATA, raw_main_html) goes through dom::document or dom::fragment, which feed html5ever 1024 bytes at a time (Parser::process) and check between pieces: the deadline (dom::Budget; spent means None, the call fails as before), the depth of the newest node (the parser's stack of open elements, which each further tag costs) against NEST_MAX = 512, and the node count against 2 per byte fed + 1024 (only html5ever's formatting-element reconstruction gets past it: <b class=k> x400 then <p>x</p> repeated). Past either cap the parse stops there and what was parsed is kept (Cut::Deep, Cut::Repeats); fetch shows one line under the skeleton, 'page nested too deep to read past 512 levels; the rest of the page after that point is missing' (Doc::cut). Chosen over the suggested byte-scan estimate with refuse or strip: the depth is the parser's own, so implied end tags (<p>, <li>, <td>, unclosed <div> in cells) cannot trip it falsely and <div/> or reconstructed elements cannot slip past it, and the text before the deep part is still read. 512 is Chromium's parser depth cap (kMaximumHTMLParserDOMTreeDepth). Debug build: 512 nested <div> parse in 34 ms; 100 000 nested <div> stop in 56 ms; a body nested 500 deep and then 5 MB of <div></div> costs 64 s of parse (5 MB flat: 8.9 s), so it hits the 15 s cap and the thread stops at the next piece. (2) The walk recurses at most WALK_DEPTH_MAX = 256 levels; a subtree below that is read as plain text (collect_text) without its rows, with the note 'page nests elements more than 256 levels deep; what is deeper is shown as plain text without its links and fields'. Controls nested in controls get their rows in one loop (Walker::row, nested_controls with its own stack); collect_text, fragment_text and serialize keep explicit stacks; fragment_text no longer walks ancestors per text node. Tested on a 1 MiB thread (half a tokio blocking thread's stack) in a debug build. (3) feed's parse (parse_with) and search's field parses (parse_answer_in) run in spawn_blocking under fetch::WALK_MAX with the same Budget and a timeout on the task; past it the call fails with 'feed: the feed took longer than 15 s to read, so nothing of it is shown' or 'search: the SearXNG answer took longer than 15 s to read'. feed-rs refuses XML nested 100 000 deep as not a feed (0.4 s)."
    why: "html5ever's scope checks walk its open-element stack, so deep nesting is quadratic (80 000 levels 31 s release) and uninterruptible, and the recursive walker overflowed a 2 MiB stack at about 4 000 levels, which aborts the process; feeding in pieces bounds the work between checks to milliseconds and the explicit stacks remove the recursion, so every call returns within its cap and no page takes srv-web down."
  - id: D-526
    text: "T-12b round 3 (amends D-515 (1); review-T-12b round 2 should-fix 2). Clients::api_for's name lookup is capped at http::LOOKUP_MAX = 5 s (or the request timeout when shorter); a lookup that does not finish is no answer (the proxy settings apply). api's request timeout is what is left of cfg.timeout after the lookup (RequestBuilder::timeout), so one api call waits at most cfg.timeout in all. page.api was already bounded as a whole by the run's remaining time."
    why: "With the lookup capped at the full request timeout, a proxied api call to a name whose resolver drops packets waited 15 s for the lookup and then up to 15 s more for the request, twice W-2's budget."
  - id: D-527
    text: "T-12b round 3 (amends D-518; review-T-12b round 2 should-fix 3). When srv-web's read before record already sees the new @fingerprint, it reads the tool's health row too: a retired tool (its file can still be in place when the archive step failed, D-316) keeps RunOutcome::Relocated, which toolstore refuses for a retired tool (T-7), so the run is not counted as clean (runs, last_ok unchanged). A run whose recorded row is retired, or whose record toolstore refused for a retired tool, removes the tool from this server's registry and never enables or re-registers it; the output carries the note. Test: t13b a_retired_tool_is_not_revived_by_a_second_repair."
    why: "D-518 recorded Ok, which toolstore accepts on a retired row, then enabled and re-registered the tool, so a retired tool came back in that process."
