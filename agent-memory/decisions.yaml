# One line per decision. Add, never delete. Reference ids in commits.
# Id ranges (D-42), so parallel branches never collide: supreme D-31..D-99, core D-100+,
# sheet D-200+, store D-300+, page D-400+, servers D-500+, driver D-600+. Append at the end
# of the list; this file merges with git union driver (.gitattributes).
decisions:
  - id: D-1
    text: "Claude Code is the only model path. No API keys, no .env, no other SDKs."
    why: "User rule; keeps the harness portable and auditable."
  - id: D-2
    text: "Rust for everything that touches the browser or the core; plain JS only inside the page."
    why: "Latency and one binary."
  - id: D-5
    text: "A challenge (captcha, Turnstile, hCaptcha, phone verify) means stop. No solving, no stealth, no fingerprint tricks."
    why: "User rule; not revisited."
  - id: D-6
    text: "The model never receives raw HTML or pixels except from explicit screenshot and video tools."
    why: "Token cost and reliability."
  - id: D-7
    text: "Priority order: efficiency > latency > throughput > token cost."
    why: "User criteria."
  - id: D-19
    text: "Gate is lenient: Read/Fill/Navigate/Submit/Send(known) allow; Send(new)/Pay/Account/Delete ask; Challenge stop. Overrides per domain+class in gate.rules."
    why: "User asked for lenient; irreversible classes still ask."
  - id: D-20
    text: "Mail and calendar are used through the browser (Gmail, Google Calendar web UIs) as site tools. No Gmail/Calendar API, no connectors."
    why: "User decision."
  - id: D-21
    text: "Memory is Postgres 16 + pgvector + pg_trgm behind a MemoryStore trait. Never two databases. SQLite+sqlite-vec and SurrealDB are future backends of the same trait."
    why: "One query joins facts, relations, recall, search, history; swap path kept open."
  - id: D-22
    text: "Forged tools are saved under tools/<eTLD+1>/ and announced in the skeleton on the next visit; readers return data, planners return act programs, a tool never gets hands."
    why: "Reuse instead of re-forging; safety."
  - id: D-23
    text: "Harness first, browser as a tool server. Phase 1 proves gate/vault/ledger/memory/scheduler on 22 use cases before any browser code."
    why: "Separate harness failures from browser failures."
  - id: D-24
    text: "New folder sheetbrowseV2_, start from scratch. Old sheetbrowse is reference only."
    why: "User decision."
  - id: D-25
    text: "Five Playwright ideas are borrowed (isolated-world script, actionability, auto-wait, event-driven targets, real input); nothing else is ported."
    why: "Those fix the bench failures; the rest serves human test authors."
  - id: D-26
    text: "No fixed sleeps in driver code; wait on a condition with a cap."
    why: "Bench: fixed waits were both too short and too long."
  - id: D-27
    text: "Planners are never dry-run against live sites; readers may be."
    why: "Bench failure F-7 (forge dry-run timeouts, risk of real submits)."
  - id: D-28
    text: "Text sent as Lokesh has no em dashes or double-dash separators."
    why: "User rule."
  - id: D-29
    text: "Repairs and forges can raise a gate floor, never lower it; cannot remove ?s; cannot add vault keys or widen @match."
    why: "Learn as data, never as permission."
  - id: D-30
    text: "Headless is never used with the 'me' profile; mail/calendar run headed (hidden window if scheduled)."
    why: "Login challenges and ToS; headless was blocked in 18/60 bench runs."
  - id: D-31
    text: "Search backend for srv-web W-1 is a local SearXNG container (compose profile `search`, 127.0.0.1:8888, JSON output on, limiter off), added by area servers in T-12. Brave free tier is not used."
    why: "No account, no token, no monthly quota for ~90 ladder runs; one compose file already exists. Cost: upstream engines can rate-limit SearXNG, so search() must report degraded results honestly; switching to Brave would be a new decision."
  - id: D-32
    text: "Embeddings: fastembed-rs with BAAI/bge-small-en-v1.5, 384 dims, computed locally in core-pg; memory.facts.embedding is vector(384)."
    why: "No keys (D-1); CPU ONNX is ms per fact at personal scale; 384 dims is a quarter of the HNSW memory of 1536. Cost: ~130 MB model download from huggingface.co on first use and an ort build on MSVC. Changing the model means a migration plus re-embedding."
  - id: D-33
    text: "Postgres runs from docker-compose.yml (pgvector/pgvector:pg16) on 127.0.0.1:5433 with trust auth on loopback; schema only via `harness db migrate` (sqlx). DATABASE_URL postgres://sb@127.0.0.1:5433/sb."
    why: "This machine's native PostgreSQL 17 on :5432 has no pgvector, and building it on Windows needs MSVC + nmake; the spec says 16; an image tag is reproducible. Trust on loopback means no password exists to commit."
  - id: D-34
    text: "Chromium is one pinned Chrome for Testing build for both profiles (bench, me), downloaded on first run into a git-ignored dir; exact version pinned in T-18. `profile login me` opens it headed with no debugging switch so the hand login is a plain browser session; agent runs reuse the profile over the pipe. The pin is bumped deliberately, at least every 4 weeks, each bump a decision."
    why: "One engine makes CDP behaviour and bench numbers reproducible; system Chrome auto-updates under the bench, and branded Chrome 136+ refuses remote debugging on its default profile. The bump cadence bounds how stale a browser holding live Google sessions can get. Unverified, check in T-18/T-27: H.264 support in CfT (B-9 mp4) and Google accepting the login."
  - id: D-35
    text: "The docs' crate `core` is packaged as `harness-core` (lib `harness_core`) in crates/core; read `core::x` in the docs as `harness_core::x`. Other crate names are as in docs/00."
    why: "A package named `core` shadows Rust's built-in core crate and makes `core::` paths ambiguous."
  - id: D-36
    text: "Class total order (derive Ord, used by max() for programs and floors): Read < Fill < Navigate < Submit < Send < Account < Delete < Pay < Challenge."
    why: "Classes whose ask times out to skip (Delete, Pay) must outrank those that time out to proceed (Send, Account), so taking the max never turns a skip into a proceed."
  - id: D-37
    text: "Element refs are `#12` (main frame) and `#f2.15` (frame 2), serialized as that string. IndexRow's serde JSON is the wire format from injected.js: snake_case fields, `bbox` named `box` on the wire and optional (fetched HTML has no layout), FieldValue as {kind: empty|filled|text, text}, flags as an object of booleans."
    why: "One shape for the live index, the fetched index and fixtures; `box` is a Rust keyword; srv-web cannot produce geometry."
  - id: D-38
    text: "Crate DAG (supersedes the docs/00 drawing, now updated): core <- core-pg; sb-sheet is a leaf; sb-act -> core, sb-sheet; toolstore -> core, sb-sheet, sb-act; sb-cdp is a leaf; sb-driver -> core, sb-cdp, sb-sheet, sb-act; sb-media -> sb-driver; srv-web -> core, sb-sheet, toolstore; srv-files, srv-cli -> core; sb-mcp -> core, sb-driver, sb-sheet, sb-act, sb-media, toolstore; toolforge -> core, toolstore, sb-act, sb-sheet; harness -> core, core-pg, toolstore."
    why: "The original drawing put the pure crates sb-sheet and sb-act above sb-driver, but I-10 makes sb-driver consume sb-act and every reviewer would have flagged that as a layering break."
  - id: D-39
    text: "Classifier hints select gate rules through the class key `Class:hint` (e.g. `Submit:job_application`) in gate.rules and MemoryStore::gate_rule. Lookup, first hit wins: (domain, Class:hint), then ('*', Class:hint), then (domain, Class), then ('*', Class), then the H-1.1 default. Migration 0001 seeds ('*', 'Submit:job_application', 'ask')."
    why: "H-1.2 wants the job-application rule scoped by a hint, but the table key is (domain, class) and I-1's gate_rule takes (domain, class: &str); encoding the hint in the class key needs no schema or trait change. Hint rules go first because they are the user's standing semantic rules and must not be undone by a broad domain allow."
  - id: D-40
    text: "Traits used as trait objects (MemoryStore, ToolHandler, Asker, Transport) use #[async_trait]."
    why: "M-2 requires Arc<dyn MemoryStore>; native async fn in traits is not dyn-compatible."
  - id: D-41
    text: "ledger.events.mode is a gate decision (allow, ask, stop) or how an ask ended (answered_proceed, answered_skip, timeout_proceed, timeout_skip): LedgerMode in harness_core::memory."
    why: "docs/01 acceptance expects to read `timeout_proceed` from the ledger, and the table has no separate outcome column."
  - id: D-42
    text: "Decision and blocker ids are allocated in ranges per author (supreme 31-99, core 100+, sheet 200+, store 300+, page 400+, servers 500+, driver 600+). agent-memory/decisions.yaml and blockers.yaml use git's union merge driver."
    why: "Four branches append to the same two files in parallel; ranges prevent id collisions and union merge turns guaranteed append conflicts into clean merges."
  - id: D-43
    text: "T-18 and T-19 no longer depend on T-17. Driver and page gate on swarm.yaml (page in wave 1, driver after page merges), not on the Phase 1 baseline."
    why: "docs/10 S-2 schedules page in wave 1 and driver in wave 2; blocked_by T-17 contradicted that. The supreme still keeps sb-driver out of the Phase 1 baseline run."
  - id: D-44
    text: "ToolStatus is ephemeral | saved | repaired | needs_repair | retired | ask; `pinned` is the tools.health.pinned flag, not a status."
    why: "M-3 stores pinned as a boolean, and T-5 introduces an `ask` status (floor raised, awaiting the user) that T-7's table omits."
  - id: D-45
    text: "migrations/0001_init.sql is M-3 plus: extensions created in the migration, vector(384) (D-32), a statement trigger that also blocks TRUNCATE on ledger.events, and the D-39 job-application seed rule. ledger.events keeps M-3's column name `args` (scrubbed), not H-3's `args_scrubbed`."
    why: "Append-only has to cover TRUNCATE; M-3 is the schema of record, so the name follows it and a column comment records the invariant."
  - id: D-46
    text: "The repo is local-only (no remote). An area's PR is its branch with `areas.<area>.status: pr_open` in its own swarm.yaml plus a final handoff; the supreme reads `swarm/<area>` directly and merges with scripts/swarm/merge.ps1. If a remote is added later, push + PR resume."
    why: "Worktrees share one object store, so pushing is unnecessary; creating a GitHub repo is an outward-facing step the user has not asked for."
  - id: D-47
    text: "Interface tiers: I-1..I-5 are CONTRACT (change only through interface_changes and a supreme decision); I-6..I-12 are DRAFT signatures the owning area may reshape before its first merge, recording each change under interface_changes so consumers see it. The supreme rewrites interfaces.yaml at merge."
    why: "Wave 0 fixes only what all areas code against today; the drafts were written ahead of their owners and should not freeze guesses."
  - id: D-48
    text: "Wave-0 contract corrections after a five-lens adversarial review (59 of 64 findings confirmed). I-1 gains run_start/run_end/run_get, schedule_add/list/rm/fired, gate_rule_set, review_add and ledger_events; append returns LedgerId; gate_rule returns GateRule{mode, strict}; duration_ms is i32; LedgerEvent.ts is microsecond-truncated (ts_now); contact keys are normalised (contact_key); neighbors walks both edge directions. I-2 is serve(server, tools, Harness) plus dispatch() for in-process tests, a live ToolRegistry for site tools, ToolSpec.description, async classify(ctx, args), Classified.what/values, ToolCtx::store/ask/registry and ToolOutput.stopped. I-3: Challenge stops before any rule lookup, a Send with no recipients is Send(new), strict = run OR rule, HINT_SIGNATURE. D-38 is amended: srv-web, srv-files, srv-cli and sb-mcp also depend on core-pg, whose bootstrap() builds the Harness. Migration 0001: NOT NULL wherever the Rust field is not an Option, gate.rules.strict, runs.strict, schedules.run_id, one statement-level append-only trigger, the signature rule. Compose: pinned pgvector/pgvector:0.8.1-pg16, postgres alone on network `db`, TCP healthcheck. D-33's 'trust on loopback' was wrong: trust covers every container on `db`, which is why nothing else may join it."
    why: "Without these, docs/01's scheduler acceptance, H-7, H-1.3's strict rules and the T-09 test seam could not be built against the contract, serve() had no way to get a store, and every later contract change would have broken four parallel areas at once. Cheaper to fix before anyone codes against it."
  - id: D-49
    text: "IndexRow.role is the lowercase ARIA role (textbox, button, checkbox, combobox, link, iframe). Sheet lines, @fingerprint items and `name:role` queries use short aliases (input, button, select, checkbox, link...) mapped to ARIA roles by sb-sheet's data/roles.txt, which both sb-sheet and toolstore::fingerprint read. Sheet lines print the alias."
    why: "The docs write `input \"Email\"` everywhere while B-5 says the role is the ARIA role; one alias table is the only way find, sheets and fingerprints agree."
  - id: D-50
    text: "Planner ?s rule (resolves B-1): every step classified Submit or higher must be immediately followed by `?s`; T-2's `...; c#btn; ?s` is the canonical shape. Permission comes from the gate's up-front check of the whole program's class; ?s guarantees nothing runs past a submit before the model sees the state. Enforced by sb_act::check_planner, the T-9 invariant, the G-2 static check and the guard_write/post_write hooks."
    why: "Read as 'before', ?s would make the submit in every Submit planner dead code, and the lenient gate (D-19) would need an extra model turn per registration (D-7: efficiency first). Read as 'right after', T-2's example, E-3's draft planner and D-29 ('a repair cannot remove ?s') all stay coherent."
  - id: D-51
    text: "sb-sheet in Rust is the only find/skeleton/sheet/read implementation, for the live and the fetched index. injected.js ships IndexRow[] and TextBlock[] (incrementally, via the dirty set) and does not score. This overrides B-6.2's 'Scoring runs in the page; only winners cross the wire'."
    why: "Two scorers (JS in the page, Rust for srv-web) would drift, and acceptance 6 would test one of them. The cost is moving the index over a local pipe (sub-ms to a few ms); the model's tokens are unchanged because only winners reach it either way."
  - id: D-52
    text: "Act DSL values: a bare value runs to the next `;` or the end of the program; a quoted value `t#7=\"a; b\"` may contain anything, with \\\" \\\\ and \\n escapes. sb_act::quote() and the tool page API's q(s) produce quoted values; planners must use q() for any argument."
    why: "Without quoting a value cannot contain `;`, and a planner interpolating a user-supplied argument could inject extra steps (`x; c#99`)."
  - id: D-53
    text: "Tool files run in an embedded JS engine (default rquickjs) in a toolstore `runner` module shared by srv-web and sb-mcp, without document, window, fetch, eval, import or require. Page API: find(q) and findAll(q) return refs without `#` (`12`, `f2.15`, so planners write `c#${id}`); text(region), table(id), url, title, q(s); and api(url) for @phase 1 readers, executed through srv-web's api tool and the gate as Read. sb-mcp evaluates @expects against the act's Consequences and reports RunOutcome::ExpectsMiss to toolstore."
    why: "I-12 named a page API and a runtime that nothing defined; T-3's acceptance needs a @phase 1 reader that calls api; toolstore cannot see sb-driver's Consequence type under D-38."
  - id: D-54
    text: "find(): the `?` weak mark compares the lexical part of the score (3*BM25 name + 1.5*nearby + 0.5*heading) with 3, not the total. docs/05 acceptance 6 runs with k = 1: the four top hits plus the always-appended CHALLENGE, OVERLAY and winning-submit rows, in document order."
    why: "With the total, role prior +2 and visible +1 reach 3 with no text match, so `?` could never fire. With the default k = 3 the newsletter Email legitimately appears, so the acceptance would be untestable as written."
  - id: D-55
    text: "A CHALLENGE container owns its subtree: a captcha container and its iframe are one row, flagged CHALLENGE (and OPAQUE when the frame is cross-origin), carried on the iframe row when there is one. Draft additions from the same review: State gains covered, input_type and autocomplete; IndexRow gains landmark and child_frame; TextBlock gains table and header (each TableRow span is one cell); element ids are never reused within a tab frame (walk({base}) per document generation, resolve -> {why: stale}); Driver::act takes &ToolCtx so @vault is resolved only into Input.insertText, and Driver gains index, text, tabs, close, dialog and download; Consequence and StepResult are serde; sb_act::classify returns ActClass{class, hints} so job_application/signature rules can fire for browser submits; FingerprintResult::Partial carries FpItems and RunOutcome::Relocated exists. The vault sink stays synchronous: the CDP payload bytes it returns exist only to be written to the pipe."
    why: "Each was a confirmed gap: B-6.2's covered term, B-7's Pay/Account evidence, sheet(region=landmark), W-5 tables, stale ids after navigation (B-4 #2), the vault reaching the driver's sink (H-2), D-39 hints for act, and T-4's relocate path."
  - id: D-56
    text: "B-2 resolved: Docker Desktop runs (reinstalled to E:\\apps\\Docker). migrations/0001_init.sql was applied to PostgreSQL 16.12 with pgvector 0.8.1 and pg_trgm 1.6, both standalone and inside one transaction (as sqlx does), in throwaway databases. Verified: zero-row UPDATE, UPDATE, DELETE and TRUNCATE on ledger.events all fail; vector(384) is enforced; the tsv, trigram and cosine paths return hits; hnsw.iterative_scan is available; NOT NULL holds; six gate rules are seeded. The `sb` database is left empty for `harness db migrate`."
    why: "The migration had been written blind; four parallel areas now rely on it."
  - id: D-57
    text: "Swarm mechanics after review. Worktrees live at <drive>:\\sb-swarm\\wt\\<area> (supersedes S-7's wt/<area>). Hooks run `python \"${CLAUDE_PROJECT_DIR}/scripts/hooks/<x>.py\"`; project settings exclude F:/aside_mcp for claude/CLAUDE.md through claudeMdExcludes. The merge gate takes an area's tasks from swarm.yaml, requires `Verdict: approve` and `Verdict: green` lines plus all-pass result cells, rejects duplicate YAML keys or ids after the union merge, and fails when the worktree's .claude/state/leaks.log is non-empty (canary hits are logged there). Reviewers get the Write tool for their report."
    why: "Claude Code loads CLAUDE.md from every ancestor directory, so worktrees inside the repo would also have loaded the enclosing browser-use instructions and main's working copy. Hooks run under Git Bash from the session's cwd, so relative script paths break after a cd. The original gate passed reports it could not read, and S-8's 'no leak fired' had no record to check."
  - id: D-400
    text: "Area page id sub-ranges: suborch D-400..D-409 / B-400..B-409, js-coder D-410..D-429 / B-410..B-429, rust-coder D-430..D-449 / B-430..B-449. Handoffs T-19-js-coder-<n>.yaml and T-19-rust-coder-<n>.yaml."
    why: "Two coders append to decisions.yaml and blockers.yaml in parallel in one worktree; sub-ranges prevent id collisions."
  - id: D-401
    text: "injected/ tests live in injected/test/ and run with `node --test injected/test/`; jsdom and playwright are devDependencies of injected/test/package.json only (node_modules git-ignored). injected.js and media.js stay single dependency-free ES2020 files. Playwright drives the locally installed Chromium against bench/pages/*.html served by a tiny node http server on two loopback ports (two origins, so same-origin and cross-origin iframes are both real)."
    why: "CLAUDE.md forbids runtime dependencies in injected/, not test tooling; file:// cannot produce a real cross-origin iframe or popup opener."
  - id: D-402
    text: "B-7 target classification defaults (sb-act): any step whose target row is CHALLENGE is Challenge. A click on a SUBMIT/submitish row, or Enter on a field in a form that has a submit, is Submit refined by its form: Pay if the form has a card/IBAN field (autocomplete cc-*, name/label card number/IBAN); Account if the form has a new-password field, two or more password fields, or create-account/sign-up/change-password/change-email text in the button, form heading or name; Delete if the button text says delete/remove/unsubscribe/trash or cancel <something>. A login (one current-password field) is Submit. A non-submit click is Delete by the same text rule, Fill on checkbox/radio/switch/option/tab, else Navigate. A bare 'Cancel'/'Close' button is Navigate, not Delete. Type/select/upload/other keys are Fill; scroll Navigate; wait and ?s Read. A target missing from the index classifies as Submit."
    why: "H-1's table defines Account as create account / change password or email, so a login is not Account; a bare Cancel closes dialogs on most sites and asking for it would waste a turn (D-7); an unknown target cannot be shown to be below Submit, and Submit forces ?s in planners without asking under the lenient gate."
  - id: D-430
    text: "Act DSL empty steps (`;;`, a leading or trailing `;`, whitespace-only programs) are skipped, not errors. Step numbers (ParseError.step, PlannerError.step, B-8 `step n`) count only real steps, i.e. index in parse()'s Vec + 1."
    why: "Planners build programs with template strings and joins, so a stray `;` is common and harmless; erroring would waste a model turn (D-7). Numbering by the Vec keeps parse errors, planner errors and act results pointing at the same step."
  - id: D-431
    text: "w() takes a decimal number and a required unit, ms or s, whitespace allowed (`w(3s)`, `w(1.5 s)`, `w(250ms)`); a missing or unknown unit is a parse error. The duration is clamped to sb_act::MAX_WAIT = 30 s rather than rejected."
    why: "A bare number is ambiguous between ms and s. w() is a settle wait capped at its duration, so a longer cap is only ever a worse cap; clamping keeps the program running instead of costing a turn, and 30 s bounds a runaway planner."
  - id: D-432
    text: "Act DSL lexing: step ops are lowercase only (t s c k u sc w ?s); whitespace is allowed around ops, refs, `=` and inside sc()/w(); sc() accepts down/up in any case or a ref. Quoted values accept exactly the escapes \\\" \\ \n, any other backslash escape is an error. An empty value is allowed only for t (clears the field: `t#7=` or `t#7=\"\"`); s, k and u need a value."
    why: "Strict escapes keep quote()/parse() an exact round trip and make a typo visible instead of silently changing a value; clearing a field is a real action, an empty select/key/upload is always a mistake."
  - id: D-433
    text: "sb-act Enter and form context (refines D-402): a key is Enter when its last `+` segment is Enter (`Enter`, `Control+Enter`). Enter on a SUBMIT/submitish row classifies as a click on it; Enter on another row in a form classifies as the max over that form's submit rows. A form is the rows with the same form id in the same frame; a submit with no form id has only itself as context. A login form (exactly one password field, autocomplete current-password, no new-password) ignores heading and form-name text for Account and uses only the button's own text. Card fields include rows with autocomplete cc-*, non-button rows named card number/IBAN, and iframe rows in the form named card/payment/IBAN (Stripe-style hosted card frames)."
    why: "Ctrl+Enter posts comments on many sites; the max over submits never under-classifies; `Sign in or create an account` headings are common on login pages and would turn every login into a 60 s Account ask; hosted card iframes are the most common checkout and carry no autocomplete."
  - id: D-434
    text: "sb-act hints: every submit-type step (click or Enter that resolves to a form submit, before Pay/Account/Delete refinement) may carry hints. job_application: a file input in the form whose name, nearby or heading says resume/resumé/résumé/cv/curriculum, or a form or button heading with apply/application(s), or a button name containing application. signature: the button name has `sign` not followed by in/up/out/on/off/into (Sign, Sign document, E-sign), or the button name, form headings or form row names contain signature/esign/esignature/docusign/e-sign."
    why: "The user's standing rule (H-1.2) must fire for job submits and e-signatures; hints only select rules (D-39) and never lower a class, so a false positive costs one ask while a miss lets a job application through unasked."
  - id: D-100
    text: "core-pg tests never touch the shared `sb` database. Each test creates a throwaway database `sb_t_<random>` on the server in SB_TEST_DATABASE_URL (default postgres://sb@127.0.0.1:5433/postgres), runs `migrations/` on it with sqlx::migrate!, and drops it at the end. Postgres unreachable = test failure with a message naming `docker compose up -d --wait postgres`, never a silent skip."
    why: "All worktrees share one compose container and `cargo test --workspace` runs core-pg tests from every area; per-test databases keep parallel areas and parallel tests from seeing each other's rows, and the append-only ledger cannot be cleaned any other way."
  - id: D-101
    text: "Vault backend: the `age` crate (x25519 recipient) encrypting a TOML map `name = {value, kind}` to vault.toml.age at SB_VAULT_PATH (default <config_dir>/sheetbrowse/vault.toml.age, outside the repo). Default KeySource is the OS keychain via the `keyring` crate (service `sheetbrowse`, account `vault`); the identity is generated on the first `vault set` when absent. IdentityFile is the fallback. Values live in `zeroize::Zeroizing<String>`. A missing vault file opens as an empty vault."
    why: "H-2 names age + keychain; keyring covers Windows Credential Manager, macOS Keychain and Secret Service with one API; generating the key on first set means no setup step and no key file in the repo (D-1)."
  - id: D-102
    text: "scrub() matches every non-empty vault value longest-first (aho-corasick, leftmost-longest), and also each value's JSON-escaped form and percent-encoded form, replacing any of them with `@vault(name)`. install_global() also installs a panic hook that scrubs the panic message before the previous hook prints it. Superseded in its details by D-118 (overlapping search, case-insensitive matching, literal protection, value floor, fail-closed build)."
    why: "Outputs are often JSON (tool results, ledger args, jsonl) or URLs; a value containing a quote, backslash or space would otherwise survive scrubbing in its encoded spelling. H-2 lists panics among the outputs."
  - id: D-103
    text: "Fastembed model cache is SB_MODEL_DIR (default <cache_dir>/sheetbrowse/fastembed), never the crate's default `.fastembed_cache` in the cwd. Embedding runs on spawn_blocking. recall()'s FTS side ORs the query's lexemes (to_tsquery with `|` built from plainto_tsquery's lexemes) and ranks with ts_rank; vector side is cosine top 20; fusion is RRF with k=60."
    why: "The default cache would litter every worktree and runs/; ONNX inference blocks; M-4 is a recall path, and AND semantics would drop a fact that matches two of three query words, which is exactly the docs/02 `Rust CDP crate` acceptance."
  - id: D-104
    text: "MCP stdio is hand-rolled in harness_core::mcp: newline-delimited JSON-RPC 2.0 with initialize, notifications/initialized, ping, tools/list, tools/call and notifications/tools/list_changed (protocol 2025-06-18). No MCP SDK dependency."
    why: "The surface the harness needs is six messages; an SDK pins a fast-moving API under every tool server and adds compile time to all of them."
  - id: D-105
    text: "Asks from a tool server process (Phase 1): bootstrap() installs a FileAsker. The card is written scrubbed to runs/<run>/asks/<n>.json and printed to stderr; the answer is `harness ask <run> <n> yes|no`, which writes <n>.answer; the asker waits on that file (notify watcher, no polling sleep) capped at card.timeout, then applies card.on_timeout. Tests use a scripted Asker."
    why: "A server launched by Claude Code owns stdio for MCP, so it cannot prompt; a file channel in the run folder is visible to the user, survives the 60 s window, and needs no extra service. MCP elicitation can replace it later behind the same Asker trait."
  - id: D-106
    text: "A run is launched through a `Launcher` trait in the harness crate. The default launcher runs `claude -p <prompt>` with SB_RUN_ID and SB_RUNS_ROOT in its environment (the tool servers read them in bootstrap()); tests use a launcher that does not call a model (rule 1). After the launcher exits, report.md is generated from the ledger and runs.ended/status are set."
    why: "H-5 says a firing starts a fresh Claude Code session; the scheduler acceptance (row, folder, report.md, parent_run) is about the harness, not the model, and must be testable without one."
  - id: D-107
    text: "Cron expressions are 5-field standard cron parsed with the `croner` crate, evaluated in UTC. harnessd wakes at the next due time across enabled schedules (tokio::time::sleep_until on a computed instant, re-read on change), never on a fixed poll interval. `harness schedule add` with no SB_RUN_ID creates its own run row (`<ts>-schedule-add`, status done) and stores it as schedules.run_id, so every firing has parent_run set."
    why: "docs/01 writes `*/1 * * * *` (5 fields; the `cron` crate wants 6+). Sleeping until a computed deadline is a wait on a condition, not a fixed sleep (rule 6). The acceptance needs parent_run set even when the schedule comes from the CLI."
  - id: D-108
    text: "harness_core::testing (cfg(test) or cargo feature `testing`) provides MemStore, an in-memory MemoryStore seeded with migration 0001's gate rules, and ScriptedAsker, an Asker that returns queued outcomes or applies card.on_timeout immediately and records every card. Gate, dispatch and echo tests use them; other areas may enable the feature as a dev-dependency."
    why: "D-48 says tool-server tests run dispatch with a fake store and a scripted asker; one shared fake avoids four diverging copies and keeps core's unit tests free of Postgres."
  - id: D-109
    text: "Resolves B-100: an ask times out to proceed only for Send(new) and Account with strict off; every other asked class (Pay, Delete, Submit including Submit:job_application and Submit:signature, and any Read/Fill/Navigate a user rule turns into an ask) times out to skip."
    why: "H-1.3 names only four classes; the standing rule 'job submissions and signatures are mine' means silence must never submit for the user, and a user who wrote an ask rule for a lenient class wanted to be asked, not overridden after 60 s."
  - id: D-110
    text: "Gate rule semantics after the T-04 adversarial review. (1) Keys are canonical: gate_rule_set (every MemoryStore backend) stores the class as Class::as_str() plus `:` plus the trimmed lowercase hint, and the domain trimmed, lowercased, trailing dot removed, or '*'; it rejects anything that does not canonicalise. Gate::lookup canonicalises call.domain and hints the same way. (2) Hint rules apply at the call's class or any lower class: for each hint, try (domain, C:hint) then ('*', C:hint) for C from call.class down to Read, first hit per hint. (3) When several hints match, the most restrictive mode wins (stop > ask > allow) and strict is OR-ed across them; any hint match beats the class-level lookup. (4) An ask times out to proceed only when not strict, not from a hint rule, and the class is Account or Send with at least one new recipient; every other ask times out to skip (refines D-109). (5) Every ask-card string (what, values) is control-stripped and length-capped, whether built by the gate or given by a classifier."
    why: "Confirmed bypasses: non-canonical rules were accepted then silently dead; an unrelated hint allow undid the standing job_application ask; a job application classed Account (password field) missed the Submit:job_application rule and proceeded on timeout; a user's ask rule for Send to a known contact proceeded after 60 s; page text with ANSI/CR could make a card misreport the action."
  - id: D-111
    text: "harness-core's integration tests get the `testing` feature through a self dev-dependency (`[dev-dependencies] harness-core = { path = \".\", features = [\"testing\"] }`), not `required-features`, so `cargo test --workspace` (the S-8 merge gate) compiles and runs them."
    why: "required-features silently skips the test binary when the feature is off, which would let the merge gate pass without running the acceptance tests."
  - id: D-112
    text: "Workspace rust-version is 1.94 (was 1.85). core-pg uses sqlx 0.9 (pgvector 0.4 requires it; one sqlx in the tree) with fixed-literal SQL, and fastembed 7; core-pg writes every timestamp from the Rust process (ts_now), never the database's now()."
    why: "sqlx 0.9 needs rustc 1.94 and fastembed 7 needs 1.88, so 1.85 was a false promise; two sqlx majors would double compile time and split types. The compose container's clock ran ~37 s ahead of the host and made due-time tests flaky."
  - id: D-113
    text: "Refines D-110 (2): a hint rule found at a class lower than the call's class can raise the class-level result (allow < ask < stop, strict OR-ed) but never lower it; a hint rule at the call's own class beats the class level as D-110 (3) says. A Send with no recipients asks (Send(new), I-3) and times out to skip. Canonicalisers are harness_core::gate::{rule_domain, rule_class_key, rule_hint, rule_key}; every gate_rule_set backend stores rule_key's output. A call.domain that does not canonicalise (e.g. host:port) gets only '*' rules."
    why: "Otherwise ('*','Read:newsletter','allow') would allow a Pay or Account call carrying the newsletter hint. A Send whose recipients the classifier could not name must never go out on silence. One canonicaliser shared by MemStore and PgStore keeps the fake and the real store from drifting."
  - id: D-114
    text: "migrations/0002_edges_dst.sql adds `create index on memory.edges (dst)` (M-3 plus one index). PgStore::connect runs the migrator with ignore_missing = true, so a binary built without a newer migration that another worktree already applied to the shared database still starts."
    why: "neighbors() walks edges in both directions and the only edges index leads on src: a depth-4 walk on a 3000-node, 15000-edge graph took ~2 s, ~80 ms with the index. All worktrees share one compose Postgres (D-100), so a strict migrator would refuse to start every branch that has not merged the newest migration yet."
  - id: D-115
    text: "search(): an exact hit is a case- and punctuation-insensitive equality on subject (score 1.0) or a substring of subject/key/value (score 0.9); the trigram tier uses word_similarity (`q <% subject`) with its score; results are ordered by score, tier only breaking ties. SM-2 rounds a fractional interval up (ceil), in PgStore and MemStore alike."
    why: "Name and domain lookups are what search() is for (M-1 job 4): 'Foo-Bar Inc' must beat a fact that merely mentions it, and a typo inside a longer subject ('Vasnth' in 'Vasanth Raghavan') must still hit. SM-2 as published rounds up."
  - id: D-118
    text: "Amends D-102 (T-05 round 3, amended in round 5). (1) scrub() runs one ASCII-case-insensitive aho-corasick automaton with Standard semantics and an overlapping search over every spelling of every non-empty value (vault::spellings: raw; lower- and upper-cased bases for non-ASCII values; JSON as serde writes it, with `\\/`, ASCII-only, HTML-safe as Go/Rails and System.Text.Json write it, and JSON inside JSON; Rust {:?}, escape_debug, escape_default, and {:?} or JSON nested inside {:?} or JSON; every percent-encode set incl. the WHATWG URL sets, and double encoding). The union of overlapping or touching match spans is replaced by the @vault(name) of its leftmost, then longest, match. (2) A match lying wholly inside a well-formed @vault(name) literal of an existing entry, or inside the fixed `@vault(` text of any opener, is ignored, so the @vault(name) literals of existing entries in the input stay parseable and scrub(scrub(s)) == scrub(s); the name inside an unknown or malformed literal is still scrubbed (with pw = hunter22, `@vault(xxhunter22yy)` scrubs to `@vault(xx@vault(pw)yy)`, which is idempotent and leaks nothing but gives BadReference), and a match that only overlaps a literal is kept and widened to cover the whole literal; scrub repeats until a pass changes nothing (at most 8 passes, after which the whole output is withheld as `@vault(?) [output withheld: scrub did not settle]`), so a literal scrub wrote cannot complete another value. (3) Vault::set refuses a non-empty value shorter than vault::MIN_VALUE_CHARS = 4 characters with VaultError::ValueTooShort { name, min } before touching the file; Vault::open refuses a file holding one the same way. Empty values are allowed and scrub nothing. Vault::in_memory (tests only) is exempt when built. (3b) set and open also refuse a non-empty value any of whose spellings occurs, ignoring ASCII case, inside `@vault(`, inside `@vault(n)` for any entry name n, or inside either withheld-marker text of (4) (SCRUB_WITHHELD, SCRUB_UNSETTLED; amended in T-05 round 6, since scrub would rewrite the marker itself) (VaultError::ValueInLiteral { name }, naming the entry whose value hides). Both errors name only the entry and point to `harness vault set <name>`. Vault::open_for_set skips these rules so that command can repair a file; set on that handle (and on in_memory) checks only the entry being set, and set on a handle from open checks every entry of the re-read file. (4) If the automaton cannot be built, open and set return VaultError::ScrubUnavailable and set writes nothing; an in_memory vault built with such values keeps a backstop, where every scrub returns `@vault(?) [output withheld: vault scrubber unavailable]`. On any vault, a scrub that hits the 8-pass cap of (2) returns `@vault(?) [output withheld: scrub did not settle]`. Both markers are malformed references, so vault_refs/resolve_into on them give BadReference: fail closed. (5) The panic hook prints a message that held a value itself, scrubbed, in the default hook's format; clean messages go to the previous hook."
    why: "A 1 to 3 character value (a middle initial, a state code) matched case-insensitively inside ordinary words and inside @vault(...) literals, which destroyed reader output, produced refs G-4 rejects, and would make the T-06 ledger (which fails closed when scrub changes a line) refuse ordinary lines; such a value protects almost nothing. A scrubber that failed silently withheld every output with no reported cause."
  - id: D-200
    text: "sb-sheet token counts are estimated as ceil(chars / 4) over the rendered UTF-8 text (sb_sheet::tokens::estimate). Used for the skeleton budget (B-6.1, 80-150), W-5 chunk_tokens (default 4000) and max_tokens."
    why: "The crate is pure and must be deterministic across live and fetched pages; a real tokenizer would add a dependency and model coupling for a budget that only needs to be roughly right."
  - id: D-201
    text: "sb-sheet's data files live in crates/sb-sheet/data/ (roles.txt, synonyms.txt), embedded with include_str! and parsed once (std OnceLock). roles.txt holds both the short alias -> ARIA roles table (D-49) and the query-word -> role prior table (B-6.2); both are public through sb_sheet::data so toolstore::fingerprint reads the same table."
    why: "Pure crate, no runtime file I/O; one table for find, sheet lines and fingerprints (D-49)."
  - id: D-202
    text: "find() candidates are rows with state.visible true and not flags.opaque-only content; a row with visible false is never a Match hit (still listed by sheet() with a `hidden` mark). Ties in score break by document order. The group-bonus form is the form owning the most part top-1 hits computed without the bonus; ties go to the form that appears first. The winning submit is the first row of that form with flags.submit or state.submitish. A row that is both a Match and an always-appended row appears once, with its Match reason."
    why: "B-6.2 leaves tie-breaks and hidden rows open; document order is the only stable tie-break across walks, and srv-web's approximated visibility (W-2) must not surface display:none distractors such as register.html's promo."
  - id: D-203
    text: "Sheet line format (B-6.3, also used for find output): `#id alias \"name\" [state...] [FLAGS...]`, e.g. `#7 input \"Email\" empty`, `#14 button \"Register\" SUBMIT`, `#3 iframe \"reCAPTCHA\" CHALLENGE OPAQUE`. Password values print only empty|filled; text values are quoted and capped at 40 chars. find output prefixes a weak hit with `?` (D-54). sb_sheet::sheet_line(row) and sb_sheet::find_lines(index, hits) are public so srv-web and sb-mcp render identically (I-6 draft addition)."
    why: "docs/00 and docs/03 write lines as `#12 input \"Email\" empty` and `button \"Register\" SUBMIT`; servers need one renderer, not two."
  - id: D-204
    text: "W-5 read cursor is opaque text `v1:<region>:<next block order>:<content hash hex>`; read(cursor) resumes at that block, so no text repeats. If the hash of the region's blocks changed, read restarts at chunk 1 and says so in the first line. Chunks break between blocks; a single block larger than chunk_tokens splits at sentence then word boundaries."
    why: "W-5 wants cursors that continue without repeating text; tying the cursor to block order (not byte offsets) survives re-rendering, and the hash makes a stale cursor visible instead of silently skipping content."
  - id: D-210
    text: "W-5 cursor detail (extends D-204, T-10): `v1:<region>:<order>[.<byte offset>][+<tokens used>]:<16 hex FNV-1a 64>`. The offset appears only when a block was split mid-body; `+used` only when max_tokens is set, so max_tokens caps the whole continued read (body tokens). The region is parsed from the right, so it may contain ':'. The hash is over the rendered units of the region. A cursor that does not parse reads from the start and says `cursor not understood` on the first line. When max_tokens is reached: cursor None, `truncated: max_tokens N reached`, the remaining outline is still listed. `chunk i of N` numbers come from the canonical plan from the region start with the current chunk_tokens."
    why: "D-204 alone cannot resume inside a split block or carry a whole-read budget across calls; both are needed for 'no repeated text' and 'max_tokens caps a whole read'."
  - id: D-211
    text: "W-5 selection and layout (T-10): main-less pages keep a block when score >= 0.5, score = 1 + landmark (nav/footer/aside -1.5, header -0.75, main/region +0.5) - 2*link density (non-headings) + 0.5 if >= 20 words / -0.5 if < 4 words (non-headings) - 1 if the same text repeats in two landmarks or 3+ times. Region resolution: a landmark name reads that landmark's blocks; otherwise a heading (`## FAQ` level first, then any level, exact text, then prefix, main content first, then the whole page) reads to the next heading of the same or higher level; no match reads the page with `region \"x\" not found` on the first line. A heading never ends a chunk when content follows. The remaining outline has one entry per heading (to the next heading of any level, body words only), `(top)` for text before the first heading, and counts only words not yet returned."
    why: "W-5 names the signals but not weights; these keep link-only and repeated header/footer blocks out while keeping a paragraph with a few inline links."
  - id: D-212
    text: "W-5 safety (T-10): blocks in a CHALLENGE row's child_frame, and in frames nested inside it, are dropped before selection (a landmark region cannot reach them); a block whose spans link a CHALLENGE row renders only the `[iframe \"reCAPTCHA\"](#id)` link forms. A span linking a password row renders `[input \"<row name>\"](#id)` and never the span text, and any FieldValue::Text on a password row is scrubbed to `***` from markdown and outline as defence in depth."
    why: "H-2 and D-5/D-55: the reader must stay safe even if a producer puts a challenge's text or a password value into a span."
  - id: D-205
    text: "find() scoring details (T-10, extends B-6.2, D-54, D-202): BM25 IDF is ln(1 + (N - n + 0.5)/(n + 0.5)) with N, n and avgdl computed per field (name, nearby, heading) over every row of the index, hidden rows included. Typed query words weigh 1.0; words added by synonym expansion weigh 0.5 (a word both typed and expanded keeps 1.0); expansion looks up every 1..3-word n-gram of the typed words and is not chained. The +2 role prior fires on n-grams of the typed words only, never on synonyms. `+1 visible / -2 covered or disabled` is either/or. A row needs lexical > 0 to be a Match, except for a bare forced role (`:button`). `name:role` splits at the last ':' and forces only when the suffix is a known alias or ARIA role, else the whole part is text. Rows in frames hosted by a CHALLENGE or OPAQUE row are never candidates. Appended CHALLENGE and OVERLAY rows and the winning submit must be visible; appended rows carry score 0.0 and weak false. A row hit by several parts keeps its highest-scoring part; weak uses its best lexical score."
    why: "On register.html, synonyms at full weight or a prior fired by the synonym `confirm` lets `Accept all` outrank the agree checkbox; half weight and typed-word priors keep acceptance 6 with a clear margin while still finding Postcode for `zip`."
  - id: D-206
    text: "Sheet line and sheet() details (T-10, extends D-203): an empty name is omitted (`#4 generic`); names are whitespace-collapsed, capped at 80 chars with `...`, and `\"` becomes `'`. SUBMIT prints for flags.submit or state.submitish. A row is a password field when input_type is `password` or autocomplete contains `password`; it prints only empty|filled. Options print as `[a, b, c, d, e, +N more]`. sheet(region) matches, in order: landmark, form id, `form` (every form row), exact heading, heading substring; a leading `#` (`## Heading`) forces heading mode; all case-insensitive. Rows of frames hosted by selected rows come along; rows in frames hosted by CHALLENGE or OPAQUE rows are never listed. An unknown region returns `no region \"x\". regions: <landmarks, form ids, ## headings>`; an empty selection returns `no elements`."
    why: "D-203 fixes the shape but not these edges; one renderer is shared by srv-web and sb-mcp, so they must be pinned."
  - id: D-207
    text: "Skeleton format (T-10, B-6.1): lines in order, empty ones omitted: title; URL; `landmarks: a, b`; `form f1 \"heading\": N fields, submit \"name\"` (at most 5 forms); h1/h2 joined by ` · ` (at most 6; rows' section headings as `h X` when there are no text blocks); `N elements: L links, B buttons, F fields`; `! CHALLENGE #id alias \"name\"`, `! OVERLAY ...`, `! dialog: \"text\"` (meta.dialog) and `! dialog #id ...` (dialog rows), at most 3 per kind; meta.site_tools verbatim; content hint. Counts, forms and warnings use visible rows outside CHALLENGE/OPAQUE-hosted frames. Fields are textbox searchbox combobox listbox checkbox radio switch slider spinbutton. Content hint: `main: form` when main holds form fields and under 300 non-heading words, else `main: article N words, M tables` (`, form` appended when it holds one); `page:` over non-chrome blocks when there is no main landmark. register.html renders 10 lines, about 98 tokens."
    why: "B-6.1 lists the items, not their rendering; a fixed, plain-ASCII-marker format keeps it deterministic and inside the 80-150 token budget."
  - id: D-208
    text: "Data file formats (T-10, D-201): roles.txt has `alias <alias>: <aria> <aria>...` lines (alias_for = first alias listing the role, else the role itself; every listed role is a known role for `name:role`) and `prior <aria> <aria>...: word, multi word, ...` lines (a word on several lines accumulates roles). synonyms.txt has one symmetric group per line, entries separated by `|`, about 200 lines, no transitive closure across lines. Keys of both match in normal form (lowercase, split on non-alphanumerics, joined by one space), so `e-mail` == `e mail` and `sign-up` == `sign up`."
    why: "Simple line formats a human can extend without touching code; normal-form keys make the scorer's tokenizer and the tables agree."
  - id: D-213
    text: "find() synonym phrases (T-10, amends D-205): a multi-word synonym (`postal code`, `sign up for updates`) is one phrase term that matches only where its words appear consecutively in a field; its BM25 tf and df count phrase occurrences, and it weighs 0.5 per word. A synonym phrase equal to an n-gram the caller typed is not added again. Single-word synonyms keep weight 0.5."
    why: "Splitting phrases into loose words let generic parts (sign, in, code, number) give a strong unmarked Match on unrelated controls, e.g. `subscribe` -> `Sign in` SUBMIT (review round 1, item 7)."
  - id: D-214
    text: "find() query evidence and role nouns (T-10, amends D-205's lexical gate): a row is a Match candidate when lexical > 0 or the part's role prior covers its role (a bare forced role lists every row of that role); a row scoring only the visible/covered term is not a hit. So an unnamed searchbox is found by `search` as `?#1 input` (score 3, lexical 0, weak by D-54). roles.txt gains `noun <aria>...: word, ...` lines (button, link, field, dropdown, check box, radio button...): when a part's typed words hold a role noun, the noun's roles replace that part's task-word priors, longest noun first (`radio button` is radio only)."
    why: "B-6.2's formula has no text gate and D-54's why assumes prior-only rows can surface with `?`; the state term alone carries no query information and would list arbitrary rows. `help button` must prefer the button over the link that `help` primes."
  - id: D-215
    text: "CHALLENGE rows are always reported (T-10, amends D-205 and D-207): find appends and the skeleton warns about every CHALLENGE row outside a CHALLENGE/OPAQUE-hosted frame, whether or not state.visible is true. Counts, forms, OVERLAY rows and the winning submit still use visible rows only."
    why: "Rule 3 / D-5: a challenge means stop, and producer visibility (srv-web W-2) is approximate, so a hidden-flagged challenge must not go unreported."
  - id: D-216
    text: "W-5 reader (T-10, amends D-211/D-212): only a `main` landmark in the top frame (frame 0) switches the page to main-only content; a `<main>` inside an iframe is that document's landmark and is boilerplate-scored with everything else. Blocks in frames hosted by CHALLENGE or OPAQUE rows are dropped (sheet::sealed_frames, shared with sheet/find/skeleton). Password rows use sheet::is_password (D-206: input_type or autocomplete). Password values are scrubbed from each rendered unit (and in their whitespace-collapsed spelling) before chunking and hashing. When a chunk holds only headings and the next unit does not fit, that unit is cut into the room left, at least a quarter of the chunk, so a heading never makes a chunk alone. A forged cursor `+used` saturates instead of overflowing."
    why: "Review/audit round 1 items 1-2, 5, 10-16: one password and sealed-frame definition across renderers, no split leaking a secret across two reads, no wasted read call on a lone heading, no panic on caller input."
  - id: D-217
    text: "find() synonym groups (T-10, amends D-205 and D-213): the synonyms of one typed n-gram are alternatives, not a sum: per field a row scores only the best term of each n-gram's synonym group, and groups add (each typed word is its own group; a term reached from two n-grams stays in the first). A synonym that is the typed n-gram respelled (same letters once spaces are removed: `e mail` for `email`, `signup` for `sign up`) weighs 1.0, as a typed word; other synonyms keep 0.5 per word. IDF is computed once per term per part and field, so a phrase's df scan is not repeated per row."
    why: "Review/audit round 2 items 4 and 10: overlapping expansions (`e-mail` phrase + `mail`) stacked to 1.5 so a synonym-only `E-mail` outranked the exact `Email` and flipped the group-bonus form; and the per-row phrase df rescan made find quadratic on large pages (seconds at 5000 rows)."
  - id: D-218
    text: "Sealed frames and escapes across renderers (T-10, amends D-212 and D-216): a reader span that links a row inside a CHALLENGE/OPAQUE-hosted frame renders the outermost host row's link form (a CHALLENGE host reduces the block as D-212 says), or nothing when the host is not in the index; plain text and outline labels follow the same rule. Password values are scrubbed in every escaped spelling the renderer produces (pipe -> backslash pipe, `[ ]` -> `( )`, double quote -> `'`, all combinations) and span text is scrubbed before escaping. sheet(region) never matches, and the unknown-region list never names, the landmarks, form ids or headings of rows or blocks in sealed frames. Skeleton's content hint uses only a frame-0 `main`, like the reader. Code blocks split at the last line break that fits and resume with the next line's indentation intact; only a cut inside an over-long line drops the spaces at the cut. A huge chunk_tokens saturates."
    why: "Review/audit round 2 items 1, 5-9: challenge-frame text and refs reached the model through spans and the no-region message, escaped password values slipped past the literal scrub, split code lost indentation, and chunk_tokens*4 could overflow."
  - id: D-300
    text: "toolstore resolves eTLD+1 with the `psl` crate (public suffix list compiled in, ICANN and private sections), then `_site.yaml` aliases. No list file is downloaded or vendored."
    why: "folder_for runs on every fetch/open; a compiled-in list needs no I/O, no network on first run and no refresh job. Bumping the crate version bumps the list."
  - id: D-301
    text: "toolstore reaches sb-act through an object-safe trait `PlannerCheck { check(program, index) -> Result<ActClass, String> }` with a default `SbAct` impl that calls sb_act::parse, classify and check_planner. Tests and callers may pass a fake; no cargo feature."
    why: "sb-act is a todo!() stub until area page merges; a trait object lets T-9's planner invariants be tested now and swaps to the real classifier with no code change in toolstore."
  - id: D-302
    text: "tools.health counters are per version: `runs` is the current clean streak (success += 1, any failure resets it to 0) and `fails` counts failures (misses included) in the current version; a version bump resets both. '3 clean runs' = runs >= 3; 'retired after 5 misses' = fails >= 5 while needs_repair. Lifetime totals come from the ledger."
    why: "T-7 needs a clean-run streak and a miss count, ToolHealth (I-1 contract) has only runs and fails, and per-version counters are what `harness tools list` should show for the current file."
  - id: D-303
    text: "T-7 'ephemeral deleted if unused 14 days or 10 site visits' is executed as retire + move to tools/_archive/ (status retired, why recorded, ledger event); the archived file is deleted 90 days later. ToolStore::sweep(store, now, visits) does both; site visit counts are passed in by the caller (reflect counts them from the ledger)."
    why: "T-7 says deletion is always retire -> archive -> delete and CLAUDE.md forbids deleting a tool file directly; toolstore has no visit counter of its own."
  - id: D-304
    text: "Fingerprint semantics (T-4): items match a row by role (alias or ARIA role, D-49) and case/space-insensitive name; `form#f2` matches when any row has form == f2. All found -> match; at least half found and the rest relocatable candidates exist -> partial(missing); otherwise miss. A needs_repair tool that matches or relocates again becomes `repaired` with version += 1."
    why: "T-4 names the three outcomes without thresholds; docs/03 acceptance needs a fixed page to bring a needs_repair row back via relocate at version 2."
  - id: D-305
    text: "Tool files run in rquickjs 0.14 inside toolstore::runner (D-53): a fresh context per run with document, window, globalThis.fetch, eval, Function, import and require absent; the page API is host functions; `api(url)` calls a caller-supplied `ApiFetch` trait object (srv-web wires it to its gated api tool). Runs are capped by an interrupt handler (wall cap, no sleeps)."
    why: "T-9 requires `page` to have no document/window/fetch, which only a runner can prove; srv-web (T-12/T-13) and sb-mcp need the same runner. rquickjs 0.14 builds on this machine's MSVC toolchain (quickjs-ng)."
  - id: D-306
    text: "Loader reporting: ToolStore::scan(domain, path) returns LoadReport { tools, skipped: Vec<(PathBuf, why)> }; load() is scan().tools. Files with a bad header are skipped and listed, never fatal. toolstore has no logging dependency; callers log `skipped`."
    why: "T-9 says the loader ignores and logs invalid files; the workspace has no logging crate and a returned list is testable."
  - id: D-307
    text: "Repairs come in two kinds. Relocate may change only @fingerprint (any other header change is rejected). Re-forge may change the body and raise @gate (status ask until the user confirms) but may not lower @gate, reduce the planner's `?s` count or fail sb-act's ?s rule, add an @vault key the old file did not use, rename the tool, or put a scheme, host, `//` or `..` in @match. Violations return StoreError::Invariant and are written to tools.health.why."
    why: "T-9 and G-4 list the invariants; T-5 lets a re-forge raise the floor while T-9 forbids a repair changing @gate, so the two kinds are separated."
  - id: D-308
    text: "Runner sandbox detail (refines D-305): `Function` stays as a global that throws on call (so `instanceof Function` works) and every function constructor reachable through prototypes is replaced by it; rquickjs's Eval intrinsic stays loaded because module loading needs it, but no JS-reachable eval exists. ApiFetch::api receives the run's remaining wall time and must return within it; reader output is capped by RunOpts.max_output."
    why: "Deleting Function outright breaks ordinary instanceof checks in tool code; module eval is how rquickjs loads ES modules. A host call with no deadline would let a hung fetch outlive the T-9 cap (review-T-11-runner should-fix 2, 3)."
  - id: D-309
    text: "Vault keys in tools (G-4, D-29) are enforced at run time, not only by text search: every @vault(k) in a planner's output program must appear as a literal `@vault(k)` in the tool's source file, else planner_act_class returns StoreError::Invariant. The static check_repair text search stays as the early check."
    why: "review-T-11-core blocking 3: a re-forge can build `@vault(` by string concatenation; only the emitted program is authoritative, and comparing it with the source's literal keys closes the bypass without parsing JS."
  - id: D-310
    text: "Only confirm() leaves `ask` (T-5). While a row is ask: record(Ok) counts runs but keeps ask, Relocated patches the fingerprint and keeps ask, misses/failures count fails and keep ask, a further reforge keeps ask. Domains and tool names that become paths must be a single normal component matching [a-z0-9._-] (domain also not starting with `.` or `_` except the reserved `_generic`); git calls use --literal-pathspecs."
    why: "review-T-11-core blocking 2 and 4: input strings reached filesystem paths and git pathspecs unchecked, and three paths turned an unconfirmed raised floor back into a runnable tool."
  - id: D-311
    text: "Refines D-303/D-310 after the fix round. Sweep idle clock: max(last_ok, last_fail); a tool that never ran counts from the later of its @forged date and the file mtime. Tool names are [A-Za-z0-9_-]{1,100} (upper case allowed, since parse_header accepts it); domains are `_generic` or [a-z0-9._-] with no leading `.`/`_`, no trailing `.`, no Windows device names. folder_for returns \"\" for hosts that cannot be a folder (non-ASCII, separators, traversal); every path builder refuses \"\". IDN hosts must arrive as punycode (URL hosts already are)."
    why: "Counting from @forged alone retired a tool registered seconds earlier from an older file; rejecting upper case would make valid headers unrecordable; returning \"\" keeps I-7's folder_for -> String and fails closed without a punycode dependency."
  - id: D-58
    text: "B-430 decided (supersedes the Pay clause of D-402): Submit is raised to Pay when the submit button's name, or the form's heading or name, says checkout, place order, confirm order, pay or pay now, buy now, complete purchase, or add card, in addition to D-402's card/IBAN field evidence. The text rule only raises the class, never lowers it; class order stays max() (D-36)."
    why: "docs/01 H-1's table lists checkout, add card and confirm order as Pay. Under D-402 a saved-card checkout has no card field, classifies as Submit, and runs under the lenient gate without an ask, which is the one path the gate exists to stop. A false Pay costs one ask; a missed Pay costs money."
  - id: D-403
    text: "sb-act raise-only refinements after review of T-19 (extends D-402, D-433, D-58; never lowers a class): (1) a key step is classified as a click on its row unless the key is known not to activate (Tab, Shift+Tab, Escape, arrows, Home/End/PageUp/PageDown, Backspace/Delete-key editing, modifiers alone, printable characters into a textbox); Enter/NumpadEnter/Space/any +Enter or +Space on a button, link, submit or checkable row = click(row); an unknown key is never below click(row). (2) Enter on a field in any form is at least Submit and goes through the form evidence even when the form has no indexed submit row (implicit submission); Enter in a formless textbox is Submit. (3) Account evidence: change-email/change-password/2FA/two-factor/security-key text in the heading or form name counts even in a one-current-password form. (4) Delete evidence also comes from the form heading or form name (delete/remove/deactivate/close account/cancel <x>/unsubscribe/discard/erase/revoke/trash), not only the button. (5) Pay words add payment, purchase, buy, donate and subscribe-and-pay phrases; card fields also by name/label/placeholder CVC, CVV, security code, card expiry/expiration, cardholder. A submit in a form containing a CHALLENGE row keeps its own class: the CHALLENGE row is itself in the index and the gate stops on it (D-5, D-55)."
    why: "Review of T-19 sb-act (bench/results/review-T-19-sb-act.md) showed a key step or a submit-less form could lower a Delete/Pay/Account target to Fill, breaking CLAUDE.md rule 4; the Should items were H-1 categories D-402 missed. Each change only raises, so the cost is at most an extra ask."
  - id: D-404
    text: "sb-act follow-ups to D-403 (raise-only except (1)): (1) 2FA/two-factor/2-step/MFA/security-key text is Account evidence only with a set-up verb (enable, set up, turn on, turn off, disable, add, remove, manage, change, reset); a 2FA code prompt during login stays Submit. (2) In a form or dialog whose heading or name carries Delete evidence, an affirmative button (confirm, yes, ok, continue, proceed, delete, remove, or a SUBMIT row) is Delete even when not SUBMIT; bare Cancel/Close/No/Back/Keep stay Navigate. (3) The Delete key (and Shift+Delete) on a non-text row is Delete; inside a textbox it stays Fill. (4) check_planner rejects any step whose target is a CHALLENGE row, with or without ?s (D-5: a challenge means stop, so a planner may never target one)."
    why: "(1) corrects D-403 (3): it made every 2FA login ask, though H-1 lists enabling 2FA as Account, not using it; (2) and (3) were under-classifications the fix coder left open (Gmail's Delete key trashes mail; 'Delete account?' dialogs confirm with a plain button); (4) closes a planner path to a challenge."
  - id: D-410
    text: "injected/ test tooling (refines D-401): injected/test/package.json pins playwright-core 1.59.1 (its browsers.json names chromium-1217, installed under ~/AppData/Local/ms-playwright; SB_CHROMIUM overrides the executable) and jsdom ^26. Playwright tests install injected.js exactly as sb-driver will, with Page.addScriptToEvaluateOnNewDocument(worldName sb) over a CDP session, and evaluate in that world's execution context. The two origins are 127.0.0.1 on two ephemeral ports (same site, different origin, so the cross-origin frame is in-process). The test server answers HTTP Range requests because Chrome only seeks media served with byte ranges. `node --test injected/test/` loads injected/test/index.js, since Node 22 runs a directory argument as a module."
    why: "playwright-core downloads nothing and uses the browser already on the machine; installing in world sb over CDP tests the real isolation path, not page.evaluate in the main world."
  - id: D-411
    text: "Which elements are IndexRows: interactive controls (ARIA widget roles, tag roles, behaviour-clickables), headings, iframes (one row each), CHALLENGE widgets (one row, on the iframe when there is one), dialogs (role dialog/alertdialog, open <dialog>, aria-modal), and fixed/sticky containers that turn out to be OVERLAY. Text is not in the index; it travels as TextBlocks from text(). Interactive rows own their subtree; dialogs, overlays and headings that hold links do not. Composite containers (custom listbox, menu, tablist) are not rows, their items are. A role=combobox/textbox wrapper around a real input is not a row, the input is. visibility:hidden elements are not rows (their visible descendants can be); opacity:0 controls are rows."
    why: "B-5 lists what a row carries but not which elements become rows; sb-sheet needs headings for skeletons and dialogs/overlays for find's always-appended rows, and the model never acts on plain text."
  - id: D-412
    text: "Name ladder order as built: aria-labelledby, aria-label, label[for], wrapping label, then for name-from-content roles (button, link, checkbox, radio, option, menuitem, tab, treeitem, heading, row) and button-type inputs their own text BEFORE title/placeholder (accname order), then placeholder, title, alt, words to the right (checkbox/radio), nearby text, and the HTML name attribute last; icon-only links fall back to their last href path segment. A short (<= 80 chars) non-heading aria-labelledby target is consumed like a <label>; nearby text used as a name is consumed too. Names are capped at 150 chars, nearby at 80, values at 200, select options at 25."
    why: "B-5 puts title before own text and `name` at rung 5: for buttons and links that names `Go to homepage` instead of the visible `Home` and `action` instead of `Save` (the name attribute is a form key); for fields, which have no own text, the order is the spec's. Visible text near a field is a better name than a form key."
  - id: D-413
    text: "Passwords and other sensitive fields (type password, autocomplete cc-*/one-time-code/current-password/new-password, name or id matching pass/pwd/secret/token/otp/cvc/cvv/csc/ssn/pin/iban/card number/security code) report value empty|filled WITHOUT calling the value getter: required + validity.valueMissing, else selectionEnd > 0, else :placeholder-shown, else validity flags only a value can raise, else empty. The jsdom test wraps the password's value getter and fails if it is ever called."
    why: "CLAUDE.md rule 5 says passwords are never read from the DOM; computing value.length would still read the string. The heuristic can call a filled field empty when the caret sits at position 0 and nothing else is known; a wrong `empty` costs a retype, a read password is a breach."
  - id: D-414
    text: "Landmark = nearest enclosing ARIA or HTML landmark (main, nav, header/footer unless scoped inside article/aside/main/nav/section, aside, dialog, section with a label = region, role search/form = form); <form> elements are NOT landmarks here because IndexRow.form already carries them (text(region=f2) selects blocks by form). Row and TextBlock heading = the last preceding heading whose own landmark contains the row (so a footer heading does not label a cookie banner after it)."
    why: "With <form> as a landmark, region=main would lose every control in a main-area form; nearest-heading-by-document-order alone mislabels content after a footer."
  - id: D-415
    text: "OVERLAY: a visible fixed or sticky element intersecting the viewport that either hit-tests over some row's centre (it covers it), or (fixed only) covers >= 25% of the viewport, or covers >= 2% and is a dialog/aria-modal or has cookie/consent/gdpr/modal/popup/overlay/newsletter/subscribe/paywall/interstitial/lightbox in its id, class or aria-label. Fixed/sticky elements that are none of these (sticky headers at rest, chat bubbles) are not emitted. covered = the element's first in-viewport client-rect centre hit-tests (through open shadow roots) to something outside the element and its labels; off-viewport rows are never covered."
    why: "B-5 says fixed/sticky and covering without a threshold; flagging every sticky header would put an OVERLAY row into every find() result."
  - id: D-416
    text: "settle(opts {quiet=150, cap=3000} ms, also quiet_ms/cap_ms) resolves {settled, changed}: settled when (a) no mutation for `quiet` ms counted from the later of the call and the last mutation, (b) no running animation (finite or infinite) whose target is inside a node added or changed in the last second, (c) document.readyState is past loading, and (d) the body has content (a control, media, visible text or a filled shadow root); otherwise {settled:false} at the cap. The only timers are the cap and a timer to the instant (a) can first hold, re-armed by each mutation; animation waits race the animations' finished promises."
    why: "Counting quiet from the call keeps a click's delayed render from being reported as no visible change; (d) is what makes acceptance 5 hold for an SPA that renders on a timer (no network to wait on); spinners are usually infinite animations on inserted nodes, so they must count."
  - id: D-417
    text: "Behaviour role: an element with an onclick attribute (or an onclick property visible in this world), or the topmost element of a cursor:pointer run (its parent is not pointer), with content (text, img/svg, aria-label or title) and no interactive descendant, is a button (a tr is a row named `a | b | c`). label, option, body and html are never behaviour buttons. Listeners added with addEventListener are invisible to an isolated world; that is accepted."
    why: "B-5's div with click handler + cursor:pointer cannot be read literally from an isolated world; the topmost-pointer rule avoids a row for every nested span under one clickable card."
  - id: D-418
    text: "fingerprint(spec) semantics: items are role[#id][quoted name] with optional trailing uppercase flags (SUBMIT CHALLENGE OVERLAY OPAQUE); roles go through an in-page copy of the D-49 alias table (keep it in step with data/roles.txt); form#fN means that form id exists; #digits means that row id, #word that DOM id; a name matches case-insensitively by equality or containment. Items are matched independently. All matched -> match, none -> miss, else {partial: [the raw missing items]}."
    why: "T-2/T-4 give the format but not the matching rule or the miss threshold; containment keeps a renamed `Register now` button matching `Register`, and raw items let toolstore relocate exactly what is missing."
  - id: D-419
    text: "act(id) why strings: gone (removed or never issued), stale (below base), challenge (row inside a CHALLENGE widget or frame; act refuses), hidden, not stable (moving), disabled, outside the viewport, `covered by <tag>#id|.class (OVERLAY #n)` when the hit is inside a fixed/sticky layer, `covered by <desc> (#n)` when it is inside a known row, `does not receive pointer events (hit <desc>)` when the hit is an ancestor. Each rAF wait is capped at 100 ms because rAF never fires in a background tab. The returned {x, y} is the centre of the first client rect clipped to the viewport (a wrapped inline link is clicked on its first line), in frame viewport CSS px."
    why: "sb-driver turns the final why into the B-8 step error, so the strings must be stable and match the docs' example; the cap keeps act from hanging in an unfocused tab."
  - id: D-420
    text: "media.js installs a separate frozen globalThis.__sbMedia in world sb: list() (id from __sb.id, kind file|mse|stream|drm with blob: URLs reported as mse, duration, live, captions, visible, box, paused, time, size, readyState), cues(id, track?), frames(id, times, {size=512, type, quality, hashOnly, seekCapMs=5000}) and frame(id, t, {size=1280}). frames pauses, seeks with an event wait capped per seek, draws to a detached canvas, returns a data URL plus a 19-hex hash (mean colour + 64-bit average hash) and restores time and play state. DRM -> protected, cross-origin without CORS -> tainted, unseekable -> not seekable, videos in a CHALLENGE container or frame are never listed or drawn."
    why: "B-9's in-page path needs a page API that I-11 does not list; a separate global keeps injected.js one concern. Hashes let sb-media find scene changes at 1 fps without moving pixels."
  - id: D-421
    text: "walk/index/text/frames details: walk(opts) accepts a boolean (B-5's walk(dirty?)), {base, dirty: true} or {dirty: [ids]}; base is adopted on the first walk only. index(), text(), frames() and fingerprint() refresh the dirty set themselves before answering. Cached per element between walks: role, name, nearby, form, landmark, options, input_type, autocomplete, submit/submitish/opens_new_tab, challenge. Recomputed on every index(): box, visible, covered, overlay, enabled, checked, value, opaque (typing and checking change no attribute). index() omits State fields equal to sb_sheet::State::default() (visible/enabled true, other booleans false, empty options) and false flags. text() emits a placeholder block (kind other, one span naming the frame with elem = the iframe row) where a non-challenge iframe sits, for sb-driver to replace with the child frame's blocks. frames() returns this frame as {frame:0, parent:null, url, opaque:false, challenge} plus {frame:null, id, parent:0, url, opaque, challenge, name} per iframe row; sb-driver maps id to its frame through DOM.getFrameOwner."
    why: "Live fields cannot be cached because they change without a mutation; omitting serde defaults roughly halves the index on the pipe; the in-page side cannot know sb-driver's frame numbers."
  - id: D-59
    text: "B-200 accepted: I-6 (draft) gains sb_sheet::sheet_line, sb_sheet::find_lines, sb_sheet::data::{aria_roles, alias_for, role_prior, synonyms}, sb_sheet::tokens::estimate and the `skeleton` example binary; toolstore joins I-6's consumers. No existing signature changes. toolstore drops its built-in alias map (B-300) for sb_sheet::data once both areas are merged."
    why: "Additive and within D-38 (toolstore -> sb-sheet is already an edge). D-49 needs one alias table for find, sheets and fingerprints, and D-51's single-scorer rule extends to a single line renderer; two copies would drift and acceptance would test one of them."
  - id: D-60
    text: "IC-300 accepted: I-7 (draft) is split into pub modules header, domain, loader, fingerprint, invariants, lifecycle, archive, runner with every wave-0 name re-exported at the root, and gains ToolStore::{scan, tool_path, archive_path, archive, git_commit, health, register_forged, reforge, confirm, set_pinned, log_invariant, sweep}, free fns relocate, planner_class, planner_act_class (through PlannerCheck, D-301) and check_repair (D-307), and StoreError::Git. record, reforge and sweep never commit; the caller commits with its task id. harness joins I-7's consumers (reflect calls sweep)."
    why: "Additive, and every name is an entry point docs/03 already requires (T-1 commits, T-4 relocate, T-7 sweep, T-9 and G-4 invariants) that the wave-0 draft had not named. Keeping commits with the caller keeps one task id per commit, which CLAUDE.md's task-id rule needs. PlannerCheck keeps toolstore -> sb-act inside D-38 without a cargo feature."
  - id: D-61
    text: "IC-301 accepted: I-12 (draft) gains toolstore::runner::{PageHost, ApiFetch, run_reader, run_planner, *_with, RunOpts, RunError, SheetPage} per D-305 and D-308, with B-320 (table shape), B-321 (url/title are properties) and B-322 (sync traits, callers use spawn_blocking and Handle::block_on) taken as the contract; B-323's 2 s default stays and srv-web may pass a larger RunOpts.timeout for @phase 1 readers."
    why: "D-53 defined the page API in prose only; srv-web (T-12/T-13) and sb-mcp need one exact shape before wave 2 starts. Synchronous host traits match how JS host calls work, and a fresh !Send runtime per run means nothing crosses threads."
  - id: D-62
    text: "B-101 accepted (I-1 contract, behaviour only): harness_core::memory::contact_key normalises with trim() + to_ascii_lowercase() instead of Unicode to_lowercase(); signature unchanged. Non-ASCII characters are compared as written."
    why: "Unicode lowercasing folds compatibility characters (U+212A KELVIN SIGN -> k), so a look-alike address would match a known contact and a Send would be allowed without an ask (H-1.1). ASCII folding can only make an address look new, which costs one ask; nothing is stored yet, so no migration is needed."
  - id: D-63
    text: "B-400 accepted: I-10 (draft) gains pub const sb_act::MAX_WAIT: Duration = 30 s; w(n) is clamped to it (D-431). sb-driver's settle cap for w() reads MAX_WAIT instead of its own constant."
    why: "Additive; one constant keeps the parser's clamp and the driver's settle cap from drifting."
  - id: D-405
    text: "injected.js rulings after review of T-19 JS (bench/results/review-T-19-js.md). (1) Sensitivity is sticky: an element ever seen as type=password, with computed -webkit-text-security other than none, or autocomplete current-password/new-password/one-time-code stays sensitive for its lifetime (WeakSet) and only ever reports empty|filled. (2) Ids are issued only after walk({base}): before the first based walk, id(), index(), text(), fingerprint(), state(), name() and frames() issue no ids and return {why: \"no base\"} (functions returning arrays return that object instead); resolve(id) is stale for an id below base that this document never issued, gone for one it issued and lost. media.js calls __sb only after a walk. (3) The page-is-a-challenge check matches known challenge hosts and paths (challenges.cloudflare.com, /cdn-cgi/challenge-platform, google.com/recaptcha, recaptcha.net, hcaptcha.com, arkoselabs.com, funcaptcha, geetest) and the 'Just a moment...' interstitial title, never the bare substring captcha; a challenge page yields one CHALLENGE row for the page instead of an empty index. (4) CHALLENGE detection adds: 'verify you are human' / 'are you a robot' / 'press and hold' text in any visible block, Arkose/FunCaptcha and GeeTest containers and frames, g-recaptcha-response/h-captcha-response/cf-turnstile-response fields. (5) The reCAPTCHA v3 / invisible badge (.grecaptcha-badge, invisible widget with no visible challenge frame) is not CHALLENGE; a visible reCAPTCHA challenge frame (bframe) or v2 checkbox is. (6) heading level is an integer clamped to 1..6. (7) D-414 amended: a <form> with an accessible name is landmark form (ARIA); an unnamed form is not. (8) settle(): the D-416 content wait applies only while the document has script elements and the body has no rendered content, and lasts at most opts.content_ms (default 1000 ms); about:blank, a body that is only embed/object (PDF) and script-less pages skip it; infinite CSS animations never hold settle. (9) media.frames() has a total budget (default 8 s, under the 10 s command timeout) and returns what it has with truncated: true; media.js reads CHALLENGE from __sb rows instead of its own copy of the detection. (10) Wire shape is proven against the Rust types: injected/test writes index() and text() of bench/pages/register.html to injected/test/fixtures/*.json (committed), and an sb-act integration test deserializes them into Vec<IndexRow> and Vec<TextBlock> and classifies the real Register row."
    why: "(1)(2) were Blocking: a show-password toggle leaked the value (rule 5, rule 2 via @vault) and an un-based first call reused ids across document generations (D-55); (3)-(5) a URL substring emptied normal pages while real interstitials went undetected, and the invisible v3 badge would make every v3 login a stop with nothing for the user to solve; (6) one bad aria-level failed the whole text() deserialize; (8) blank and PDF pages burned the full 3 s cap on every step (D-7); (9) frames() could outrun the command timeout with the video paused; (10) the key-name check did not prove the Rust types accept the output. sb-act already depends on sb-sheet, so the round-trip test needs no new edge."
  - id: D-406
    text: "sb-act rulings after round-2 review (bench/results/review-T-19-sb-act.md, raise-only). (1) Key values: \r, \n and \r\n are Enter; only U+0020 and U+00A0 are Space; any key containing a control character is unknown and classifies at least as click(row). (2) Enter on any row inside a form is max(click(row), the form's implicit-submission class) whatever the row's role (buttons, links, switches, checkboxes included); this restores D-433's form max. A submitish field also takes the max over the form's other submits. A file input is not a text field for key steps (keys on it are click(row)). (3) The one-time-code exemption from card evidence applies only to a field whose sole card evidence is the phrase 'security code'; CVC, CVV, CSC, cardholder, MM/YY, expiry and card number still count. (4) check_planner first scans every step for a CHALLENGE target and returns ChallengeTarget for the first, before any MissingStop. (5) Form evidence is computed once per form per classify() call (cache keyed by frame + form id), so Enter stays linear in the index. (6) An affirmative button sharing a heading with Delete wording is Delete even outside a form or dialog landmark. (7) Word lists: Pay adds 'submit order', 'upgrade' (as a submit or plan-change button), 'subscribe' with a price; Account 2FA terms add passkey and authenticator app (still need a set-up verb, D-404 (1)); Delete adds 'clear history', 'clear data', 'clear all', 'empty trash'. Site keyboard shortcuts (Gmail '#') are left to hand-written site tools (T-27)."
    why: "(1)-(3) were round-2 Blocking lowerings (a raw CR in a quoted key value ran a Pay as Fill; Enter on a switch in a checkout ran as Fill; an unrecorded exemption hid CVC fields); (4) saves the planner a wasted repair turn (D-7); (5) a 1 700-row form cost 2.5 s per Enter; (6)(7) close H-1 gaps found in the same review. Every change only raises a class."
  - id: D-407
    text: "sb-act word lists, final for T-19: Pay adds complete order, order now, place bid, renew (on a submit), top up, send money, transfer money/funds; Account set-up verbs add create (so 'Create a passkey' is Account). Sanctioned as coded: 'Cancel and ...' / 'Cancel or ...' ('Cancel and close', 'Cancel or go back') are Navigate like a bare Cancel; Backspace on a non-text row stays click(row). From here a missing word in a list is a Should item, not Blocking: Blocking is reserved for structural paths (a step kind, key, role or form shape) that come out below their target's class."
    why: "Three review rounds closed every structural lowering; word lists are open-ended and each round found a few more synonyms. Adding the money words named in round 3 costs nothing; ruling list gaps non-blocking stops an unbounded loop while keeping rule 4's structural guarantee. 'Book now' and 'Reserve' stay Submit because free bookings are H-1's own Submit example."
  - id: D-422
    text: "injected.js challenge text (D-405 (4)): an element (not html/body) whose own text (direct text nodes plus leaf inline children) is 8..200 characters and matches verify you are human / verify you are not a robot / are you a robot|human / I am not a robot / human verification / press and hold becomes a CHALLENGE row (role group unless it already has a row role, name = that text). With at most two visible controls inside it owns its subtree; around more controls it only marks rec.challenge, so act refuses them and text() skips them. A dialog or heading whose name matches also sets rec.challenge. Captcha response fields (g-recaptcha-response, h-captcha-response, cf-turnstile-response) make their parent a challenge box. Box names add geetest, funcaptcha, arkose; frame labels add verification challenge, arkose, funcaptcha, geetest. Buttons, inputs, links, labels, forms, main, body and html are never boxes (a v3-bound <button class=g-recaptcha data-sitekey> stays a normal SUBMIT)."
    why: "The review reproduced a Cloudflare interstitial with no CHALLENGE row (prompt in a <p>, widget in a closed shadow root); the 200-character limit keeps an article that quotes the checkbox text from becoming a stop."
  - id: D-423
    text: "media.js (D-405 (9)): frames(id, times, opts) still returns one entry per time, in order; entries not reached within opts.budgetMs (default 8000) or after the first seek timeout are {t, why, truncated: true}; every event wait is min(seekCapMs, budget left); a readyState 0 video (preload=none) gets load(). Ids, lookups and CHALLENGE come only from __sb: before the first based walk every call returns {why: no base}, without __sb {why: no __sb}. A CHALLENGE row carried on an iframe also covers its widget container: the iframe ancestors up to the first one holding a real control, or body/form/main."
    why: "An aligned array lets sb-media map results to its times without a second shape; stopping after a timeout keeps the call under the 10 s command timeout; the container rule keeps a video inside a captcha container refused although D-55 puts the row on the iframe."
  - id: D-424
    text: "A challenge page (D-405 (3)) yields index() = one row {id of documentElement, role document, name challenge page (host), flags.challenge, box = viewport}, text() = one other block whose span links that row, frames() = only the self entry with challenge true, walk().count 1; name(), state() and act() read nothing inside. The page check is by host (challenges.cloudflare.com, recaptcha.net, hcaptcha.com, arkoselabs.com, funcaptcha.com, geetest.com, google.com/recaptcha/) or path (/cdn-cgi/challenge-platform/) or the title Just a moment...; a frame src in the parent may also match by the captcha/turnstile substring (the widget labels itself). reCAPTCHA v3 / invisible (B-402): the badge, data-size=invisible, a size=invisible frame, and any challenge frame that is not visible (the hidden bframe) are ordinary rows, never CHALLENGE. For sb-driver: the parent row is authoritative for its child frame; do not read a child frame whose owner row is not visible, so a hidden bframe child (whose own __sb answers with its challenge-page row) never turns a v3 page into a stop."
    why: "An empty index for a challenge page was an unreported stop (rule 3 needs it reported); the child of a hidden or passive widget would otherwise report a challenge the parent deliberately did not."
  - id: D-425
    text: "Ids before the first based walk (D-405 (2)): walk() without an integer base > 0 before the first based walk returns {why: no base} and walks nothing; a base given to a later walk is ignored (ids keep their numbers for the document lifetime); resolve() before the first based walk and for any id below base answers stale, for an id at or above the next unissued id gone; role(), resolve(), act() and settle() work before the base."
    why: "Every id the document issues is then in [base, next), so stale vs gone is a range test that does not depend on call order."
  - id: D-426
    text: "Sticky sensitivity details (D-405 (1)): the MutationObserver records attributeOldValue, so an element whose old type was password or old autocomplete was current-password/new-password/one-time-code joins the sensitive set even if no walk saw it; finishRow registers every input and textarea. state.input_type reports the live type. Because a type swap resets the caret, the last empty|filled evidence (taken at a read or at the field's last input event, from caret and validity only) carries over when the type has changed since; the next edit replaces it."
    why: "Chromium resets selection on a type change, so the toggled field read as empty although filled (no leak, but a wrong state for the model)."
  - id: D-427
    text: "settle() details (D-405 (8)): when content_ms expires on a quiet scripted page that is still empty, settle resolves settled: true (quiet held; there is just nothing). Attribute and text mutations only count animations on the changed node itself (html and body always self); added nodes count their subtree; animations with infinite end time are ignored; recent-change entries hold WeakRefs and are pruned after 5 s."
    why: "The content wait is a bounded hint, not a failure; the review showed one class toggle on <html> letting an always-on shimmer hold settle to the cap."
  - id: D-428
    text: "Wire fixtures (D-405 (10)): injected/test/gen-fixtures.js writes injected/test/fixtures/register.index.json and register.text.json from Chromium (1280x720, walk base 1, integer boxes); browser.test.js fails when the live output differs (boxes compared for presence only, since they depend on fonts); crates/sb-act/tests/wire_from_injected.rs deserializes both and classifies the real Register click as Account. Test helpers open() in browser.test.js and accept-t19.test.js now run the first based walk as sb-driver does; frames.html serves its captcha child from /cdn-cgi/challenge-platform/ (the test server maps that prefix to bench/pages)."
    why: "A captured fixture catches JS/Rust drift such as the aria-level bug in CI; a substring URL can no longer mark the fixture frame, so it moved to a real challenge path."
  - id: D-408
    text: "sb-act, raise-only, after round-3 review: (1) a non-submit button (role button/menuitem, not a link) inside a form, or sharing a heading with one, applies the same Pay and Account word checks as a submit (D-58, D-406 (7), D-407, D-403 (3)), so a React-style type=button 'Complete purchase' in a card form is Pay; a non-submit button is also Pay when its form has card evidence and the button name has any Pay word. (2) A key chord containing Enter, Return or NumpadEnter in any position, or a key value with trailing/leading separators or whitespace around Enter ('Enter+', 'Enter+Shift', ' Enter'), is treated as Enter. 'Leave group' and 'Wipe device' join the Delete words."
    why: "Round-3 review Should 1: checkouts built without a submit button are common and D-402's 'non-submit click is Navigate' let their Pay buttons run without an ask, the one path the gate exists to stop; Should 2 was a structural lowering that depends on how sb-driver splits chords, so it is closed here rather than left to the driver."
  - id: D-64
    text: "IC-302 accepted (amends D-61, I-12): ApiFetch::api(&self, url: &str, remaining: Duration) must return within the run's remaining wall time, and a late return (Ok or Err) makes the run RunError::Timeout; RunOpts gains max_output (default 64 KiB) with RunError::OutputTooLarge{max, got}; q(undefined|null) throws TypeError. srv-web's and sb-mcp's ApiFetch impls must honour `remaining`."
    why: "A hung host fetch outlived T-9's wall cap because the interrupt handler only runs when JS resumes (B-323), and reader output had no size bound (CLAUDE.md rule 5). Changing the trait now costs nothing; wave 2 has not written an impl yet."
  - id: D-65
    text: "IC-303 accepted (amends D-60, I-7): StoreError::BadPath; public try_tool_path, try_archive_path, valid_domain, valid_name, check_tool_id; folder_for returns \"\" for hosts that cannot be a folder and every mutator refuses it; planner_class and planner_act_class reject an @vault(k) the tool source does not contain literally (D-309)."
    why: "review-T-11-core blocking 1-3: path traversal through domain or tool names, git pathspec magic, and a re-forge reaching a vault key by string concatenation (G-4). Consumers need the validators to reject bad input before calling a mutator."
  - id: D-66
    text: "B-401 accepted (I-10): PlannerError gains ChallengeTarget{step}; check_planner rejects any step whose target row is CHALLENGE, with or without ?s, before the ?s rule. MissingStop{class: Challenge} no longer occurs. toolstore's and toolforge's matches on PlannerError must handle the new variant."
    why: "D-5: a planner never targets a challenge. A named variant lets toolstore and toolforge (G-2) report it instead of folding it into a missing-?s error."
  - id: D-67
    text: "B-410 accepted (I-11): injected/media.js installs globalThis.__sbMedia {list, cues, frames, frame} in world sb, beside __sb; shapes live in its header and D-420; video ids are __sb ids. sb-media becomes an I-11 consumer. It ships with the page area but is Phase 2 code (swarm.yaml page note) and is not part of the Phase 1 baseline."
    why: "B-9's in-page seek and canvas path needs a page API that I-11 did not name; keeping it a separate global leaves __sb's surface unchanged for sb-driver."
  - id: D-68
    text: "B-411 accepted (I-11): act(id) returns a Promise; walk(true) and walk({dirty: [ids]}) are accepted; frames() entries may carry challenge, and child entries with frame:null carry id/name; text() emits an iframe placeholder block (kind other, elem = iframe row); index() omits State fields equal to State::default() (D-421). Every reader of I-5 JSON deserializes State with serde(default); sb-sheet's State already does."
    why: "Additive, and sb-driver (wave 2) must code against what the page really returns. Omitting default state fields shrinks the index on the pipe; verified that sb_sheet::index::State is #[serde(default)] on swarm/sheet, so I-5 still round-trips."
  - id: D-69
    text: "B-102 (Postgres backends exiting with code 2 three times, 08:34-09:19 UTC): no docker-compose.yml change during wave 1. Areas keep throwaway databases (D-100) and re-run a test that hits recovery mode, reporting the Postgres log line. The supreme revisits shm_size (256mb) and log settings at the wave-1 gate, when no area is running tests."
    why: "The container log shows no shared-memory or out-of-memory error and the crashed backends logged nothing, so shm is a guess, not a diagnosis. Any compose change recreates the one shared container on the next `docker compose up`, which would kill every other area's tests mid-run. No crash since 09:19 UTC."
  - id: D-70
    text: "B-103 accepted (I-3 contract, additive): pub fn harness_core::gate::clean_card(card: AskCard) -> AskCard exposes the D-110 (5) control-character strip and caps the gate already applies. ToolCtx::ask (I-2) and every other card builder call it; the copy in mcp.rs (card_line) is removed in favour of it."
    why: "Two sanitisers for the same card drift, and a card that skips one path can carry ANSI or CR text that misreports the action (the D-110 finding). Making the gate's own helper public is additive and leaves one place to test."
  - id: D-71
    text: "B-104 accepted (I-2 contract, additive): harness_core::mcp gains serve_io(server, registry, harness, reader, writer), PROTOCOL_VERSION and scrub_value(vault, &Value); new module harness_core::ask {FileAsker, answer, asks_dir, card_path, answer_path}. tools/call for a name not in the registry answers JSON-RPC error -32602 (MCP 2025-06-18 'Unknown tool') rather than an isError result; dispatch() still returns ToolError::Args."
    why: "The MCP spec puts unknown tools under protocol errors (-32602), while isError is for a tool that ran and failed; following it keeps clients like Claude Code from treating a typo as a tool failure. serve_io is the stdio transport's test seam and ask::answer is what T-08's `harness ask` needs, so both belong in the contract file."
  - id: D-72
    text: "IC-304 accepted (I-7 draft), with one condition: the further pub items (runner ALLOWED_GLOBALS/FIND_ALL_K/table_json, invariants stop_count/vault_keys, archive has_task_id, domain normalize_host/registrable/SiteConfig, fingerprint helpers, loader namespace/glob_match/url_path, skeleton_line, the lifecycle constants) and behaviours (record(Relocated) on a retired row errors; a reforge of an ask row stays ask) are contract for consumers. Consumers call try_tool_path/try_archive_path only; tool_path/archive_path, which return an empty PathBuf on bad input, stay for wave-0 compatibility and are marked #[deprecated] by store in a follow-up (not a merge blocker)."
    why: "toolforge's G-2 static check reuses these helpers, so wave 2 should see them before coding. An empty PathBuf as an error sentinel joins to the tools root and is easy to write through; IC-303 already makes every mutator refuse it, so the risk is in new callers, which the try_* rule covers."
  - id: D-73
    text: "B-412 accepted (I-11 draft): un-based reads return {why: \"no base\"} (array calls return that object), walk() without a base returns it, resolve() answers stale; sb-driver walks with a base after every navigation before any read. A challenge page reports index() = [one CHALLENGE row, role document], text() = [one other block], frames() = [self with challenge: true]. __sbMedia list()/cues() may return {why}, frames() entries may carry truncated: true, opts.budgetMs defaults to 8000."
    why: "The un-based first call reused ids across document generations (review-T-19-js Blocking 2, against D-55), and an empty index on a challenge page was a stop nobody reported. sb-driver and sb-media are not written yet, so the shape change costs nothing now."
  - id: D-74
    text: "I-7 paths corrected to match swarm/store deeab04 (supreme second-opinion review): try_tool_path and try_archive_path are ToolStore methods, not root functions (archive.rs); parse_fingerprint, render_fingerprint and patch_fingerprint live in toolstore::header and are re-exported at the crate root, not in toolstore::fingerprint. D-65 and D-72 read with these paths. No code change on the branch."
    why: "The IC-303 and IC-304 proposals named the wrong paths and D-65/D-72 copied them, so a wave-2 consumer coding against I-7 as written would not compile. The code's layout is fine; the contract text was wrong."
  - id: D-409
    text: "sb-act, raise-only, after round-4 review (resolves review-T-19-sb-act round 4 Blocking 1, Should 1, Should 2): (1) a key value is classified as the maximum over every class its segments imply: Enter in any position gives enter(row), and Delete/Del in any position or U+007F anywhere on a non-text row still gives Delete, so 'Enter+Delete', 'Control+Enter+Delete', 'Enter\u007f' and 'Delete+Enter' are Delete (or higher). (2) Any button or menuitem row (not a link), with or without a form, whose name matches pay_words (the phrase list, not the single PAY_TOKENS words) is Pay; this covers a formless 'Pay $20.00' and a Stripe-style checkout whose card form sits in another frame. (3) A 2SV set-up whose verb and noun sit in different headings stays Submit (known word gap, no change)."
    why: "D-408 (2) returned the Enter class before the Delete merges ran, lowering 7 chord shapes from Delete to Navigate/Submit on a mail row, which hard rule 4 forbids. pay_words is a phrase list strict enough to run without form context; one extra ask on a formless Pay button is cheaper than an unasked payment. The split-heading 2SV case needs cross-row phrase matching that would raise unrelated rows."
  - id: D-429
    text: "injected.js, after review-T-19-js round 2 (resolves its Should 1 and 2): (1) an input or textarea added by the same mutation batch that removed a sensitive field, in the same parent or at the same position (replaceWith, show-password toggles that rebuild the element), inherits sensitivity, and the sensitive-name pattern gains pw_ and pw- prefixes; its value is never read. (2) 'press and hold' is CHALLENGE text only next to a human, robot or bot word, and a bare 'Are you human?' heading without a challenge widget, response field or challenge host is not CHALLENGE. Chord keys stay '+'-separated only (Playwright and CDP convention); sb-driver rejects '-' chords such as 'Ctrl-Enter' instead of passing them through (note for area driver, I-9)."
    why: "Hard rule 5 says passwords are never read from the DOM, and a rebuilt element was a live leak path that D-405 (1) did not cover. Challenge false positives stop real tasks (file pickers, voice buttons) for nothing, which costs a whole hand-back to the user."
  - id: D-117
    text: "Ledger::write fail-closed rule (refines D-102 for the ledger, T-06): after scrub_event, every data field (server, tool, args, result_summary, consequences, why), serialized exactly as it appears in the jsonl line, must come back unchanged from scrub(), else LedgerError::Unscrubbable { fields } and nothing is inserted or written. Fields the harness generates itself (id, run_id, which must equal the ledger's own run, ts, class, mode, duration_ms measured by the wrapper, ok) and the line's key names and JSON punctuation are not checked: a vault value equal to a year, a duration, a mode or a key name is a coincidence there, not a leak. run_id is the one exempt field that is not purely harness-made: its slug comes from the prompt and was scrubbed against the vault only when the run was created (run::slugify). A value added to the vault mid-run, or held by a tool server with another vault, is not re-checked against it; this is accepted because the run folder's name holds the slug anyway. The rule does not rely on any minimum vault value length (D-118)."
    why: "Outside data can only enter a ledger line through the data fields, which still fail closed; checking the whole line made a 4-digit PIN equal to the year refuse every write, which loses the H-3 ledger and protects nothing."
  - id: D-119
    text: "T-07 round 2 (H-6, H-1.3, H-1.4, I-2). (1) ToolCtx::ask runs every mid-call card through Gate::check as a Call {class = card.class, domain = card.site, the enclosing call's server, tool, scrubbed args and hints, no recipients, strict = runs.strict}: Stop -> no card, a core stop event, TimeoutSkip; Ask -> the card proceeds on timeout only if the gate's card, Gate::on_timeout(class, strict) and the handler's card all proceed (so a strict or hint rule makes it skip); Allow -> the handler's card is still shown, tightened by Gate::on_timeout; a gate error -> shown with on_timeout Skip. (2) A run with no runs row (run_get Ok(None)) reads as strict in dispatch and ToolCtx::ask; a failed lookup refuses the call in dispatch (ToolError::Failed, the handler never runs) and reads as strict in ToolCtx::ask. (3) Every Asker call is capped at card.timeout + 5 s; a cap hit, or a TimeoutProceed on a card that says Skip, counts as TimeoutSkip. (4) FileAsker returns TimeoutSkip when it cannot create asks/ or write the card, and closes an ask by claiming <n>.answer no-clobber (temp file + hard_link): its own timeout writes `timeout`, so ask::answer refuses (ErrorKind::AlreadyExists) an ask already answered or timed out. (5) dispatch catches a handler or classifier panic: isError reply and an ok=false tool event. (6) Outgoing JSON-RPC scrubs only payload strings (result.content[*].text, result.tools[*] name/description/inputSchema, error.message), never id, jsonrpc, method or protocolVersion. (7) Diagnostic and stop lines are scrubbed, then cleaned by gate::clean_card, then scrubbed again. (8) A non-UTF-8 input line answers -32700 and serve_io keeps reading."
    why: "Rule 4: a mid-call escalation is a side effect whose class must meet gate.rules (strict, hint, stop), not only runs.strict, and a proceed on timeout must mean the user saw the card and stayed silent. An answer nobody reads must not look accepted. Cleaning before scrubbing let truncation or whitespace collapse reshape a vault value past the scrubber (rule 2). Scrubbing the envelope let a short vault value rewrite the id or protocolVersion."
  - id: D-121
    text: "report.md event-shape contract (T-06; H-3, H-4, Q-4, Q-5; binds the T-07 wrapper and T-09 site tools). ledger::report reads only these shapes, documented in the ledger.rs and mcp.rs module headers. (1) Tool event: server = the tool server, tool (a site tool is named after its site), class, mode = allow | answered_proceed | timeout_proceed (None counts as allowed) or stop when the handler returned a stopped output (why = the reason), ok, args (the target is the first of url href to path file id message_id thread query q domain), result_summary, consequences (paths inside the run's files/ go on the Files: line). (2) Read: counts ok class=Read calls outside core, one per distinct target, bucketed mails / files / pages / other by server, tool and target host. (3) Ask outcome: server = core, mode = one of the four outcomes, class and tool of the asked call, why = the card's what line. (4) Stop: server = core, mode = stop, why = the reason, tool and args of the call. One listing per stopped call: a tool stop event is grouped with the next event of the same (tool, args) when that is a core stop (the trailing one), and with the core stops of the same (tool, args) right before it whose ts lies inside the call (ts - duration_ms, plus 100 ms slack). Every other core stop is a call of its own, so a resumed run (H-1.4) stopped again on the same tool and args lists a second stop. A group shows its first core stop's why, and Result: stopped (...) shows the last group's why. (5) A failed call (ok = false, not a stop or skip) is resolved by a later ok call with the same server, tool and target; otherwise it is listed with class, why, consequence and fallback (the next non-core event, or none). (6) Core events with other modes (allow, ask) are not read, and core events never count as failures."
    why: "The report is derived from the ledger alone, so a writer that changes an event's server, mode, tool or args silently changes what the user is told; a decision binds T-07 and T-09 to the shapes, and grouping stops by call instead of by run keeps a second stop after a resume visible."

  - id: D-116
    text: "T-08 placement and loop rules (refines D-106, D-107). (1) The Launcher trait (and a Clock trait with SystemClock and a test ManualClock) live in harness_core::sched, not the harness crate, because the core::sched loop calls them; the harness crate implements ClaudeLauncher and re-exports the trait. (2) harness is one crate with a lib and two bins (harness, harnessd); deps clap, rpassword, core-pg, toolstore (tools subcommands, I-7 try_* paths per D-74), notify, and sqlx only so `db status` can read _sqlx_migrations without migrating. (3) Schedule changes wake harnessd through a marker file: `harness schedule add|rm` calls sched::notify_changed(runs_root), which writes <runs_root>/.sched/changed; harnessd watches that folder (notify, non-recursive) and re-reads schedule_list. No poll interval. (4) Due rule: the next croner occurrence strictly after max(last_run, the first time this loop saw the schedule, the loop's last attempt); occurrences missed while harnessd was down coalesce into one firing; a schedule whose previous firing is still running skips; schedule_fired is written before the run starts, so a failing firing never hot-loops. (5) watch and reflect rows are stored but the Phase 1 loop skips them with one log line (T-16); sched fire() returns SchedError::NotInPhase1 for them. (6) A firing writes a core ledger event sched.fire; a launcher error or non-zero exit writes a core launch event (ok false), sets runs.status failed unless the ledger says stopped, and the report's Result line says failed. (7) ClaudeLauncher: scheduled runs are `claude -p` with the scrubbed prompt on stdin (not argv, so a prompt starting with '-' is not a flag and Windows quoting cannot break it), SB_RUN_ID and an absolute SB_RUNS_ROOT in the environment, stdout scrubbed into files/answer.md; `harness run` is interactive `claude <prompt>` with inherited stdio."
    why: "The loop in core cannot name a trait defined in a crate above it. A marker file is the only cross-process change signal reachable without adding LISTEN/NOTIFY to the MemoryStore contract, and it keeps rule 6 (wait on an event, not an interval). Coalescing and write-before-launch keep a down daemon or a broken prompt from producing a burst of runs."
  - id: D-120
    text: "T-04 round 3 gate semantics (refines D-110, D-113; resolves review-T-04 round-2 should-fix 1 and 2). (1) rule_domain returns the A-label form URL hosts carry: trim; U+3002, U+FF0E, U+FF61 become '.'; full-width ASCII becomes ASCII; lowercase; one trailing dot removed; each label with non-ASCII letters is Punycode-encoded (RFC 3492, xn--). A label may hold only ASCII a-z 0-9 - _ or non-ASCII letters and digits that are neither default-ignorable nor in a compatibility block; there is no NFC/NFKC, so decomposed or compatibility input is refused, never mapped. Labels <= 63, names <= 253 characters. rule_hint accepts only ASCII a-z 0-9 _ - . after ASCII lowercasing (so KELVIN SIGN and full-width hints are refused). (2) Cards: the invisible set is Unicode Default_Ignorable_Code_Point plus U+2800; what_line cleans every component (tool, each recipient, each arg key and value) before joining; a stop reason cleans the tool name. (3) Send: recipients blank after trim are not recipients; new recipients are deduped by contact_key (first spelling kept). The card's first value is the gate's ('new recipients (N)', list): up to 32 recipients within 2000 characters, each over 120 characters shown as head + '…(+K chars)…' + '@domain', then '…(+K more)'; 'none' when N = 0. A classifier, arg or clean_card value under that key is dropped. A Send(new) ask proceeds on timeout only when every new recipient is listed in full and as written. (4) from_hint is set by a hint whose own mode decided or tied the result; a lower-class hint that loses to the class level leaves the class-level timeout (an Account or Send(new) ask hinted 'newsletter' under ('*','Read:newsletter','allow') proceeds)."
    why: "A rule typed as BÜCHER.DE was stored as bücher.de and never matched xn--bcher-kva.de, the silent dead rule D-110 (1) closed; without an IDNA dependency in core, refusing what cannot be mapped safely beats storing a key no host has. An OSC opened in one recipient and closed in the next ate the new address from a card that proceeds on timeout, and the 200-character what cap pushed a ninth recipient off the card; a card that cannot show who receives the mail must not send on silence. D-113 made the unrelated allow rule make Account stricter, which the spec does not ask for."
  - id: D-75
    text: "blockers.yaml no longer uses the git union merge driver (.gitattributes); decisions.yaml keeps it. scripts/swarm/merge_gate.py now also fails when a blockers.yaml entry sits under a section whose fields it lacks (blockers need question and default_taken; interface_changes need interface and change) or when ids repeat across sections. swarm/core and swarm/page must repair their blockers.yaml by moving lines, not editing entries: the block of store entries from `  - id: B-31` through the end of B-310 goes to the end of the `blockers:` list, and the second `interface_changes:` key line is deleted."
    why: "After main gained store's blockers (f493fd3), core and page merged main with union, which stacked main's additions to `blockers:` after their own additions to `interface_changes:` and repeated the key, so PyYAML's last-key-wins hid B-101/B-103/B-104/B-402..B-405 and filed 18 store blockers as interface changes. decisions.yaml is one list, where union is safe; for a three-list file a normal 3-way merge places hunks correctly and turns real overlap into a visible conflict. The gate already rejected the duplicate key, but a misfile without one would have passed."
  - id: D-435
    text: "Amends D-429 (1) and (2), after review-T-19-js round 3 Should 1 and 2: (1) sensitivity is inherited only by a field that matches a removed sensitive field: a one-for-one input swap in a single mutation record (replaceWith), or an added field that shares id, name, autocomplete, aria-label, placeholder or label text with it; a re-rendered page whose other fields match nothing keeps reading their values. (2) Removed sensitive fields are remembered (signature plus removal time, no timer) for 2000 ms, so a rebuild split by a microtask or a later task within that window still inherits by the same match. (3) 'press and hold' also counts as CHALLENGE text when a challenge widget, response field or challenge frame is on the page."
    why: "D-429's wide net turned every field of a page re-rendered after login into empty|filled, so the planner saw filled fields as empty and wasted turns re-filling them; a microtask split still leaked the password (hard rule 5). Matching by identity keeps the leak closed for real show-password toggles, which keep the field's id/name/label, without blinding the rest of the page."
  - id: D-436
    text: "Passive reCAPTCHA v3 markers (the invisible .grecaptcha-badge, a v3-bound data-sitekey button or script, invisible widgets) are not challenge context for the context-dependent challenge text of D-429 (2) and D-435 (3); only a visible challenge widget, a response field or a challenge frame is."
    why: "D-405 (5) and B-402 say v3 never causes a stop; accept-T-19-js round 2 showed a quiz heading 'Are you human?' became CHALLENGE on any page with a v3 badge, a stop with nothing for the user to solve."
  - id: D-437
    text: "B-414 default accepted: D-435 (1)'s one-for-one swap means, within one observer batch, a parent that lost exactly one field (subtrees counted), a sensitive one, and gained exactly one field; that field inherits sensitivity whatever its identity. Covers replaceWith of the input or of its wrapper and remove + append into the same parent."
    why: "The literal 'single mutation record' reading leaks the password on a wrapper swap or a two-record remove + append (accept-pw.html #w-in, #r3), a hard rule 5 break; the cost of the wider reading is one over-marked field when a one-field login step becomes a one-field page, which only reads as empty|filled."
  - id: D-438
    text: "review-T-19 round 4 rulings on D-435/D-437: (1) add-first rebuilds: fields added in the last 2000 ms that are not sensitive are remembered (element via WeakRef plus add time, capped, never a value); when a sensitive field is removed, any such field that matches it by D-435 key, or is the single field added to the same parent within the window, becomes sensitive and dirty. While a sensitive field and an un-walked field added next to it after it coexist, the new field matching its keys is sensitive at once (closes the overlap read). (2) The D-437 swap count and the add-side counts consider only fields that hold a value (textarea and input types other than checkbox, radio, hidden, button, submit, reset, image, file, range, color). (3) If reading a removed sensitive field's keys throws, a match-all entry is remembered for 2000 ms (fail closed on both sides). label[for] removed in the same record as its field counts as that field's label. (4) passiveFrame: an hCaptcha frame=challenge frame is never passive by URL; only display decides. size=invisible is read from the query string for reCAPTCHA, not from the hash."
    why: "Reviewer-9 reproduced a password leak in Chromium on the Vue/framer-motion/Svelte transition order (new field in, old field out on transitionend), inside D-435 (2)'s stated 2 s window, so it is hard rule 5 and blocks. (2)-(3) close smaller leaks of the same rule. (4) leans toward CHALLENGE, the safe side of hard rule 3, without needing a real hCaptcha capture."
  - id: D-439
    text: "Completes D-437 across batches for remove-first rebuilds: when a batch removes from a parent exactly one value field, a sensitive one, the S.gone entry also keeps a WeakRef to that parent; within 2000 ms, if a later batch adds exactly one value field to that same parent, it inherits sensitivity whatever its identity. The add-side sensitive(f) check and key reads run inside the fail-closed try, so a throwing getter marks the field sensitive instead of aborting inheritSensitive."
    why: "js-coder-5 not_done 1: remove; await; append of a neutral-identity field into the same parent still leaked the password (hard rule 5), the mirror of the add-first same-parent rule in D-438 (1); the cost is the same one over-marked field D-437 accepts. not_done 2: the add-side catch was unreachable, so a throw failed open."
  - id: D-440
    text: "B-415 resolved with its first proposal only: D-438 (1)'s add-first same-parent rule (the single remembered field added to the parent) is skipped for a parent that also gained a value field in the batch that removes the sensitive field, because that batch's D-437 one-for-one swap already handed sensitivity to the new field. Key-matched remembered fields still inherit. Adds made while the document is loading are still remembered."
    why: "Fields the parser inserted at load sat in S.born, so a wrapper swap within 2 s of load marked an unrelated neighbour (#nick) and acceptance A10/A14 failed. Skipping the rule where D-437 already applies removes that over-mark without opening a leak; ignoring adds during loading would drop real add-first rebuilds on slow pages, the fail-open direction."
  - id: D-76
    text: "B-150 accepted (I-4 contract, additive): harness_core::vault gains default_path() (SB_VAULT_PATH, else <config_dir>/sheetbrowse/vault.toml.age), default_key() (keychain service `sheetbrowse`, account `vault`), const MIN_VALUE_CHARS = 4, and VaultError::{ValueTooShort{name, min}, ScrubUnavailable}. VaultError is marked #[non_exhaustive] in the same change so further variants never break a consumer's match."
    why: "The CLI and bootstrap need one definition of the D-101 defaults, and D-118's floor needs a typed refusal so a short value is reported instead of over-scrubbing every output. The only exhaustive match today is core's own test; non_exhaustive keeps wave-2 consumers (srv-web, srv-files, srv-cli) safe from the next addition."
  - id: D-77
    text: "B-151 owner and timing: area core closes the base64/base64url scrub gap (standard and url alphabets, padded and unpadded, the three byte alignments, trimmed edge characters, patterns under 8 characters skipped) as wave-2 work on swarm/core after its wave-1 merge, with a test that `Basic <base64 of user:canary>` and a JWT payload carrying the canary are scrubbed. It must be merged to main before servers' T-12 (srv-web api with vault headers) merges; the supreme holds the servers merge until then. B-152 (input masks, split or truncated values, capitalised non-ASCII) is accepted as defaulted: core closes it in step 3 with page's readers, before the browser readers' acceptance."
    why: "core's default said 'first core task of step 2', but core has no wave-2 task (T-16 is wave 3) while T-12 is the first code that sends vault values in headers that can come back base64-encoded, so the gap would ship with the first real vault use and count against Phase 1's zero-leak gate. Running it beside servers keeps it off the critical path."
  - id: D-78
    text: "store's follow-up batch (one change on swarm/store after it merges main): the five B-31 items, #[deprecated] on tool_path/archive_path (D-72), and toolstore::fingerprint switching from its built-in alias map to sb_sheet::data::{aria_roles, alias_for} (D-59, now unblocked by the sheet merge 607eda5). It must be on main before servers T-13 (the seeded ashbyhq.com tool and fingerprint on a fetched index) merges and before toolforge T-28. The store session is relaunched for it when the user approves."
    why: "D-59 tied the alias swap to 'once both areas are merged', which happened at 607eda5, but no task or session owned it. Two alias tables would let find and fingerprints disagree on what a role name means, which is the drift D-49 exists to prevent, and T-13 is the first consumer to fingerprint a real page."
  - id: D-79
    text: "B-177 accepted (I-2 contract, behaviour only): ask::answer returns io::ErrorKind::AlreadyExists with a plain message once an ask is closed; FileAsker::ask returns TimeoutSkip when it cannot write the card; dispatch and ToolCtx::ask read a missing runs row as strict, cap every Asker at card.timeout + 5 s, and turn a handler or classifier panic into ToolError::Failed plus an ok=false tool event; ToolCtx::ask cards go through Gate::check; serve_io answers -32700 for a non-UTF-8 line and scrubs only payload strings. `harness ask` prints the AlreadyExists message as is."
    why: "Each change only makes the wrapper stricter or fail closed (review-T-07 blocking and should-fix items): a lost runs row must not relax strict mode, a hung Asker must not stall a tool call past its card timeout, and a panic must leave a ledger trace instead of killing the server."
  - id: D-80
    text: "B-185 accepted: harness_core::sched becomes interface I-13 (draft, consumers harness and srv-cli): Scheduler{runner, wake, fired}::run_loop(shutdown), traits Launcher and Clock (SystemClock, ManualClock), Runner::{fire, execute}, parse_cron (5 fields, UTC), next_after, changed_dir, notify_changed, CHANGED_DIR, FIRE_TOOL, LAUNCH_TOOL, SchedError. The harness crate's Env, CliError, cli and daemon items stay harness-internal. Any tool that adds or removes a schedule outside the CLI calls sched::notify_changed."
    why: "The loop in core calls the launcher, so the trait must live in core (D-38 has harness above core), and a Clock seam makes the H-5 acceptance testable without a model or a real minute. Recording it as an interface tells servers (srv-cli, wave 2) about notify_changed before they write a schedule tool."
  - id: D-81
    text: "B-191 accepted (I-3 contract, behaviour only): rule_domain stores Punycode A-labels and refuses non-mappable Unicode; rule_hint accepts only ASCII a-z 0-9 _ - .; a Send AskCard's values[0] is always the gate-written ('new recipients (N)', list) row and any other value under that key is dropped; blank Call.recipients are ignored and duplicates count once. No re-set is needed: the six seeded gate.rules (migrations/0001_init.sql) use '*' and ASCII hints, and no user rule exists yet."
    why: "Unicode domains and hints admit look-alike keys (the D-62 problem for gate rules), and a classifier-supplied 'new recipients' row could tell the user a Send goes to known contacts when it does not. Checked the seeds before accepting, so the stated incompatibility strands nothing."
  - id: D-82
    text: "B-413 accepted (I-11 draft): __sbMedia frame() returns {t: null, why} and frames(id, times) returns a single {t: null, why} entry when the call is refused as a whole (no base, unknown id, challenge); per-time failures keep one entry per requested time."
    why: "I-11 named a bare {why} only for list() and cues(), so sb-media (wave 2) had no written shape for whole-call refusals of frame()/frames(); writing it down before sb-media exists costs nothing, and a single t:null entry is distinguishable from per-time failures."
  - id: D-312
    text: "B-31 (1), per D-78: tool names are lower case only. domain::valid_name accepts [a-z0-9_-]+ (still no device names, at most 100 bytes), the header parser refuses an @name with an upper-case letter, and ToolStore::reforge refuses a new spec whose @name differs from the name it was called with (StoreError::Invariant-style refusal, no file written)."
    why: "NTFS and the default macOS volume are case-insensitive, so Register.js and register.js are one file but would be two tools.health rows. Lower-casing at the boundary is simpler than case-folding every health key, docs/03 sets no case rule, and both seeds are already lower case."
  - id: D-313
    text: "B-31 (2), per D-78: check_repair refuses a re-forge that changes @kind (either way) or lowers @phase (2 to 1, which gains page.api and runs on fetched HTML). Raising @phase 1 to 2 is allowed."
    why: "G-4 says a repair may never widen what a tool can do; a reader becoming a planner or a browser tool becoming a fetch tool with api access both widen it, and neither is a repair."
  - id: D-314
    text: "B-31 (4), per D-78: ToolStore::archive fails closed. It sets the tool's mtime to now before the rename (a rename keeps it); if that fails, nothing has moved and the error is returned, so an archived file always carries its archive time and sweep's 90-day clock (D-303) is never measured from the tool's old mtime. The mtime is set through a handle that a read-only file grants (FILE_WRITE_ATTRIBUTES on Windows, a read-only open elsewhere). Sweep does not stop on a per-tool file failure (retire, archive, 90-day delete): it writes an ok:false ledger event for that tool or file and goes on with the other tools and domains; memory errors still return."
    why: "Recording the time in a row would need a tools.health column (contract change, like G-5's content hash); failing the archive keeps the current contract and the caller retries at the next sweep. Setting the mtime before the rename means a failure needs no rollback (a failed rollback would have left a file in _archive with its old mtime), and continuing the sweep keeps one stuck file from blocking every later retire and delete."
  - id: D-83
    text: "B-193 accepted (I-3 contract, names only): harness_core::gate::{ANY_DOMAIN, rule_domain, rule_hint, rule_class_key, rule_key} join I-3's rust list as the one canonicaliser for gate.rules keys (D-113, behaviour per D-81), and I-3 gains consumers: [core-pg]. Any other code that writes or looks up gate.rules keys calls these instead of normalising on its own."
    why: "core-pg's rule_set and lookup already call them (crates/core-pg/src/lib.rs, verified on swarm/core), so they are contract in fact; naming them lets wave-2 consumers find them, and a second normaliser would reopen the look-alike-key problem D-62 and D-81 closed."
  - id: D-84
    text: "B-194 accepted with a condition (I-4 contract). VaultError::ValueInLiteral{name} is accepted as proposed. Vault::open_for_set is accepted only if it returns a distinct type, harness_core::vault::VaultEditor, exposing set, remove, names and save, and NOT resolve_into, scrub or install_global; it must not return a Vault. core makes this change before its wave-1 PR, with a compile-fail or API test showing VaultEditor cannot resolve."
    why: "On swarm/core (0790269) open_for_set returns a full Vault built with strict=false, so the handle that skips D-118's value rules can still resolve values scrub cannot see (short ones, ones inside a literal) and can be installed as the process-wide scrubber; only a doc comment forbids it. The vault is the harness's main safety boundary, so the restriction belongs in the type system (CLAUDE.md: APIs hard to get wrong), and the editor type costs a few lines."
  - id: D-85
    text: "B-195 accepted (I-13 draft): Launcher::before_run (provided, default Ok) runs first in Runner::execute, before the prompt is scrubbed; a failure returns SchedError::BeforeRun(LaunchError) with no folder or runs row. harnessd's daemon::ReopenVault re-opens the vault there. The harness-crate launcher constants and ClaudeLauncher fields (D-124) stay harness-internal. Condition: SchedError is marked #[non_exhaustive] in the same change, as VaultError was (D-76)."
    why: "A vault value added while harnessd runs would otherwise be unknown to the scrubber for every scheduled run until a restart, which is a leak path; re-opening before anything is written closes it, and failing before the runs row keeps a half-started run out of the ledger. SchedError has gained a variant each round, so non_exhaustive keeps srv-cli (wave 2) safe from the next."
  - id: D-86
    text: "The repo has a remote: origin = https://github.com/loki52501/sheet_browse.git, with main and every swarm branch pushed. PRs are real GitHub pull requests (gh pr create --base main --head swarm/<branch>); areas push their own branches; the supreme pushes main after every merge. Supersedes D-46 (local-only). Never force-push; never push main from an area session."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core. A real remote gives every merge a PR record and lets areas publish branches without the supreme reading worktrees."
  - id: D-87
    text: "Merge rule (overrides docs/10 S-3 and S-8 where they differ): a PR merges when its reviewer report has no Blocking items and cargo test --workspace passes on the merge commit, and no leak hook fired (CLAUDE.md hard rule, kept). A red acceptance item does not block a merge; it becomes a follow-up task on main (T-xxb) owned by the same area. Supreme second-opinion reviews are non-blocking notes filed into blockers.yaml; they never hold a merge or a launch."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core."
  - id: D-88
    text: "Holds are abolished: no wave-2 launch or merge waits on a should-fix in another area. D-77's base64 scrub, B-32 item 1 and B-33 item 3 become ordinary follow-up tasks (T-05d, T-10b, T-11b) running in parallel with wave 2."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core."
  - id: D-89
    text: "Review loops are capped at two rounds per PR: round 1 review + test, round 2 fixes. After round 2 the PR merges under D-87 and everything left is filed as follow-ups."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core; wave-1 PRs went 3 to 5 rounds."
  - id: D-90
    text: "Interface freeze: no amendment to interfaces.yaml until T-17 is done. An area that needs a change works around it locally and files the proposal; the supreme answers 'deferred to wave 4' and moves on. D-84 (VaultEditor) and D-85 (before_run, non_exhaustive SchedError) are the last accepted items; if core has not finished them they become follow-up tasks (T-05c, T-08b), not merge conditions."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core."
  - id: D-91
    text: "One PR per task from now on, on branch swarm/<area>-T<nn> (for example swarm/servers-T12, swarm/core-T05d). core's remaining work after its merge, every follow-up, and every wave-2 and wave-3 task each gets its own branch and merges alone."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core; one branch per area made each merge wait for the area's slowest task."
  - id: D-92
    text: "The supreme relaunches any stopped area session itself, without asking, with scripts/swarm/launch.ps1 (Start-Process wt.exe form, TMP on F:/sb-swarm/tmp-<area>). It still asks the user only about: a merge conflict it cannot resolve, a vault or captcha rule, or deleting something."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core."
  - id: D-93
    text: "Supreme checkpoint commits at most once per hour, one line. Decisions only when they change what someone else must do."
    why: "speed: three days produced 2 merged areas; the old rule serialised everything behind core."
  - id: D-122
    text: "T-09 placement (H-6, H-2, H-3, H-5, docs/01 and docs/02 step-1 acceptance). The fake echo server is an example of the harness crate (crates/harness/examples/echo.rs): a stdio MCP server on core::mcp::serve_io with a PgStore-backed ledger and the real Vault, never an installed bin. The step-1 acceptance lives in crates/harness/tests/step1_accept.rs, spawns the echo example over stdio (as Claude Code will), runs against the compose Postgres in a throwaway sb_t_* database (D-100), and greps stdout, stderr, ledger.events, every table, ledger.jsonl and runs/ for SB_VAULT_CANARY. The scheduler item drives `harness schedule add` through the real CLI and a harnessd loop with the T-08 Clock seam and a fake Launcher in place of claude (rule 1)."
    why: "echo needs core and core-pg, and harness is the only crate above both; an example keeps a test tool out of the installed bins, and going through stdio exercises the wrapper on the path production uses instead of calling dispatch in-process like accept_t07."
  - id: D-123
    text: "T-07 round 3 (H-6, H-1.3, H-1.4, I-2; refines D-119). (1) FileAsker publishes asks/<n>.json whole: the card is written to a temp file in asks/ and hard-linked to <n>.json (atomic, no-clobber); AlreadyExists moves on to n+1, so several processes on one run still never share an n; a failed write leaves no card and no temp file. Where hard links are unavailable, create_new takes the name and one rename replaces the empty placeholder with the full temp file (a reader sees empty or whole, never partial). (2) ask::answer refuses with ErrorKind::InvalidData, and writes nothing, when asks/<n>.json is not a complete JSON object. (3) The asker claims <n>.answer (as timeout) on every path where it stops waiting: its timer; a dropped ask future (an OpenAsk guard closes the ask inline in Drop, so it is closed before the wrapper cap reports TimeoutSkip); a card that landed after the future was dropped (the guard rides the oneshot from the card-writing thread and closes the ask when the send fails or the channel is dropped); and, when the temp-file claim fails for an I/O reason, a bare create_new of an empty answer. If even that fails the ask is TimeoutSkip, never TimeoutProceed. (4) A mid-call card with site None is checked by Gate::check against the enclosing call's classified domain (CallInfo.domain, scrubbed); a card with its own site keeps it. (5) Stop reasons (gate stops and a handler's stopped output) go through clean_line (scrub, clean_card, scrub) for why and element before the ledger, the returned stopped and the model's stop line (D-119 (7))."
    why: "review-T-07 round 2: a card claimed with create_new and written afterwards was read empty or partial in 15 of 40 stress runs and left an empty card that ask::answer accepted when the write failed; an ask abandoned by the cap left <n>.answer open, so a late harness ask reported success for an answer nobody read; a handler that built a card without a site skipped the call's own domain stop and strict rules (rule 4); a handler stop line carried ESC and CRLF into the ledger and the model text."
  - id: D-125
    text: "Refines D-115 (T-03, T-04 MemStore; M-3): the trigram tier's cut-off is word_similarity >= 0.5, not pg_trgm's default 0.6. PgStore sets pg_trgm.word_similarity_threshold = 0.5 on every pooled connection (after_connect), so `subject %> $1` keeps using the trigram index; MemStore's port uses the same 0.5. Ranking is unchanged (score order, tier breaks ties)."
    why: "D-115's own example ('Vasnth' inside 'Vasanth Raghavan') scores exactly 0.5 on the server, so the default threshold made the decision's stated purpose fail (accept-T-03 round 3). One step lower admits that typo class; search() results are ranked and capped, so the extra low-score hits cost little."
  - id: D-126
    text: "Refines D-120 (1) and B-190 (T-04; H-1.2): gate::rule_domain maps a domain with the idna crate (UTS-46 nontransitional processing, idna 1.x, already in Cargo.lock) instead of the hand-written subset, then stores the A-label form; a domain idna refuses is refused (RuleError), never stored. So every stored key is what a browser's URL host carries (ſ -> s, ĳ -> ij, modifier letters, final sigma -> σ, U+1E9E -> ss, compatibility ideographs and jamo)."
    why: "Three review and accept rounds each found another character class the subset missed, and every miss is a silent dead user rule (D-110 (1)). The standard mapping in a crate the workspace already builds ends the class of bugs; B-190 allowed taking it."
  - id: D-124
    text: "T-08 round 2 (H-2, H-5, H-7; refines D-116 (7), takes the B-192 default). (1) `harness` installs the vault (Vault::open + install_global) at the top of execute for every command except `vault set`; when the vault cannot be opened the command fails before it prints or writes anything, and the error names entries only. `vault set` opens with Vault::open_for_set (repairs a file open refuses, D-118) and never installs that handle. (2) harnessd re-opens and installs the vault before every firing through Launcher::before_run (harness::daemon::ReopenVault); when that fails the firing ends with SchedError::BeforeRun and no folder, row or prompt is written. (3) A `claude -p` session is capped at SB_SESSION_CAP_SECS (default 3600 s, whole seconds above 0): past it the session is killed (taskkill /F /T on Windows, since claude.cmd runs under cmd.exe), the run gets the failed launch event and status failed; harnessd's shutdown drain is bounded by the same cap. Interactive `harness run` sessions are not capped. (4) answer.md keeps at most 1 MiB of stdout (the rest is read and dropped); 64 KiB more is read, the whole is scrubbed, and that slack is dropped from the end, so a vault value cut by the cap is never written in part; a cut answer ends with an `[answer cut: kept N of M bytes]` note. (5) Every ClaudeLauncher session gets `--disallowedTools 'Bash(harness ask:*)' 'Bash(harness gate:*)' 'Bash(harness vault:*)'` as separate arguments after `-p` (scheduled) or after the prompt (interactive), because the option's list is variadic and would swallow a trailing prompt."
    why: "Without an installed vault scrub() is the identity, so the CLI printed schedule prompts and tool whys raw (review-T-08 blocking); open_for_set is the only exit from the D-118 refusal loop. A per-firing reopen is deterministic where a file watcher races the next firing. A hung session held its schedule in running forever and blocked shutdown; cutting stdout before scrubbing could leave a value prefix behind. The denied commands keep asks, gate rules and vault entries user-only (rule 4, B-192)."
  - id: D-127
    text: "T-07 round 4 (H-6, H-1.4, I-2; refines D-119, D-121 (4); review-T-07 Notes carried since round 1). (1) ToolRegistry never lowers a name's class (rule 4): every name keeps a floor, the highest class it was ever registered with in this registry (shared by clones, kept after remove); add and new register max(floor, spec.class), and the new handler, description and schema replace the old ones. Keep-max, not refuse: add returns () in I-2, so a refusal would be silent or need a signature change, and a repaired or re-forged site tool must still be able to replace its handler. (2) One core stop per stopped call: while the handler runs, a stop that ToolCtx::ask hits (a Challenge card or a gate Stop) is held, not written, and only the call's first one is kept (a later one goes to stderr). When the handler returns stopped the wrapper writes the tool event (mode stop, the handler's why) and then one trailing core stop carrying the held stop (its element filled from the handler's when it has none), or the handler's stop when nothing was held. When the call did not return stopped (went on, failed, panicked) the held stop is written right before the tool event. An ask from classify writes its stop at once. Accepted gap: a process that dies inside the handler after a mid-call stop loses that line; nothing ran on its behalf (the ask returned TimeoutSkip). (3) serve_io reads at most MAX_LINE_BYTES = 8 MiB per incoming line (the newline not counted). A longer line is not buffered: past the cap its bytes are consumed and dropped up to the next newline or EOF, the reply is error -32600 with id null, and the server keeps reading. -32600, not -32700: the line was never parsed, so the server cannot say it is not JSON, only that it will not take it as a request; the id is unknown, so it is null as JSON-RPC 2.0 requires."
    why: "A forge or repair that re-registered Pay as Read lowered the gate class, which rule 4 forbids, and remove-then-add was the same hole. Writing the mid-call stop at once and skipping the trailing one would make ledger::report take the next call's core stop of the same (tool, args) as this call's trailing stop, so a resumed run stopped again by the gate would lose its listing; holding the stop keeps the documented shape (tool stop event, then its trailing core stop) that D-121 (4) groups exactly. read_until grew its buffer without bound on a line with no newline; 8 MiB is far above any tool call's arguments."
  - id: D-600
    text: "sb-cdp is our own CDP client (B-3), not chromiumoxide: one writer task, one reader task, a reply map by id, flattened sessions, a per-session event broadcast and a 10 s command timeout (B-4 #11) live in sb_cdp::Cdp over Arc<dyn Transport>. On Windows Pipe launches Chromium with CreateProcessW and the CRT lpReserved2 block (fd 3 = Chromium reads, fd 4 = Chromium writes), the same mechanism libuv and Playwright use; anonymous pipes have no overlapped I/O, so one blocking OS thread per direction bridges to tokio channels. On Unix the pipes are dup2'd to fds 3 and 4. Messages are NUL-terminated JSON both ways."
    why: "--remote-debugging-pipe reads inherited CRT fds 3/4 and std::process cannot pass them on Windows; chromiumoxide is WebSocket-first and would hide the transport the spec puts behind a trait. A thread per direction is the only correct async bridge for anonymous pipes."
  - id: D-601
    text: "D-34 pin: Chrome for Testing 156.0.8078.4 (Chromium revision 1706539, listed in known-good-versions.json), the build Playwright ships as chromium-1248. Chromium is resolved as LaunchOpts.chromium, else env SB_CHROMIUM, else <SB_HOME or cwd>/chromium/156.0.8078.4/chrome-<platform>/chrome(.exe); missing -> DriverError naming SB_CHROMIUM. First-run download is follow-up T-18b. Profiles live in <SB_HOME or cwd>/profiles/: `me` is persistent at profiles/me and refuses headless; `bench` is a fresh temp dir profiles/bench-* removed when the driver drops. Launch flags are exactly --remote-debugging-pipe, --user-data-dir, --no-first-run, --no-default-browser-check, --headless=new only for bench when asked, and about:blank; no stealth, UA or fingerprint flags (D-5)."
    why: "One exact build keeps CDP behaviour reproducible (D-34) and the local Playwright copy lets tests run without a download; the downloader needs an HTTP and unzip path that does not block the transport work, so it ships as its own PR under D-91. profiles/ is already git-ignored."
  - id: D-602
    text: "Pipe launch handle inheritance on Windows (T-18, B-3, B-4 #11; refines D-600). sb_cdp::Pipe::launch makes the two pipe ends and NUL inheritable only around its own CreateProcessW, closes its copies right after it, limits its child with PROC_THREAD_ATTRIBUTE_HANDLE_LIST, and serializes Pipe launches with a crate-private lock. Accepted limit: a CreateProcess on another thread of the same process during that window with bInheritHandles=TRUE and no handle list (every std::process::Command spawn; std's own CREATE_PROCESS_LOCK is private) can still inherit the pipe ends. That child then holds the pipe open, so the client sees end-of-file (and closes) only when both the browser and that child have exited; browser processes are still killed by the Job. Consumers that spawn long-lived children while a browser launches (sb-mcp, toolstore, harness) should spawn them before or after Driver::launch, not concurrently; short-lived ones (git) only delay the close until they exit. If that ever bites, the fix is one process-wide spawn lock in a crate below both, which every in-repo spawner takes."
    why: "review-T-18 should-fix 1: the old comment claimed the handle list protects against concurrent spawns, which it does not. Win32 has no per-spawn inheritance for CreateProcess calls we do not control, and stable std offers no hook to pass a handle list to Command, so the window can be shrunk and our own launches serialized, not closed."
  - id: D-441
    text: "Amends D-440 (review-T-19 round 5 Blocking, hard rule 5). Under a same-batch one-for-one swap (D-437), D-438 (1)'s add-first same-parent rule is skipped only for remembered fields that were added while document.readyState was 'loading' (the S.born entry records it). A single remembered field in the parent that was added after loading still inherits, as D-438 (1) did before D-440, so both it and the swapped-in field read empty or filled. Key matches inherit as before. jsdom.test.js's D-440 case 'remove + append next to the neighbour' is split: a neighbour added while loading reads; one added after load is marked."
    why: "D-440 skipped the rule for every remembered field, so an add-first rebuild with no shared key leaked when the removing batch also swapped in a different field (review round 5 V7 and the Chromium d440 transitionend probe: 3 to 4 value reads). B-415's over-mark came only from parser inserts, so limiting the skip to adds made while loading fixes A10, A14 and A18 and keeps every post-load add-first rebuild fail closed; the cost is one more over-marked field in that rare shape."
  - id: D-442
    text: "Supersedes D-440 and D-441; resolves B-415 by accepting its over-mark (review-T-19 round 6 Blocking, hard rule 5). (1) The add-first same-parent rule (D-438 (1)) is never skipped: no exception for a same-batch D-437 swap and none for fields added while the document was loading. (2) When the parent lost exactly one value field and it was sensitive, every remembered field (S.born, within 2000 ms) added to that parent inherits, not only a single one; a parent that lost two or more fields keeps D-438 (1)'s single-field rule, so an SPA login swap still reads its new page (D-435 (1)). (3) Accepted cost: a field the parser or a script added to the same parent within 2 s before a one-field password swap reads empty or filled (B-415, accept-t19 A18 now asserts this over-mark; A10 and A14 controls swap after the 2 s window). Remaining pre-existing shapes (N5 two adds plus removal in one batch, V5 cross-parent three-batch build, S.born cap eviction, the overlap read while both fields exist) go to T-19b."
    why: "D-440 and D-441 each skipped marking on a proxy for 'parser-inserted' and each reopened a leak (round 5 V7 and d440; round 6 M1, M4, N1: a copy added while a slow script held the page loading). Rule 5 outranks efficiency, and the only cost of failing closed is that one unrelated field reads filled when a password next to it is rebuilt within 2 s of load. Marking every remembered field of a one-field parent also closes V8, N3 and N3r, which had no single field to mark."
  - id: D-443
    text: "Extends D-442 (review-T-19 round 7 Blocking, hard rule 5). (1) Overlap read: a value field added to a parent that holds a connected sensitive field at the time of the add is remembered as 'added next to a sensitive field'; while its parent still holds a sensitive field and for at most 2000 ms after its add, its value is never read (state empty or filled, from caret or length evidence only), and when that sensitive field is removed it inherits through D-442. (2) A parent whose removed value fields were all sensitive marks every remembered field in it (all = e.out === e.sens, covers password plus confirm, X7). (3) One sensitive field removed alone and two or more value fields added to the same parent in the same batch with no key match: all of them inherit (N5); an SPA login swap removes a non-sensitive field too, so it still reads (D-435 (1)). (4) Accepted cost: an unrelated field added next to a live password reads empty or filled for up to 2 s, and controls that assert otherwise wait the window out. Still open in T-19b: S.born cap eviction, cross-parent copies with no shared key (V5, X1, X1b), exits longer than the settle cap (O4, settle reports settled false), and any X2w/X5 shape the overlap mask does not cover."
    why: "settle() returns settled true while both fields of a show-password toggle exist (JS-timed exits, transitions on a child of the class-changed node, a read chained in the same evaluate), so the normal click-settle-read flow walks the text copy and reads the password; that needs less than round 5's Blocking V7. Masking new neighbours of a live password costs at most 2 s of 'filled' instead of text on one field; rule 5 outranks it. (2) and (3) are one-line fail-closed widenings that cannot fire on an SPA login swap."
  - id: D-603
    text: "sb-driver act(id) retry (T-20, B-4 #6, B-4 #11, H-1.4). Terminal whys, no retry: gone, stale, challenge (also stops the program: ActResult.stopped with class Challenge and the element), and no base when a forced re-walk with a fresh base does not cure it. Retryable whys: hidden, not stable (moving), disabled, outside the viewport, and every answer starting with 'covered by ' or 'does not receive pointer events'; a page that does not answer before the step's deadline is retryable as 'not answering'. Any other why, or an answer that is neither {x,y} nor {why}, is terminal (fail closed) as 'unknown answer from the page: ...'. Schedule: attempt 1 at once; on a retryable why the next attempt follows a wait of 0, 50, 100, 250, 500 ms, then 500 ms per step, each wait capped by what is left of a 5 s budget counted from the first attempt; the wait is an in-page condition in world sb (first DOM mutation, else the step's deadline), never a sleep, and a 0 ms wait sends nothing. When the budget runs out the step fails with '<last why> after 5.0 s'; a terminal why reached after retries reads '<why> after <elapsed, 1 decimal> s', and on the first attempt just '<why>'. A context destroyed mid-call is retried once in the frame's new sb context (B-4 #11); an id from the old document then answers stale. Ids in a why from frame N > 0 are rewritten to #fN.id."
    why: "gone and stale cannot heal (identity is per document, D-55), a challenge is a stop by D-5 and H-1.4, and an unknown answer must tighten (pr-ready: no fail-open); everything else is a state a page commonly leaves on its own (cookie banners, animations, async enabling). Waking on the first mutation instead of the full step cuts the success latency when a cover goes away, and costs at most one act call per mutation burst within the 5 s cap."
  - id: D-604
    text: "Element id bases (T-20, B-4 #3, D-55, D-73). sb-driver keeps, per (tab, frame number), a count k of documents it has based, and gives document k the base 1 + k * 100000; a frame that would pass the u32 id range fails closed with DriverError::Cdp instead of reusing ids. A document is identified by its sb-world execution context (uniqueId, else session and id); before the first __sb call into a new context the driver runs walk({base}) there. A paused target (waitForDebuggerOnStart) gets Runtime.runIfWaitingForDebugger only from the reply hook of its Page.addScriptToEvaluateOnNewDocument (start_then, in wire order, on any reply), one round trip after attach: a navigation is started in the browser process and does not queue behind renderer-side commands, and a navigation that raced the install committed with neither Page events nor the sb world (seen on chromium-1248 for targets created with a URL and for Page.navigate sent right after attach; the same holds for popups). Driver::open creates about:blank, waits for that reply (recorded in the registry), navigates, waits for the commit with an sb context, then settles and walks in one Runtime.callFunctionOn. A base given to a walk that never ran (no runtime yet) or whose document died under it is handed back. injected.js is installed per tracked target with Page.addScriptToEvaluateOnNewDocument(worldName sb), pipelined before Runtime.runIfWaitingForDebugger, without runImmediately: a new tab's initial about:blank document can outlive the commit of its first navigation (seen on chromium-1248, the registry already showed the new URL), so an sb context in a fresh tab must only belong to a navigated document. A frame with no sb context on first use (documents that existed at attach) gets Page.createIsolatedWorld plus the source (the script's own guard makes a double run a no-op)."
    why: "Resuming after the install reply costs one round trip per new target and is the only order that guarantees the first document has __sb and Page events. walk() reports a row count, not the next id, so the driver cannot know where a document's ids end; a stride far above any real page's id count keeps ids short on the first document (the common case) and never reuses one within 42949 documents per frame. Proposal B-605 asks walk to return next so the stride can go."
  - id: D-605
    text: "Tab visibility for actionability (T-20, B-4 #6, B-4 #10). Driver::open creates each tab with Target.createTarget(about:blank, newWindow true), then Page.navigate on the tab's session once its attach setup is queued, so every opened tab is visible in its own window and its runtime is installed before the first document. act(id) is called through a wrapper that answers a hidden document first; the driver then sends Page.bringToFront to the tab once and asks again at once, outside the backoff schedule; a tab still hidden after that is the retryable why 'the tab is not visible'."
    why: "Measured on chromium-1248 headless: a background tab in the same window reports visibilityState hidden, requestAnimationFrame never fires there and timers run about once a second, so act(id), which awaits two frames, took over 600 ms instead of about 33 ms. A tab in its own window stays visible, so tabs can act in parallel; popups a page opens land in the opener's window and are fronted on demand."
  - id: D-606
    text: "act(id) retry wait (T-20, B-4 #6; decided by the driver sub-orchestrator in review-T-20 round 1; supersedes the wait part of D-603, whose terminal and retryable why classes stay). Attempt k is due at its slot: 0, 50, 100, 250, 500 ms after the previous attempt's answer, then every 500 ms. Between attempts the driver awaits the in-page __sb.settle({quiet: 150, cap}) with the call and the cap ending at min(slot, budget end), and when settle returns before the slot it waits until the slot with tokio::time::sleep_until (the schedule itself is the condition; the only timer in the driver, rule 6); a 0 ms slot sends nothing. A wait the page does not answer in time (transient) waits the slot out; a context lost during the wait follows B-4 #11 (retried once inside the call; lost twice ends the step as stale); any other CDP failure ends the step with its reason (WhyKind::Failed, a failed step, not a driver error). The 5 s budget is strict: every call, wait and Page.bringToFront is capped at t0 + 5 s, nothing is sent once it has passed, and an attempt due at or after it does not run; the step then fails with the last real in-page answer plus 'after X s', X the measured time (about 5.0), or 'not answering after X s' when the page never answered. A base is handed back only when walk() provably did not run (no runtime in the world); never on a lost context (supersedes that part of D-604). Network in-flight tracking stays T-22."
    why: "review-T-20 Blocking 1 and 2: the first-mutation wait ended at once on pages that never stop mutating (carousels, clocks), so retries ran back to back, about 100 act calls in 5 s, and ANSWER_GRACE let a step end at about 5.6 s while reading 'after 5.0 s'. settle() plus the slot keeps the spec's schedule on every page and makes the wait a page condition first; a strict budget makes the 5 s cap mean 5 s. A walk sent before its context died may have based the document, which a bfcache restore would bring back next to the next document's ids."
  - id: D-607
    text: "Driver::open waits for the document's first paint (T-20, B-4 #6, accept-T-20 row 1b). Its one settle-and-walk call also awaits, in parallel with the settle, the first 'paint' performance entry (a PerformanceObserver in world sb), capped at min(3000 ms, the settle cap); skipped for hidden and about: documents. The < 50 ms first-answer checks (chromium_t20 (a), accept_t20 rows 1 and 1b) assert every sample, not a median."
    why: "Measured on chromium-1248 headless: in the first window after launch the first paint lands about 1.1 to 1.4 s after page start, after open used to return, and until it does requestAnimationFrame stalls for 100 to 700 ms, so the first act(id) waited out nextFrame's 100 ms fallback (row 1b: 104 to 154 ms). Later windows paint about 120 ms in, before the settle ends, so the wait costs them nothing; only a page that never paints pays the cap. A separate finding: closing tabs that share the acting tab's renderer process keeps its main thread busy for about 100 ms, so chromium_t20 closes its concurrent-open tabs after the timing checks, not before."
  - id: D-444
    text: "Extends D-443 (review-T-19 round 8 Blocking, hard rule 5). (1) Visibility-swap toggles: a value field is never read (empty or filled only) while its parent directly holds a sensitive value field that is not displayed (Y6 clone-and-hide, Y7 a synced text twin whose display is flipped); the same holds where the twin and the hidden sensitive field each sit alone in sibling wrappers of one parent. (2) D-443 (1)'s add-time check counts a sensitive field moved in the same batch as present (Y3, Y3d). (3) D-443 (3)'s key match is computed over the non-sensitive added fields only, so a new hidden password with the old one's key does not stand the rule down (Y5). (4) D-443's open item 'exits longer than the settle cap' reads 'exits longer than 2000 ms' (O4, O5, O6). Accepted cost: a visible field next to a hidden password in the same parent reads empty or filled. Everything still open goes to T-19b: V5, X1, X1b, Y1, Y1g (copies with no structural or key link), V9 and S.born cap order, X2w, X2w0, X5 (hidden trick input in the removal count), O4..O6, Y2c (jsdom only)."
    why: "Show toggles that swap display instead of adding and removing fields are invisible to every add/remove rule (D-435..D-443) and leak for the life of the page after a normal click-settle-read; a parent-local check in fieldValue closes them for the cost of masking one neighbour of a hidden password. (2) and (3) are one-line gaps against D-443's own wording. The remaining shapes need the page to print the value somewhere with no link to the password field, or exits past the 2 s window, which no common framework toggle does."
  - id: D-445
    text: "Extends D-444 (1) (review-T-19 round 9 Blocking, hard rule 5). (1) Depth: from a value field, climb ancestors while the ancestor's only value field is that field, up to 6 levels; at each level, a sibling subtree whose only value field is a sensitive field that is not shown masks it (Z7 hidden hosts, Z7v Vue v-show components, Z7i, Z5m mixed depth inside one label). Lookups are memoized per index() call. (2) 'Not shown' for a sensitive field means any of: display none, visibility hidden or collapse, the hidden attribute, opacity 0 on it or an ancestor, a zero-size box, an off-screen box, or a clip/clip-path that hides it (Z3, Z4, Z4v). (3) settle() re-checks one task later before resolving settled (a setTimeout 0 with a rule 6 comment: a transitionend handler that sets display none has no other observable condition), so a read chained after settle() sees the hidden state (Z6). Accepted cost: neighbours of an autofill-trick password hidden off-screen read empty or filled. Open in T-19b with D-444's list: masked fields that hold a value but give no evidence report empty instead of filled (a planner may retype them); jsdom shadow-root and textarea cases for D-444 (1)."
    why: "Mainstream components (Vue v-show on a wrapper component, label plus control divs) put the inputs two levels below the swapped hosts, so the one-level check of D-444 (1) misses them and the password is read on every click-settle-read. The climb is bounded and memoized (an unmemoized version made index() 160 ms). Off-screen, opacity 0 and clipped are the other ways a site hides a password field; counting them only masks more."
  - id: D-608
    text: "Per-step gate in Driver::act (T-21, rule 4, H-1.4, D-402). Before each step with a target or a scroll, sb-driver reads the live index of the step's frame (__sb.index(), rows rewritten to the driver's frame number) or reuses the index the previous step's consequence call returned, and classifies the step with sb_act::classify_step against it. A challenge page (a CHALLENGE row with role document) or a CHALLENGE target stops the program as Challenge; a live class above ctx.class stops it with StopReason {class: live class, why: 'stopped before input: step N <label> is <class> on the live page, above the approved <class> (H-1.4)', element}. No index (the page did not answer) classifies every target as Submit. The gate runs before actionability, so a stopped step has had no focus, scroll or input; nothing after a stop runs. T-20's actionability tests now pass a ctx of class Pay (the highest below Challenge) and allow one extra round trip (GATE_READ, 60 ms) on act-level 5 s timings; their probe counts only hit tests inside an attempt, because index() hit-tests rows too."
    why: "Rule 4 and H-1.4 say the live page decides, and a step can only be judged once its row is read; reading before actionability costs one round trip on a program's first step only (later steps reuse the post-step index) and keeps focus handlers and scrolls from running for a step the gate refuses. Running the read concurrently with actionability would save that round trip but would focus or scroll before the decision."
  - id: D-609
    text: "Input synthesis (T-21, B-4 #7). The act wrapper takes an optional op run in the same round trip once the element is actionable: {focus: true} for t# and k# (the step fails with 'the element did not take focus' unless document.activeElement, through shadow roots, is the element or inside it) and {select: choice} for s# (the option whose label, then value, then case-folded label is choice; option.selected = true; input and change dispatched; 'no option matches (N options)' otherwise). The wrapper also adds the frame offset in the page (each same-origin frameElement's content box on the way to the top; a frame it cannot reach answers 'cross-origin frame'), so every point is in the tab's viewport. Click and check: mouseMoved, mousePressed, mouseReleased queued together on the tab session. Type: Ctrl+A (Cmd+A on macOS) with commands [selectAll], then Input.insertText; an empty value sends Delete instead. A value with @vault(k) is resolved once, inside ToolCtx::resolve_into, and the select-all events and the insertText message are queued inside the sink; the message is built with sb_cdp::start_raw from a pre-sized Zeroizing buffer, and an unknown key or malformed reference fails the step before anything is sent. Key: a chord table (Enter/Return, NumpadEnter, Tab, Escape, Backspace, Delete, Space, arrows, Home, End, PageUp, PageDown, Insert, F1-F12, one printable character; modifiers Control/Ctrl, Shift, Alt/Option, Meta/Cmd); unknown names and control characters are refused. Upload: the path is relative to ctx.run_dir/files (a leading files/ names that folder, as in B-7's u#9=files/cv.pdf), must not hold .., a root or a drive or UNC prefix, and must resolve after symlinks to an existing file inside the folder; then the file input is fetched by reference and DOM.setFileInputFiles is sent (no actionability: file inputs are usually hidden behind a label). Scroll: in the page; sc(down|up) scrolls the nearest scrollable ancestor of the viewport centre (else the document) by 85 % of its height and reports whether it moved; sc(#N) scrolls the element into the centre."
    why: "Folding focus and select into the act call keeps every step to one round trip after actionability; queueing inside the sink means the value exists only while the bytes are built. Focus is required because keys and text go to whatever has focus, and Enter on another form would submit something the gate did not classify. In-page scrolling is deterministic (no compositor lag after a wheel event) and reaches inner scrollers the way a user's wheel would."
  - id: D-610
    text: "Driver::open uses the browser's own first tab once (T-21, docs/05 acceptance 3). At launch, after setAutoAttach replies (existing targets are attached before the reply, in wire order), a single about:blank tab opened by nobody is kept as the spare; the first open navigates it instead of creating a window, so the model's first tab is tab 1 and a target=_blank popup from it is tab 2. A failed or dropped open never closes the spare (it may be the browser's last window). Later opens create a new window each (D-605)."
    why: "Acceptance 3 reads 'opened tab 2' after one opened page; without this the startup tab was tab 1 and stayed as an unused window in tabs()."
  - id: D-611
    text: "Downloads stop and ask (T-21, B-4 #9). At launch sb-driver sends Browser.setDownloadBehavior {behavior: deny, eventsEnabled: true}: every download is cancelled before a byte is written (Browser.downloadProgress reports canceled) and reported. The act step that caused it gets Consequence::Download {name: the sanitised suggested name, escaped, guid}, and the download is recorded with the run's files folder. Driver::download(tab, guid, allow): allow=false forgets it (and sends Browser.cancelDownload); allow=true fetches the URL again with the page's cookies through Network.loadNetworkResource (frame and session of the original download) and IO.read, or decodes a data: URL, into runs/<id>/files/: the name is claimed with create_new (name, name (2), ...) and the bytes are written to a .part file renamed onto it; capped at 1 GiB. A download is answered once and only from the tab it came from."
    why: "CDP has no pause for a download: the choices are deny (nothing lands) or allow into a folder (bytes land before the user answers). The acceptance asks that nothing exists on disk before the answer, so the driver denies and fetches again on allow; the cost is B-608 (blob: and POST downloads cannot be fetched again)."
  - id: D-612
    text: "Popups run when their first navigation starts (T-21; amends D-604 for popups). A tracked page session whose runtime install has not replied gets Runtime.runIfWaitingForDebugger as soon as it reports Page.frameStartedNavigating. Measured on chromium-1248: a target=_blank or window.open popup is attached paused with its navigation already started, its renderer does not answer (Runtime.evaluate timed out after 10 s), so the install's reply never came and the popup never loaded under D-604's run-after-reply rule; resumed this way its first document has the sb world with __sb (accept_t21 asserts it)."
    why: "D-604's order (run only after the install reply) deadlocks targets whose renderer starts with their navigation; the install is registered in the browser by then, so the first document still gets the runtime."
  - id: D-613
    text: "Consequence window (T-21, B-4 #9). The observer logs main-frame commits and same-document navigations, main-frame navigation starts, JavaScript dialogs (open until answered) and downloads into an in-driver log (bounded), before any subscriber sees them. After a step's input is queued the driver awaits the input's replies or a dialog on the tab, whichever comes first (an alert from a click handler holds the mouseReleased reply until it is answered); then one in-page call settles (quiet 150 ms, cap 500 ms, the call capped at 800 ms) and returns the step frame's index in the same round trip, also raced against a dialog. A main-frame navigation that started and has neither committed nor become a download is awaited up to 3 s from the input; if the document that answered was replaced since, the settle-and-index call runs once more on the current one. Tabs whose opener is this tab and that are new since the step are awaited up to 3 s for their first document, and their title is read from document.title (TargetInfo titles go stale, B-601). Consequences, in order: Navigated {url}, OpenedTab {tab, title}, Download {name, guid}, Dialog {text}. A dialog stops the program after its step, leaves the page paused, skips the diff, and an act on a tab with an open dialog answers with a failed first step carrying it; Driver::dialog(tab, accept, text) answers it with Page.handleJavaScriptDialog. NoVisibleChange when none of these happened, the step did not fail, a scroll did not move, and the step frame's index before and after shows no change (value changes count as changes). All page strings are escaped and capped, and the whole result is scrubbed against the values of the vault keys the program typed (as typed, upper and lower case, URL-component and form encoded, and as the result's own escaping renders them), then against the process-wide scrubber."
    why: "The index the window returns is both the next step's live index for the gate and the diff's after side, so the window adds no round trip beyond the settle B-4 #9 asks for; logging in the observer means a lagging broadcast cannot hide a dialog or a download."
  - id: D-614
    text: "B-8 diff (T-21). From each frame's index as first read in the program to its index at the end: '+ <alias> \"name\"' for rows added, '\u2212 <alias> \"name\"' for rows removed, '+ form fN' / '\u2212 form fN' for forms, '~ #id <alias> \"name\" checked|unchecked|enabled|disabled|shown|hidden|renamed' for rows changed; headings, dialogs and alerts first, then forms, then controls; six entries, then '+N more'; joined with ' \u00b7 '. Field values are never printed (a value change counts as a change for NoVisibleChange only). Page text in it, and in every consequence, is one line, has '\"' and backticks as ', [ ] as ( ), a '#' that would start a ref (#12, #f2.3) as a fullwidth number sign, and is capped (names 60, other text 120 characters); URLs are percent-encoded where they would carry harness syntax and capped at 200. sb_sheet has no diff helper; the alias is sb_sheet::data::alias_for."
    why: "B-8's example line, rows keyed by (frame, id) which are never reused (D-604), and pr-ready 5: page text must not reproduce the harness's own syntax."
  - id: D-615
    text: "Exact focus for key and type steps (review-T-21 Blocking 2, rule 4; amends D-609). After the act wrapper calls el.focus(), the step goes on only when the deep active element (document.activeElement through open shadow roots) is the element itself. One exception, for t# only: a plain text field (input of type text, search, email, url, tel or number, or a textarea; never password) inside the element's own shadow tree when that shadow root has delegatesFocus. Anything else (a descendant that already held focus, such as an autofocused Pay button inside a dialog row, or a password field inside a container) fails the step with 'the element did not take focus (another element has it; target that element instead)', before any key or text is sent. The driver does not re-gate the focused element."
    why: "The gate classified the target row, and keys and text go to whatever holds focus, so any other focused element is an unclassified target (Enter on a dialog row under Navigate pressed its Pay button). Re-gating the focused element would need its id and row and a second classify, and a focused descendant is never what the model asked for; failing closed costs one turn at most and the why tells the model which element to target. A delegatesFocus host is the one case where the host stands for its inner field; key steps get no exception because Enter in an inner text field can submit an inner form the host's row does not show."
  - id: D-616
    text: "Scrub before cap (review-T-21 Blocking 1, rule 2, B-152). Driver::act keeps page strings raw while the program runs (consequence URL, title, dialog text, download name and guid; the diff's row names and form ids). When it ends: (1) every raw string is scrubbed against the values of the vault keys the program typed (resolved inside ToolCtx::resolve_into; spellings: as typed, URL component and form encoded, the page-text and cleaned-URL renderings, and the why neutralisations with '_' and '?'; ASCII case-insensitive), then the process-wide scrubber; (2) the strings are escaped and capped and the diff is rendered; (3) every shown string (whys, diff, stop why included) is scrubbed again the same way. Both scrub passes also replace a value prefix of 8 or more characters (a spelling's) that ends where a string may have been cut: at its end, before '…' (the page index's own cut at 150) or before '...' (the driver's caps). clean_url keeps an '@vault(name)' literal as it is. Driver::tabs() and Driver::frames() pass URLs and titles through harness_core::scrub (defence in depth; the MCP wrapper scrubs payloads with the server's vault). Driver::download saves under sanitize_name(harness_core::scrub(raw name)), which is also the name the act result showed."
    why: "A cap that cuts a typed value leaves a prefix that a whole-value scrub cannot see (a 60-character diff name, a 120-character title, a 200-character URL, the index's 150-character name). Scrubbing the raw string first sees every value whole; the prefix rule covers cuts made before the driver gets the string (the index, the 2000-character raw cap) and the whys it neutralises. The driver only knows the values of keys the program typed, so a value typed in an earlier program and cut before the driver sees it is left to core's scrubber (B-613)."
  - id: D-617
    text: "A step in a frame other than 0 never reports NoVisibleChange (T-21 tester note on row 10a): the consequence window compares only the step frame's index, and a click inside a frame can change its parent. Until T-22 merges frames in the window and the diff, such a step reports no NoVisibleChange at all."
    why: "A false 'no visible change' invites a retried click (a second submit); saying nothing costs nothing. Reading the parent and top indexes before and after each frame step would add two round trips per step."
  - id: D-618
    text: "Dialogs between steps and stale targets (review-T-21 should-fix 1 and 5). Before each step Driver::act checks for an open dialog on the tab (no round trip) and, if one is open, reports the step as failed with 'a dialog is open on this tab: answer it with dialog() first' and the Dialog consequence, and stops. The live-index read, the stale check and actionability (with its op) each race a dialog opened since the step began (or_dialog): one that opens during them ends the step at once with the Dialog consequence, without waiting for the read's 3 s or the 5 s actionability cap and without a Submit stop for the missing index. When the gate would stop a step (not a CHALLENGE) and its target is not in a fresh live index, one in-page resolve asks whether the id is stale (an earlier document) or gone; then the step fails with 'stale' or 'gone' and the program is not stopped. A live element the index does not list keeps the Submit stop (D-402)."
    why: "A dialog from a timer blocks every in-page call, so without the race a step stalls to its cap and then misreports. A stale id cannot run under any approval, so a stop that asks the user to approve Submit wastes a turn; the resolve costs a round trip only on that rare path, and never touches a challenge page."
  - id: D-619
    text: "Download hardening (review-T-21 should-fix 2 and 3). Driver::download refuses (error, nothing saved, the .part file removed) a re-fetch whose Network.loadNetworkResource answer has an httpStatusCode outside 200..299, and refetches only http and https URLs (and decodes data: URLs); file: is no longer accepted. Names: sanitize_name drops Unicode format characters (general category Cf, Unicode 15.1: bidi overrides and isolates, zero-width characters, the BOM, tags), collapses whitespace, neutralises the harness syntax as page text does (backticks, brackets, '#' before a digit), and prefixes '_' to the Windows device names CON, PRN, AUX, NUL, CONIN$, CONOUT$ and COM/LPT followed by one digit or a superscript 1, 2 or 3. page_text drops Cf characters, and clean_url percent-encodes them."
    why: "An error page saved under the download's name is a wrong file the model would trust; chromium-1248 already reports a 410 as ERR_HTTP_RESPONSE_CODE_FAILURE, and the status check covers builds and paths that answer success with an error status. A page never needs file:, and it would copy a local file into the run. A right-to-left override makes report<RLO>fdp.exe read as reportexe.pdf."
  - id: D-620
    text: "Network-aware settle (T-22, B-4 #8). Every tracked session (tab, OOPIF, pending prerender) gets Network.enable {maxPostDataSize: 0} in the pipelined attach setup, right after Page.enable. The observer keeps requests in flight in the event store, from Network.requestWillBeSent to loadingFinished or loadingFailed (no round trip to know it). A request counts for a settle that began at event mark m when: (1) it was announced on a session of the tab (its page or one of its OOPIFs) after m, so requests started before the settle began never hold it (open marks before Page.navigate, an act step before its input, w(d) and Driver::settle at their start); (2) its type is not EventSource, WebSocket, Media, Ping, CSPViolationReport or Prefetch; (3) it is younger than 3 s (a long-poll past the cap stops counting); (4) no loadingFinished/loadingFailed came, its session did not detach, and a Document request's frame did not commit (Page.frameNavigated) or start a download. The loop: wait (a condition on the event store, capped, also woken at the first age-out) until no counted request is in flight, then one in-page __sb.settle (DOM quiet 150 ms, finite animations on changed nodes); if a counted request started during it or one is in flight, go again while time remains. Driver::settle settles frame 0's DOM and the whole tab's network; its cap is a hard deadline in Rust (the in-page call gets the time left minus 50 ms so its answer, with changed, arrives first); at the cap, or when a dialog is open, {settled: false}. The in-flight table is capped at 2048 entries, oldest dropped first. Resolves B-614 with D-621."
    why: "B-4 #8 asks for no in-flight requests as well as DOM quiet, with a 3 s cap that is never exceeded. Counting only requests that start after the settle began, and ignoring streams and requests older than the cap, makes every doubt end a settle earlier, never later (fail-safe toward the cap). A quiet page still costs exactly one round trip. Measured on chromium-1248: endless mutations 2.958 s worst, a page that starts a never-answered fetch every 50 ms 3.015 s worst, both settled false."
  - id: D-621
    text: "The act consequence window, open and w(d) use the D-620 loop (T-22, B-614, T-21b item 4). Act: the step's mark is taken before its input; while a counted request it started is in flight, the window waits for it (a condition) before the settle-and-index call, at most until 3 s after the input; each in-page call is still capped at 500 ms (the first gets the whole 500 ms, as in T-21); when the network never went idle the call is made once anyway so the step has an index. A step whose request is still in flight at the end of the window (a wait that ended busy counts as busy even if the request aged out of D-620 (3) during the last call) never reports NoVisibleChange and reports settled false. Open: the in-page settle that comes with the based walk (one round trip, D-607 paint wait kept) is followed by the loop only when a counted request was involved, within 3 s of the commit. w(d): the loop with d as the cap; 'the page did not answer within d + 300 ms' is unchanged. D-617 (frame steps never claim no change) stays: the window still compares only the step frame's index."
    why: "A submit whose XHR outlasts 500 ms read as 'no visible change' and invited a second submit (B-614). Waiting for the request costs at most the settle cap and saves the model a turn (efficiency over latency); a page with no network activity keeps T-21's one call. Measured: a 900 ms XHR save reports '+ heading \"Saved\"' after 1.1 s; a never-answered one ends at 3.03 s with settled false and no NoVisibleChange."
  - id: D-622
    text: "Driver::tabs() refreshes titles with one Target.getTargets (browser session, capped at 1 s) and writes each page target's title into the registry; if it does not answer in time the registry's last titles are used. Resolves B-601."
    why: "Measured on chromium-1248: no Target.targetInfoChanged comes when document.title changes, but Target.getTargets already has the new title (within 6 ms). One browser round trip covers every tab, needs no renderer (a hidden or busy tab answers too) and no in-page call on a challenge page."
  - id: D-623
    text: "Driver::index (I-9, T-22): every frame the registry does not call opaque is read with __sb.index() and every frame whose parent is read gets its owner looked up, all concurrently (cap 3 s). The owner is DOM.getFrameOwner (on the parent's session, which works for an OOPIF too) -> DOM.resolveNode into the parent's sb world (its own object group, released after) -> __sb.id(this), cached per (tab, frame) and parent document. Rows get the registry frame number (#f2.15); an iframe row gets child_frame; the child's rows follow it depth first (document order, at most 32 levels). A child the registry calls opaque (cross-origin, out of process, or inside one) gets OPAQUE on its row and nothing from inside; a row flagged OPAQUE or CHALLENGE by the page is never entered (its frame's rows, if read, are dropped). A frame whose element is not a row of its parent (a hidden iframe) is left out with it. Frame 0's read failing is an error; a child's is skipped. Every string of every row goes through harness_core::scrub (H-2). A dialog open on the tab is an error (an in-page read would wait for the answer)."
    why: "B-4 #2 and B-5: same-origin frames are separate frames with their own copy, cross-origin frames one opaque row never read inside. The owner lookup from the parent's side is the only way to tie an opaque frame to its row without reading inside it; DOM.getFrameOwner and DOM.resolveNode need no DOM.enable (measured). Three round trips per frame once per parent document, all frames in parallel."
  - id: D-624
    text: "Driver::close(tab) (T-22, B-4 #2): Target.closeTarget, then a registry condition (capped at 5 s) until the browser reports the tab detached; on the cap the registry forgets the tab itself. Then the tab's element id bases, frame owners, and its sessions' dialogs and requests in flight are dropped. Removing a tab from the registry also drops its OOPIF sessions, their runtime installs and prerenders attached under it. A protocol error from closeTarget (a page that closed itself) still cleans up; a closed transport is an error; a tab not open is TabGone. The browser's startup tab stops being the spare once closed."
    why: "A closed tab must leave nothing a later call could trip on: tabs() must not list it, and no stale session, base or owner may be reused. Waiting for the browser's own detach keeps the registry fed only by events (B-4 #2) in the normal case."
  - id: D-625
    text: "Settle honesty about requests it does not wait for (T-22, B-4 #8; refines D-620 (1) and (3); decided by driver/suborch). Requests the tab started before a settle began are still not waited for (D-620 (1)), and a request older than 3 s still stops holding the wait (D-620 (3)); but when the settle ends with any tracked request of the tab still in flight, started before it, aged out, or counted, the answer is settled false. This holds for Driver::settle with any cap_ms and for w(d) with any d up to MAX_WAIT; the act window applies it to the requests started after the step's mark (its net_busy also counts an aged-out request, so no NoVisibleChange). Stream types (D-620 (2)) are never tracked, so they never make a settle unsettled."
    why: "B-4 #8 says settled means no in-flight requests. Not waiting keeps the cap and the old fail-safe direction (end earlier), and reporting settled false keeps the answer true: w(10s) on a 5 s save used to say settled true at 3.2 s while the save was pending (review-T-22 blocking 1, should-fix 1)."
  - id: D-626
    text: "open() caps what follows the commit, not the navigation (T-22, B-4 #8, accept-T-22 row 3c; decided by driver/suborch). open() takes the instant the driver sees the main frame commit a new document (the registry's generation change, from Page.frameNavigated) and gives everything after it one deadline, commit + 3 s: the D-607 paint wait, the in-page settle, the based walk and its reply, and the D-620 network pass. The in-page settle (and the paint wait under it) gets the time left minus REPLY_MARGIN (50 ms), as settle_tab gives its call. Target.createTarget, the runtime install ack, Page.navigate and the wait for the commit keep their own 30 s cap (OPEN_CAP)."
    why: "Acceptance row 3c: open() measured 3.39 to 3.62 s total and 3.03 to 3.11 s from the main-frame commit. B-4 #8's 3 s cap applies to settling, not to network navigation. After the change: 2.97 to 3.015 s from the commit on endless mutations, never-ending fetches, CSS animation loops, EventSource and a mix (5 runs each)."
  - id: D-627
    text: "The act window on a hidden page is not settled (T-22, accept-T-22 note 4). The window's in-page call (POST_FN) checks document.visibilityState: a page hidden when the call starts skips the in-page settle and returns its index at once with settled false; a page hidden by the end of its settle is settled false too. A call that misses its cap (or whose document went away) also reports Some(false), not None: an input step that ran always reports Some(bool); None stays for steps with no window (failed before input, dialogs)."
    why: "A target=_blank click puts a new tab in front of the step's tab, whose timers are then throttled: whether its 150 ms quiet settle answered within the window was a race, so the same step reported true or None between runs. Hidden pages cannot be judged settled; saying so is deterministic and costs nothing."
  - id: D-628
    text: "Closed frames are refused at call time, and index() reads frames level by level (T-22, B-4 #2, B-5, D-5; refines D-623; review-T-22 should-fix 2, 3, 4). Registry::closed_frame(tab, frame) says, from the registry now, whether a frame is opaque (out of process, cross-origin to its parent, or inside such a frame) or a CHALLENGE frame or inside one (by ancestry). based_ctx, through which every in-page call goes (call_sb, call_sb_doc, call_sb_ref, the owner lookup, open's walk), refuses such a frame before anything is sent, and act fails a step in such a frame before any read (a CHALLENGE one also stops the program). index() reads frame 0, then each child whose iframe row in its parent's fresh rows is neither OPAQUE nor CHALLENGE and that closed_frame allows, and so on; a level's reads run concurrently with the owner lookups of its children, and the parent's row writes the frame's CHALLENGE mark into the registry before the child could be read. The merge uses the registry as it is after the reads, so a frame that turned opaque meanwhile loses its rows. The owner cache keeps only answers the page gave (an id, or not a row); a CDP error or timeout is asked again on the next index(). Every row string (role included) is scrubbed and capped, field by field with exhaustive patterns."
    why: "Opacity judged from a snapshot let act on #fN.x read and click inside a frame that had turned cross-origin, and frames nested in a challenge widget were walked and their rows only dropped afterwards; hard rule 3 and B-5 say never read inside. Level-by-level reading adds one round trip per nesting level only on pages with nested same-origin frames; a cached failed lookup hid a frame until its parent navigated."
